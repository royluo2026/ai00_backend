<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工艺交付物</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bar-bg: #13131f;
    --text: #cdd6f4; --text-muted: #6c7086; --accent: #89b4fa;
    --border: #313244; --hover: #2a2a3d; --active: #2d3561;
  }
  [data-theme="light"] {
    --bg: #eff1f5; --bg2: #e6e9ef; --bar-bg: #dce0e8;
    --text: #4c4f69; --text-muted: #9ca0b0; --accent: #1e66f5;
    --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

  .cd-layout { display: flex; height: 100%; }

  /* ── 左侧导航 ───────────────────────────────── */
  .cd-nav {
    width: 180px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--bg2); border-right: 1px solid var(--border);
  }
  .cd-nav-header {
    padding: 12px 14px 8px;
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .cd-nav-list { flex: 1; overflow-y: auto; padding: 4px 6px; }

  .cd-nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    cursor: pointer; color: var(--text-muted);
    font-size: 13px; white-space: nowrap;
    transition: background .12s, color .12s;
    user-select: none;
  }
  .cd-nav-item:hover { background: var(--hover); color: var(--text); }
  .cd-nav-item.active { background: var(--active); color: var(--accent); font-weight: 500; }
  .cd-nav-item svg { flex-shrink: 0; }

  /* ── 右侧内容区 ─────────────────────────────── */
  .cd-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .cd-page {
    display: none; flex: 1;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .cd-page.active { display: flex; }

  .cd-placeholder-icon { color: var(--text-muted); opacity: .4; margin-bottom: 16px; }
  .cd-placeholder-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .cd-placeholder-sub { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="cd-layout">

  <!-- 左侧导航 -->
  <div class="cd-nav">
    <div class="cd-nav-header">工艺交付物</div>
    <div class="cd-nav-list" id="cdNavList"></div>
  </div>

  <!-- 右侧内容 -->
  <div class="cd-content" id="cdContent"></div>

</div>

<script>
'use strict';

const NAV_ITEMS = [
  { key: 'process_card',    title: '工艺卡',
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/><line x1="7" y1="16" x2="15" y2="16"/></svg>' },
  { key: 'control_plan',    title: '控制计划',
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' },
  { key: 'torque_list',     title: '扭矩清单',
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M2 12h4m12 0h4m-3.93 7.07l-2.83-2.83M6.76 6.76L3.93 3.93"/></svg>' },
  { key: 'critical_process', title: '关键工艺清单',
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
];

const PLACEHOLDER_SVG = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';

let _activeKey = null;

function init() {
  // 主题
  try {
    const theme = window.parent?.document?.documentElement?.getAttribute('data-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (_) {}
  window.addEventListener('message', e => {
    if (e.data?.type === 'theme') document.documentElement.setAttribute('data-theme', e.data.theme);
  });

  const navList = document.getElementById('cdNavList');
  const content = document.getElementById('cdContent');

  NAV_ITEMS.forEach(item => {
    // 左侧导航项
    const navEl = document.createElement('div');
    navEl.className = 'cd-nav-item';
    navEl.dataset.key = item.key;
    navEl.innerHTML = item.icon + `<span>${item.title}</span>`;
    navEl.addEventListener('click', () => activate(item.key));
    navList.appendChild(navEl);

    // 右侧占位页面
    const page = document.createElement('div');
    page.className = 'cd-page';
    page.dataset.key = item.key;
    page.innerHTML =
      `<div class="cd-placeholder-icon">${PLACEHOLDER_SVG}</div>` +
      `<div class="cd-placeholder-title">${item.title}</div>` +
      `<div class="cd-placeholder-sub">开发中</div>`;
    content.appendChild(page);
  });

  // 默认激活第一个
  activate(NAV_ITEMS[0].key);
}

function activate(key) {
  _activeKey = key;
  document.querySelectorAll('.cd-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.key === key);
  });
  document.querySelectorAll('.cd-page').forEach(el => {
    el.classList.toggle('active', el.dataset.key === key);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
