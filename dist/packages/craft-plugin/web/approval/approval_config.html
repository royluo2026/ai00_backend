<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>流程配置</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
  <link rel="stylesheet" href="/assets/approval-292f9789.css">
</head>
<body>
    <script src="/web/icons.js"></script>
    <div class="approval-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><svg class="icon" width="18" height="18"><use href="#icon-settings"/></svg> 审批流程配置</h3>
            <a href="approval_view.html" class="btn btn-outline-secondary">返回审批</a>
        </div>

        <div class="approval-card">
            <div class="card-header">流程节点配置</div>
            <div class="card-body">
                <div id="node-list" class="mb-4"></div>
                <button id="btn-add-node" class="btn btn-primary me-2"><svg class="icon" width="14" height="14"><use href="#icon-plus"/></svg> 添加审批节点</button>
                <button id="btn-save-config" class="btn btn-success"><svg class="icon" width="14" height="14"><use href="#icon-save"/></svg> 保存配置</button>
            </div>
        </div>

        <div class="approval-card mt-4">
            <div class="card-header">流程预览</div>
            <div class="card-body">
                <div id="flow-chart"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="approval.js"></script>
    <script>
        // 页面加载渲染配置
        document.addEventListener('DOMContentLoaded', renderFlowConfig);
    </script>
</body>
</html>
