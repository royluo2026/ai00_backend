<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>项目管理</title>
  
  <link rel="stylesheet" href="/assets/project-2140a346.css">
</head>
<body class="project-body">
  <script src="/web/icons.js"></script>

  <!-- 顶部工具栏 -->
  <header class="proj-header">
    <h1 class="proj-title">项目管理</h1>
    <div class="proj-actions">
      <input id="searchInput" class="proj-search" type="text" placeholder="搜索项目..." />
      <button id="btnNew" class="btn btn-primary">＋ 新建项目</button>
    </div>
  </header>

  <!-- 内容区 -->
  <div id="content" class="proj-content">

    <!-- 项目列表 -->
    <section id="projectList" class="project-list"></section>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon"><svg class="icon" width="48" height="48" style="opacity:0.4"><use href="#icon-project"/></svg></div>
      <p class="empty-text">暂无项目，点击右上角新建</p>
    </div>

  </div>

  <!-- 新建/编辑项目对话框 -->
  <div id="dlgProject" class="dialog-overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <span id="dlgTitle">新建项目</span>
        <button class="dialog-close" id="btnDlgClose">✕</button>
      </div>
      <div class="dialog-body">
        <label class="form-label">项目名称 <span class="required">*</span></label>
        <input id="inputName" class="form-input" type="text" placeholder="请输入项目名称" />
        <label class="form-label">关联车型</label>
        <select id="selectVehicle" class="form-select">
          <option value="">-- 暂不关联 --</option>
        </select>
        <label class="form-label">目标工厂</label>
        <select id="selectFactory" class="form-select">
          <option value="">-- 暂不关联 --</option>
        </select>
      </div>
      <div class="dialog-footer">
        <button id="btnCancel" class="btn btn-secondary">取消</button>
        <button id="btnConfirm" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 项目详情侧边栏 -->
  <div id="detailPanel" class="detail-panel hidden">
    <div class="detail-header">
      <span id="detailName" class="detail-name"></span>
      <div class="detail-actions">
        <button id="btnEditProject" class="btn btn-sm btn-secondary">编辑</button>
        <button class="btn btn-sm" id="btnCloseDetail">✕</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-row">
        <span class="detail-label">状态</span>
        <span id="detailStatus" class="status-badge"></span>
        <button id="btnAdvStatus" class="btn btn-sm btn-ghost">推进状态 ›</button>
      </div>
      <div class="detail-row">
        <span class="detail-label">车型</span>
        <span id="detailVehicle" class="detail-value">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">成员数</span>
        <span id="detailMembers" class="detail-value">—</span>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="detail-section">
      <div class="section-header">
        <span>任务</span>
        <button id="btnNewTask" class="btn btn-sm btn-ghost">＋ 添加</button>
      </div>
      <div id="taskList" class="task-list"></div>
    </div>

    <!-- 问题列表 -->
    <div class="detail-section">
      <div class="section-header">
        <span>问题</span>
        <button id="btnNewIssue" class="btn btn-sm btn-ghost">＋ 添加</button>
      </div>
      <div id="issueList" class="issue-list"></div>
    </div>

    <!-- 成员管理（project_owner 可见操作） -->
    <div class="detail-section" id="memberSection" style="display:none">
      <div class="section-header">
        <span>成员管理</span>
        <button id="btnAddProjectMember" class="btn btn-sm btn-ghost" style="display:none">＋ 添加</button>
      </div>
      <div id="projectMemberList" style="font-size:12px"></div>
    </div>
  </div>

  <!-- 新建任务对话框 -->
  <div id="dlgTask" class="dialog-overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <span>新建任务</span>
        <button class="dialog-close" id="btnTaskClose">✕</button>
      </div>
      <div class="dialog-body">
        <label class="form-label">任务标题 <span class="required">*</span></label>
        <input id="taskTitle" class="form-input" type="text" placeholder="请输入任务标题" />
        <label class="form-label">优先级</label>
        <select id="taskPriority" class="form-select">
          <option value="low">低</option>
          <option value="normal" selected>普通</option>
          <option value="high">高</option>
          <option value="urgent">紧急</option>
        </select>
        <label class="form-label">截止日期</label>
        <input id="taskDue" class="form-input" type="date" />
      </div>
      <div class="dialog-footer">
        <button id="btnTaskCancel" class="btn btn-secondary">取消</button>
        <button id="btnTaskConfirm" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <script src="project.js"></script>
</body>
</html>
