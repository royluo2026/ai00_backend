<!DOCTYPE html>
<html lang="zh">
<head>

<script src="/web/core/dialogs.js?rev=20260922-unified-1"></script>

  <script src="/web/core/business_facade.js"></script>
<meta charset="UTF-8">
<title>工艺规划</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bar-bg: #13131f;
    --text: #cdd6f4; --text-muted: #6c7086; --accent: #89b4fa;
    --border: #313244; --hover: #2a2a3d; --active: #2d3561;
    --xiaorou-blue: #1e66f5;
  }
  [data-theme="light"] {
    --bg: #eff1f5; --bg2: #e6e9ef; --bar-bg: #dce0e8;
    --text: #4c4f69; --text-muted: #9ca0b0; --accent: #1e66f5;
    --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .hub { display: flex; flex-direction: column; height: 100%; }

  .hub-tabs {
    display: flex; align-items: center; gap: 2px;
    padding: 0 8px; height: 38px;
    background: var(--bar-bg); border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto;
  }
  .hub-tabs::-webkit-scrollbar { height: 3px; }
  .hub-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .hub-tab-item {
    position: relative; display: flex; align-items: center;
    padding: 0 26px 0 12px; height: 28px;
    color: var(--text-muted); cursor: pointer; border-radius: 4px;
    font-size: 13px; white-space: nowrap; user-select: none;
    transition: background .15s, color .15s;
  }
  .hub-tab-item:hover { background: var(--hover); color: var(--text); }
  .hub-tab-item.active { background: var(--active); color: var(--accent); font-weight: 500; }

  .hub-tab-out {
    position: absolute; right: 4px;
    width: 16px; height: 16px; padding: 0; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .1s, background .1s, color .1s;
  }
  .hub-tab-item:hover .hub-tab-out { opacity: 1; pointer-events: auto; }
  .hub-tab-out:hover { background: rgba(137,180,250,.15); color: var(--accent); }
  .hub-tab-item.active .hub-tab-out { color: var(--accent); }

  .hub-frame { flex: 1; border: none; width: 100%; display: block; }
  .craft-xiaorou-ball { position: fixed; right: 18px; bottom: 18px; z-index: 20; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #1e66f5; color: white; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 18px rgba(30,102,245,.32); }
  .craft-xiaorou-chat { position: fixed; right: 18px; bottom: 72px; z-index: 20; width: min(360px, calc(100vw - 36px)); height: min(500px, calc(100vh - 110px)); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); box-shadow: 0 18px 50px rgba(0,0,0,.3); }
  .craft-xiaorou-chat.hidden { display: none; }
  .craft-xiaorou-head { min-height: 42px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; color: var(--xiaorou-blue); font-weight: 650; border-bottom: 1px solid var(--border); }
  .craft-xiaorou-close { border: 0; background: transparent; color: var(--text-muted); font-size: 20px; cursor: pointer; }
  .craft-xiaorou-messages { min-height: 0; flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .craft-xiaorou-empty { margin: auto; color: var(--text-muted); font-size: 12px; }
  .craft-xiaorou-message { display: flex; }
  .craft-xiaorou-message.user { justify-content: flex-end; }
  .craft-xiaorou-bubble { max-width: 84%; padding: 8px 10px; border-radius: 9px; background: var(--hover); color: var(--text); font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .craft-xiaorou-message.user .craft-xiaorou-bubble { background: var(--xiaorou-blue); color: white; }
  .craft-xiaorou-compose { padding: 10px; display: flex; gap: 7px; border-top: 1px solid var(--border); }
  .craft-xiaorou-input { min-width: 0; flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg2); color: var(--text); outline: none; }
  .craft-xiaorou-input:focus { border-color: var(--xiaorou-blue); }
  .craft-xiaorou-send { padding: 0 14px; border: 0; border-radius: 7px; background: var(--xiaorou-blue); color: white; cursor: pointer; }
  .craft-xiaorou-send:disabled { opacity: .55; cursor: wait; }
</style>
  <link rel="stylesheet" href="/assets/dialogs-e48cd6c5.css">
</head>
<body>
<div class="hub">
  <div class="hub-tabs" id="hubTabs"></div>
  <iframe class="hub-frame" id="hubFrame"></iframe>
</div>
<button id="craftXiaorouBall" class="craft-xiaorou-ball" type="button" aria-expanded="false" title="小柔">柔</button>
<section id="craftXiaorouChat" class="craft-xiaorou-chat hidden" aria-label="小柔智能助手">
  <header class="craft-xiaorou-head"><span>小柔 · 工艺规划</span><button id="craftXiaorouClose" class="craft-xiaorou-close" type="button" aria-label="关闭">×</button></header>
  <div id="craftXiaorouMessages" class="craft-xiaorou-messages"><div class="craft-xiaorou-empty">可以问我当前工艺规划相关的问题</div></div>
  <div class="craft-xiaorou-compose">
    <input id="craftXiaorouInput" class="craft-xiaorou-input" type="text" placeholder="输入问题…" autocomplete="off">
    <button id="craftXiaorouSend" class="craft-xiaorou-send" type="button">发送</button>
  </div>
</section>

<script src="/web/components/hub_shell.js"></script>
<script>
  const hub = new HubShell({
    hubId: 'craft_hub',
    tabs: [
      { key: 'bop_lineage',  title: '工艺流程图',  src: '../lineage_view/index.html', webSrc: 'lineage_view/index.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="4" height="6" rx="1"/><rect x="10" y="4" width="4" height="6" rx="1"/><rect x="10" y="14" width="4" height="6" rx="1"/><rect x="18" y="6" width="4" height="4" rx="1"/><rect x="18" y="14" width="4" height="4" rx="1"/><line x1="6" y1="12" x2="10" y2="7"/><line x1="6" y1="12" x2="10" y2="17"/><line x1="14" y1="7" x2="18" y2="8"/><line x1="14" y1="17" x2="18" y2="16"/></svg>' },
      { key: 'deliverables', title: '工艺交付物',   src: '../craft_deliverables/index.html', webSrc: 'craft_deliverables/index.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' },
      /*
      { key: 'pbom',         title: 'PBOM',        src: '../ebom/ebom.html',          webSrc: 'ebom/ebom.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>' },
      { key: 'bop_nav', title: '车型工序', src: '../bop_nav/index.html', webSrc: 'bop_nav/index.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg>' },
      */
    ],
    tabsEl: 'hubTabs',
    frameEl: 'hubFrame',
  });
  hub.boot();

  window.addEventListener('message', e => {
    if (e.data?.type === 'theme') hub.applyTheme(e.data.theme);
  });
  document.getElementById('hubFrame').addEventListener('load', () => {
    hub.applyTheme(document.documentElement.dataset.theme || 'dark');
  });
  try { hub.applyTheme(window.parent?.document?.documentElement?.getAttribute('data-theme') || 'dark'); } catch(_) {}

  const xiaorou = {
    ball: document.getElementById('craftXiaorouBall'), chat: document.getElementById('craftXiaorouChat'),
    close: document.getElementById('craftXiaorouClose'), messages: document.getElementById('craftXiaorouMessages'),
    input: document.getElementById('craftXiaorouInput'), send: document.getElementById('craftXiaorouSend'),
  };
  function setXiaorouOpen(open) {
    xiaorou.chat.classList.toggle('hidden', !open);
    xiaorou.ball.setAttribute('aria-expanded', String(open));
    if (open) xiaorou.input.focus();
  }
  function addXiaorouMessage(role, text) {
    xiaorou.messages.querySelector('.craft-xiaorou-empty')?.remove();
    const row = document.createElement('div');
    row.className = `craft-xiaorou-message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'craft-xiaorou-bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    xiaorou.messages.appendChild(row);
    xiaorou.messages.scrollTop = xiaorou.messages.scrollHeight;
    return bubble;
  }
  async function sendXiaorou() {
    const message = xiaorou.input.value.trim();
    if (!message || xiaorou.send.disabled) return;
    xiaorou.input.value = '';
    xiaorou.input.disabled = xiaorou.send.disabled = true;
    addXiaorouMessage('user', message);
    const answer = addXiaorouMessage('ai', '…');
    try {
      let content = '';
      answer.textContent = '';
      await window.AI00Business.stream('agent.interaction.chat.change.apply', {
        version: 3,
        payload: { operation: 'chat_stream', body: { message, context: { text: '当前模块：工艺规划' } } },
      }, {
        onToken(token) { content += token; answer.textContent = content; xiaorou.messages.scrollTop = xiaorou.messages.scrollHeight; },
        onError(error) { answer.textContent = `错误：${error}`; },
      });
      if (!answer.textContent) answer.textContent = '（无回复）';
    } catch (error) {
      answer.textContent = `请求失败：${error.message}`;
    } finally {
      xiaorou.input.disabled = xiaorou.send.disabled = false;
      xiaorou.input.focus();
    }
  }
  xiaorou.ball.addEventListener('click', () => setXiaorouOpen(xiaorou.chat.classList.contains('hidden')));
  xiaorou.close.addEventListener('click', () => setXiaorouOpen(false));
  xiaorou.send.addEventListener('click', sendXiaorou);
  xiaorou.input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); void sendXiaorou(); }
  });
</script>
</body>
</html>
