<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PBOM</title>
  
  
  
  <link rel="stylesheet" href="/assets/ebom-3334cad2.css">
  <link rel="stylesheet" href="/assets/list_deps-9b550476.css">
  <link rel="stylesheet" href="/assets/self_annotation_panel-bceac7d9.css">
  <link rel="stylesheet" href="/assets/tree_list_shell-da642102.css">
</head>
<body>
  <script src="/web/icons.js"></script>
  <div class="page-root">

    <!-- ── 顶部工具栏 ─────────────────────────────────────── -->
    <div class="toolbar">
      <div class="toolbar-actions">
        <label class="sel-project-label">全部项目
          <select id="sel-project" class="sel-project"></select>
        </label>
        <div class="ie-toolbar-btns">
          <button id="btn-import" class="ie-toolbar-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导入零件
          </button>
          <button id="btn-new-blank" class="ie-toolbar-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新建版本
          </button>
          <button id="btn-export" class="ie-toolbar-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            导出
          </button>
          <button id="btn-annotated" class="ie-toolbar-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V6h1a2 2 0 000-4H8a2 2 0 000 4h1v4.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24z"/></svg>
            已标注
          </button>
        </div>
        <!-- 目标版本状态区 -->
        <div id="pbom-status-area" style="display:none;align-items:center;gap:6px;margin-left:8px;">
          <span id="pbom-status-badge" style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;"></span>
          <button id="btn-mark-ready" class="ie-toolbar-btn" style="font-size:11px;padding:3px 8px;"></button>
        </div>
      </div>
    </div>

    <!-- ── 三栏主布局（由 ListDiffShell 动态生成）─────────── -->
    <div class="main-layout" id="diff-shell-root"></div>
  </div>

  <!-- ── 导入零件弹窗 ──────────────────────────────────────── -->
  <div id="modal-import" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">导入零件</div>
      <label>导入方式
        <select id="imp-source" class="modal-select">
          <option value="import">Excel 导入</option>
          <option value="manual">手动录入</option>
          <option value="sync">系统同步</option>
        </select>
      </label>
      <!-- 版本模式：新建 or 选现有 -->
      <label>版本
        <select id="imp-ver-mode" class="modal-select">
          <option value="new">新建版本</option>
          <option value="existing">导入到现有版本</option>
        </select>
      </label>
      <!-- 现有版本选择（existing 模式） -->
      <div id="imp-existing-wrap">
        <label>选择版本
          <select id="imp-existing-ver" class="modal-select">
            <option value="">-- 请先选择项目 --</option>
          </select>
        </label>
      </div>
      <!-- 新建版本字段（new 模式） -->
      <div id="imp-new-wrap">
        <label>所属项目
          <select id="imp-project" class="modal-select">
            <option value="">（无项目）</option>
          </select>
        </label>
        <label>可选后缀（如 v2）
          <input id="imp-suffix" type="text" placeholder="留空则不追加后缀" />
        </label>
        <label>版本名预览（自动生成，可修改）
          <input id="imp-ver-preview" type="text" placeholder="项目名-后缀-时间戳" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="btn-imp-cancel" class="btn-ghost">取消</button>
        <button id="btn-imp-confirm" class="btn-primary">创建版本并继续导入</button>
      </div>
    </div>
  </div>

  <!-- ── 新建空白版本 ──────────────────────────────────────── -->
  <div id="modal-new-ver" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">新建空白版本</div>
      <label>所属项目
        <select id="nv-project" class="modal-select">
          <option value="">（无项目）</option>
        </select>
      </label>
      <label>可选后缀（如 v2）
        <input id="nv-suffix" type="text" placeholder="留空则不追加后缀" />
      </label>
      <label>版本名（自动生成，可修改）
        <input id="nv-name" type="text" placeholder="项目名-后缀-时间戳" />
      </label>
      <div class="modal-actions">
        <button id="btn-nv-cancel" class="btn-ghost">取消</button>
        <button id="btn-nv-confirm" class="btn-primary">创建</button>
      </div>
    </div>
  </div>

  <!-- ── 添加/编辑零件对话框 ──────────────────────────────── -->
  <div id="modal-part" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="part-modal-title">添加零件</div>
      <label>零件号 *
        <input id="inp-part-no" type="text" placeholder="如 A123456-00" />
      </label>
      <label>零件名称 *
        <input id="inp-part-name" type="text" placeholder="零件名称" />
      </label>
      <label>数量
        <input id="inp-part-qty" type="number" value="1" min="0.001" step="0.001" />
      </label>
      <label>单位
        <input id="inp-part-unit" type="text" value="pcs" placeholder="pcs / 件 / kg" />
      </label>
      <label>材料
        <input id="inp-part-material" type="text" placeholder="可选" />
      </label>
      <label>父零件（GID，可选）
        <input id="inp-part-parent" type="text" placeholder="留空表示顶层" />
      </label>
      <label>临时修正VPPS（可选，优先用于匹配）
        <input id="inp-part-temp-vpps" type="text" placeholder="留空则使用原始VPPS" />
      </label>
      <label>备注
        <textarea id="inp-part-remark" rows="2" placeholder="可选备注信息" style="resize:vertical"></textarea>
      </label>
      <div class="modal-actions">
        <button id="btn-part-cancel" class="btn-ghost">取消</button>
        <button id="btn-part-confirm" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="/web/components/view_manager.js"></script>
  <script src="/web/components/export_template_editor.js"></script>
  <script src="/web/components/import_export.js"></script>
  <script src="/web/components/diff_manager.js"></script>
  <script src="/web/components/grid_editor.js"></script>
  <script src="/web/components/list_sidebar.js"></script>
  <script src="/web/components/entry_thread.js"></script>
  <script src="/web/components/sidebar_detail_panel.js"></script>
  <script src="/web/components/tree_view.js"></script>
  <script src="/web/components/overlay_edit_modal.js"></script>
  <script src="/web/components/list_shell.js"></script>
  <script src="/web/components/data_registry.js"></script>
  <script src="/web/components/tree_list_shell.js"></script>
  
  <script src="/web/components/list_diff_shell.js"></script>
  
  <script src="/web/components/self_annotation_panel.js"></script>
  <script src="ebom.js"></script>
</body>
</html>
