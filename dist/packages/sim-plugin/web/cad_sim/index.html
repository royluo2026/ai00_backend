<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>数模仿真</title>

  <link rel="stylesheet" href="/assets/index-06e617e5.css">
</head>
<body>

<!-- VisMockup 状态横幅 -->
<div id="vmBanner" class="cs-vm-banner hidden">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <span id="vmBannerText"></span>
</div>

<!-- 顶部工具栏 -->
<div class="cs-toolbar">
  <div class="cs-toolbar-title">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
      <line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
    数模仿真
  </div>
  <div class="cs-toolbar-sep"></div>

  <!-- VisMockup 启动 -->
  <button id="btnLaunchVm" class="cs-btn" title="启动 VisMockup 并连接">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    启动 VisMockup
  </button>

  <!-- 打开文件 -->
  <button id="btnOpenFile" class="cs-btn" title="在 VisMockup 中打开 PLMXML / JT 文件">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
    </svg>
    打开文件
  </button>
  <div class="cs-toolbar-sep"></div>

  <!-- VisMockup 状态指示 -->
  <div id="vmStatusDot" class="cs-vm-dot" title="VisMockup 未连接"></div>
  <span id="vmStatusLabel" class="cs-vm-label">未连接</span>
  <div class="cs-toolbar-sep"></div>

  <!-- 仿真任务 -->
  <button id="btnNewTask" class="cs-btn primary">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    新建仿真任务
  </button>
  <button id="btnGovernedCapture" class="cs-btn primary" title="通过 AI00 Connector 搭建环境并按工艺倒序截图">
    AI00 Connector 截图
  </button>
  <div class="cs-toolbar-spacer"></div>

  <!-- 复位视角 -->
  <button id="btnResetCamera" class="cs-btn" title="重置 VisMockup 视角">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12a9 9 0 1018 0 9 9 0 00-18 0"/><polyline points="3 3 3 12 12 12"/>
    </svg>
    复位
  </button>
</div>

<!-- 主体双栏：BOP 树 + 3D viewer -->
<div class="cs-body">

  <!-- 左侧：BOP 结构树面板 -->
  <div class="cs-bop-panel" id="bopPanel">
    <!-- BOP 版本选择 -->
    <div class="cs-bop-hdr">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M17.5 14v6m-3-3h6"/>
      </svg>
      BOP 结构树
    </div>

    <!-- 版本选择器 -->
    <div class="cs-bop-ver-row">
      <select id="bopVersionSel" class="cs-bop-ver-sel">
        <option value="">-- 选择 BOP 版本 --</option>
      </select>
      <button id="btnLoadBopVer" class="cs-btn cs-btn-xs" title="加载所选版本">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
        </svg>
      </button>
      <button id="btnRefreshVers" class="cs-btn cs-btn-xs" title="刷新版本列表">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
      </button>
    </div>

    <!-- GID 手动输入（折叠区，点击"更多"展开）-->
    <div id="bopManualRow" class="cs-bop-manual-row hidden">
      <input type="text" id="bopGidInput" class="cs-bop-gid-input" placeholder="或直接输入 BOP 版本 GID">
      <button id="btnLoadBopGid" class="cs-btn cs-btn-xs">加载</button>
    </div>
    <button id="btnToggleManual" class="cs-bop-toggle-manual">手动输入 GID</button>

    <!-- 版本状态徽标 -->
    <div id="bopVerStatus" class="cs-bop-ver-status hidden"></div>

    <!-- 树体 -->
    <div id="bopTreeLoading" class="cs-bop-loading hidden">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="cs-spin">
        <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
      </svg>
      加载中...
    </div>
    <div id="bopTreeEmpty" class="cs-bop-empty hidden">请选择 BOP 版本</div>
    <div id="bopTreeBody" class="cs-bop-tree-body"></div>
  </div>

  <!-- 中间：VisMockup 结构树面板 -->
  <div class="cs-vis-panel" id="visPanel">
    <div class="cs-vis-hdr">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      VM 结构树
      <button id="btnRefreshVisTree" class="cs-btn cs-btn-xs" title="从 VisMockup 重新加载结构树" style="margin-left:auto">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
      </button>
      <button id="btnScanCatiaMap" class="cs-btn cs-btn-xs" title="扫描全树 catiaOccurrenceName 映射（不触发几何加载）">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        扫描映射
      </button>
      <button id="btnCaptureOps" class="cs-btn cs-btn-xs"
              title="对选中 BOP 节点下所有 operation 按 sort_order 倒序截图并存入工步">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M9 5V3h6v2"/>
        </svg>
        按工序截图
      </button>
    </div>
    <div id="visTreeLoading" class="cs-bop-loading hidden">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="cs-spin">
        <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
      </svg>
      加载中...
    </div>
    <div id="visTreeEmpty" class="cs-bop-empty">连接后点击刷新加载结构树</div>
    <div id="visTreeBody" class="cs-vis-tree-body"></div>
  </div>

  <!-- 右侧：VisMockup 控制区 + 详情面板 -->
  <div class="cs-viewer-panel">
    <div class="cs-viewer-toolbar">
      <span style="font-size:11px;color:var(--text-muted)" id="nodePathLabel">—</span>
      <div style="flex:1"></div>
    </div>
    <div class="cs-viewer-body" id="viewerBody">
      <div id="vmPlaceholder" class="cs-vm-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <p>点击"启动 VisMockup"连接 3D 查看器</p>
        <p style="font-size:11px;opacity:.6;margin-top:4px">VisMockup 已打开时将自动连接，无需重新启动</p>
      </div>
    </div>

    <!-- 底部详情面板（BOP 节点 / VM 节点详情，可折叠） -->
    <div id="csDetailPanel" class="cs-dp">
      <!-- 关闭状态：把手条 -->
      <div class="cs-dp-handle" id="dpHandle">
        <div class="cs-dp-grip"></div>
        <span class="cs-dp-handle-label" id="dpHandleLabel">点击节点后在此查看详情 ▲</span>
      </div>
      <!-- 开启状态：拖拽调高条 + 头部 + 主体 -->
      <div class="cs-dp-resize" id="dpResize"></div>
      <div class="cs-dp-header">
        <span class="cs-dp-source-tag" id="dpSourceTag">—</span>
        <span class="cs-dp-title" id="dpTitle">—</span>
        <div style="flex:1"></div>
        <button class="cs-dp-close" id="dpClose" title="关闭详情面板">✕</button>
      </div>
      <div class="cs-dp-body">
        <div class="cs-dp-placeholder" id="dpPlaceholder">点击左侧 BOP 树或 VM 树中的节点</div>
        <!-- BOP 详情 -->
        <div id="dpBopContent" class="cs-dp-content hidden">
          <div class="cs-dp-tree" id="dpBopTree"></div>
          <div class="cs-dp-divider"></div>
          <div class="cs-dp-right" id="dpBopRight"></div>
        </div>
        <!-- VM 详情 -->
        <div id="dpVisContent" class="cs-dp-content hidden">
          <div class="cs-dp-left" id="dpVisLeft"></div>
          <div class="cs-dp-divider"></div>
          <div class="cs-dp-right" id="dpVisRight"></div>
        </div>
      </div>
    </div>
  </div>
</div><!-- /.cs-body -->

<!-- VM 测试命令条 -->
<div class="cs-cmd-bar">
  <span class="cs-cmd-bar-label">VM</span>
  <div class="cs-cmd-sep"></div>

  <!-- 视图显示 -->
  <button id="cmdAllOn" class="cs-btn cs-btn-xs" title="AllNodesOn — 显示所有节点">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </svg>
    全显
  </button>
  <button id="cmdAllOff" class="cs-btn cs-btn-xs" title="AllNodesOff — 隐藏所有节点">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
    全隐
  </button>
  <div class="cs-cmd-sep"></div>

  <!-- 选择 -->
  <button id="cmdSelVisible" class="cs-btn cs-btn-xs" title="SelectVisibleNodes — 选中所有可见节点">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
    </svg>
    选可见
  </button>
  <button id="cmdDesel" class="cs-btn cs-btn-xs" title="DeSelectAllNodes — 取消全部选中">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
    </svg>
    取消选
  </button>
  <div class="cs-cmd-sep"></div>

  <!-- 动态高亮 -->
  <button id="cmdDynHlOn" class="cs-btn cs-btn-xs" title="SetForceDynamicHighlight(True) — 开启动态高亮">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    高亮↑
  </button>
  <button id="cmdDynHlOff" class="cs-btn cs-btn-xs" title="SetForceDynamicHighlight(False) — 关闭动态高亮">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" opacity=".4"/>
    </svg>
    高亮↓
  </button>
  <div class="cs-cmd-sep"></div>

  <!-- 信息 -->
  <button id="cmdDocInfo" class="cs-btn cs-btn-xs" title="查询文档信息（路径、节点数等）">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    文档信息
  </button>

  <!-- 截图 -->
  <button id="cmdCapture" class="cs-btn cs-btn-xs" title="CaptureImage — 截图到 Temp 目录">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>
    </svg>
    截图
  </button>
  <div class="cs-cmd-sep"></div>

  <!-- 加载全部几何 -->
  <button id="cmdLoadAllGeo" class="cs-btn cs-btn-xs" title="遍历全树触发 JT 几何数据加载（大型文件耗时较长，谨慎使用）">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
      <polyline points="12 2 12 12"/><polyline points="8 8 12 12 16 8"/>
    </svg>
    加载全部几何
  </button>

  <div class="cs-cmd-sep"></div>
  <!-- 调试：原始树结构 -->
  <button id="cmdDebugTree" class="cs-btn cs-btn-xs" title="调试：打印 VisMockup 原始节点树到 console（F12查看）">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
    </svg>
    Debug树
  </button>

  <!-- 诊断 catia 匹配 -->
  <button id="cmdDebugCatiaMatch" class="cs-btn cs-btn-xs" title="诊断 BOP catia_occ 与 VM catiaOccurrenceName 是否对得上（详见F12）">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    诊断匹配
  </button>

  <div style="flex:1"></div>
  <span class="cs-cmd-result" id="cmdResult"></span>
</div>

<!-- 新建仿真任务弹窗 -->
<div id="connectorCaptureOverlay" class="cs-modal-overlay hidden">
  <div class="cs-modal cs-connector-modal">
    <div class="cs-modal-title">AI00 Connector · 环境搭建与倒序截图</div>
    <div class="cs-connector-note">浏览器只提交受治理任务；VisMockup COM、场景控制和内部截图均在本机 Connector 中执行。</div>
    <div class="cs-field">
      <label>环境名称</label>
      <input id="connectorEnvironmentName" value="工艺倒序截图环境" maxlength="255">
    </div>
    <div class="cs-field">
      <label>Connector 设备 ID</label>
      <input id="connectorDeviceId" placeholder="选择或输入已绑定设备 ID">
    </div>
    <div class="cs-connector-source" id="connectorSource">请先选择已发布的 BOP 版本</div>
    <div id="connectorProblems" class="cs-connector-problems hidden"></div>
    <div id="connectorProgress" class="cs-connector-progress">尚未预检</div>
    <div class="cs-modal-actions">
      <button class="cs-btn" id="connectorClose">关闭</button>
      <button class="cs-btn" id="connectorCompose">搭建环境</button>
      <button class="cs-btn" id="connectorPreflight" disabled>重新预检</button>
      <button class="cs-btn primary" id="connectorStart" disabled>物化并截图</button>
      <button class="cs-btn" id="connectorCancel" disabled>取消</button>
    </div>
  </div>
</div>

<!-- 新建仿真任务弹窗 -->
<div id="taskModalOverlay" class="cs-modal-overlay hidden">
  <div class="cs-modal">
    <div class="cs-modal-title">新建仿真任务</div>
    <input type="hidden" id="taskModalGid">
    <div class="cs-field">
      <label>任务标题</label>
      <input type="text" id="taskModalTitle" placeholder="输入任务标题">
    </div>
    <div class="cs-field">
      <label>任务类型</label>
      <select id="taskModalType">
        <option value="early_eval">早期评估</option>
        <option value="change_eval">变更评估</option>
        <option value="stage_eval">阶段评估</option>
      </select>
    </div>
    <div class="cs-field">
      <label>关联工艺规划 GID（可选）</label>
      <input type="text" id="taskModalWorkPlan" placeholder="work_plan_gid">
    </div>
    <div class="cs-modal-actions">
      <button class="cs-btn" id="taskModalCancel">取消</button>
      <button class="cs-btn primary" id="taskModalSave">创建</button>
    </div>
  </div>
</div>

<!-- online-3d-viewer：Three.js 降级预览 -->
<script src="../assets/lib/occt/o3dv.min.js"></script>
<script src="structure_tree.js"></script>
<script src="viewer3d.js"></script>
<script src="capture_workflow.js"></script>
<script src="cad_sim.js"></script>
<script>
  // 主题同步
  window.addEventListener('message', e => {
    if (e.data?.type === 'theme')
      document.documentElement.setAttribute('data-theme', e.data.theme || 'dark');
  });
  try {
    document.documentElement.setAttribute('data-theme',
      window.parent?.document?.documentElement?.getAttribute('data-theme') || 'dark');
  } catch(_) {}
</script>
</body>
</html>
