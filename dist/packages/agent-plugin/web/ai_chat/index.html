<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI 助手</title>
<!-- 标题栏专属样式（弹窗特有） -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; user-select: none;
  background: var(--bg);
}
.titlebar {
  height: var(--titlebar-h); display: flex; align-items: center;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 12px; flex-shrink: 0; -webkit-app-region: drag;
}
.titlebar-icon { width: 16px; height: 16px; opacity: .7; flex-shrink: 0; color: var(--accent); }
.titlebar-title { flex: 1; font-size: 12px; font-weight: 500; color: var(--text-dim); padding-left: 7px; }
.titlebar-controls { display: flex; gap: 1px; -webkit-app-region: no-drag; }
.win-btn {
  width: 28px; height: 28px; border: none; background: none;
  color: var(--text-muted); cursor: pointer; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s, color .1s;
}
.win-btn:hover { background: var(--hover); color: var(--text); }
.win-btn.danger:hover { background: var(--red); color: #fff; }
</style>
<!-- 共享样式（包含所有 .ai-* 组件） -->


<!-- 覆盖 --titlebar-h（必须在共享 CSS 之后，否则被 ai_assistant.css 的 0px 覆盖） -->
<style>:root { --titlebar-h: 32px; }</style>
  <link rel="stylesheet" href="/assets/index-215ea23e.css">
  <link rel="stylesheet" href="/assets/workflow_canvas-44ad52aa.css">
</head>
<body>

<!-- 标题栏（弹窗特有） -->
<div class="titlebar">
  <span class="titlebar-title">小柔 · AI 柔性业务助手</span>
  <div class="titlebar-controls">
    <button class="win-btn" id="winMin" title="最小化">
      <svg width="10" height="2" viewBox="0 0 10 2"><line x1="0" y1="1" x2="10" y2="1" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="win-btn" id="winMax" title="最大化">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="8" height="8"/></svg>
    </button>
    <button class="win-btn danger" id="winClose" title="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</div>

<!-- AI 主体（与 ai_assistant.html 保持一致） -->
<div class="ai-shell">

  <div class="ai-body">

    <!-- 协作面板（默认折叠，位于左侧侧边栏与对话区之间） -->
    <div class="ai-collab-section collapsed" id="aiCollabSection">
      <button class="ai-collab-toggle" id="aiCollabToggle" title="协作模式">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span class="ai-collab-badge hidden" id="aiCollabBadge"></span>
      </button>
      <div class="ai-collab-body">
        <div class="ai-collab-header">
          <span class="ai-collab-title">协作模式</span>
          <button class="ai-mode-toggle" id="aiModeToggle" data-mode="auto" title="切换 Orchestrator 模式">自动</button>
        </div>
        <!-- 协作阶段进度 -->
        <div class="ai-orch-phase hidden" id="aiOrchPhase">
          <span class="ai-orch-step" data-step="1">规划</span>
          <span class="ai-orch-arrow">›</span>
          <span class="ai-orch-step" data-step="2">执行</span>
          <span class="ai-orch-arrow">›</span>
          <span class="ai-orch-step" data-step="3">汇总</span>
        </div>
        <div class="ai-agent-tree" id="aiAgentTree">
          <div class="ai-agent-tree-empty">无活跃 Agent</div>
        </div>
      </div>
    </div>

    <!-- 左侧：历史会话 -->
    <div class="ai-sidebar" id="aiSidebar">
      <div class="ai-sidebar-header">
        <button class="ai-collapse-btn" id="aiSidebarToggle" title="折叠历史对话">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span class="ai-sidebar-title">历史对话</span>
        <button class="ai-new-btn" id="aiNewBtn" title="新建对话">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="ai-session-list" id="aiSessionList"></div>

      <!-- 话题讨论区（WFC 沙盘配套） -->
      <div class="ai-disc-wrap" id="aiDiscWrap">
        <div class="ai-disc-hdr">
          <span class="ai-disc-title">话题讨论</span>
          <button class="ai-disc-organize-btn" id="aiDiscOrganizeBtn" title="整理讨论结果到画布">→ 画布</button>
          <button class="ai-disc-export-btn" id="aiDiscExportBtn" title="导出 Markdown">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="ai-disc-add-btn" id="aiDiscAddBtn" title="新建话题">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="ai-topics" id="aiTopics"></div>
      </div>
    </div>

    <!-- 中间：对话区 -->
    <div class="ai-main">
      <div class="ai-messages" id="aiMessages">
        <div class="ai-empty" id="aiEmpty">
          <img class="ai-empty-logo ai-empty-logo-dark"
               src="/assets/logo_light-e3521d72.svg" alt="AI00">
          <img class="ai-empty-logo ai-empty-logo-light"
               src="/assets/logo_dark-78acb428.svg" alt="AI00">
          <h3>小柔</h3>
          <p>ME 总装团队的柔性智能业务助手，有什么可以帮到你？</p>
        </div>
      </div>

      <div class="ai-input-area">
        <!-- Skill @触发下拉 -->
        <div class="ai-skill-drop hidden" id="aiSkillDrop"></div>
        <textarea class="ai-input" id="aiInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行…@ 触发 Skill" rows="1"></textarea>
        <button class="ai-mic-btn" id="aiMicBtn" title="语音输入">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="ai-send-btn" id="aiSendBtn" title="发送">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 右侧：工具调用面板 -->
    <div class="ai-tools-panel" id="aiToolsPanel">
      <div class="ai-tools-header">
        <button class="ai-collapse-btn" id="aiToolsToggle" title="折叠工具面板">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <span class="ai-tools-title">工具调用</span>
        <button class="ai-tool-list-btn" id="aiToolListBtn" title="查看工具注册表">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>

      <!-- Skill 快捷面板 -->
      <div class="ai-skill-panel" id="aiSkillPanel">
        <div class="ai-skill-panel-header">
          <span class="ai-skill-panel-title">Skill 快捷调用</span>
          <button class="ai-skill-panel-refresh" id="aiSkillPanelRefresh" title="刷新 Skill 列表">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
        </div>
        <div class="ai-skill-cards" id="aiSkillCards">
          <div class="ai-skill-empty" id="aiSkillEmpty">暂无激活 Skill</div>
        </div>
      </div>

      <div class="ai-tool-cards" id="aiToolCards">
        <div class="ai-tool-empty" id="aiToolEmpty">本轮暂无工具调用</div>
      </div>
    </div><!-- #aiToolsPanel -->

    <!-- 最右侧：工作流画布面板 -->
    <div class="ai-canvas-panel collapsed" id="aiCanvasPanel">
      <button class="ai-canvas-toggle" id="aiCanvasToggle" title="工作流画布">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <path d="M6.5 10v4M6.5 14h8M17.5 10v4"/>
        </svg>
      </button>
      <div class="ai-canvas-body" id="aiCanvasBody">
        <!-- 标题栏 -->
        <div class="wfc-header">
          <span class="wfc-title">工作流画布</span>
          <div class="wfc-header-actions">
            <!-- Agent 上下文开关 -->
            <button class="wfc-hdr-btn wfc-ctx-btn" id="wfcCtxToggle" title="关闭时 Agent 不自动读取画布，节省 token；打开时每次发送消息自动注入画布上下文">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
              <span id="wfcCtxLabel">上下文 关</span>
            </button>
            <button class="wfc-hdr-btn" id="wfcSaveBtn" title="保存画布">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>
            </button>
            <button class="wfc-hdr-btn" id="wfcLoadBtn" title="加载画布">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
              </svg>
            </button>
            <button class="wfc-hdr-btn" id="wfcClearBtn" title="清空画布">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </button>
            <button class="wfc-hdr-btn wfc-inject-btn" id="wfcInjectBtn" title="注入对话">→ 对话</button>
            <button class="wfc-hdr-btn wfc-skill-btn" id="wfcToSkillBtn" title="转为Skill">转 Skill</button>
          </div>
        </div>
        <!-- 节点库 -->
        <div class="wfc-palette" id="wfcPalette">
          <div class="wfc-palette-pinned" id="wfcPinned"></div>
          <div class="wfc-palette-groups" id="wfcGroups"></div>
        </div>          <div class="wfc-canvas-col">
        <!-- 主画布板 -->
        <div class="wfc-board" id="wfcBoard">
          <!-- 流程图区（≤25% 高度，超出滚动） -->
          <div class="wfc-flow-section">
            <div class="wfc-qa-section" id="wfcQaSection">
              <div class="wfc-qa-col wfc-q-col" id="wfcQCol">
                <div class="wfc-qa-col-hdr">问题</div>
              </div>
              <div class="wfc-qa-col wfc-a-col" id="wfcACol">
                <div class="wfc-qa-col-hdr">回答</div>
              </div>
            </div>
            <div class="wfc-grid" id="wfcGrid">
              <svg class="wfc-connections" id="wfcSvg"></svg>
              <div class="wfc-lanes" id="wfcLanes"></div>
            </div>
          </div>
          <!-- 可拖拽分割线 -->
          <div class="wfc-bc-divider" id="wfcBcDivider"></div>
          <!-- 底部大容器（标签式） -->
          <div class="wfc-bottom-container" id="wfcBottomContainer">
            <div class="wfc-bc-tabbar" id="wfcBcTabbar">
              <button class="wfc-bc-tab active" data-tab="sandbox">沙盘</button>
              <button class="wfc-bc-add" id="wfcBcAdd" title="添加标签页">+</button>
            </div>
            <div class="wfc-bc-panes" id="wfcBcPanes">
              <!-- 沙盘面板（静态 DOM，供 _initSandbox 直接使用） -->
              <div class="wfc-bc-pane active" data-tab="sandbox">
                <div class="wfc-sandbox-vp" id="wfcwSandboxVp">
                  <div class="wfc-sandbox-world" id="wfcwSandboxWorld">
                    <svg class="wfc-sandbox-svg" id="wfcwSandboxSvg"></svg>
                  </div>
                </div>
                <div class="wfc-sandbox-zoom-ctrl">
                  <button id="wfcwZoomOut" title="缩小">−</button>
                  <span id="wfcwZoomLabel">100%</span>
                  <button id="wfcwZoomIn" title="放大">+</button>
                  <button id="wfcwZoomFit" title="适配视图">适配</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 底部状态 -->
        <div class="wfc-footer" id="wfcFooter">
          <span id="wfcStats">0 节点 · 0 连线</span>
          <button class="wfc-mode-btn" id="wfcModeBtn" data-mode="explore">探索模式</button>
        </div>
      </div><!-- /.ai-canvas-body -->

  </div><!-- .ai-body -->

  <!-- 底部状态栏 -->
  <div class="ai-statusbar">
    <button class="ai-sb-entry-btn" id="aiSbChatBtn" title="AI 聊天">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      AI 聊天
    </button>
    <button class="ai-sb-entry-btn" id="aiSbCanvasBtn" title="AI 画布">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v4M6.5 14h8M17.5 10v4"/></svg>
      AI 画布
    </button>
    <span class="ai-sb-sep">·</span>
    <span class="ai-sb-bal" id="aiSbBal" title="">¥—</span>
    <span class="ai-sb-refresh-time" id="aiSbRefreshTime"></span>
    <span class="ai-sb-sep ai-sb-usage-sep hidden" id="aiSbUsageSep1">·</span>
    <span class="ai-sb-usage" id="aiSbUsage"></span>
    <span class="ai-sb-sep">·</span>
    <span class="ai-sb-model" id="aiSbModel" title="">—</span>
    <span class="ai-sb-sep">·</span>
    <span class="ai-sb-iter" id="aiSbIter">0 轮</span>
  </div>

</div><!-- .ai-shell -->

<!-- 工具注册表弹窗 -->
<div class="ai-tl-overlay hidden" id="aiToolListOverlay">
  <div class="ai-tl-modal">
    <div class="ai-tl-header">
      <span class="ai-tl-header-title">工具注册表</span>
      <span class="ai-tl-total" id="aiTlTotal"></span>
      <button class="ai-detail-close" id="aiToolListClose">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="ai-tl-body" id="aiTlBody">
      <div class="ai-tl-loading">加载中…</div>
    </div>
  </div>
</div>

<!-- 工具调用详情弹窗 -->
<div class="ai-detail-overlay hidden" id="aiToolDetail">
  <div class="ai-detail-modal">
    <div class="ai-detail-header">
      <span id="aiDetailTitle">tool_name</span>
      <button class="ai-detail-close" id="aiDetailClose">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="ai-detail-body" id="aiDetailBody"></div>
  </div>
</div>

<!-- Agent 详情浮层 -->
<div class="ai-agent-detail-overlay hidden" id="aiAgentDetailOverlay">
  <div class="ai-agent-detail-modal">
    <div class="ai-agent-detail-header">
      <span class="ai-agent-detail-title" id="aiAgentDetailTitle">Agent</span>
      <button class="ai-detail-close" id="aiAgentDetailClose">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="ai-agent-detail-body" id="aiAgentDetailBody"></div>
  </div>
</div>

<!-- Skill 变量填写 Modal -->
<div class="ai-skill-var-overlay hidden" id="aiSkillVarOverlay">
  <div class="ai-skill-var-modal">
    <div class="ai-skill-var-header">
      <span class="ai-skill-var-title" id="aiSkillVarTitle">填写 Skill 变量</span>
      <button class="ai-detail-close" id="aiSkillVarClose">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="ai-skill-var-body" id="aiSkillVarBody"></div>
    <div class="ai-skill-var-footer">
      <button class="ai-skill-var-cancel" id="aiSkillVarCancel">取消</button>
      <button class="ai-skill-var-confirm" id="aiSkillVarConfirm">确认</button>
    </div>
  </div>
</div>

<!-- 弹窗特有初始化（主题 + 标题栏按钮），必须在 ai_assistant.js 之前 -->
<script>
  (function () {
    // 主题初始化（Electron 直接获取）
    const saved = localStorage.getItem('system.theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    window.electronAPI?.onThemeChanged?.(function (theme) {
      document.documentElement.setAttribute('data-theme', theme || 'dark');
      localStorage.setItem('system.theme', theme || 'dark');
    });
    // 标题栏按钮
    document.getElementById('winMin').addEventListener('click', function () { window.electronAPI?.minimizeSelf(); });
    document.getElementById('winMax').addEventListener('click', function () { window.electronAPI?.maximizeSelf(); });
    document.getElementById('winClose').addEventListener('click', function () { window.electronAPI?.close(); });
  })();
</script>
<script>
  window.addEventListener('message', function (e) {
    if (e.data?.type === 'theme')
      document.documentElement.setAttribute('data-theme', e.data.theme || 'dark');
    if (e.data?.type === 'ai_ctx_event' || e.data?.type === 'ai_ctx_state') {
      window._wfc?._recordCtxEvent({ ...e.data, ts: Date.now() });
    }
  });
</script>
<!-- 共享脚本 -->
<script src="/web/assets/lib/marked.min.js"></script>
<script src="../automation_hub/workflow_canvas.js"></script>
<script src="../automation_hub/ai_assistant.js"></script>
</body>
</html>
