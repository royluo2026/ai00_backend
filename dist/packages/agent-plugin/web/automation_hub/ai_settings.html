<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI 设置</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1e1e2e; --bg2: #181825; --bg3: #11111b;
  --text: #cdd6f4; --text-muted: #6c7086; --text-dim: #9399b2;
  --accent: #89b4fa; --green: #a6e3a1; --red: #f38ba8; --peach: #fab387; --yellow: #f9e2af;
  --border: #313244; --hover: #2a2a3d; --active: #2d3561;
}
[data-theme="light"] {
  --bg: #eff1f5; --bg2: #e6e9ef; --bg3: #dce0e8;
  --text: #4c4f69; --text-muted: #9ca0b0; --text-dim: #6c6f85;
  --accent: #1e66f5; --green: #40a02b; --red: #d20f39; --peach: #fe640b; --yellow: #df8e1d;
  --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
}
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif; font-size: 13px; overflow: hidden; }

/* ── 页面滚动容器 ── */
.page { height: 100%; overflow-y: auto; padding: 28px 32px; }
.page::-webkit-scrollbar { width: 5px; }
.page::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 区块标题 ── */
.section { max-width: 680px; margin: 0 auto 28px; }
.section-title {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.section-badge {
  font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 10px;
  background: rgba(137,180,250,.15); color: var(--accent); border: 1px solid rgba(137,180,250,.3);
  text-transform: none; letter-spacing: 0;
}
.section-badge.admin {
  background: rgba(250,179,135,.12); color: var(--peach); border-color: rgba(250,179,135,.3);
}

/* ── Provider 卡片 ── */
.provider-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 4px;
}
.provider-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 14px 8px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--bg2);
  cursor: pointer; transition: border-color .14s, background .14s;
  user-select: none;
}
.provider-card:hover { background: var(--hover); border-color: var(--accent); }
.provider-card.selected { border-color: var(--accent); background: var(--active); }
.provider-icon { width: 28px; height: 28px; opacity: .85; }
.provider-name { font-size: 12px; font-weight: 500; color: var(--text-dim); }
.provider-card.selected .provider-name { color: var(--accent); }

/* ── CHJ 私有模型快选 ── */
.chj-model-row {
  display: none; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; border-radius: 6px;
  background: var(--bg3); border: 1px solid var(--border);
  margin-bottom: 10px;
}
.chj-model-row.show { display: flex; }
.chj-model-row-label { font-size: 11px; color: var(--text-muted); align-self: center; white-space: nowrap; }
.chj-model-chip {
  padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text-dim); font-size: 11px;
  cursor: pointer; transition: border-color .12s, color .12s, background .12s;
  user-select: none;
}
.chj-model-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--hover); }
.chj-model-chip.selected { border-color: var(--accent); color: var(--accent); background: var(--active); font-weight: 600; }

/* ── 表单 ── */
.form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-label {
  font-size: 12px; font-weight: 500; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px;
}
.form-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  background: rgba(137,180,250,.12); color: var(--text-muted); border: 1px solid var(--border);
}
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

.field-wrap { position: relative; display: flex; }
.field-wrap input {
  flex: 1; padding: 8px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .12s;
  min-width: 0;
}
.field-wrap input:focus { border-color: var(--accent); }
.field-wrap input::placeholder { color: var(--text-muted); }
.field-wrap input.has-action { padding-right: 72px; }

.field-action {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 2px;
}
.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: none; background: none;
  color: var(--text-muted); cursor: pointer; border-radius: 4px;
  transition: background .1s, color .1s;
}
.icon-btn:hover { background: var(--hover); color: var(--accent); }

/* ── 操作按钮行 ── */
.action-row {
  display: flex; align-items: center; gap: 10px; margin-top: 20px;
}
.btn {
  padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: opacity .12s;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--bg3); }
.btn-outline {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  background: none; border: 1px solid rgba(243,139,168,.4); color: var(--red);
}
.btn-danger:hover { background: rgba(243,139,168,.08); }

/* ── 状态提示 ── */
.status-bar {
  display: none; align-items: center; gap: 7px;
  padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-left: auto;
}
.status-bar.show { display: flex; }
.status-bar.ok   { background: rgba(166,227,161,.12); color: var(--green);  border: 1px solid rgba(166,227,161,.3); }
.status-bar.err  { background: rgba(243,139,168,.12); color: var(--red);    border: 1px solid rgba(243,139,168,.3); }
.status-bar.info { background: rgba(137,180,250,.10); color: var(--accent); border: 1px solid rgba(137,180,250,.2); }

/* ── 当前配置展示 ── */
.config-preview {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.config-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg2); font-size: 11px; color: var(--text-dim);
}
.config-chip .chip-label { color: var(--text-muted); }
.config-chip .chip-val { color: var(--text); font-weight: 500; }
.config-chip .chip-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.chip-dot.ok  { background: var(--green); }
.chip-dot.err { background: var(--red); }

/* ── 来源标签 ── */
.source-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; padding: 1px 8px; border-radius: 10px;
  font-weight: 500;
}
.source-chip.src-user  { background: rgba(166,227,161,.12); color: var(--green);  border: 1px solid rgba(166,227,161,.3); }
.source-chip.src-admin { background: rgba(250,179,135,.12); color: var(--peach);  border: 1px solid rgba(250,179,135,.3); }
.source-chip.src-env   { background: rgba(137,180,250,.10); color: var(--accent); border: 1px solid rgba(137,180,250,.2); }
.source-chip.src-none  { background: rgba(243,139,168,.10); color: var(--red);    border: 1px solid rgba(243,139,168,.3); }

/* ── 余额显示 ── */
.balance-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg2); font-size: 11px; color: var(--text-dim);
  cursor: pointer; transition: border-color .12s;
}
.balance-chip:hover { border-color: var(--accent); }
.balance-chip .bal-val { color: var(--text); font-weight: 500; }
.balance-chip.bal-ok   { border-color: rgba(166,227,161,.4); }
.balance-chip.bal-low  { border-color: rgba(249,226,175,.5); }
.balance-chip.bal-err  { border-color: var(--border); }
.balance-chip.querying { opacity: .6; pointer-events: none; }

/* ── 管理员区块 ── */
#adminSection { display: none; }
</style>
</head>
<body>
<div class="page" id="page">

  <!-- ── 当前有效配置 ── -->
  <div class="section">
    <div class="section-title">
      当前 AI 配置
      <span id="sourceBadge" class="source-chip src-none">未配置</span>
    </div>
    <div class="config-preview" id="configPreview">
      <div class="config-chip">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
        <span class="chip-label">当前模型</span>
        <span class="chip-val" id="modelPreview">—</span>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:4px">
      当前模型为公司内部部署私有化模型，无泄密风险。
    </p>
  </div>

  <!-- ── 管理员全局配置（仅超管可见） ── -->
  <div class="section" id="adminSection">
    <div class="section-title">
      系统默认配置
      <span class="section-badge admin">仅超级管理员</span>
    </div>
    <div class="form-hint" style="margin-bottom:14px;color:var(--text-muted)">
      配置后所有用户均可使用 AI 功能，无需自行填写 API Key。
    </div>

    <!-- Provider 快选 -->
    <div class="section" style="margin-bottom:12px;padding:0">
      <div class="section-title" style="font-size:11px;border-bottom:none;padding-bottom:4px;margin-bottom:8px">
        快速选择 Provider
      </div>
      <div class="provider-grid" id="adminProviderGrid">
        <div class="provider-card" data-model="anthropic/claude-sonnet-4-6" data-base="">
          <svg class="provider-icon" viewBox="0 0 32 32" fill="currentColor" style="color:var(--peach)">
            <path d="M18.19 4h-4.38L7 28h4.38l1.56-4.48h6.12L20.62 28H25L18.19 4zm-3.81 15.52 2.12-6.08 2.12 6.08h-4.24z"/>
          </svg>
          <span class="provider-name">Anthropic</span>
        </div>
        <div class="provider-card" data-model="gpt-4o" data-base="">
          <svg class="provider-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--green)">
            <path d="M29 16a13 13 0 11-26 0 13 13 0 0126 0z"/>
            <path d="M21.5 10.5L16 16m0 0l-5.5 5.5M16 16l5.5 5.5M16 16l-5.5-5.5"/>
          </svg>
          <span class="provider-name">OpenAI</span>
        </div>
        <div class="provider-card" data-model="deepseek/deepseek-chat" data-base="https://api.deepseek.com/v1">
          <svg class="provider-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent)">
            <circle cx="16" cy="16" r="11"/>
            <path d="M10 16c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6"/>
            <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
          </svg>
          <span class="provider-name">DeepSeek</span>
        </div>
        <div class="provider-card" data-model="ollama/qwen2.5:7b" data-base="http://localhost:11434">
          <svg class="provider-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--yellow)">
            <rect x="5" y="8" width="22" height="16" rx="3"/>
            <path d="M10 14h12M10 18h8"/>
          </svg>
          <span class="provider-name">Ollama</span>
        </div>
        <div class="provider-card" data-provider="chj_admin" data-model="kivy-glm-5" data-base="http://api-hub.inner.chj.cloud/llm-gateway/v1">
          <svg class="provider-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--red)">
            <path d="M16 4 L28 10 L28 22 L16 28 L4 22 L4 10 Z"/>
            <path d="M16 4 L16 28M4 10 L28 22M28 10 L4 22"/>
          </svg>
          <span class="provider-name">私有模型</span>
        </div>
      </div>

      <!-- CHJ 私有模型快选 -->
      <div class="chj-model-row" id="adminChjModelRow">
        <span class="chj-model-row-label">选择模型</span>
        <span class="chj-model-chip" data-model="kivy-glm-5">GLM-5</span>
        <span class="chj-model-chip" data-model="kivy-kimi-k2.5">Kimi-K2.5</span>
        <span class="chj-model-chip" data-model="kivy-deepseek-v4-pro">DeepSeek-V4-Pro</span>
        <span class="chj-model-chip" data-model="kivy-nvidia-nemotron-v3">NVIDIA-Nemotron-v3</span>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label" for="adminModelInput">
        模型
        <span class="form-badge">LiteLLM model string</span>
      </label>
      <div class="field-wrap">
        <input id="adminModelInput" type="text"
               placeholder="anthropic/claude-sonnet-4-6"
               autocomplete="off">
      </div>
    </div>

    <div class="form-row">
      <label class="form-label" for="adminKeyInput">API Key（全局）</label>
      <div class="field-wrap">
        <input id="adminKeyInput" type="password"
               class="has-action"
               placeholder="留空保留已有密钥"
               autocomplete="new-password">
        <div class="field-action">
          <button class="icon-btn" id="toggleAdminKeyBtn" title="显示/隐藏">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIconAdmin">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label" for="adminBaseInput">
        Base URL
        <span class="form-badge">可选</span>
      </label>
      <div class="field-wrap">
        <input id="adminBaseInput" type="text"
               placeholder="留空使用 provider 默认地址"
               autocomplete="off">
      </div>
      <div class="form-hint">Ollama 本地：<code>http://localhost:11434</code> &nbsp;·&nbsp; OpenAI 兼容接口：填入自定义 API 地址</div>
    </div>

    <div class="action-row">
      <button class="btn btn-outline" id="adminTestBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:5px;vertical-align:-1px">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        测试连接
      </button>
      <button class="btn btn-primary" id="adminSaveBtn">保存系统默认</button>
      <div class="status-bar" id="adminStatusBar"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── 当前配置展示 ──────────────────────────────────────────────────────────
  const $sourceBadge  = document.getElementById('sourceBadge');
  const $modelPreview = document.getElementById('modelPreview');

  // ── 管理员配置区 ──────────────────────────────────────────────────────────
  const $adminModel   = document.getElementById('adminModelInput');
  const $adminKey     = document.getElementById('adminKeyInput');
  const $adminBase    = document.getElementById('adminBaseInput');
  const $adminTestBtn = document.getElementById('adminTestBtn');
  const $adminSaveBtn = document.getElementById('adminSaveBtn');
  const $adminStatus  = document.getElementById('adminStatusBar');

  // ── 云端 Fetch 帮助函数 ──────────────────────────────────────────────────
  function _cf(method, path, body) {
    const fn = window._cloudFetch || window.parent?._cloudFetch || window.top?._cloudFetch;
    if (!fn) return Promise.reject(new Error('_cloudFetch not available'));
    if (method === 'GET') return fn(path);
    const opts = { method };
    if (body !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    return fn(path, opts);
  }

  // ── 工具函数 ─────────────────────────────────────────────────────────────

  function showStatus(el, msg, type) {
    el.textContent = msg;
    el.className = 'status-bar show ' + type;
    if (type !== 'info') {
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 4000);
    }
  }

  const SOURCE_LABEL = { admin: '来自系统配置', env: '来自环境变量', none: '未配置' };
  const SOURCE_CLASS = { admin: 'src-admin', env: 'src-env', none: 'src-none' };

  function updatePreview(cfg) {
    if (!cfg) return;
    $modelPreview.textContent = cfg.model || '（未配置）';
    const src = cfg.source || 'none';
    $sourceBadge.textContent = SOURCE_LABEL[src] || src;
    $sourceBadge.className = 'source-chip ' + (SOURCE_CLASS[src] || 'src-none');
  }

  document.getElementById('toggleAdminKeyBtn').addEventListener('click', () => {
    const shown = $adminKey.type === 'text';
    $adminKey.type = shown ? 'password' : 'text';
    document.getElementById('eyeIconAdmin').style.opacity = shown ? '1' : '.4';
  });

  // ── 管理员 Provider 快选 ───────────────────────────────────────────────
  const $adminChjModelRow = document.getElementById('adminChjModelRow');

  function _syncAdminChjChips(modelVal) {
    $adminChjModelRow.querySelectorAll('.chj-model-chip').forEach(c => {
      c.classList.toggle('selected', c.dataset.model === modelVal);
    });
  }

  document.getElementById('adminProviderGrid').addEventListener('click', e => {
    const card = e.target.closest('.provider-card');
    if (!card) return;
    document.querySelectorAll('#adminProviderGrid .provider-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    $adminModel.value   = card.dataset.model || '';
    $adminBase.value    = card.dataset.base  || '';
    const isChj = card.dataset.provider === 'chj_admin';
    $adminChjModelRow.classList.toggle('show', isChj);
    if (isChj) _syncAdminChjChips($adminModel.value);
  });

  $adminChjModelRow.addEventListener('click', e => {
    const chip = e.target.closest('.chj-model-chip');
    if (!chip) return;
    $adminModel.value = chip.dataset.model;
    _syncAdminChjChips(chip.dataset.model);
  });

  // ── 保存管理员配置 ────────────────────────────────────────────────────

  $adminSaveBtn.addEventListener('click', async () => {
    $adminSaveBtn.disabled = true;
    showStatus($adminStatus, '保存中…', 'info');
    try {
      await _cf('POST', '/api/ai/admin-config', {
        model:    $adminModel.value.trim(),
        api_key:  $adminKey.value.trim(),
        api_base: $adminBase.value.trim(),
      });
      $adminKey.value = '';
      showStatus($adminStatus, '✓ 系统默认配置已保存', 'ok');
      const cfg = await _cf('GET', '/api/ai/admin-config');
      updatePreview(cfg);
    } catch (e) {
      showStatus($adminStatus, '保存失败：' + e, 'err');
    }
    $adminSaveBtn.disabled = false;
  });

  // ── 测试连接（管理员配置） ────────────────────────────────────────────

  $adminTestBtn.addEventListener('click', async () => {
    $adminTestBtn.disabled = true;
    showStatus($adminStatus, '连接测试中…', 'info');
    try {
      if ($adminKey.value.trim()) {
        await _cf('POST', '/api/ai/admin-config', {
          model:    $adminModel.value.trim(),
          api_key:  $adminKey.value.trim(),
          api_base: $adminBase.value.trim(),
        });
        $adminKey.value = '';
      }
      const res = await _cf('POST', '/api/ai/test-connection', {});
      if (res && res.success) {
        showStatus($adminStatus, '✓ 连接成功：' + res.model, 'ok');
      } else {
        showStatus($adminStatus, '✗ ' + (res?.error || '连接失败'), 'err');
      }
    } catch (e) {
      showStatus($adminStatus, '✗ ' + e, 'err');
    }
    $adminTestBtn.disabled = false;
  });

  // ── 超管检测（双保险）────────────────────────────────────────────────────
  // 路径 A：后端明确返回 is_admin
  // 路径 B：遍历窗口层级找 _authUser（兼容 iframe 嵌套时机问题）
  function _checkAdminFromWindow() {
    try {
      // 优先直接读顶层窗口（最权威，避免中间 iframe 桥接延迟）
      const topUser = window.top?._authUser;
      console.log('[AiSettings] window.top._authUser:', topUser, 'top===window:', window.top === window);
      if (topUser) {
        const r = topUser.org_role || topUser.system_role || topUser.role || '';
        console.log('[AiSettings] role detected:', r);
        if (r === 'super_admin') return true;
      }
      // 逐层向上遍历作为备用
      let w = window;
      while (w) {
        const u = w._authUser;
        if (u) {
          const r = u.org_role || u.system_role || u.role || '';
          console.log('[AiSettings] found _authUser at level:', r);
          if (r === 'super_admin') return true;
        }
        if (!w.parent || w.parent === w) break;
        w = w.parent;
      }
    } catch (err) {
      console.warn('[AiSettings] _checkAdminFromWindow error:', err);
    }
    return false;
  }

  function _showAdminSection(cfg) {
    document.getElementById('adminSection').style.display = 'block';
    if (cfg) {
      $adminModel.value = cfg.model || '';
      $adminBase.value  = cfg.api_base || '';
      if (cfg.has_key) {
        $adminKey.placeholder = (cfg.key_preview || '已配置') + '（留空保留）';
      }
      // 同步 Provider 卡片高亮
      if (cfg.model) {
        document.querySelectorAll('#adminProviderGrid .provider-card').forEach(c => {
          const match = c.dataset.model === cfg.model ||
            (c.dataset.provider === 'chj_admin' && (cfg.model || '').startsWith('kivy-'));
          c.classList.toggle('selected', match);
        });
        if ((cfg.model || '').startsWith('kivy-')) {
          $adminChjModelRow.classList.add('show');
          _syncAdminChjChips(cfg.model);
        }
      }
    }
  }

  // ── 初始化 ──────────────────────────────────────────────────────────────

  async function init() {
    // 路径 B 先行（同步），若失败则稍后重试（等父窗口 _authUser 传递到位）
    if (_checkAdminFromWindow()) {
      _showAdminSection(null);
    } else {
      // 延迟重试：首次渲染时父 iframe 可能尚未完成 auth 桥接
      setTimeout(() => {
        if (_checkAdminFromWindow()) _showAdminSection(null);
      }, 400);
    }

    // 路径 A：请求后端，刷新配置预览 + is_admin（权威判断）
    let cfg = null;
    try {
      cfg = await _cf('GET', '/api/ai/admin-config');
    } catch (e) {
      console.warn('[AiSettings] admin-config fetch failed:', e);
    }

    if (cfg) {
      updatePreview(cfg);
      if (cfg.is_admin) _showAdminSection(cfg);
    }
  }

  init();

})();
</script>

<script>
  window.addEventListener('message', e => {
    if (e.data?.type === 'theme')
      document.documentElement.setAttribute('data-theme', e.data.theme || 'dark');
  });
  try {
    document.documentElement.setAttribute('data-theme',
      window.parent?.document?.documentElement?.getAttribute('data-theme') || 'dark');
  } catch(_) {}
</script>
</body>
</html>
