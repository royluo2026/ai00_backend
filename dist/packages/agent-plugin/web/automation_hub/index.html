<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>自动化与AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bar-bg: #13131f;
    --text: #cdd6f4; --text-muted: #6c7086; --accent: #89b4fa;
    --border: #313244; --hover: #2a2a3d; --active: #2d3561;
  }
  [data-theme="light"] {
    --bg: #eff1f5; --bg2: #e6e9ef; --bar-bg: #dce0e8;
    --text: #4c4f69; --text-muted: #9ca0b0; --accent: #1e66f5;
    --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .hub { display: flex; flex-direction: column; height: 100%; }

  .hub-tabs {
    display: flex; align-items: center; gap: 2px;
    padding: 0 8px; height: 38px;
    background: var(--bar-bg); border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto;
  }
  .hub-tabs::-webkit-scrollbar { height: 3px; }
  .hub-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .hub-tab-item {
    position: relative; display: flex; align-items: center;
    padding: 0 26px 0 12px; height: 28px;
    color: var(--text-muted); cursor: pointer; border-radius: 4px;
    font-size: 13px; white-space: nowrap; user-select: none;
    transition: background .15s, color .15s;
  }
  .hub-tab-item:hover { background: var(--hover); color: var(--text); }
  .hub-tab-item.active { background: var(--active); color: var(--accent); font-weight: 500; }

  .hub-tab-out {
    position: absolute; right: 4px;
    width: 16px; height: 16px; padding: 0; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .1s, background .1s, color .1s;
  }
  .hub-tab-item:hover .hub-tab-out { opacity: 1; pointer-events: auto; }
  .hub-tab-out:hover { background: rgba(137,180,250,.15); color: var(--accent); }
  .hub-tab-item.active .hub-tab-out { color: var(--accent); }

  .hub-frame { flex: 1; border: none; width: 100%; display: block; }
</style>
<script src="/web/components/iframe_error_bridge.js"></script>
</head>
<body>
<div class="hub">
  <div class="hub-tabs" id="hubTabs"></div>
  <iframe class="hub-frame" id="hubFrame"></iframe>
</div>

<script src="/web/components/hub_shell.js"></script>
<script>
  const hub = new HubShell({
    hubId: 'automation_hub',
    tabs: [
      { key: 'auto_canvas', title: '自动化画布', src: '../auto_canvas/index.html?canvas_type=auto_canvas&canvas_gid=rule_automation&canvas_name=自动化画布', webSrc: 'auto_canvas/index.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>' },
      { key: 'rule',        title: '规则管理',   src: '../rule_mgmt/rule_mgmt.html',   webSrc: 'rule_mgmt/rule_mgmt.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' },
      { key: 'skill_lib',   title: 'Skill 库',   src: 'skill_lib.html',                webSrc: 'automation_hub/skill_lib.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>' },
      { key: 'ai_settings', title: 'AI 设置',    src: 'ai_settings.html',              webSrc: 'automation_hub/ai_settings.html',
        icon: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' },
    ],
    tabsEl: 'hubTabs',
    frameEl: 'hubFrame',
  });
  hub.boot();

  window.addEventListener('message', e => {
    if (e.data?.type === 'theme') hub.applyTheme(e.data.theme);
  });
  document.getElementById('hubFrame').addEventListener('load', () => {
    hub.applyTheme(document.documentElement.dataset.theme || 'dark');
  });
  try { hub.applyTheme(window.parent?.document?.documentElement?.getAttribute('data-theme') || 'dark'); } catch(_) {}
</script>
</body>
</html>
