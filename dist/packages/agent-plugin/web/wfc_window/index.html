<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI 画布</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; user-select: none; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

  /* ── CSS 变量（workflow_canvas.css 依赖） ───────────────────────────────── */
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bg3: #11111b;
    --text: #cdd6f4; --text-muted: #6c7086; --text-dim: #9399b2;
    --accent: #89b4fa; --accent2: #cba6f7; --green: #a6e3a1;
    --red: #f38ba8; --yellow: #f9e2af; --peach: #fab387;
    --border: #313244; --hover: #2a2a3d; --active: #2d3561;
  }
  [data-theme="light"] {
    --bg: #eff1f5; --bg2: #e6e9ef; --bg3: #dce0e8;
    --text: #4c4f69; --text-muted: #9ca0b0; --text-dim: #6c6f85;
    --accent: #1e66f5; --accent2: #8839ef; --green: #40a02b;
    --red: #d20f39; --yellow: #df8e1d; --peach: #fe640b;
    --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
  }

  /* 标题栏 */
  .wfcw-titlebar {
    height: 32px; display: flex; align-items: center; flex-shrink: 0;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 10px; -webkit-app-region: drag;
  }
  .wfcw-titlebar-icon { color: var(--accent); opacity: .8; flex-shrink: 0; }
  .wfcw-titlebar-title { flex: 1; font-size: 12px; font-weight: 500; color: var(--text-dim); padding-left: 7px; }
  .wfcw-titlebar-controls { display: flex; gap: 1px; -webkit-app-region: no-drag; }
  .win-btn {
    width: 28px; height: 28px; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s, color .1s;
  }
  .win-btn:hover { background: var(--hover); color: var(--text); }
  .win-btn.danger:hover { background: var(--red); color: #fff; }
</style>


<style>:root { --titlebar-h: 32px; }</style>
<script src="/web/components/iframe_error_bridge.js"></script>
  <link rel="stylesheet" href="/assets/index-cd2bbf2e.css">
  <link rel="stylesheet" href="/assets/workflow_canvas-44ad52aa.css">
</head>
<body>

<!-- 标题栏 -->
<div class="wfcw-titlebar">
  <svg class="wfcw-titlebar-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3" y="3" width="7" height="7" rx="1"/>
    <rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="14" y="14" width="7" height="7" rx="1"/>
    <path d="M6.5 10v4M6.5 14h8M17.5 10v4"/>
  </svg>
  <span class="wfcw-titlebar-title">AI 画布</span>
  <div class="wfcw-titlebar-controls">
    <button class="win-btn" id="winMin" title="最小化">
      <svg width="10" height="2" viewBox="0 0 10 2"><line x1="0" y1="1" x2="10" y2="1" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="win-btn" id="winMax" title="最大化">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="8" height="8"/></svg>
    </button>
    <button class="win-btn danger" id="winClose" title="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</div>

<!-- 主体：左侧节点库 + 画布 -->
<div class="wfcw-body" id="wfcwBody">

  <!-- ── 左侧：节点库 ─────────────────────────────────────────────────────── -->
  <div class="wfcw-node-sidebar" id="wfcwNodeSidebar">
    <!-- 拖拽调宽手柄（右边缘） -->
    <div class="wfcw-ns-resize" id="wfcwNsResize"></div>
    <div class="wfcw-ns-hdr">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;opacity:.7">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <path d="M6.5 10v4M6.5 14h8M17.5 10v4"/>
      </svg>
      <span class="wfcw-ns-title">节点库</span>
      <button class="wfcw-ns-collapse-btn" id="wfcwNsCollapseBtn" title="收起面板">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <!-- ── Skill 库（节点库上方） ────────────────────────────────────────── -->
    <div class="wfcw-ns-section" id="wfcwNsSkillsSection">
      <div class="wfcw-ns-sec-hdr" id="wfcwNsSkillsHdr">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;opacity:.7">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Skill 库</span>
        <svg class="wfcw-ns-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
      </div>
      <div class="wfcw-ns-sec-body" id="wfcwSkillsBody">
        <div class="wfcw-ns-empty">加载中…</div>
      </div>
    </div>

    <div class="wfc-palette wfcw-ns-palette" id="wfcwPaletteEl">
      <div class="wfc-palette-pinned" id="wfcPinned"></div>
      <div class="wfc-palette-groups" id="wfcGroups"></div>
    </div>

    <!-- ── 工具库 ──────────────────────────────────────────────────────────── -->
    <div class="wfcw-ns-section collapsed" id="wfcwToolsSection">
      <div class="wfcw-ns-sec-hdr" id="wfcwToolsHdr">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;opacity:.7">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3-3a1 1 0 000-1.4l-1.6-1.6a1 1 0 00-1.4 0z"/>
          <path d="M5 19a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H7a2 2 0 00-2 2zM9 3H7a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2z"/>
        </svg>
        <span>工具库</span>
        <svg class="wfcw-ns-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
      </div>
      <div class="wfcw-ns-sec-body" id="wfcwToolsBody">
        <div class="wfcw-ns-empty">加载中…</div>
      </div>
    </div>


  </div><!-- .wfcw-node-sidebar -->

  <!-- ── 第二左侧：流程总览 sidebar ──────────────────────────────────────── -->
  <div class="wfcw-flow-sidebar ns-collapsed" id="wfcwFlowSidebar">
    <div class="wfcw-fs-hdr" id="wfcwFsHdr">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span class="wfcw-fs-title">执行流程</span>
      <button class="wfcw-fs-edit-btn" id="wfcwFsEditBtn" title="放入画布编辑">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="wfcw-fs-collapse-btn" id="wfcwFsCollapseBtn" title="收起">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="wfcw-fs-body" id="wfcwFsSidebarBody">
      <div class="wfcw-fs-empty">选中 Skill 后显示流程</div>
    </div>
    <!-- 操作按钮行（固定模式时显示） -->
    <div class="wfcw-fs-actions" id="wfcwFsActions" style="display:none">
      <button class="wfcw-fs-action-btn wfcw-fs-run-btn" id="wfcwFsRunBtn" title="自主执行整张流程">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        执行
      </button>
      <button class="wfcw-fs-action-btn" id="wfcwFsToSkill" title="另存为新 Skill">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        转 Skill
      </button>
      <button class="wfcw-fs-action-btn" id="wfcwFsUpdateSkill" title="将修改更新到原 Skill">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        更新
      </button>
    </div>
  </div>

  <!-- ── 画布区域 ─────────────────────────────────────────────────────────── -->
  <div class="wfcw-canvas-wrap">

    <!-- 画布主列：header + board + footer -->
    <div class="wfcw-canvas-main">

    <!-- 画布操作栏 -->
    <div class="wfc-header">
      <div class="wfc-header-actions">
        <!-- 模式徽章（固定/探索） -->
        <button class="wfc-hdr-btn wfcw-mode-badge" id="wfcwModeBadge" data-mode="explore" title="点击手动切换模式">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="wfcwModeBadgeIcon">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span id="wfcwModeBadgeLabel">探索模式</span>
        </button>
        <button class="wfc-hdr-btn" id="wfcSaveBtn" title="保存画布">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
        </button>
        <button class="wfc-hdr-btn" id="wfcLoadBtn" title="加载画布">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          </svg>
        </button>
        <button class="wfc-hdr-btn" id="wfcClearBtn" title="清空画布">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 双层画布：上层=Skill流程总览，下层=交互画布 -->
    <div class="wfcw-canvas-panels" id="wfcwCanvasPanels">

      <!-- 上层：Skill 流程总览（点击 Skill 后显示，默认隐藏） -->
      <div class="wfcw-flow-panel" id="wfcwFlowPanel">
        <div class="wfcw-flow-panel-hdr">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;opacity:.7"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span class="wfcw-flow-panel-title" id="wfcwFlowPanelTitle">执行流程</span>
          <button class="wfcw-flow-panel-close" id="wfcwFlowPanelClose" title="关闭流程总览">
            <svg width="9" height="9" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
        <div class="wfcw-flow-panel-body">
          <div class="wfc-flow-section">
            <div class="wfc-grid" id="wfcwTopGrid">
              <svg class="wfc-connections" id="wfcwTopSvg"></svg>
              <div class="wfc-lanes" id="wfcwTopLanes"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 水平拖拽分隔条（仅在流程总览显示时可见） -->
      <div class="wfcw-hdivider" id="wfcwHDivider"></div>

      <!-- 下层：交互画布（接收 generate_canvas 结果 + 人工确认等交互内容） -->
      <div class="wfcw-interaction-panel" id="wfcwInteractionPanel">
        <!-- Skill 执行沙盘（卡片式，执行期间覆盖工作流画布） -->
        <div class="wfcw-sandbox hidden" id="wfcwSandbox"></div>
        <div class="wfc-flow-section">
          <div class="wfc-grid" id="wfcwGrid">
            <svg class="wfc-connections" id="wfcwSvg"></svg>
            <div class="wfc-lanes" id="wfcwLanes"></div>
          </div>
        </div>
        <!-- 画布空状态提示（有节点时自动隐藏） -->
        <div class="wfcw-canvas-empty" id="wfcwCanvasEmpty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="opacity:.3">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <div class="wfcw-canvas-empty-title">交互画布</div>
          <div class="wfcw-canvas-empty-hint">向小柔发送消息，AI 可自动生成节点图<br>或拖拽左侧节点库手动搭建流程</div>
        </div>
        <!-- 流程中止后的重置按钮条（halted 时显示） -->
        <div class="wfcw-canvas-halted-bar hidden" id="wfcwHaltedBar">
          <span class="wfcw-halted-icon">⛔</span>
          <span class="wfcw-halted-msg" id="wfcwHaltedMsg">流程已中止</span>
          <button class="wfcw-reset-btn" id="wfcwResetBtn">重新开始</button>
        </div>
      </div>

    </div><!-- .wfcw-canvas-panels -->

    <!-- 底部状态栏 -->
    <div class="wfc-footer">
      <span id="wfcwStats">0 节点 · 0 连线</span>
      <button class="wfc-mode-btn" id="wfcwModeBtn" data-mode="explore">探索模式</button>
    </div>

    </div><!-- .wfcw-canvas-main -->

  </div><!-- .wfcw-canvas-wrap -->

</div><!-- .wfcw-body -->

<!-- 初始化：主题 + 标题栏按钮 -->
<div class="wfcw-cc-panel" id="wfcwCcPanel">
  <div class="wfcw-cc-panel-hdr">
    <span class="wfcw-cc-mode-badge" id="wfcwCcModeBadge">CC</span>
    <span class="wfcw-cc-panel-title" id="wfcwCcPanelTitle">内容预览</span>
    <div class="wfcw-cc-panel-btns">
      <button class="wfcw-cc-hdr-btn" id="wfcwCcCfgBtn" title="配置">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
      <button class="wfcw-cc-hdr-btn wfcw-cc-close-btn" id="wfcwCcClose" title="关闭">
        <svg width="9" height="9" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
  <div class="wfcw-cc-panel-body">
    <iframe class="wfcw-cc-iframe" id="wfcwCcIframe" src="about:blank"></iframe>
  </div>
</div>

<!-- 容器卡片配置弹窗 -->
<div class="wfcw-cc-cfg-overlay" id="wfcwCcCfgOverlay">
  <div class="wfcw-cc-cfg-modal">
    <div class="wfcw-cc-cfg-hdr">
      <span>配置容器卡片</span>
      <button id="wfcwCcCfgClose">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="wfcw-cc-cfg-body">
      <div class="wfcw-cc-cfg-row">
        <label>显示名称</label>
        <input type="text" id="wfcwCcCfgLabel" placeholder="卡片标题">
      </div>
      <div class="wfcw-cc-cfg-row">
        <label>内容模式</label>
        <select id="wfcwCcCfgMode">
          <option value="row_detail">行详情（清单行）</option>
          <option value="markdown">MD 文档预览</option>
          <option value="webview">网页预览</option>
          <option value="pdf">PDF 预览</option>
          <option value="image_gallery">图片集</option>
          <option value="richtext">富文本</option>
        </select>
      </div>
      <div id="wfcwCcCfgFields"></div>
    </div>
    <div class="wfcw-cc-cfg-footer">
      <button id="wfcwCcCfgCancel">取消</button>
      <button id="wfcwCcCfgSave" class="primary">保存并预览</button>
    </div>
  </div>
</div>

<!-- 悬浮球 -->
<div class="wfcw-float-ball" id="wfcwFloatBall" style="right:24px;bottom:24px">
  <svg viewBox="0 0 32 32" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="16" r="16" fill="#CBA6F7"/>
    <text x="16" y="21" text-anchor="middle" font-size="15" font-family="system-ui,sans-serif" font-weight="600" fill="#fff">柔</text>
  </svg>
  <span class="wfcw-fb-badge" id="wfcwFbBadge" style="display:none">0</span>
</div>

<!-- 悬浮聊天窗 -->
<div class="wfcw-float-chat" id="wfcwFloatChat" style="display:none">
  <div class="wfcw-fc-hdr" id="wfcwFcHdr">
    <div class="wfcw-fc-tabs">
      <button class="wfcw-fc-tab active" data-tab="chat">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        AI 对话
      </button>
      <button class="wfcw-fc-tab" data-tab="skills">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Skill 库
      </button>
      <button class="wfcw-fc-tab" data-tab="topics">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        话题
      </button>
    </div>
    <button class="wfcw-fc-close" id="wfcwFcClose" title="关闭">
      <svg width="9" height="9" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
  <div class="wfcw-fc-body">
    <!-- AI 对话 Tab -->
    <div class="wfcw-fc-pane" data-pane="chat">
      <div class="wfc-ap-msgs" id="wfcwAiMsgs"></div>
      <div class="wfc-ap-irow">
        <textarea class="wfc-ap-inp" id="wfcwAiInp" placeholder="问 AI 关于这个流程…" rows="1"></textarea>
        <button class="wfc-stop-btn" id="wfcwAiStop" style="display:none">■ 停止</button>
        <button class="wfc-ap-sbtn wfc-ap-sbtn-primary" id="wfcwAiSend">发送</button>
      </div>
    </div>
    <!-- Skill 库 Tab -->
    <div class="wfcw-fc-pane" data-pane="skills" style="display:none">
      <div class="wfcw-skill-steps">
        <div class="wfcw-skill-step">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>选技能</span>
        </div>
        <svg class="wfcw-skill-step-arr" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
        <div class="wfcw-skill-step">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>看画布</span>
        </div>
        <svg class="wfcw-skill-step-arr" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
        <div class="wfcw-skill-step">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>问小柔</span>
        </div>
      </div>
      <div class="wfcw-skill-panel-body" id="wfcwSkillsBody">
        <div class="wfcw-ns-empty">暂无 Skill</div>
      </div>
    </div>
    <!-- 话题 Tab -->
    <div class="wfcw-fc-pane" data-pane="topics" style="display:none">
      <div class="wfc-ap-msgs" id="wfcwTopicBody">
        <div class="wfcw-ls-empty" id="wfcwTopicEmpty">暂无话题</div>
      </div>
    </div>
  </div>
  <!-- 底部工具栏 -->
  <div class="wfcw-fc-footer">
    <button class="wfc-hdr-btn wfc-ctx-btn" id="wfcCtxToggle" title="关闭时画布状态不推送到 AI 对话；打开时每次变更自动同步">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      <span id="wfcCtxLabel">上下文 关</span>
    </button>
    <button class="wfc-hdr-btn wfc-inject-btn" id="wfcInjectBtn" title="将画布内容发送到对话">→ 对话</button>
    <button class="wfc-hdr-btn wfc-skill-btn" id="wfcToSkillBtn" title="将当前执行流程另存为新 Skill">转 Skill</button>
    <button class="wfc-hdr-btn wfc-skill-btn" id="wfcUpdateSkillBtn" title="将本次调整更新到原 Skill" style="display:none">更新 Skill</button>
    <span class="wfcw-topic-badge" id="wfcwTopicBadge" style="display:none">0</span>
    <button class="wfcw-ls-org-btn" id="wfcwTopicOrganize" title="整理到对话">→ 对话</button>
  </div>
</div>

<!-- 初始化：主题 + 标题栏按钮 -->
<script>
  (function () {
    const saved = localStorage.getItem('system.theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    window.electronAPI?.onThemeChanged?.(function (theme) {
      document.documentElement.setAttribute('data-theme', theme || 'dark');
      localStorage.setItem('system.theme', theme || 'dark');
    });
    document.getElementById('winMin').addEventListener('click', function () { window.electronAPI?.minimizeSelf(); });
    document.getElementById('winMax').addEventListener('click', function () { window.electronAPI?.maximizeSelf(); });
    document.getElementById('winClose').addEventListener('click', function () { window.electronAPI?.close(); });
  })();
</script>
<script src="../assets/lib/marked.min.js"></script>
<script src="../automation_hub/workflow_canvas.js"></script>
<script src="wfc_window.js"></script>
</body>
