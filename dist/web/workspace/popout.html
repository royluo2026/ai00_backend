<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>弹出面板</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100vh;
      overflow: hidden;
      background: #1e1e2e;
      display: flex;
      flex-direction: column;
    }
    [data-theme="light"] { background: #eff1f5; }

    .po-titlebar {
      height: 36px;
      background: #181825;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      user-select: none;
    }
    [data-theme="light"] .po-titlebar {
      background: #e6e9ef;
      border-bottom-color: #dce0e8;
    }
    .po-title {
      font-size: 13px;
      color: #9ca0b0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    [data-theme="light"] .po-title { color: #9ca0b0; }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="po-titlebar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" style="color:#6c7086;flex-shrink:0">
      <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
    <span class="po-title" id="po-title">弹出面板</span>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const src    = params.get('src');
    const title  = params.get('title') || '弹出面板';

    document.title            = title;
    document.getElementById('po-title').textContent = title;

    // 应用主题（从 localStorage 读，与主窗口同步）
    const theme = localStorage.getItem('system.theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);

    // 监听主窗口主题广播
    window.addEventListener('message', e => {
      if (e.data?.type === 'theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        localStorage.setItem('system.theme', e.data.theme);
        try { iframe?.contentWindow?.postMessage(e.data, '*'); } catch (_) {}
      }
    });

    if (src) {
      const iframe = document.createElement('iframe');
      iframe.src   = src;
      iframe.allow = 'clipboard-read; clipboard-write';
      iframe.addEventListener('load', () => {
        try { iframe.contentWindow.postMessage({ type: 'theme', theme }, '*'); } catch (_) {}
      });
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
