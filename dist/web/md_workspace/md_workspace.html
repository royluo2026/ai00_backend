<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: file:;">
  <title>MD 文档</title>
  
  
  <script src="/web/icons.js"></script>
  <link rel="stylesheet" href="/assets/md_workspace-cc3135ca.css">
  <link rel="stylesheet" href="/assets/main-921414fe.css">
</head>
<body>
  <div class="md-layout">
    <!-- 侧栏：文件列表 -->
    <aside class="md-sidebar">
      <div class="md-sidebar-header">
        <span class="sidebar-title">MD 文档</span>
        <button id="btn-new-doc" class="btn-icon" title="新建文档">
          <svg class="icon" width="16" height="16"><use href="#icon-plus"/></svg>
        </button>
      </div>
      <div id="doc-list" class="doc-list"></div>
      <div class="sidebar-footer">
        <span id="workspace-info" class="workspace-info"></span>
      </div>
    </aside>

    <!-- 主区：编辑 / 预览 -->
    <main class="md-main">
      <div id="empty-state" class="empty-state">
        <div style="opacity:.4">
          <svg class="icon" width="48" height="48"><use href="#icon-md-doc"/></svg>
        </div>
        <p>选择或新建一个 MD 文档开始编辑</p>
        <button id="btn-new-doc-2" class="btn-primary">新建文档</button>
      </div>

      <div id="editor-area" class="editor-area" style="display:none">
        <div class="editor-toolbar">
          <span id="current-filename" class="current-filename"></span>
          <div class="toolbar-actions">
            <button id="btn-mode-edit"    class="btn-ghost btn-sm active" title="编辑">编辑</button>
            <button id="btn-mode-preview" class="btn-ghost btn-sm"        title="预览">预览</button>
            <button id="btn-import"       class="btn-ghost btn-sm"        title="导入 .md">导入</button>
            <button id="btn-export"       class="btn-ghost btn-sm"        title="导出 .md">导出</button>
            <button id="btn-delete-doc"   class="btn-ghost btn-sm btn-danger" title="删除文档">删除</button>
          </div>
        </div>

        <!-- 编辑态 -->
        <div id="edit-pane" class="edit-pane">
          <div class="md-toolbar">
            <button data-insert-before="**" data-insert-after="**" data-placeholder="粗体" title="粗体"><b>B</b></button>
            <button data-insert-before="*"  data-insert-after="*"  data-placeholder="斜体" title="斜体"><i>I</i></button>
            <button data-insert-before="`"  data-insert-after="`"  data-placeholder="代码" title="行内代码">code</button>
            <button data-insert-before="```\n" data-insert-after="\n```" data-placeholder="代码块" title="代码块">```</button>
            <button data-insert-before="> "  data-insert-after=""  data-placeholder="引用" title="引用">❝</button>
            <button data-insert-before="## " data-insert-after="" data-placeholder="标题" title="标题">H2</button>
            <button data-insert-before="- "  data-insert-after="" data-placeholder="列表项" title="列表">•</button>
            <button data-insert-before="![](" data-insert-after=")" data-placeholder="../assets/" title="图片链接">IMG</button>
          </div>
          <textarea id="md-textarea" class="md-editor" placeholder="在此输入 Markdown 内容…"></textarea>
          <div class="edit-footer">
            <span id="save-status" class="save-status"></span>
            <button id="btn-save" class="btn-primary btn-sm">保存</button>
          </div>
        </div>

        <!-- 预览态（隐藏） -->
        <div id="preview-pane" class="preview-pane" style="display:none">
          <div id="md-preview" class="md-preview"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- 新建文档 modal -->
  <div id="new-doc-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:var(--bg-surface,#24273a);border:1px solid var(--border-default,#313244);border-radius:10px;padding:20px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.4);">
      <h3 style="margin:0 0 12px;font-size:14px;color:var(--text-normal,#cdd6f4);">新建文档</h3>
      <input id="new-doc-title" type="text" placeholder="文档标题…" maxlength="100"
        style="width:100%;box-sizing:border-box;padding:7px 10px;background:var(--bg-secondary,#181825);border:1px solid var(--border-default,#313244);border-radius:6px;color:var(--text-normal,#cdd6f4);font-size:13px;outline:none;" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
        <button id="new-doc-cancel" style="padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;background:var(--bg-tertiary,#313244);color:var(--text-muted,#a6adc8);">取消</button>
        <button id="new-doc-confirm" style="padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;background:var(--color-accent,#89b4fa);color:var(--bg-primary,#1e1e2e);font-weight:500;">确认</button>
      </div>
    </div>
  </div>

  <script src="md_workspace.js"></script>
</body>
</html>
