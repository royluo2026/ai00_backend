<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI00 调试日志</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: 'Consolas', monospace; font-size: 12px; display: flex; flex-direction: column; height: 100vh; }
  #toolbar { padding: 8px 12px; background: #181825; border-bottom: 1px solid #313244; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  #toolbar select { background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  #toolbar button { background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { background: #45475a; }
  #log-container { flex: 1; overflow-y: auto; padding: 8px; }
  .log-entry { padding: 2px 4px; border-radius: 3px; margin-bottom: 1px; white-space: pre-wrap; word-break: break-all; }
  .log-entry.DEBUG   { color: #6c7086; }
  .log-entry.INFO    { color: #cdd6f4; }
  .log-entry.WARNING { color: #fab387; background: rgba(250,179,135,0.05); }
  .log-entry.ERROR   { color: #f38ba8; background: rgba(243,139,168,0.07); }
  .log-entry .time   { color: #6c7086; margin-right: 6px; }
  .log-entry .level  { font-weight: bold; margin-right: 6px; min-width: 7ch; display: inline-block; }
  #status { padding: 4px 12px; background: #181825; border-top: 1px solid #313244; font-size: 11px; color: #6c7086; flex-shrink: 0; }
</style>
</head>
<body>
<div id="toolbar">
  <span style="color:#89b4fa;font-weight:bold">AI00 调试日志</span>
  <select id="level-filter">
    <option value="ALL">ALL</option>
    <option value="DEBUG">DEBUG</option>
    <option value="INFO" selected>INFO</option>
    <option value="WARNING">WARNING</option>
    <option value="ERROR">ERROR</option>
  </select>
  <button id="btn-clear">清空</button>
  <button id="btn-scroll">自动滚动: 开</button>
  <span id="ws-status" style="color:#a6e3a1;margin-left:auto">● WS 连接中...</span>
</div>
<div id="log-container"></div>
<div id="status">等待 Python 服务器连接...</div>

<script>
  const container = document.getElementById('log-container');
  const wsStatus  = document.getElementById('ws-status');
  const status    = document.getElementById('status');
  let autoScroll  = true;
  let logCount    = 0;

  document.getElementById('btn-clear').onclick = () => {
    container.innerHTML = '';
    logCount = 0;
    status.textContent = '日志已清空';
  };
  document.getElementById('btn-scroll').onclick = function() {
    autoScroll = !autoScroll;
    this.textContent = `自动滚动: ${autoScroll ? '开' : '关'}`;
  };
  document.getElementById('level-filter').onchange = function() {
    const level = this.value;
    document.querySelectorAll('.log-entry').forEach(el => {
      el.style.display = (level === 'ALL' || el.dataset.level === level) ? '' : 'none';
    });
  };

  function addLog(level, msg, time) {
    const filter = document.getElementById('level-filter').value;
    const el = document.createElement('div');
    el.className = `log-entry ${level}`;
    el.dataset.level = level;
    const t = time ? new Date(time * 1000).toISOString().slice(11, 23) : new Date().toISOString().slice(11, 23);
    el.innerHTML = `<span class="time">${t}</span><span class="level">${level}</span>${escapeHtml(msg)}`;
    if (filter !== 'ALL' && el.dataset.level !== filter) el.style.display = 'none';
    container.appendChild(el);
    logCount++;
    status.textContent = `共 ${logCount} 条`;
    if (autoScroll) container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 监听 Python WS 日志事件
  window.addEventListener('ai00:log', e => {
    const { level, msg, time } = e.detail;
    addLog(level || 'INFO', msg, time);
    wsStatus.style.color = '#a6e3a1';
    wsStatus.textContent = '● 已连接';
  });

  // 初始提示
  addLog('INFO', '调试日志窗口已打开');
</script>
</body>
</html>
