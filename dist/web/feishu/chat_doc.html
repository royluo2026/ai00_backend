<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书聊天 & 文档 - 工艺系统</title>
  
  <link rel="stylesheet" href="/assets/feishu-ba922168.css">
</head>
<body>
  <script src="/web/icons.js"></script>
  <div class="feishu-layout">
    <!-- 顶部导航 -->
    <div class="feishu-top-nav">
      <div class="nav-title">
        <svg class="icon" width="16" height="16"><use href="#icon-mail"/></svg> 飞书聊天 &amp; 文档
      </div>
      <div class="nav-actions">
        <button class="nav-btn" id="refreshBtn">刷新</button>
        <button class="nav-btn logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <!-- 双栏内嵌容器 -->
    <div class="content-container">
      <!-- 左侧：聊天容器 -->
      <div class="iframe-wrapper">
        <iframe class="feishu-iframe" id="chatIframe" sandbox="allow-same-origin allow-scripts allow-popups" allow="camera;microphone">
          <div class="loading">聊天加载中...</div>
        </iframe>
      </div>

      <!-- 右侧：文档容器 -->
      <div class="iframe-wrapper">
        <iframe class="feishu-iframe" id="docIframe" sandbox="allow-same-origin allow-scripts allow-popups">
          <div class="loading">文档加载中...</div>
        </iframe>
      </div>
    </div>
  </div>

  <script src="feishu.js"></script>
</body>
</html>
