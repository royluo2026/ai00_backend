<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="app-version" content="1.0.3">
  <title>总装智能辅助工艺开发系统(AI00)V1.0</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo_light-e3521d72.svg">
  <!-- 未登录时隐藏页面，避免主页内容闪现 -->
  <style id="_auth_gate">body{visibility:hidden}</style>
  
  
  <!-- 浏览器模式兼容层：Electron 已注入 electronAPI 时自动跳过 -->
  <script src="/web/core/web_compat.js"></script>
  <link rel="stylesheet" href="/assets/index-2f66384e.css">
  <link rel="stylesheet" href="/assets/main-921414fe.css">
</head>
<body>
  <script src="/web/icons.js"></script>

  <!-- ===== 主工作区 ===== -->
  <div id="workspace">

    <!-- 左侧图标导航（动态，NavManager 管理）-->
    <nav id="nav-sidebar" class="nav-sidebar">
      <!-- AI00 Logo -->
      <div class="nav-logo" title="AI00 工艺系统">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none"
             style="color: var(--color-primary)">
          <rect width="48" height="48" rx="12" fill="currentColor" opacity="0.15"/>
          <path d="M12 36 L24 12 L36 36" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 28 L32 28" stroke="currentColor" stroke-width="3"
                stroke-linecap="round"/>
          <circle cx="24" cy="12" r="3" fill="currentColor"/>
        </svg>
      </div>
      <div id="nav-items-top" class="nav-items-top"></div>
      <div class="nav-items-bottom">
        <!-- 内容树按钮 -->
        <div id="nav-content-tree-btn" class="nav-item" title="内容树">
          <span class="nav-icon">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
        </div>
        <!-- 更多模块按钮 -->
        <div id="nav-more-btn" class="nav-item" title="更多模块">
          <span class="nav-icon"><svg class="icon" width="20" height="20"><use href="#icon-apps"/></svg></span>
        </div>
        <div class="nav-item" data-view="settings" title="系统设置 (Ctrl+,)">
          <span class="nav-icon"><svg class="icon" width="20" height="20"><use href="#icon-settings"/></svg></span>
        </div>
      </div>
    </nav>

    <!-- 更多模块面板 -->
    <div id="nav-more-panel" class="hidden">
      <div class="more-panel-header">隐藏的模块</div>
      <div class="more-panel-list"></div>
    </div>

    <!-- 右键上下文菜单 -->
    <div id="nav-ctx-menu" class="hidden"></div>


    <!-- 主工作台内容区（WorkspaceEngine 接管）-->
    <div id="ws-content"></div>

  </div><!-- #workspace -->

  <!-- ===== 状态栏 ===== -->
  <div id="statusbar" class="statusbar">
    <div class="statusbar-left">
      <span class="sb-app-logo" title="AI00 柔性智能业务基座">
        <svg width="14" height="14" viewBox="0 0 48 48" fill="none" style="vertical-align:-2px;color:var(--color-primary)">
          <rect width="48" height="48" rx="12" fill="currentColor" opacity="0.15"/>
          <path d="M12 36 L24 12 L36 36" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 28 L32 28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <circle cx="24" cy="12" r="3" fill="currentColor"/>
        </svg>
        <span style="font-size:11px;font-weight:600;color:var(--color-primary);letter-spacing:0.02em">柔性智能业务基座</span>
      </span>
      <span class="sb-sep" style="margin:0 4px;color:var(--border-default)">│</span>
      <span id="current-user" class="status-item">未登录</span>
      <button id="btn-statusbar-logout" style="display:none;margin-left:6px;padding:1px 7px;font-size:11px;border-radius:3px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;line-height:1.6;" title="退出登录">退出</button>
    </div>
    <div id="statusbar-center" class="statusbar-center"></div>
    <div class="statusbar-right">
      <!-- 工序截图进度（绿色字，从 cad_sim/assoc_panel 通过 window._showCaptureProgress 更新） -->
      <span id="capture-progress-msg" style="display:none;color:#a6e3a1;font-size:11px;margin-right:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;"></span>
      <!-- 日程快览（feishu 模式登录后显示） -->
      <div id="sb-schedule-bar" style="display:none">
        <button id="sb-overdue-btn" class="status-btn sb-overdue-btn" title="查看逾期任务" style="display:none">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:-1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          逾期 <span id="sb-overdue-count"></span>
        </button>
        <span class="sb-sched-sep"></span>
        <div id="sb-schedule-info" class="sb-schedule-info"></div>
      </div>
      <button class="status-btn" id="btn-notif" title="通知" style="position:relative">
        <svg class="icon" width="14" height="14"><use href="#icon-bell"/></svg>
        <span id="notif-badge" style="display:none;position:absolute;top:-5px;right:-6px;min-width:16px;height:16px;background:#f38ba8;border-radius:8px;font-size:10px;font-weight:600;color:#1e1e2e;text-align:center;line-height:16px;padding:0 3px;pointer-events:none;"></span>
      </button>
      <button class="status-btn" id="btn-log"><svg class="icon" width="14" height="14"><use href="#icon-log"/></svg> 日志</button>
      <button class="status-btn" id="btn-debug"><svg class="icon" width="14" height="14"><use href="#icon-tool"/></svg> 调试</button>
      <span id="health-dot" title="后端健康状态" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle;background:#555;"></span>
    </div>
  </div>

  <!-- ===== 通知面板 ===== -->
  <div id="notif-panel" class="float-panel hidden"
       style="bottom:36px;right:16px;width:360px;max-height:480px;overflow:hidden;">
    <div class="float-panel-header">
      <span><svg class="icon" width="14" height="14"><use href="#icon-bell"/></svg> 通知</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button id="btn-notif-read-all" class="float-close" title="全部标记已读" style="font-size:11px;padding:0 6px;">全已读</button>
        <button class="float-close"
                onclick="document.getElementById('notif-panel').classList.add('hidden')">✕</button>
      </div>
    </div>
    <div id="notif-list" style="overflow-y:auto;flex:1;padding:4px 0;"></div>
  </div>

  <!-- ===== 命令面板（Ctrl+P）===== -->
  <div id="cmd-overlay" class="overlay hidden">
    <div id="cmd-palette" class="cmd-palette">
      <input id="cmd-input" class="cmd-input" type="text"
             placeholder="输入命令或功能名称..." autocomplete="off" spellcheck="false">
      <div id="cmd-results" class="cmd-results"></div>
    </div>
  </div>

  <!-- ===== 全局搜索（Ctrl+O）===== -->
  <div id="gs-overlay" class="overlay hidden">
    <div id="gs-panel">
      <div id="gs-input-row">
        <button id="gs-category-badge" class="gs-badge gs-badge-all">全部 ▾</button>
        <input id="gs-input" type="text" placeholder="搜索联系人、工序、任务、知识…" autocomplete="off" spellcheck="false">
      </div>
      <div id="gs-category-tabs" class="gs-tabs hidden"></div>
      <div id="gs-results"></div>
      <div id="gs-footer">ESC 关闭 · Tab 切换分类 · Enter 打开</div>
    </div>
  </div>

  <!-- ===== 调试浮窗（Ctrl+`）===== -->
  <div id="debug-panel" class="float-panel hidden"
       style="bottom:36px;right:16px;width:420px;">
    <div class="float-panel-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <span><svg class="icon" width="14" height="14"><use href="#icon-tool"/></svg> 调试面板</span>
        <span style="display:flex;gap:0;border:1px solid var(--border-default,#313244);border-radius:3px;overflow:hidden;">
          <button id="btn-dbg-view-log" class="dbg-tab-btn active">日志</button>
          <button id="btn-dbg-view-net" class="dbg-tab-btn">网络</button>
          <button id="btn-dbg-view-crumbs" class="dbg-tab-btn">轨迹</button>
        </span>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <input id="debug-search" type="text" placeholder="搜索日志…"
               style="font-size:11px;padding:1px 6px;background:var(--bg-primary,#1e1e2e);border:1px solid var(--border-default,#313244);border-radius:3px;color:var(--text-normal,#cdd6f4);width:110px;outline:none;">
        <button class="float-close" id="btn-debug-export" title="导出日志">⬇</button>
        <button class="float-close" id="btn-debug-copy" title="复制到剪贴板">⎘</button>
        <button class="float-close"
                onclick="document.getElementById('debug-panel').classList.add('hidden')">✕</button>
      </div>
    </div>
    <div class="float-panel-body" id="debug-body"
         style="font-family:monospace;font-size:12px;max-height:220px;overflow-y:auto;line-height:1.6;"></div>
    <div id="debug-net"
         style="display:none;font-family:monospace;font-size:11px;max-height:220px;overflow-y:auto;line-height:1.6;padding:4px 8px;"></div>
    <div id="debug-crumbs"
         style="display:none;font-family:monospace;font-size:11px;max-height:220px;overflow-y:auto;line-height:1.6;padding:4px 8px;"></div>
  </div>

  <!-- ===== 日志浮窗 ===== -->
  <div id="log-panel" class="float-panel hidden"
       style="bottom:36px;right:448px;width:500px;">
    <div class="float-panel-header">
      <span><svg class="icon" width="14" height="14"><use href="#icon-log"/></svg> 系统日志</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <select id="log-level-filter" class="log-filter-select">
          <option value="all">全部</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARN</option>
          <option value="ERROR">ERROR</option>
        </select>
        <button class="float-close" id="btn-refresh-log" title="刷新">↺</button>
        <button class="float-close" id="btn-log-copy" title="复制到剪贴板">⎘</button>
        <button class="float-close"
                onclick="document.getElementById('log-panel').classList.add('hidden')">✕</button>
      </div>
    </div>
    <div class="float-panel-body" id="log-body"
         style="font-family:monospace;font-size:11px;max-height:260px;overflow-y:auto;line-height:1.5;"></div>
  </div>

  <!-- ===== 脚本（event_bus 最先，workspace 次之，core 模块，main 最后）===== -->
  <script src="/web/event_bus.js"></script>
  <script src="/web/workspace/workspace.js"></script>
  <!-- core 模块（ThemeManager / AuthStateManager / NotifManager / CmdPalette）-->
  <script src="/web/core/theme_manager.js"></script>
  <script src="/web/core/auth_state.js?v=2"></script>
  <script src="/web/core/notification_manager.js"></script>
  <script src="/web/core/cmd_palette.js"></script>
  <script src="/web/core/global_search.js"></script>
  <!-- workspace 模块（TabManager / NavManager，依赖 WorkspaceEngine + core）-->
  <script src="/web/workspace/tab_manager.js"></script>
  <script src="/web/workspace/nav_manager.js"></script>
  <!-- main.js 协调入口（依赖上述所有模块，必须最后加载）-->
  <script src="/web/main.js"></script>

</body>
</html>
