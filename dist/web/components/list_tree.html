<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>清单树</title>
  <style>
    :root {
      --bg-primary: #1e1e2e; --bg-secondary: #181825; --bg-surface: #24273a;
      --text-normal: #cdd6f4; --text-muted: #a6adc8; --text-faint: #6c7086;
      --border-default: #313244; --color-accent: #89b4fa;
    }
    [data-theme="light"] {
      --bg-primary: #eff1f5; --bg-secondary: #e6e9ef; --bg-surface: #dce0e8;
      --text-normal: #4c4f69; --text-muted: #8c8fa1; --text-faint: #9ca0b0;
      --border-default: #bcc0cc; --color-accent: #1e66f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background: var(--bg-secondary);
      color: var(--text-normal);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* ── 顶栏 ── */
    .lt-header {
      padding: 6px 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .lt-search {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      color: var(--text-normal);
      font-size: 12px;
      padding: 3px 7px;
      outline: none;
    }
    .lt-search::placeholder { color: var(--text-faint); }
    .lt-search:focus { border-color: var(--color-accent); }
    .lt-refresh-btn {
      width: 24px; height: 24px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .lt-refresh-btn:hover { background: rgba(255,255,255,.07); color: var(--text-normal); }
    [data-theme="light"] .lt-refresh-btn:hover { background: rgba(0,0,0,.05); }

    /* ── 滚动区 ── */
    .lt-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 4px 0;
    }
    .lt-scroll::-webkit-scrollbar { width: 4px; }
    .lt-scroll::-webkit-scrollbar-track { background: transparent; }
    .lt-scroll::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }

    /* ── 车型节点 ── */
    .lt-vehicle {
      padding: 0;
    }
    .lt-vehicle-hdr {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      margin: 0 4px;
    }
    .lt-vehicle-hdr:hover { background: rgba(255,255,255,.05); }
    [data-theme="light"] .lt-vehicle-hdr:hover { background: rgba(0,0,0,.04); }
    .lt-caret {
      width: 12px; height: 12px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint);
      transition: transform .15s;
    }
    .lt-caret.open { transform: rotate(90deg); }
    .lt-vehicle-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .lt-vehicle-body { display: none; }
    .lt-vehicle-body.open { display: block; }

    /* ── 项目节点 ── */
    .lt-project {
      margin: 0 4px;
    }
    .lt-project-hdr {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 18px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
    }
    .lt-project-hdr:hover { background: rgba(255,255,255,.05); }
    [data-theme="light"] .lt-project-hdr:hover { background: rgba(0,0,0,.04); }
    .lt-project-name {
      flex: 1; font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lt-project-count {
      font-size: 10px; color: var(--text-faint);
      background: rgba(108,112,134,.2);
      padding: 1px 4px; border-radius: 3px;
      flex-shrink: 0;
    }
    .lt-project-body { display: none; }
    .lt-project-body.open { display: block; }

    /* ── 清单条目 ── */
    .lt-list-item {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 32px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      margin: 0 4px;
    }
    .lt-list-item:hover { background: rgba(255,255,255,.05); }
    .lt-list-item.active { background: rgba(137,180,250,.12); }
    [data-theme="light"] .lt-list-item:hover { background: rgba(0,0,0,.04); }
    [data-theme="light"] .lt-list-item.active { background: rgba(30,102,245,.08); }
    .lt-list-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lt-list-name {
      flex: 1; font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lt-list-item.active .lt-list-name { color: var(--color-accent); }
    .lt-list-type {
      font-size: 10px; color: var(--text-faint);
      flex-shrink: 0;
    }

    /* ── 未分配分组 ── */
    .lt-unassigned-hdr {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      margin: 2px 4px 0;
    }
    .lt-unassigned-hdr:hover { background: rgba(255,255,255,.05); }
    [data-theme="light"] .lt-unassigned-hdr:hover { background: rgba(0,0,0,.04); }
    .lt-unassigned-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: .4px;
    }
    .lt-unassigned-body { display: none; }
    .lt-unassigned-body.open { display: block; }

    /* 未分配的清单缩进更浅 */
    .lt-unassigned-body .lt-list-item { padding-left: 20px; }

    /* ── 状态提示 ── */
    .lt-msg { font-size: 12px; color: var(--text-faint); padding: 8px 12px; }

    /* ── 右键菜单 ── */
    .lt-ctx-menu {
      position: fixed;
      z-index: 9999;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 5px;
      box-shadow: 0 6px 18px rgba(0,0,0,.4);
      padding: 3px 0;
      min-width: 130px;
      font-size: 12px;
    }
    .lt-ctx-item {
      padding: 5px 12px;
      cursor: pointer;
      color: var(--text-normal);
      white-space: nowrap;
    }
    .lt-ctx-item:hover { background: rgba(137,180,250,.1); color: var(--color-accent); }
    [data-theme="light"] .lt-ctx-item:hover { background: rgba(30,102,245,.08); }
    .lt-ctx-sep { height: 1px; background: var(--border-default); margin: 3px 0; }
  </style>
</head>
<body>

<div class="lt-header">
  <input class="lt-search" id="ltSearch" type="text" placeholder="搜索清单…" autocomplete="off" spellcheck="false">
  <button class="lt-refresh-btn" id="ltRefresh" title="刷新">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
  </button>
</div>
<div class="lt-scroll" id="ltScroll"></div>

<script>
'use strict';

// ── 主题 ─────────────────────────────────────────────────────
function _applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t || 'dark');
}
try {
  const pTheme = window.parent?.document?.documentElement?.getAttribute('data-theme');
  _applyTheme(pTheme || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
} catch (_) { _applyTheme('dark'); }

window.addEventListener('message', e => {
  if (e.data?.type === 'theme') _applyTheme(e.data.theme);
});

// ── 状态 ─────────────────────────────────────────────────────
let _lists       = [];   // work.lists（task/issue/knowledge/rule）
let _pbomSnaps   = [];   // bop.pbom_versions
let _bopVersions = [];   // bop.bop_versions（工艺流程图）
let _projects    = [];
let _vehicles    = [];
let _selected    = null;  // { itemType, gid }
let _searchQ     = '';
let _loading     = false;

// 树展开状态（localStorage 持久化）
const _LS_KEY = 'lt:expand';
let _expanded = {};
try { _expanded = JSON.parse(localStorage.getItem(_LS_KEY) || '{}'); } catch (_) {}
function _saveExpanded() {
  try { localStorage.setItem(_LS_KEY, JSON.stringify(_expanded)); } catch (_) {}
}

// ── 图标 ─────────────────────────────────────────────────────
const _TYPE_ICON = {
  task: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  issue: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  knowledge: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  rule: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`,
  pbom: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
  bop_lineage: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><line x1="12" y1="7" x2="5" y2="17"/><line x1="12" y1="7" x2="19" y2="17"/></svg>`,
};
const _CARET_SVG = `<svg width="8" height="8" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 2 9 6 3 10"/></svg>`;
const _VEHICLE_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
const _PROJECT_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`;

// ── 加载数据 ──────────────────────────────────────────────────
async function _load() {
  if (_loading) return;
  _loading = true;
  _render();  // 显示加载中

  const _cloudFetch  = window._cloudFetch || window.parent?._cloudFetch || window.top?._cloudFetch;

  async function invokeCapability(id, payload = {}) {
    if (!_cloudFetch) throw new Error('云端服务未连接');
    const response = await _cloudFetch(`/api/v1/capabilities/${id}:invoke`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: 1, payload }),
    });
    const envelope = response?.data;
    if (response?.success !== true || envelope?.ok !== true) {
      const detail = envelope?.error || response?.error || {};
      throw new Error(detail.message || `能力调用失败：${id}@1`);
    }
    const value = envelope.data;
    return value?.data !== undefined && Object.keys(value).length === 1 ? value.data : value;
  }

  // 云端清单
  let cloudLists = [];
  try {
    if (_cloudFetch) {
      const res = await (window.top?.AI00ExistingCapabilityClient || window.AI00ExistingCapabilityClient)
        .call('project.lists.search');
      cloudLists = (res?.data || []).filter(l => !l.deleted_at).map(l => ({ ...l, _src: 'cloud' }));
    }
  } catch (_) {}

  const seen = new Set();
  _lists = cloudLists.filter(l => {
    if (!l.gid || l.deleted_at || seen.has(l.gid)) return false;
    seen.add(l.gid);
    return true;
  });

  // 3. 车型（仅云端）
  _vehicles = [];
  try {
    if (_cloudFetch) {
      const value = await invokeCapability('project.project.read.atomic.vehicle_models_list', {});
      _vehicles = Array.isArray(value) ? value : (value?.data || value?.items || []);
    }
  } catch (_) {}

  // 4. 项目（仅云端）
  _projects = [];
  try {
    if (_cloudFetch) {
      const value = await invokeCapability('project.project.read.atomic.projects_search', {});
      const rows = Array.isArray(value) ? value : (value?.data || value?.projects || []);
      _projects = rows.filter(p => !p.is_deleted && !p.is_archived);
    }
  } catch (_) {}

  // 5. PBOM 快照（仅云端）
  _pbomSnaps = [];
  try {
    if (_cloudFetch) {
      const res = await _cloudFetch('/api/ebom/snapshots', { method: 'GET' });
      _pbomSnaps = (res?.data || []).map(s => ({
        gid:         s.gid,
        name:        s.name || s.version_tag || s.gid,
        color:       '#94e2d5',
        item_type:   'pbom',
        project_gid: s.project_gid || null,
        _src:        'cloud',
        _snapData:   s,
      }));
    }
  } catch (_) {}

  // 6. BOP 版本（工艺流程图，仅云端）
  _bopVersions = [];
  try {
    if (_cloudFetch) {
      const value = await invokeCapability('craft.bop.version.list', { include_archived: false, page_size: 100 });
      const rows = Array.isArray(value) ? value : (value?.items || value?.versions || value?.data || []);
      _bopVersions = rows.map(v => ({
          gid:         v.gid,
          name:        v.bop_name ? `${v.bop_name}（${v.version_tag || v.gid.slice(-6)}）` : (v.version_tag || v.gid.slice(-6)),
          color:       '#cba6f7',
          item_type:   'bop_lineage',
          project_gid: v.project_gid || null,
          _src:        'cloud',
        }));
    }
  } catch (_) {}

  _loading = false;
  _render();
  window.parent?.postMessage({ type: 'lt:ready' }, '*');
}

// ── 渲染 ──────────────────────────────────────────────────────
function _render() {
  const el = document.getElementById('ltScroll');
  if (!el) return;

  if (_loading) {
    el.innerHTML = '<div class="lt-msg">加载中…</div>';
    return;
  }

  const q = _searchQ.toLowerCase();
  const allItems = [..._lists, ..._pbomSnaps, ..._bopVersions];
  const filteredLists = q
    ? allItems.filter(l => (l.name || l.title || '').toLowerCase().includes(q))
    : allItems;

  if (!filteredLists.length) {
    el.innerHTML = '<div class="lt-msg">' + (q ? '无匹配清单' : '暂无清单') + '</div>';
    return;
  }

  const frag = document.createDocumentFragment();

  // 按 project_gid 分组
  const byProject = new Map();  // project_gid → [list, ...]
  for (const l of filteredLists) {
    const pgid = l.project_gid || '__none__';
    if (!byProject.has(pgid)) byProject.set(pgid, []);
    byProject.get(pgid).push(l);
  }

  // ── 有项目的清单，按车型→项目分组 ─────────────────────────────
  // 构建车型 → 项目 → 清单 的映射
  const vehicleMap = new Map();  // vehicle_gid → {vehicle, projects: Map<proj_gid, {proj, lists}> }

  for (const proj of _projects) {
    const pgid = proj.gid;
    if (!byProject.has(pgid)) continue;
    const vgid = proj.vehicle_model_gid || '__no_vehicle__';
    if (!vehicleMap.has(vgid)) {
      const v = _vehicles.find(v => v.gid === vgid);
      vehicleMap.set(vgid, {
        vehicle: v || { gid: vgid, name: '未分配车型' },
        projects: new Map(),
      });
    }
    vehicleMap.get(vgid).projects.set(pgid, {
      proj,
      lists: byProject.get(pgid) || [],
    });
  }

  // 渲染车型块
  for (const [vgid, { vehicle, projects }] of vehicleMap) {
    const vKey = 'v:' + vgid;
    const vEl  = document.createElement('div');
    vEl.className = 'lt-vehicle';

    const vHdr = document.createElement('div');
    vHdr.className = 'lt-vehicle-hdr';
    const vOpen = _expanded[vKey] !== false;  // 默认展开
    vHdr.innerHTML =
      `<span class="lt-caret${vOpen ? ' open' : ''}">${_CARET_SVG}</span>` +
      `<span style="color:var(--color-accent);flex-shrink:0">${_VEHICLE_SVG}</span>` +
      `<span class="lt-vehicle-name">${_esc(vehicle.name)}</span>`;
    vHdr.addEventListener('click', () => {
      const body = vEl.querySelector('.lt-vehicle-body');
      const caret = vHdr.querySelector('.lt-caret');
      const nowOpen = body.classList.toggle('open');
      caret.classList.toggle('open', nowOpen);
      _expanded[vKey] = nowOpen;
      _saveExpanded();
    });
    vEl.appendChild(vHdr);

    const vBody = document.createElement('div');
    vBody.className = 'lt-vehicle-body' + (vOpen ? ' open' : '');

    for (const [pgid, { proj, lists }] of projects) {
      const pKey = 'p:' + pgid;
      const pEl  = document.createElement('div');
      pEl.className = 'lt-project';

      const pHdr = document.createElement('div');
      pHdr.className = 'lt-project-hdr';
      const pOpen = _expanded[pKey] !== false;
      pHdr.innerHTML =
        `<span class="lt-caret${pOpen ? ' open' : ''}">${_CARET_SVG}</span>` +
        `<span style="color:var(--text-faint);flex-shrink:0">${_PROJECT_SVG}</span>` +
        `<span class="lt-project-name">${_esc(proj.name || proj.project_code || pgid)}</span>` +
        `<span class="lt-project-count">${lists.length}</span>`;
      pHdr.addEventListener('click', () => {
        const body = pEl.querySelector('.lt-project-body');
        const caret = pHdr.querySelector('.lt-caret');
        const nowOpen = body.classList.toggle('open');
        caret.classList.toggle('open', nowOpen);
        _expanded[pKey] = nowOpen;
        _saveExpanded();
      });
      pEl.appendChild(pHdr);

      const pBody = document.createElement('div');
      pBody.className = 'lt-project-body' + (pOpen ? ' open' : '');
      for (const l of lists) {
        pBody.appendChild(_makeListItem(l));
      }
      pEl.appendChild(pBody);
      vBody.appendChild(pEl);
    }

    vEl.appendChild(vBody);
    frag.appendChild(vEl);
  }

  // ── 未分配项目的清单（project_gid 无对应项目） ──────────────
  const unassignedLists = [];
  for (const l of filteredLists) {
    const pgid = l.project_gid;
    // 列表中有 project_gid 但项目不在 _projects 里，或者没有 project_gid
    if (!pgid) {
      unassignedLists.push(l);
    } else if (!_projects.find(p => p.gid === pgid)) {
      unassignedLists.push(l);
    }
  }

  if (unassignedLists.length) {
    const uKey  = '__unassigned__';
    const uEl   = document.createElement('div');
    uEl.className = 'lt-vehicle';

    const uHdr  = document.createElement('div');
    uHdr.className = 'lt-unassigned-hdr';
    const uOpen = _expanded[uKey] !== false;
    uHdr.innerHTML =
      `<span class="lt-caret${uOpen ? ' open' : ''}">${_CARET_SVG}</span>` +
      `<span class="lt-unassigned-name">未分配项目</span>` +
      `<span style="font-size:10px;color:var(--text-faint);margin-left:4px">${unassignedLists.length}</span>`;
    uHdr.addEventListener('click', () => {
      const body = uEl.querySelector('.lt-unassigned-body');
      const caret = uHdr.querySelector('.lt-caret');
      const nowOpen = body.classList.toggle('open');
      caret.classList.toggle('open', nowOpen);
      _expanded[uKey] = nowOpen;
      _saveExpanded();
    });
    uEl.appendChild(uHdr);

    const uBody = document.createElement('div');
    uBody.className = 'lt-unassigned-body' + (uOpen ? ' open' : '');
    for (const l of unassignedLists) {
      uBody.appendChild(_makeListItem(l));
    }
    uEl.appendChild(uBody);
    frag.appendChild(uEl);
  }

  el.innerHTML = '';
  el.appendChild(frag);
}

// ── 清单条目元素 ──────────────────────────────────────────────
function _makeListItem(list) {
  const item = document.createElement('div');
  item.className = 'lt-list-item';
  const isActive = _selected && _selected.gid === list.gid;
  if (isActive) item.classList.add('active');

  const color  = list.color || '#6c7086';
  const itype  = list.item_type || 'task';
  const name   = list.name || list.title || '';
  item.innerHTML =
    `<div class="lt-list-dot" style="background:${_esc(color)}"></div>` +
    `<span class="lt-list-name">${_esc(name)}</span>` +
    `<span class="lt-list-type" style="opacity:.7">${_TYPE_ICON[itype] || ''}</span>`;

  item.addEventListener('click', () => _selectList(list));
  item.addEventListener('contextmenu', e => { e.preventDefault(); _showCtxMenu(e, list); });
  return item;
}

// ── 选中清单 ──────────────────────────────────────────────────
function _selectList(list) {
  _selected = { gid: list.gid, itemType: list.item_type };
  _render();
  const itype = list.item_type || 'task';
  // PBOM 快照：打开 ebom tab，传 gid 供 ebom.js 选择版本
  if (itype === 'pbom') {
    window.parent?.postMessage({ type: 'ls:nav', itemType: 'ebom', gid: list.gid }, '*');
    return;
  }
  // BOP 版本（工艺流程图）：打开 bop_lineage tab，传 gid 供 lineage.js 切换版本
  if (itype === 'bop_lineage') {
    window.parent?.postMessage({ type: 'ls:nav', itemType: 'bop_lineage', gid: list.gid }, '*');
    return;
  }
  // task / issue / knowledge / rule
  window.parent?.postMessage({ type: 'ls:nav', itemType: itype, gid: list.gid }, '*');
}

// ── 右键菜单（关联项目）────────────────────────────────────────
function _showCtxMenu(e, list) {
  const existing = document.getElementById('lt-ctx-menu');
  if (existing) existing.remove();

  // PBOM 快照和 BOP 版本的 project_gid 由后端管理，不支持在此更改
  if (list.item_type === 'pbom' || list.item_type === 'bop_lineage' || !_projects.length) return;

  const menu = document.createElement('div');
  menu.id = 'lt-ctx-menu';
  menu.className = 'lt-ctx-menu';

  // 标题
  const title = document.createElement('div');
  title.style.cssText = 'padding:4px 12px 2px;font-size:10px;color:var(--text-faint);';
  title.textContent = '关联到项目';
  menu.appendChild(title);
  menu.appendChild(title);

  const sep = document.createElement('div');
  sep.className = 'lt-ctx-sep';
  menu.appendChild(sep);

  // 清除关联
  if (list.project_gid) {
    const clearItem = document.createElement('div');
    clearItem.className = 'lt-ctx-item';
    clearItem.textContent = '取消项目关联';
    clearItem.addEventListener('click', () => { menu.remove(); _assignProject(list, ''); });
    menu.appendChild(clearItem);
    const sep2 = document.createElement('div');
    sep2.className = 'lt-ctx-sep';
    menu.appendChild(sep2);
  }

  for (const proj of _projects) {
    const pItem = document.createElement('div');
    pItem.className = 'lt-ctx-item';
    pItem.textContent = proj.name || proj.project_code || proj.gid;
    if (list.project_gid === proj.gid) {
      pItem.style.color = 'var(--color-accent)';
    }
    pItem.addEventListener('click', () => { menu.remove(); _assignProject(list, proj.gid); });
    menu.appendChild(pItem);
  }

  document.body.appendChild(menu);
  let x = e.clientX, y = e.clientY;
  if (x + 150 > window.innerWidth) x = window.innerWidth - 155;
  if (y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight - 4;
  menu.style.left = x + 'px';
  menu.style.top  = y + 'px';

  setTimeout(() => {
    document.addEventListener('mousedown', function close(ev) {
      if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('mousedown', close); }
    });
  }, 10);
}

// ── 关联项目（PATCH /api/lists/{gid}）────────────────────────
async function _assignProject(list, projectGid) {
  const _cloudFetch = window._cloudFetch || window.parent?._cloudFetch || window.top?._cloudFetch;
  try {
    if (_cloudFetch) {
      await (window.top?.AI00ExistingCapabilityClient || window.AI00ExistingCapabilityClient)
        .call('project.lists.patch', { gid: list.gid, patch: { project_gid: projectGid } });
    }
    list.project_gid = projectGid || null;
    _render();
  } catch (err) {
    console.error('[list_tree] 关联项目失败:', err);
  }
}

function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 搜索 ─────────────────────────────────────────────────────
let _searchTimer;
document.getElementById('ltSearch').addEventListener('input', e => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    _searchQ = e.target.value.trim();
    _render();
  }, 200);
});

// ── 刷新 ─────────────────────────────────────────────────────
document.getElementById('ltRefresh').addEventListener('click', _load);

// ── 消息同步 ─────────────────────────────────────────────────
window.addEventListener('message', e => {
  const m = e.data;
  if (!m) return;
  if (m.type === 'theme')      _applyTheme(m.theme);
  if (m.type === 'lt:reload')  _load();
  // 当其他地方触发 ls:nav，同步高亮选中态
  if (m.type === 'ls:nav:sync') {
    _selected = m.gid ? { gid: m.gid, itemType: m.itemType || '' } : null;
    _render();
  }
});

_load();
</script>
