<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统通用UI组件库</title>
  
  <link rel="stylesheet" href="/assets/app-ui-6f33ba9e.css">
</head>
<body>
  <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <h1 style="margin-bottom: 24px;">系统通用UI组件库</h1>

    <!-- 按钮组件 -->
    <div class="app-card" style="margin-bottom: 24px;">
      <div class="app-card-title">按钮组件</div>
      <div class="app-card-desc">主按钮 / 次按钮 / 边框按钮 / 文字按钮 / 禁用状态</div>
      <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="app-btn app-btn-primary">主按钮</button>
        <button class="app-btn app-btn-secondary">次按钮</button>
        <button class="app-btn app-btn-outline">边框按钮</button>
        <button class="app-btn app-btn-text">文字按钮</button>
        <button class="app-btn app-btn-primary" disabled>禁用按钮</button>
        <button class="app-btn app-btn-primary app-btn-sm">小尺寸按钮</button>
      </div>
    </div>

    <!-- 卡片组件 -->
    <div class="app-card app-card-hover" style="margin-bottom: 24px;">
      <div class="app-card-title">卡片组件</div>
      <div class="app-card-desc">
        系统风格卡片，支持悬停效果，适用于设置项、功能模块、数据展示等全场景使用。
      </div>
      <div class="app-card-footer">
        <button class="app-btn app-btn-outline">取消</button>
        <button class="app-btn app-btn-primary">确认</button>
      </div>
    </div>

    <!-- 输入框组件 -->
    <div class="app-card" style="margin-bottom: 24px;">
      <div class="app-card-title">输入框组件</div>
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 16px;">
        <div class="app-input-group">
          <label class="app-input-label">普通输入框</label>
          <input type="text" class="app-input" placeholder="请输入内容">
        </div>
        <div class="app-input-group">
          <label class="app-input-label">禁用输入框</label>
          <input type="text" class="app-input" disabled value="禁用状态">
        </div>
      </div>
    </div>

    <!-- 下拉框组件 -->
    <div class="app-card">
      <div class="app-card-title">下拉框组件</div>
      <div style="margin-top: 16px;">
        <div class="app-select">
          <div class="app-select-trigger">
            <span>请选择主题</span>
          </div>
          <div class="app-select-options">
            <div class="app-select-option" data-value="light">浅色主题</div>
            <div class="app-select-option" data-value="dark">深色主题</div>
            <div class="app-select-option" data-value="system">跟随系统</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主题切换 -->
    <div style="margin-top: 24px;">
      <button class="app-btn app-btn-primary" onclick="window.ThemeManager?.toggleTheme?.()">
        切换明暗主题
      </button>
    </div>
  </div>

  <script src="/web/components/app-ui.js"></script>
</body>
</html>
