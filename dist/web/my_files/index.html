<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的文件</title>
  
  
  <link rel="stylesheet" href="/assets/index-b32c86b9.css">
  <link rel="stylesheet" href="/assets/app-ui-6f33ba9e.css">
</head>
<body>
  <script src="/web/icons.js"></script>

  <div class="mf-layout">

    <!-- ── 左侧文件浏览器 ── -->
    <aside class="mf-sidebar" id="mfSidebar">

      <!-- 工具栏：分组 / 排序 / 搜索 -->
      <div class="mf-toolbar">
        <select id="mfGroupBy" title="分组方式">
          <option value="domain">按域</option>
          <option value="time">按时间</option>
          <option value="type">按类型</option>
        </select>
        <select id="mfSortBy" title="排序方式">
          <option value="updated_at">最近更新</option>
          <option value="title">名称</option>
        </select>
        <div class="mf-search-wrap">
          <input type="text" id="mfSearch" class="mf-search" placeholder="搜索…" autocomplete="off">
        </div>
        <button class="mf-btn-icon" id="mfBtnSettings" title="设置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
        <button class="mf-btn-icon mf-btn-new" id="mfBtnNew" title="新建文件">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <!-- 类型选择 Popover -->
      <div class="mf-type-picker" id="mfTypePicker" hidden></div>

      <!-- 文件列表 -->
      <div class="mf-file-list" id="mfFileList">
        <div class="mf-loading">加载中…</div>
      </div>

    </aside>

    <!-- ── 可拖拽分割条 ── -->
    <div class="mf-splitter" id="mfSplitter" title="拖拽调整宽度（双击重置）"></div>

    <!-- ── 右侧详情查看器 ── -->
    <main class="mf-viewer" id="mfViewer">
      <div class="mf-viewer-empty" id="mfViewerEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
        </svg>
        <span>← 从左侧选择一个文件</span>
      </div>
    </main>

  </div>

  <!-- 新建文件 Modal -->
  <div class="mf-modal-overlay" id="mfModalOverlay" hidden>
    <div class="mf-modal" id="mfModal">
      <div class="mf-modal-hdr">
        <span class="mf-modal-hdr-icon" id="mfModalIcon"></span>
        <span class="mf-modal-hdr-title" id="mfModalTitle">新建</span>
        <button class="mf-btn-icon mf-modal-close" id="mfModalClose">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mf-modal-body" id="mfModalBody"></div>
      <div class="mf-modal-footer">
        <button class="mf-btn-secondary" id="mfModalCancel">取消</button>
        <button class="mf-btn-primary" id="mfModalSubmit">创建</button>
      </div>
    </div>
  </div>

  <script src="/web/components/visibility_selector.js"></script>
  <script src="my_files.js"></script>
</body>
</html>
