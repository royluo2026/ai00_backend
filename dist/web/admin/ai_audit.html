<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 操作审计</title>
  <script src="/web/icons.js"></script>
  
  <style>
    :root {
      --bg-primary:#1e1e2e; --bg-secondary:#181825; --bg-surface:#24273a; --bg-tertiary:#313244;
      --text-normal:#cdd6f4; --text-muted:#a6adc8; --text-faint:#6c7086;
      --border-default:#313244; --color-accent:#89b4fa;
      --color-green:#a6e3a1; --color-red:#f38ba8; --color-yellow:#f9e2af;
      --color-blue:#89b4fa; --color-mauve:#cba6f7; --color-gray:#585b70;
    }
    [data-theme="light"] {
      --bg-primary:#eff1f5; --bg-secondary:#e6e9ef; --bg-surface:#dce0e8; --bg-tertiary:#bcc0cc;
      --text-normal:#4c4f69; --text-muted:#8c8fa1; --text-faint:#9ca0b0;
      --border-default:#bcc0cc; --color-accent:#1e66f5;
      --color-green:#40a02b; --color-red:#d20f39; --color-yellow:#df8e1d;
      --color-blue:#1e66f5; --color-mauve:#8839ef; --color-gray:#7c7f93;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; background:var(--bg-primary); color:var(--text-normal); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size:13px; }
    #appRoot { height:100%; display:flex; flex-direction:column; }

    /* ── status / rw badges ── */
    .aa-badge {
      display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; font-weight:500; line-height:18px;
    }
    .aa-badge-ok     { background:color-mix(in srgb,var(--color-green) 18%,transparent); color:var(--color-green); }
    .aa-badge-error  { background:color-mix(in srgb,var(--color-red) 18%,transparent);   color:var(--color-red);   }
    .aa-badge-write  { background:color-mix(in srgb,var(--color-mauve) 18%,transparent); color:var(--color-mauve); }
    .aa-badge-read   { background:color-mix(in srgb,var(--color-gray) 18%,transparent);  color:var(--text-muted);  }
    .aa-badge-confirm{ background:color-mix(in srgb,var(--color-green) 18%,transparent); color:var(--color-green); }
    .aa-badge-cloud  { background:color-mix(in srgb,var(--color-blue) 18%,transparent);  color:var(--color-blue);  }

    /* session row styling */
    .aa-session-label { font-weight:600; color:var(--text-normal); }
    .aa-session-meta  { font-size:11px; color:var(--text-faint); margin-left:8px; }

    /* write-only active toolbar btn */
    .aa-btn-active { background:color-mix(in srgb,var(--color-mauve) 25%,var(--bg-surface)) !important; color:var(--color-mauve) !important; border-color:var(--color-mauve) !important; }
  </style>
  <link rel="stylesheet" href="/assets/tree_list_shell-da642102.css">
</head>
<body>
<div id="appRoot"></div>

<script src="/web/components/tree_list_shell.js"></script>
<script>
'use strict';

// ── theme ──────────────────────────────────────────────────────────────────
(function(){
  try {
    const p = window.parent || window;
    const t = p._currentTheme || localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch(_) {}
})();

// ── state ──────────────────────────────────────────────────────────────────
let _writesOnly = false;
let _tls = null;

// ── column definitions ─────────────────────────────────────────────────────
const COLUMNS = [
  { key: 'tool_name',     label: '工具 / 会话',   width: 220 },
  { key: 'is_write',      label: '读/写',          width: 60  },
  { key: 'status',        label: '状态',           width: 60  },
  { key: 'resource_type', label: '资源类型',       width: 90  },
  { key: 'user_gid',      label: '用户 GID',       width: 120 },
  { key: 'created_at',    label: '时间',           width: 160 },
];

// ── cell renderers ─────────────────────────────────────────────────────────
const CELL_RENDERERS = {
  tool_name(row) {
    if (row._isSession) {
      const short = (row.session_gid || '').slice(0, 12);
      const count = row._callCount || 0;
      return `<span class="aa-session-label">${_tlsHe('会话 ' + short)}</span>` +
             `<span class="aa-session-meta">${count} 条调用</span>`;
    }
    return _tlsHe(row.tool_name || '-');
  },
  is_write(row) {
    if (row._isSession) return '';
    return row.is_write
      ? `<span class="aa-badge aa-badge-write">写</span>`
      : `<span class="aa-badge aa-badge-read">读</span>`;
  },
  status(row) {
    if (row._isSession) return '';
    return row.status === 'error'
      ? `<span class="aa-badge aa-badge-error">error</span>`
      : `<span class="aa-badge aa-badge-ok">ok</span>`;
  },
  resource_type(row) {
    if (row._isSession) return '';
    return _tlsHe(row.resource_type || '');
  },
  user_gid(row) {
    if (row._isSession) return '';
    return `<span style="font-family:monospace;font-size:11px">${_tlsHe((row.user_gid||'').slice(0,12))}</span>`;
  },
  created_at(row) {
    const v = row._isSession ? row._firstCall : row.created_at;
    if (!v) return '';
    try {
      const d = new Date(v);
      return _tlsHe(d.toLocaleString('zh-CN', { hour12:false }));
    } catch(_) { return _tlsHe(v); }
  },
};

// ── data loading ──────────────────────────────────────────────────────────
async function _fetchLogs() {
  try {
    const params = new URLSearchParams({ limit: 500, offset: 0 });
    if (_writesOnly) params.set('is_write', 'true');
    const path = `/api/ai/audit-logs?${params}`;

    // Prefer window.top._cloudFetch (handles auth automatically)
    const cloudFetch = window.top?._cloudFetch || window.parent?._cloudFetch;
    if (cloudFetch) {
      const data = await cloudFetch(path);
      return data.logs || [];
    }

    // Fallback: manual fetch with token
    const token = window.top?._authToken || window.parent?.parent?._authToken || window.parent?._authToken || '';
    const baseUrl = 'http://127.0.0.1:8080';
    const resp = await fetch(`${baseUrl}${path}`, {
      headers: token ? { 'X-AI00-Token': token } : { 'X-AI00-Token': '' },
    });
    if (!resp.ok) {
      console.error('[ai_audit] fetch failed', resp.status, await resp.text());
      return [];
    }
    const data = await resp.json();
    return data.logs || [];
  } catch(e) {
    console.error('[ai_audit] fetch error', e);
    return [];
  }
}

function _buildRows(logs) {
  // Group logs by session_gid, building parent+child rows
  const sessionMap = new Map();   // session_gid → { gid, logs[] }

  for (const log of logs) {
    const sid = log.session_gid || '__no_session__';
    if (!sessionMap.has(sid)) {
      sessionMap.set(sid, { session_gid: sid, logs: [] });
    }
    sessionMap.get(sid).logs.push(log);
  }

  const rows = [];
  for (const [sid, group] of sessionMap) {
    // Sort children by created_at asc
    const children = group.logs.sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));
    const firstCall = children[0]?.created_at || '';

    // Parent (session) row — use vpps = session_gid for tree lookup
    rows.push({
      gid:          sid,
      vpps:         sid,        // parent-child matching key
      parent_vpps:  null,       // root
      _isSession:   true,
      session_gid:  sid,
      _callCount:   children.length,
      _firstCall:   firstCall,
      tool_name:    '',
      is_write:     false,
      status:       '',
      resource_type:'',
      user_gid:     children[0]?.user_gid || '',
      created_at:   firstCall,
    });

    // Child (tool call) rows
    for (const log of children) {
      rows.push({
        ...log,
        vpps:        log.gid,   // unique key
        parent_vpps: sid,       // point to session parent
        _isSession:  false,
      });
    }
  }

  return rows;
}

// ── toolbar buttons ────────────────────────────────────────────────────────
function _makeExtraToolbarBtns() {
  return [
    {
      html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>',
      title: '刷新',
      onClick: () => _tls && _tls.refresh(),
    },
    {
      html: `<span style="font-size:11px;font-weight:500">仅写操作</span>`,
      title: '只显示写操作（含云端写）',
      onClick(btn) {
        _writesOnly = !_writesOnly;
        btn.classList.toggle('aa-btn-active', _writesOnly);
        _tls && _tls.refresh();
      },
    },
  ];
}

// ── init ───────────────────────────────────────────────────────────────────
async function _init() {
  _tls = new TreeListShell({
    mountEl:        document.getElementById('appRoot'),
    title:          'AI 操作审计',
    forcedItemType: 'audit',
    showListSelector: false,

    onLoadLists: async () => [{ gid: 'all', name: '全部日志' }],

    onLoadData: async (_type, _listGid) => {
      const logs = await _fetchLogs();
      return _buildRows(logs);
    },

    parentField: 'parent_vpps',

    columns: COLUMNS,
    allColumns: COLUMNS,

    cellRenderer: CELL_RENDERERS,

    detailMode: 'readonly',
    detailFields: [
      { key: 'session_gid',   label: '会话 GID'    },
      { key: 'user_gid',      label: '用户 GID'    },
      { key: 'tool_name',     label: '工具名'      },
      { key: 'is_write',      label: '是否写操作'  },
      { key: 'is_confirmed',  label: '已确认'      },
      { key: 'status',        label: '状态'        },
      { key: 'resource_type', label: '资源类型'    },
      { key: 'resource_gid',  label: '资源 GID'    },
      { key: 'created_at',    label: '时间'        },
      { key: 'inputs_json',   label: '输入参数'    },
      { key: 'result_json',   label: '返回结果'    },
    ],

    extraToolbarBtns: _makeExtraToolbarBtns(),

    moduleId: 'ai_audit',
  });
  await _tls.init();
}

// Wait for DOM
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _init);
} else {
  _init();
}
</script>
</body>
</html>
