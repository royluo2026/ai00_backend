<style>
:root {
  --bg:        #ffffff;
  --bg2:       #f7f6f3;
  --bg3:       #efefef;
  --text:      #2e2e2e;
  --muted:     #6e6e6e;
  --faint:     #9a9a9a;
  --border:    #dcdcdc;
  --accent:    #2563eb;
  --accent-h:  #1d4ed8;
  --radius:    6px;
  --mono:      'Consolas','JetBrains Mono','Fira Code',monospace;
}
:root[data-theme="dark"] {
  --bg:        #1e1e2e;
  --bg2:       #181825;
  --bg3:       #313244;
  --text:      #cdd6f4;
  --muted:     #a6adc8;
  --faint:     #6c7086;
  --border:    #313244;
  --accent:    #89b4fa;
  --accent-h:  #7ba8f0;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
  background: var(--bg2); color: var(--text);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-size: 13px;
}

/* ── toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--bg);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.toolbar-title { font-size: 14px; font-weight: 700; color: var(--text); margin-right: 2px; }
.toolbar-count { font-size: 11px; color: var(--faint); }
.spacer { flex: 1; }
.tb-input {
  padding: 4px 9px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg2); color: var(--text); font-size: 12px; outline: none; width: 160px;
}
.tb-input:focus { border-color: var(--accent); }
.tb-sel {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg2); color: var(--text); font-size: 12px; outline: none; cursor: pointer;
}
.btn {
  padding: 4px 11px; border-radius: var(--radius); font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-h); color: #fff; }
.btn-active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb,var(--accent) 10%,var(--bg)); }

/* ── layout ── */
.body-wrap { display: flex; flex: 1; overflow: hidden; }

/* ── table area ── */
.tbl-area { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--bg); table-layout: fixed; }
thead { position: sticky; top: 0; z-index: 5; }
thead th {
  background: var(--bg2); color: var(--faint); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
  padding: 7px 8px; border-bottom: 1px solid var(--border);
  white-space: nowrap; text-align: left; user-select: none; cursor: pointer;
}
thead th:hover { color: var(--text); }
thead th.sort-active { color: var(--accent); }
.sort-arrow { font-size: 9px; margin-left: 3px; }
tbody td {
  padding: 6px 8px; border-bottom: 1px solid var(--border);
  vertical-align: middle; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover td { background: color-mix(in srgb,var(--accent) 4%,var(--bg)); }
tbody tr.selected td { background: color-mix(in srgb,var(--accent) 9%,var(--bg)); }
tbody tr td.wrap-cell { white-space: normal; word-break: break-all; line-height: 1.5; }

/* column widths */
.col-id    { width: 84px; }
.col-type  { width: 68px; }
.col-prio  { width: 70px; }
.col-mod   { width: 80px; }
.col-uid   { width: 90px; }
.col-page  { width: 120px; }
.col-seq   { width: 48px; }
.col-title { width: 360px; }
.col-stat  { width: 76px; }
.col-ucfm  { width: 76px; }
.col-files { width: 130px; }
.col-cmt   { width: 130px; }
.col-aiq   { width: 130px; }
.col-cmt2  { width: 76px; }
.col-links { width: 100px; }

/* links */
.lk-icon {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px 4px; border-radius: 4px; cursor: pointer;
  transition: background .15s; vertical-align: middle;
}
.lk-icon:hover { background: var(--bg3); }
.lk-icon svg { flex-shrink: 0; }
.lk-web  { color: #2563eb; }
.lk-file { color: #16a34a; }
.lk-ob   { color: #7c3aed; }
.lk-tooltip {

  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  font-size: 11px; max-width: 320px; word-break: break-all;
  white-space: normal; pointer-events: none;
}
.lk-icon:hover .lk-tooltip { display: block; }

.b-p1   { background: rgba(249,115,22,.18); color: #ea580c; }

.b-p3   { background: rgba(107,114,128,.18); color: #6b7280; }
.b-pending  { background: rgba(107,114,128,.18); color: #6b7280; }
.b-doing    { background: rgba(59,130,246,.18); color: #2563eb; }
.b-done     { background: rgba(34,197,94,.18); color: #16a34a; }
.b-hold     { background: rgba(234,179,8,.18); color: #ca8a04; }
.b-norepro  { background: rgba(139,92,246,.18); color: #7c3aed; }

.ref-header {

.ref-item {

<script>
// ── 数据 ──────────────────────────────────────────────────────────────────────
const LS_KEY = 'bug_tracker.items';
let _items   = [];
let _modal   = null;  // RowEditModal instance

// 优先级：本地 JSON 文件（Electron）> localStorage
const _ea = () => window.electronAPI || window.parent?.electronAPI || window.parent?.parent?.electronAPI;

async function loadData() {
  try {
    const ea = _ea();
    if (ea?.readTracker) {
      const raw = await ea.readTracker();
      if (raw) {
        _items = JSON.parse(raw);
        localStorage.setItem(LS_KEY, raw);
        await _preloadEntriesFromDB();
        render();
        return;
      }
    }
  } catch(e) { console.warn('tracker file read failed', e); }
  // fallback localStorage
  try { _items = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { _items = []; }
  await _preloadEntriesFromDB();
  render();
}

async function _preloadEntriesFromDB() {
  // entries 存储在 bug_tracker.json 中，无需从 DB 加载
}

async function saveData() {
  // ═══ 写盘前先读盘合并，防止覆盖外部修改（如 Claude 直接编辑 JSON）═══
  try {
    const ea = _ea();
    if (ea?.readTracker) {
      const diskRaw = await ea.readTracker();
      if (diskRaw) {
        const diskItems = JSON.parse(diskRaw);
        if (Array.isArray(diskItems)) _mergeFromDisk(diskItems);
      }
    }
  } catch(e) { /* 读盘失败静默跳过，不阻塞保存 */ }

  const json = JSON.stringify(_items, null, 2);
  localStorage.setItem(LS_KEY, json);
  try {
    const ea = _ea();
    if (ea?.writeTracker) await ea.writeTracker(json);
  } catch(e) { console.warn('tracker file write failed', e); }
}

/** 将盘上条目合并到内存 _items，保留外部新增的 entries 和字段更新 */
function _mergeFromDisk(diskItems) {
  for (const di of diskItems) {
    const mi = _items.find(it => it.id === di.id);
    if (!mi) continue;

    // ── 合并 entries：盘上多出来的条目（Claude 新增的）追加到内存 ──
    const memEntries = mi.entries || [];
    const memIds = new Set(memEntries.map(e => e.id));
    for (const de of (di.entries || [])) {
      if (!memIds.has(de.id)) {
        // 新条目 → 直接追加
        // AI 条目若无 parent_id，自动挂到最近一条 human 条目下（禁止 AI 创建主题卡片）
        if (de.author === 'ai' && !de.parent_id) {
          const lastHuman = [...memEntries].reverse().find(e => e.author === 'human');
          if (lastHuman) de.parent_id = lastHuman.id;
        }
        memEntries.push(de);
      } else {
        // 已存在条目：AI 写的条目，其 ai_status / read_by_human 以盘上为准
        const me = memEntries.find(e => e.id === de.id);
        if (me && de.author === 'ai') {
          me.ai_status = de.ai_status;
          if (de.read_by_human !== undefined) me.read_by_human = de.read_by_human;
        }
      }
    }
    mi.entries = memEntries;

    // ── 自动标记：盘上有 AI 回复条目 → 所有 human 条目 AI 已读 ──
    const hasAiReply = memEntries.some(e => e.author === 'ai' && e.section === 'detail');
    if (hasAiReply) {
      memEntries.forEach(e => { if (e.author === 'human') e.ai_status = 'read'; });
    }

    // ── 合并 item 级字段：以盘上为准（直接编辑 JSON 的场景）──
    if (di.ai_question && di.ai_question !== mi.ai_question) {
      mi.ai_question = di.ai_question;
    }
    if (di.ai_status && di.ai_status !== mi.ai_status) {
      mi.ai_status = di.ai_status;
    }
    if (di.updated_at) mi.updated_at = di.updated_at;
  }
}

/** 弹出为独立 Electron 窗口 */
async function openStandalone() {
  const ea = _ea();
  if (ea?.openTrackerWindow) {
    await ea.openTrackerWindow();
  } else {
    alert('独立窗口仅在 Electron 桌面端可用');
  }
}

// ── ID 生成 ───────────────────────────────────────────────────────────────────
function _genId() {
  const nums = _items.map(i => parseInt(i.id) || 0);
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return String(next).padStart(7, '0');
}

// ── 序号自动回收与补位 ──────────────────────────────────────────────────────
/** 释放已完成/已搁置条目的 seq，并将其余条目重新编号为连续 1,2,3... */
function _reindexSeqs() {
  // 释放：已完成/已搁置 → seq = null
  const RELEASE_STATUSES = ['已完成', '已搁置'];
  for (const it of _items) {
    if (it.seq != null && RELEASE_STATUSES.includes(it.status)) {
      it.seq = null;
      it.updated_at = new Date().toISOString();
    }
  }
  // 补位：活跃条目（有 seq 的）按 seq 升序重新编号 1,2,3...N
  const active = _items
    .map((it, i) => ({ i, seq: it.seq }))
    .filter(x => x.seq != null)
    .sort((a, b) => a.seq - b.seq);
  active.forEach((x, idx) => {
    const newSeq = idx + 1;
    if (newSeq > 10) {
      // cap: items beyond position 10 lose their seq
      if (_items[x.i].seq != null) {
        _items[x.i].seq = null;
        _items[x.i].updated_at = new Date().toISOString();
      }
    } else if (_items[x.i].seq !== newSeq) {
      _items[x.i].seq = newSeq;
      _items[x.i].updated_at = new Date().toISOString();
    }
  });
}

// ── 渲染 ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const TYPE_CLS  = { 'bug':'b-bug', '调整':'b-adj', '新需求':'b-req' };
const PRIO_CLS  = { 'P0-紧急':'b-p0', 'P1-高':'b-p1', 'P2-中':'b-p2', 'P3-低':'b-p3' };
const STAT_CLS  = { '待处理':'b-pending', '进行中':'b-doing', '待验证':'b-verify', '已完成':'b-done', '已搁置':'b-hold', '无法复现':'b-norepro' };
const AI_CLS    = { '待处理':'b-ai-none', '已修复':'b-ai-fixed', '已更新':'b-ai-updated', '方案变更':'b-ai-changed', '无需修改':'b-ai-skip', '无法复现':'b-ai-norepro' };

// ── 内联状态选择（badge 点选面板，单次点击即选）────────────────────────────────
let _inlineWrap = null;

function showInlineSel(e, idx, field, opts, clsMap) {
  e.stopPropagation();
  if (_inlineWrap) { _inlineWrap.remove(); _inlineWrap = null; }

  const rect = e.currentTarget.getBoundingClientRect();
  const wrap = document.createElement('div');
  wrap.className = 'inline-sel-wrap';
  // 防止超出右边界
  const panelW = 110;
  const left = Math.min(rect.left, window.innerWidth - panelW - 8);
  wrap.style.left = left + 'px';
  wrap.style.top  = rect.bottom + 4 + 'px';

  const cur = _items[idx][field] || (field === 'user_confirm' ? '待确认' : '待处理');
  opts.forEach(([v]) => {
    const span = document.createElement('span');
    span.className = 'badge pick-opt ' + (clsMap[v] || 'b-pending') + (v === cur ? ' pick-active' : '');
    span.textContent = v;
    span.addEventListener('mousedown', async (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      // 状态改为“已完成”必须先验证为 ✓已验证
      if (field === 'status' && v === '已完成' && _items[idx].user_confirm !== '✓已验证') {
        alert('请先将"已确认"设为"✓已验证"再完成。');
        wrap.remove(); _inlineWrap = null;
        return;
      }
      _items[idx][field] = v;
      _items[idx].updated_at = new Date().toISOString();
      if (field === 'status') _reindexSeqs();  // release seq when status changes
      wrap.remove(); _inlineWrap = null;
      render();              // 先刷新，不等存储
      await saveData();
    });
    wrap.appendChild(span);
  });

  document.body.appendChild(wrap);
  _inlineWrap = wrap;

  setTimeout(() => {
    function close(ev) {
      if (!wrap.contains(ev.target)) {
        wrap.remove(); _inlineWrap = null;
        document.removeEventListener('mousedown', close);
      }
    }
    document.addEventListener('mousedown', close);
  }, 0);
}

// ── 序号选择（1-10，唯一，插入中间自动+1）──────────────────────────────────
function showSeqSel(e, idx) {
  e.stopPropagation();
  if (_inlineWrap) { _inlineWrap.remove(); _inlineWrap = null; }

  const rect = e.currentTarget.getBoundingClientRect();
  const wrap = document.createElement('div');
  wrap.className = 'inline-sel-wrap';
  wrap.style.left = Math.min(rect.left, window.innerWidth - 60 - 8) + 'px';
  wrap.style.top  = rect.bottom + 4 + 'px';
  wrap.style.flexDirection = 'row';
  wrap.style.flexWrap = 'wrap';
  wrap.style.gap = '3px';
  wrap.style.minWidth = '240px';
  wrap.style.maxWidth = '280px';

  const cur = _items[idx].seq;

  // "空" 按钮
  const clearBtn = document.createElement('span');
  clearBtn.className = 'badge pick-opt b-pending' + (cur == null ? ' pick-active' : '');
  clearBtn.textContent = '×';
  clearBtn.style.padding = '3px 8px';
  clearBtn.addEventListener('mousedown', async (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    _items[idx].seq = null;
    _items[idx].updated_at = new Date().toISOString();
    wrap.remove(); _inlineWrap = null;
    _reindexSeqs();
    await saveData();
    render();
  });
  wrap.appendChild(clearBtn);

  for (let n = 1; n <= 10; n++) {
    const span = document.createElement('span');
    span.className = 'badge pick-opt' + (n === cur ? ' pick-active' : '');
    span.textContent = n;
    span.style.padding = '3px 8px';
    span.style.minWidth = '26px';
    span.style.textAlign = 'center';
    if (n === cur) {
      span.style.background = 'var(--accent)';
      span.style.color = '#fff';
    }
    span.addEventListener('mousedown', async (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      // 碰撞处理：如果有人占了这个号，把它及后续号都+1
      const takenIdx = _items.findIndex((it, i) => i !== idx && it.seq === n);
      if (takenIdx >= 0) {
        // 收集所有 seq >= n 的其他条目，按 seq 降序处理避免覆盖
        const toShift = _items
          .map((it, i) => ({ i, seq: it.seq }))
          .filter(x => x.i !== idx && x.seq != null && x.seq >= n)
          .sort((a, b) => b.seq - a.seq);
        for (const x of toShift) {
          const newSeq = x.seq + 1;
          _items[x.i].seq = newSeq <= 10 ? newSeq : null;
        }
      }
      _items[idx].seq = n;
      _items[idx].updated_at = new Date().toISOString();
      wrap.remove(); _inlineWrap = null;
      _reindexSeqs();
      await saveData();
      render();
    });
    wrap.appendChild(span);
  }

  document.body.appendChild(wrap);
  _inlineWrap = wrap;

  setTimeout(() => {
    function close(ev) {
      if (!wrap.contains(ev.target)) {
        wrap.remove(); _inlineWrap = null;
        document.removeEventListener('mousedown', close);
      }
    }
    document.addEventListener('mousedown', close);
  }, 0);
}

// ── 分组折叠状态（已完成/已搁置默认收起）────────────────────────────────────
const _collapsed = new Set(['待验证', '已搁置', '已完成']);
const GROUP_ORDER = ['进行中', '待处理', '待验证', '已搁置', '已完成', '无法复现'];

function toggleGroup(status) {
  _collapsed.has(status) ? _collapsed.delete(status) : _collapsed.add(status);
  render();
}

// ── 排序 ──────────────────────────────────────────────────────────────────────
const LS_SORT_KEY = 'bug_tracker.sort';
let _sortField = localStorage.getItem(LS_SORT_KEY + '.field') || 'id';
let _sortDir   = localStorage.getItem(LS_SORT_KEY + '.dir')   || 'desc';

const SORT_FIELDS = {
  'id': 'id', 'type': 'type', 'priority': 'priority', 'module': 'module',
  'ui_id': 'ui_id', 'page': 'page', 'seq': 'seq', 'title': 'title',
  'ai_status': 'ai_status', 'user_confirm': 'user_confirm', 'status': 'status',
  'files': 'files', 'comment': 'comment', 'ai_question': 'ai_question', 'commit': 'commit'
};

const PRIO_ORDER = { 'P0-紧急':0, 'P1-高':1, 'P2-中':2, 'P3-低':3 };

function _cmp(a, b, field) {
  let va = (a[field] || ''), vb = (b[field] || '');
  if (field === 'seq') {
    // 有值排前，空值排后；同有值时按数值升序
    const ha = a.seq != null, hb = b.seq != null;
    if ( ha && !hb) return -1;
    if (!ha &&  hb) return 1;
    if (!ha && !hb) return 0;
    va = a.seq; vb = b.seq;
  }
  if (field === 'id' || field === 'seq') { va = parseInt(va)||0; vb = parseInt(vb)||0; }
  else if (field === 'priority') { va = PRIO_ORDER[va] ?? 99; vb = PRIO_ORDER[vb] ?? 99; }
  else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
  if (va < vb) return -1;
  if (va > vb) return 1;
  return 0;
}

function sortBy(field) {
  if (_sortField === field) {
    _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    _sortField = field;
    _sortDir = 'asc';
  }
  localStorage.setItem(LS_SORT_KEY + '.field', _sortField);
  localStorage.setItem(LS_SORT_KEY + '.dir', _sortDir);
  render();
}

function badge(v, map) {
  const cls = map[v] || 'b-pending';
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}

const LINK_ICONS = {
  web: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"/></svg>`,
  file: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>`,
  obsidian: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 12 12 22 2 12"/></svg>`,
};

function _detectLinkType(url) {
  const u = (url || '').trim().toLowerCase();
  if (u.startsWith('obsidian://')) return 'obsidian';
  if (u.startsWith('file://') || u.match(/^[a-z]:[\\/]/i) || u.startsWith('/')) return 'file';
  return 'web';
}

function _renderLinks(links) {
  if (!Array.isArray(links) || !links.length) return '<span style="color:var(--faint);font-size:10px">-</span>';
  return links.map((l, i) => {
    const type = l.type || _detectLinkType(l.url);
    const icon = LINK_ICONS[type] || LINK_ICONS['web'];
    const cls = type === 'web' ? 'lk-web' : type === 'file' ? 'lk-file' : 'lk-ob';
    const url = l.url || '';
    const title = l.title || url;
    const tip = `${type} | ${title}`;
    return `<span class="lk-icon ${cls}" data-lk-idx="${i}" data-lk-type="${esc(type)}" data-lk-url="${esc(url)}" title="${esc(tip)}">
      ${icon}
      <span class="lk-tooltip">${tip}</span>
    </span>`;
  }).join('');
}

/** 打开链接（Electron shell）*/
function openLink(e, type, url) {
  e.stopPropagation();
  if (!url) return;
  // try top-level electronAPI first (most reliable for iframes)
  const ea = window.top?.electronAPI || window.parent?.electronAPI || window.electronAPI;
  if (type === 'file') {
    if (ea?.openPath) { ea.openPath(url); return; }
  } else {
    if (ea?.openExternal) { ea.openExternal(url); return; }
  }
  // fallback
  window.open(url, '_blank');
}

function _renderThead() {
  const fields = [
    ['id','ID'], ['type','类型'], ['priority','优先级'], ['seq','序号'],
    ['title','主题'], ['ui_id','UI_ID'],
    ['links','链接'],
    ['status','状态'], ['user_confirm','已确认'],
    ['files','涉及文件'], ['commit','commit'],
    ['comment','最新评论(人)'], ['ai_question','最新反馈（AI）'],
    ['module','模块'], ['page','具体页面']
  ];
  const arrow = _sortDir === 'asc' ? '▲' : '▼';
  const h = fields.map(([f,label]) => {
    const cls = f === _sortField ? ' sort-active' : '';
    const ar  = f === _sortField ? `<span class="sort-arrow">${arrow}</span>` : '';
    return `<th class="${cls}" onclick="sortBy('${f}')">${label}${ar}</th>`;
  }).join('');
  document.getElementById('thead').innerHTML = `<tr>${h}</tr>`;
}

function render() {
  _renderThead();

  const q       = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const fType   = document.getElementById('fType')?.value   || '';
  const fPrio   = document.getElementById('fPrio')?.value   || '';
  const fStatus = document.getElementById('fStatus')?.value || '';

  const filtered = _items.filter(it => {
    if (fType   && it.type     !== fType)   return false;
    if (fPrio   && it.priority !== fPrio)   return false;
    if (fStatus && it.status   !== fStatus) return false;
    if (q) {
      // search: title + detail + module + ui_id + page + entries content + old fields
      const entriesText = (it.entries || []).map(e => e.content || '').join(' ');
      const hay = [
        (it.title||''),(it.detail||''),(it.module||''),(it.ui_id||''),(it.page||''),
        (it.comment||''),(it.ai_question||''),(it.history||''), entriesText
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="15"><div class="empty-state"><p>暂无条目</p></div></td></tr>`;
    document.getElementById('countLabel').textContent = `共 ${_items.length} 条`;
    return;
  }

  // 按状态分组，按 GROUP_ORDER 排序
  const groups = {};
  GROUP_ORDER.forEach(s => { groups[s] = []; });
  filtered.forEach(it => {
    const s = it.status || '待处理';
    if (!groups[s]) groups[s] = [];
    groups[s].push(it);
  });

  let html = '';
  GROUP_ORDER.forEach(status => {
    const rows = groups[status];
    if (!rows || !rows.length) return;
    const collapsed = _collapsed.has(status);
    const arrowCls = collapsed ? 'grp-arrow collapsed' : 'grp-arrow';
    html += `<tr class="grp-hdr" onclick="toggleGroup('${status}')">
      <td colspan="15">
        <div class="grp-title">
          <span class="${arrowCls}">▼</span>
          ${badge(status, STAT_CLS)}
          <span class="grp-count">${rows.length} 条</span>
        </div>
      </td>
    </tr>`;
    if (!collapsed) {
      // 组内排序
      const sf = _sortField, sd = _sortDir;
      rows.sort((a,b) => sd === 'asc' ? _cmp(a,b,sf) : _cmp(b,a,sf));
      rows.forEach(it => {
        const realIdx = _items.indexOf(it);
        html += `<tr data-idx="${realIdx}" onclick="if(!event.target.closest('.lk-icon'))openEdit(${realIdx})">
          <td><code style="font-family:var(--mono);font-size:10px;color:var(--accent)">${esc(it.id||'')}</code></td>
          <td>${badge(it.type||'', TYPE_CLS)}</td>
          <td>${badge(it.priority||'', PRIO_CLS)}</td>
          <td class="cell-inline" style="text-align:center" onclick="showSeqSel(event,${realIdx})">
            <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${it.seq ? 'var(--accent)' : 'var(--faint)'}">${it.seq || '-'}</span>
          </td>
          <td style="font-weight:500">${esc(it.title||'')}</td>
          <td><code style="font-family:var(--mono);font-size:10px;color:var(--muted)">${esc(it.ui_id||'')}</code></td>
          <td style="position:relative">${_renderLinks(it.links)}</td>
          <td class="cell-inline" onclick="showInlineSel(event,${realIdx},'status',STATUS_OPTS,STAT_CLS)">${badge(it.status||'待处理', STAT_CLS)}</td>
          <td class="cell-inline" onclick="showInlineSel(event,${realIdx},'user_confirm',UC_OPTS,UC_CLS)">${badge(it.user_confirm||'待确认', UC_CLS)}</td>
          <td style="font-size:10px;color:var(--muted)">${esc(it.files||'')}</td>
          <td><code style="font-family:var(--mono);font-size:10px;color:var(--faint)">${esc(it.commit||'')}</code></td>
          <td style="font-size:11px">${esc(it.comment||'')}</td>
          <td style="font-size:11px;color:var(--muted)">${esc(it.ai_question||'')}</td>
          <td>${esc(it.module||'')}</td>
          <td>${esc(it.page||'')}</td>
        </tr>`;
      });
    }
  });
  tbody.innerHTML = html;

  document.getElementById('countLabel').textContent =
    filtered.length === _items.length
      ? `共 ${_items.length} 条`
      : `显示 ${filtered.length} / ${_items.length} 条`;

  // 刷新 UI 索引面板的统计数据
  if (_refOpen) renderRef();
}

function _initModal() {
  _modal = new RowEditModal({
    columns: BT_COLUMNS,
    entryMode: 'ai',
    items: _items,
    getItemEntries: (it) => {
      if (it.entries && it.entries.length) return it.entries;
      const migrated = EntryThread.migrate(it);
      if (migrated.length) { it.entries = migrated; return migrated; }
      return [];
    },
    getItemAttachments: (it) => it.attachments || [],
    getItemTitle: (it) => it.title || '',
    entryIssueId: 'id',
    isCloud: false,
    itemType: 'bug_tracker',
    showDelete: true,
    datalists: BT_DATALISTS,
    onNew: () => {
      _modal?.close().then(() => {
        _modal.setItems(_items);
        _modal.openNew({ type: 'bug', priority: 'P1-高', status: '待处理', ai_status: '待处理', user_confirm: '待确认' });
      });
    },
    extraFooterButtons: [{
      html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制指令`,
      onclick: () => { _copyIssueInstruction(); },
    }],
    onSave: async (data) => {
      const idx = data._idx;
      const oldFields = EntryThread.entriesToOldFields(data._entries || []);
      const item = {
        id:           data._isNew ? _genId() : (_items[idx]?.id || ''),
        type:         data.type,
        priority:     data.priority,
        status:       data.status,
        ai_status:    data.ai_status,
        user_confirm: data.user_confirm,
        module:       (data.module || '').trim(),
        ui_id:        (data.ui_id || '').trim(),
        page:         (data.page || '').trim(),
        files:        (data.files || '').trim(),
        seq:          data.seq ? parseInt(data.seq) : null,
        title:        (data.title || '').trim(),
        detail:       oldFields.detail,
        comment:      oldFields.comment || (_items[idx]?.comment || ''),
        ai_question:  oldFields.ai_question || (_items[idx]?.ai_question || ''),
        commit:       (data.commit || '').trim(),
        links:        data.links || [],
        attachments:  data.attachments || [],
        history:      oldFields.history,
        entries:      data._entries || [],
        created_at:   data._isNew ? new Date().toISOString() : (_items[idx]?.created_at || new Date().toISOString()),
        updated_at:   new Date().toISOString(),
      };
      if (!item.title) return null;
      // seq collision
      if (item.seq != null) {
        const toShift = _items
          .map((it, i) => ({ i, seq: it.seq }))
          .filter(x => x.i !== idx && x.seq != null && x.seq >= item.seq)
          .sort((a, b) => b.seq - a.seq);
        for (const x of toShift) {
          const newSeq = x.seq + 1;
          _items[x.i].seq = newSeq <= 10 ? newSeq : null;
          _items[x.i].updated_at = new Date().toISOString();
        }
      }
      if (data._isNew) {
        _items.unshift(item);
      } else {
        _items[idx] = item;
      }
      _reindexSeqs();
      // entries 随 JSON 主存储持久化
      await saveData();
      render();
      return item;
    },
    onDelete: async (item) => {
      const idx = _items.indexOf(item);
      if (idx >= 0) _items.splice(idx, 1);
      await saveData();
      render();
    },
  });
}

function openNew() {
  if (!_modal) _initModal();
  _modal.setItems(_items);
  _modal.openNew({
    type: 'bug', priority: 'P1-高', status: '待处理',
    ai_status: '待处理', user_confirm: '待确认',
  });
}

function openEdit(idx) {
  if (!_modal) _initModal();
  _modal.setItems(_items);
  _modal.openAtIndex(idx);
}

/** Copy issue-level AI instruction */
function _copyIssueInstruction() {
  // 直接从 REM 实例获取当前编辑的条目
  const it = _modal?._currentItem;
  const issueId = it?.id || '?';
  const text = '请读dev\\bug_tracker.json的（' + issueId + '号）问题的卡片。并执行相应动作，完成之后：\n'
    + '1. 更新 dev\\bug_tracker.json 里该卡片的 ai_status 字段\n'
    + '2. 对每条 human 条目分别追加回复卡片（section:"detail", author:"ai", author_name:"Claude", parent_id:该human条目的id），说明该条的处理结果。不要新建主题卡片，只回复已有卡片\n'
    + '注意只改 ai_status，不要把卡片移到历史区\n'
    + '⚠️ JSON 可能被 Electron 自动保存并发写入。写文件前先读盘确认未被外部修改，若内容有变请合并后再写，避免覆盖用户的并发编辑。';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      const st = document.querySelector('.rem-save-status');
      if (st) { st.textContent = '已复制指令'; setTimeout(() => { st.textContent = '已保存'; }, 1500); }
    }).catch(() => {});
  }
}

function renderRef() {
  const q = (document.getElementById('refSearch')?.value || '').toLowerCase();
  const filtered = q
    ? UI_INDEX.filter(u => u.id.toLowerCase().includes(q) || u.name.includes(q) || (u.desc||'').includes(q))
    : UI_INDEX;

  const pages = filtered.filter(u => u.id.startsWith('P-'));
  const comps  = filtered.filter(u => u.id.startsWith('EL-'));
  const types  = filtered.filter(u => u.id.startsWith('PT-'));

  function row(u) {
    // 统计该 UI_ID 对应的条目中，status != '已完成' 的数量
    const cnt = _items.filter(it => (it.ui_id||'').includes(u.id) && it.status !== '已完成').length;
    const cntHtml = cnt > 0 ? `<span class="ref-count">${cnt}</span>` : '';
    return `<div class="ref-item ${u.cat}" onclick="insertUid('${u.id}','${u.name.replace(/'/g,"\\'")}')">
      <span class="ref-uid">${u.id}</span>
      <span class="ref-name">${esc(u.name)}</span>
      <span class="ref-type">${esc(u.type)}</span>
      ${cntHtml}
    </div>`;
  }

  let html = '';
  if (pages.length) { html += `<div class="ref-section-hdr">具体页面</div>` + pages.map(row).join(''); }
  if (comps.length)  { html += `<div class="ref-section-hdr">通用组件</div>` + comps.map(row).join(''); }
  if (types.length)  { html += `<div class="ref-section-hdr">页面类型模板</div>` + types.map(row).join(''); }
  document.getElementById('refBody').innerHTML = html || `<div style="padding:20px;color:var(--faint);font-size:12px">无匹配结果</div>`;
}

function insertUid(id, name) {
  const input = document.querySelector('[data-rem-field="ui_id"]');
  if (!input) return;
  const label = name || id;
  const cur = input.value.trim();
  input.value = cur ? (cur + ' / ' + label) : label;
  input.focus();
}

function toggleRef() {
  _refOpen = !_refOpen;
  document.getElementById('refPanel').classList.toggle('open', _refOpen);
  document.getElementById('btnRef').classList.toggle('btn-active', _refOpen);
  if (_refOpen) renderRef();
}

// ── init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  // event delegation for link icon clicks (data attributes instead of inline onclick)
  document.addEventListener('click', (e) => {
    const icon = e.target.closest('.lk-icon');
    if (!icon) return;
    const type = icon.dataset.lkType;
    const url = icon.dataset.lkUrl;
    if (type && url) openLink(e, type, url);
  });
});

// theme sync — localStorage 兜底 + postMessage 实时切换 + storage 跨窗口同步
window.addEventListener('message', e => {
  if (e.data?.type === 'theme') {
    document.documentElement.setAttribute('data-theme', e.data.theme || 'dark');
  }
});
window.addEventListener('storage', e => {
  if (e.key === 'system.theme' && e.newValue) {
    document.documentElement.setAttribute('data-theme', e.newValue);
  }
});
(function syncTheme() {
  const t = localStorage.getItem('system.theme');
  document.documentElement.setAttribute('data-theme', t || 'dark');
})();
</script>
