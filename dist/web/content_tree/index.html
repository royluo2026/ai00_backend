<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>内容树</title>
  
  <link rel="stylesheet" href="/assets/index-ef0b1e52.css">
</head>
<body>

  <!-- ── 顶栏 ── -->
  <div id="ct-header">
    <input id="ct-search-input" type="text" placeholder="搜索内容…" autocomplete="off" spellcheck="false">
    <button id="ct-add-group-btn" class="ct-hdr-btn" title="新建分组">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- ── 树 ── -->
  <div id="ct-tree"></div>

  <!-- ── 右键菜单 ── -->
  <div id="ct-ctx-menu" class="hidden"></div>

  <!-- ── 添加内容对话框 ── -->
  <div id="ct-add-dlg" class="hidden">
    <div class="ct-add-dlg-box">
      <div class="ct-add-dlg-hdr">
        <span>添加内容到分组</span>
        <button id="ct-add-dlg-close" class="ct-add-dlg-close">✕</button>
      </div>
      <div class="ct-add-dlg-body" id="ct-add-dlg-body"></div>
    </div>
  </div>

  <script src="content_tree.js"></script>
  <script>
    // 页面加载完成后通知主窗口，请求树数据
    window.addEventListener('load', () => {
      window.top?.postMessage({ type: 'ct:ready' }, '*');
    });
  </script>
</body>
</html>
