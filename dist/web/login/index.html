<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI00 柔性智能业务基座</title>
  
  <link rel="stylesheet" href="/assets/index-1560454e.css">
</head>
<body>

  <!-- 自定义标题栏（无边框窗口拖动区域）-->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-logo">
      <svg width="18" height="18" viewBox="0 0 48 48" fill="none" style="color:#1e66f5">
        <rect width="48" height="48" rx="12" fill="currentColor" opacity="0.15"/>
        <path d="M12 36 L24 12 L36 36" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 28 L32 28" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="12" r="3" fill="currentColor"/>
      </svg>
      <span>柔性智能业务基座</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-btns">
      <button class="tbtn tbtn-close" id="btn-close" title="关闭">✕</button>
    </div>
  </div>

  <!-- 登录卡片 -->
  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo + 标题 -->
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="#1e66f5" opacity="0.15"/>
            <path d="M12 36 L24 12 L36 36" stroke="#1e66f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 28 L32 28" stroke="#1e66f5" stroke-width="3" stroke-linecap="round"/>
            <circle cx="24" cy="12" r="3" fill="#1e66f5"/>
          </svg>
        </div>
        <h1 class="app-name">AI00 柔性智能业务基座</h1>
        <p class="app-desc">总装智能辅助工艺开发系统</p>
      </div>

      <!-- 登录选项 -->
      <div class="login-actions">
        <button class="btn-feishu" id="btn-feishu">
          <svg class="feishu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 12C6 8.686 8.686 6 12 6s6 2.686 6 6-2.686 6-6 6-6-2.686-6-6z" fill="currentColor" opacity="0.3"/>
            <path d="M12 3C7.029 3 3 7.029 3 12s4.029 9 9 9 9-4.029 9-9-4.029-9-9-9zm0 16c-3.866 0-7-3.134-7-7s3.134-7 7-7 7 3.134 7 7-3.134 7-7 7z" fill="currentColor"/>
            <path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          飞书扫码登录
        </button>
      </div>

      <!-- 状态提示 -->
      <div class="login-status hidden" id="login-status">
        <span class="status-icon" id="status-icon">⏳</span>
        <span id="status-msg">正在连接...</span>
      </div>

    </div>
  </div>

  <script src="/web/shared/random_id.js"></script>
  <script src="/web/core/web_compat.js"></script>
  <script src="login.js"></script>
</body>
</html>
