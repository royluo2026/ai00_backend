<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI00 - 问题清单</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e; color: #cdd6f4; min-height: 100vh;
    }
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px; border-bottom: 1px solid #313244;
      background: #181825;
    }
    .header-logo {
      width: 32px; height: 32px; border-radius: 8px; background: #89b4fa;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #1e1e2e; flex-shrink: 0;
    }
    .header-title { font-size: 16px; font-weight: 600; color: #cdd6f4; }
    .header-subtitle { font-size: 12px; color: #6c7086; margin-top: 2px; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #89b4fa; color: #1e1e2e; }
    .btn-secondary { background: #313244; color: #cdd6f4; }
    .btn-feishu {
      background: #3370ff; color: #fff; padding: 10px 24px;
      font-size: 15px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
    }
    .login-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: calc(100vh - 65px); gap: 20px;
    }
    .login-card {
      background: #181825; border: 1px solid #313244; border-radius: 12px;
      padding: 40px; text-align: center; max-width: 380px; width: 90%;
    }
    .login-card h2 { font-size: 20px; margin-bottom: 8px; }
    .login-card p { color: #6c7086; font-size: 14px; margin-bottom: 24px; }
    .content { padding: 20px 24px; }
    table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    th {
      text-align: left; padding: 8px 12px; border-bottom: 1px solid #313244;
      color: #6c7086; font-weight: 500; background: #181825;
    }
    td { padding: 9px 12px; border-bottom: 1px solid #1e1e2e; }
    tr:hover td { background: #313244; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500;
    }
    .badge-open       { background: #f9e2af22; color: #f9e2af; }
    .badge-in_progress{ background: #89b4fa22; color: #89b4fa; }
    .badge-resolved   { background: #a6e3a122; color: #a6e3a1; }
    .badge-closed     { background: #6c708622; color: #6c7086; }
    .badge-low        { background: rgba(108,112,134,.3); color: #bac2de; }
    .badge-medium     { background: rgba(249,226,175,.25); color: #f9e2af; }
    .badge-high       { background: rgba(235,160,172,.25); color: #eba0ac; }
    .badge-critical   { background: rgba(243,139,168,.3); color: #f38ba8; }
    .empty-state {
      text-align: center; padding: 60px 0; color: #6c7086;
    }
    #loadingMsg { text-align: center; padding: 40px 0; color: #6c7086; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">A</div>
    <div>
      <div class="header-title" id="listTitle">问题清单</div>
      <div class="header-subtitle">AI00 工艺系统</div>
    </div>
    <div class="header-actions" id="headerActions" style="display:none">
      <button class="btn btn-secondary" id="btnOpenApp">在 App 中打开</button>
    </div>
  </div>

  <div id="loginWrap" class="login-wrap">
    <div class="login-card">
      <h2>查看共享清单</h2>
      <p>请使用飞书账号登录，查看完整内容</p>
      <button class="btn btn-feishu" id="btnLogin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
        飞书登录
      </button>
    </div>
  </div>

  <div id="mainContent" style="display:none">
    <div class="content">
      <div id="loadingMsg">加载中…</div>
      <table id="issueTable" style="display:none">
        <thead>
          <tr>
            <th>标题</th>
            <th>状态</th>
            <th>严重度</th>
            <th>负责人</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody id="issueBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">暂无数据</div>
    </div>
  </div>

  <script>
    'use strict';
    const API = window.location.origin;
    const params = new URLSearchParams(location.search);
    const listGid = params.get('list_gid');
    const listName = params.get('list_name') || '问题清单';
    let jwt = localStorage.getItem('ai00_web_jwt');

    const STATUS_LABEL = { open:'待处理', in_progress:'处理中', resolved:'已解决', closed:'已关闭' };
    const SEV_LABEL    = { low:'低', medium:'中', high:'高', critical:'严重' };

    document.getElementById('listTitle').textContent = decodeURIComponent(listName);

    // 深链接按钮
    document.getElementById('btnOpenApp').onclick = () => {
      const qs = listGid ? `?list_gid=${encodeURIComponent(listGid)}` : '';
      location.href = `ai00://issues${qs}`;
    };

    // 飞书 OAuth
    document.getElementById('btnLogin').onclick = feishuLogin;

    async function feishuLogin() {
      try {
        const res = await fetch(`${API}/auth/feishu/login-url`).then(r => r.json());
        const { login_url, state } = res;
        const popup = window.open(login_url, 'feishu_login', 'width=480,height=640,left=200,top=100');
        for (let i = 0; i < 60; i++) {
          await new Promise(r => setTimeout(r, 2000));
          const poll = await fetch(`${API}/auth/feishu/poll/${state}`).then(r => r.json());
          if (poll.status === 'ok') {
            jwt = poll.token;
            localStorage.setItem('ai00_web_jwt', jwt);
            popup?.close();
            showMain();
            loadIssues();
            return;
          }
          if (poll.status === 'error' || poll.status === 'expired') break;
        }
        popup?.close();
        alert('登录超时，请重试');
      } catch (e) {
        alert('登录失败：' + e.message);
      }
    }

    function showMain() {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('headerActions').style.display = 'flex';
    }

    async function loadIssues() {
      document.getElementById('loadingMsg').style.display = 'block';
      document.getElementById('issueTable').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      try {
        const qs = listGid ? `?list_gid=${encodeURIComponent(listGid)}` : '';
        const res = await fetch(API + '/api/issues' + qs, {
          headers: { 'X-AI00-Token': jwt }
        });
        if (res.status === 401) {
          // token 过期，清除并重新登录
          localStorage.removeItem('ai00_web_jwt');
          jwt = null;
          document.getElementById('loginWrap').style.display = 'flex';
          document.getElementById('mainContent').style.display = 'none';
          document.getElementById('headerActions').style.display = 'none';
          return;
        }
        const data = await res.json();
        const issues = data.data || [];
        document.getElementById('loadingMsg').style.display = 'none';
        if (issues.length === 0) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }
        renderTable(issues);
        document.getElementById('issueTable').style.display = 'table';
        // 用第一条 issue 的 list_gid 推导清单名
        if (!params.get('list_name') && issues[0]?.list_gid) {
          // 暂无更好方式，保持 URL 传入的名字
        }
      } catch (e) {
        document.getElementById('loadingMsg').textContent = '加载失败：' + e.message;
      }
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTable(issues) {
      const tbody = document.getElementById('issueBody');
      tbody.innerHTML = issues.map(row => `
        <tr>
          <td>${esc(row.title || '-')}</td>
          <td><span class="badge badge-${esc(row.status)}">${esc(STATUS_LABEL[row.status] || row.status || '-')}</span></td>
          <td><span class="badge badge-${esc(row.severity)}">${esc(SEV_LABEL[row.severity] || row.severity || '-')}</span></td>
          <td>${esc(row.feishu_assignee_name || row.owner_name || '-')}</td>
          <td>${esc(String(row.created_at || '').slice(0, 10))}</td>
        </tr>
      `).join('');
    }

    // 页面初始化
    if (jwt) {
      showMain();
      loadIssues();
    }
  </script>
</body>
</html>
