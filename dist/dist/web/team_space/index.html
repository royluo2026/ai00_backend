<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>团队空间</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bg3: #24243a;
    --text: #cdd6f4; --text-muted: #6c7086; --text-sub: #a6adc8;
    --accent: #89b4fa; --accent2: #cba6f7; --green: #a6e3a1;
    --border: #313244; --hover: #2a2a3d; --active: #2d3561;
    --card-bg: #24243a; --danger: #f38ba8;
    --badge-bg: #31324f;
  }
  [data-theme="light"] {
    --bg: #eff1f5; --bg2: #e6e9ef; --bg3: #f4f5fb;
    --text: #4c4f69; --text-muted: #9ca0b0; --text-sub: #6c6f85;
    --accent: #1e66f5; --accent2: #8839ef; --green: #40a02b;
    --border: #ccd0da; --hover: #e0e4ef; --active: #c0c8f0;
    --card-bg: #ffffff; --danger: #d20f39;
    --badge-bg: #e0e4ef;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

  /* ── Layout ─────────────────────────────────────────────── */
  .ts-layout { display: flex; height: 100%; overflow: hidden; }

  /* ── Left: org tree panel ──────────────────────────────── */
  .ts-tree-panel {
    width: 220px; flex-shrink: 0; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .ts-panel-hdr {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px;
    letter-spacing: .06em; color: var(--text-muted); text-transform: uppercase; flex-shrink: 0;
  }
  .ts-panel-hdr svg { flex-shrink: 0; }
  .ts-tree-body { flex: 1; overflow-y: auto; padding: 6px 6px; }

  .ts-team-item {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    border-radius: 6px; cursor: pointer; transition: background .12s; user-select: none;
    color: var(--text-sub);
  }
  .ts-team-item:hover { background: var(--hover); }
  .ts-team-item.active { background: var(--active); color: var(--accent); }
  .ts-team-item .ts-indent { display: inline-block; }
  .ts-team-item .ts-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-team-item .ts-count { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .ts-tree-add {
    margin: 4px 6px; padding: 6px 10px; border: 1px dashed var(--border);
    border-radius: 6px; cursor: pointer; color: var(--text-muted); font-size: 12px;
    text-align: center; transition: border-color .12s;
  }
  .ts-tree-add:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Right: main area ──────────────────────────────────── */
  .ts-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .ts-topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg);
  }
  .ts-team-name { font-size: 15px; font-weight: 600; flex: 1; }
  .ts-badge {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: var(--badge-bg); color: var(--text-muted);
  }
  .ts-badge.admin { background: color-mix(in srgb, var(--accent2) 15%, transparent); color: var(--accent2); }
  .ts-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
    border-radius: 6px; border: 1px solid var(--border); background: transparent;
    color: var(--text); cursor: pointer; font-size: 12px; transition: background .12s;
  }
  .ts-btn:hover { background: var(--hover); }
  .ts-btn.primary { background: var(--accent); color: var(--bg2); border-color: var(--accent); }
  .ts-btn.primary:hover { opacity: .88; }
  .ts-btn.danger { color: var(--danger); border-color: var(--danger); }
  .ts-btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .ts-content { flex: 1; overflow-y: auto; padding: 16px 18px; }

  /* ── Widgets grid ──────────────────────────────────────── */
  .ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ts-widget {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ts-widget.wide { grid-column: 1 / -1; }
  .ts-widget-hdr {
    display: flex; align-items: center; gap: 8px; padding: 11px 14px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px;
    color: var(--text-sub); flex-shrink: 0;
  }
  .ts-widget-hdr .ts-w-title { flex: 1; }
  .ts-widget-hdr .ts-w-count { font-size: 11px; color: var(--text-muted); }
  .ts-widget-body { flex: 1; overflow-y: auto; max-height: 320px; }

  /* ── Member list ───────────────────────────────────────── */
  .ts-member-list { padding: 4px 0; }
  .ts-member-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); transition: background .1s; cursor: default;
  }
  .ts-member-row:last-child { border-bottom: none; }
  .ts-member-row:hover { background: var(--hover); }
  .ts-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--active);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--accent); flex-shrink: 0;
  }
  .ts-avatar-img { object-fit: cover; background: none; }
  .ts-member-name { flex: 1; font-size: 13px; }
  .ts-member-role { font-size: 11px; color: var(--text-muted); }
  .ts-grant-tag {
    padding: 1px 7px; border-radius: 8px; font-size: 10px;
    background: color-mix(in srgb, var(--accent2) 15%, transparent);
    color: var(--accent2);
  }
  .ts-member-actions { display: flex; gap: 4px; }
  .ts-icon-btn {
    padding: 3px 5px; border-radius: 4px; border: none; background: transparent;
    color: var(--text-muted); cursor: pointer; transition: background .1s;
  }
  .ts-icon-btn:hover { background: var(--hover); color: var(--text); }

  /* ── List widget ────────────────────────────────────────── */
  .ts-list-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
  }
  .ts-list-item:last-child { border-bottom: none; }
  .ts-list-item:hover { background: var(--hover); }
  .ts-list-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .ts-list-title { flex: 1; }
  .ts-list-meta { font-size: 11px; color: var(--text-muted); }

  /* ── Quick actions widget ───────────────────────────────── */
  .ts-quick-actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; }
  .ts-qa-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer;
    font-size: 12px; transition: background .12s; min-width: 90px;
  }
  .ts-qa-btn:hover { background: var(--hover); border-color: var(--accent); color: var(--accent); }
  .ts-qa-btn svg { flex-shrink: 0; }

  /* ── Empty state ────────────────────────────────────────── */
  .ts-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; gap: 8px; color: var(--text-muted);
  }
  .ts-empty svg { opacity: .35; }
  .ts-empty p { font-size: 12px; }

  /* ── Dialog ─────────────────────────────────────────────── */
  .ts-dialog-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 900; align-items: center; justify-content: center;
  }
  .ts-dialog-overlay.open { display: flex; }
  .ts-dialog {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; min-width: 340px; max-width: 480px; width: 90%;
    display: flex; flex-direction: column; gap: 14px;
  }
  .ts-dialog h3 { font-size: 14px; font-weight: 600; }
  .ts-field { display: flex; flex-direction: column; gap: 5px; }
  .ts-field label { font-size: 11px; color: var(--text-muted); }
  .ts-field input, .ts-field select {
    padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text); font-size: 13px; outline: none;
  }
  .ts-field input:focus, .ts-field select:focus { border-color: var(--accent); }
  .ts-dialog-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>
<div class="ts-layout">
  <!-- 左侧：组织树 -->
  <div class="ts-tree-panel">
    <div class="ts-panel-hdr">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      团队
    </div>
    <div class="ts-tree-body" id="tsTeamTree"></div>
    <div class="ts-tree-add" id="tsAddTeam" style="display:none">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建子团队
    </div>
  </div>

  <!-- 右侧：主区域 -->
  <div class="ts-main">
    <div class="ts-topbar">
      <div class="ts-team-name" id="tsTeamName">选择团队</div>
      <div class="ts-badge admin" id="tsAdminBadge" style="display:none">team_admin</div>
      <div class="ts-badge" id="tsMemberCountBadge" style="display:none"></div>
      <button class="ts-btn" id="tsBtnAddMember" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加成员
      </button>
      <button class="ts-btn" id="tsBtnTransfer" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        转让 admin
      </button>
      <button class="ts-btn danger" id="tsBtnDelete" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        删除团队
      </button>
    </div>

    <div class="ts-content" id="tsContent">
      <div class="ts-empty" id="tsEmptyHint">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <p>从左侧选择团队</p>
      </div>
      <div id="tsWidgets" style="display:none">
        <div class="ts-grid">
          <!-- 成员列表 widget -->
          <div class="ts-widget wide">
            <div class="ts-widget-hdr">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <span class="ts-w-title">团队成员</span>
              <span class="ts-w-count" id="tsMemberCount"></span>
            </div>
            <div class="ts-widget-body">
              <div class="ts-member-list" id="tsMemberList"></div>
            </div>
          </div>

          <!-- 团队清单 widget -->
          <div class="ts-widget">
            <div class="ts-widget-hdr">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              <span class="ts-w-title">团队清单</span>
              <span class="ts-w-count" id="tsListCount"></span>
            </div>
            <div class="ts-widget-body">
              <div id="tsTeamLists"></div>
            </div>
          </div>

          <!-- 快捷操作 widget -->
          <div class="ts-widget" id="tsQuickActionsWidget" style="display:none">
            <div class="ts-widget-hdr">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span class="ts-w-title">管理操作</span>
            </div>
            <div class="ts-widget-body">
              <div class="ts-quick-actions">
                <button class="ts-qa-btn" id="tsQaBtnAddMember">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                  添加成员
                </button>
                <button class="ts-qa-btn" id="tsQaBtnCreateSub">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                  新建子团队
                </button>
                <button class="ts-qa-btn" id="tsQaBtnTransfer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                  转让 admin
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 添加成员对话框 -->
<div class="ts-dialog-overlay" id="dlgAddMember">
  <div class="ts-dialog">
    <h3>添加成员</h3>
    <div class="ts-field">
      <label>用户 GID（支持部分匹配）</label>
      <input type="text" id="dlgMemberSearch" placeholder="输入姓名或 GID 搜索…">
    </div>
    <div id="dlgMemberResults" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:4px 0"></div>
    <div class="ts-field">
      <label>角色</label>
      <select id="dlgMemberRole">
        <option value="member">成员 (member)</option>
        <option value="team_admin">团队管理员 (team_admin grant)</option>
      </select>
    </div>
    <div class="ts-dialog-footer">
      <button class="ts-btn" id="dlgMemberCancel">取消</button>
      <button class="ts-btn primary" id="dlgMemberConfirm">添加</button>
    </div>
  </div>
</div>

<!-- 新建子团队对话框 -->
<div class="ts-dialog-overlay" id="dlgCreateSub">
  <div class="ts-dialog">
    <h3>新建子团队</h3>
    <div class="ts-field">
      <label>团队名称</label>
      <input type="text" id="dlgSubTeamName" placeholder="例：工艺规划组">
    </div>
    <div class="ts-dialog-footer">
      <button class="ts-btn" id="dlgSubCancel">取消</button>
      <button class="ts-btn primary" id="dlgSubConfirm">创建</button>
    </div>
  </div>
</div>

<!-- 转让 admin 对话框 -->
<div class="ts-dialog-overlay" id="dlgTransfer">
  <div class="ts-dialog">
    <h3>转让 team_admin 权限</h3>
    <div class="ts-field">
      <label>转让给（团队成员）</label>
      <select id="dlgTransferTarget"></select>
    </div>
    <div class="ts-dialog-footer">
      <button class="ts-btn" id="dlgTransferCancel">取消</button>
      <button class="ts-btn primary" id="dlgTransferConfirm">确认转让</button>
    </div>
  </div>
</div>

<script src="team_space.js"></script>
</body>
</html>
