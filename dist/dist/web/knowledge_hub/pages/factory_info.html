<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>现场信息</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #1e1e2e; --bg2:    #181825; --bg3:   #313244; --bg4: #45475a;
  --text:    #cdd6f4; --muted:  #6c7086; --accent:#89b4fa;
  --border:  #313244; --hover:  #2a2a3d; --danger:#f38ba8;
  --success: #a6e3a1; --warn:   #f9e2af;
}
[data-theme="light"] {
  --bg:      #eff1f5; --bg2:    #e6e9ef; --bg3:   #ccd0da; --bg4: #bcc0cc;
  --text:    #4c4f69; --muted:  #9ca0b0; --accent:#1e66f5;
  --border:  #ccd0da; --hover:  #e0e4ef; --danger:#d20f39;
  --success: #40a02b; --warn:   #df8e1d;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

.md-root { display: flex; height: 100%; }

.md-nav {
  width: 150px; flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 12px 0;
}
.md-nav-title {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase; padding: 0 14px 10px;
}
.md-nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; cursor: pointer;
  color: var(--muted); font-size: 12px; font-weight: 500;
  border-left: 3px solid transparent;
  transition: color .15s, background .15s; user-select: none;
}
.md-nav-item svg { flex-shrink: 0; opacity: .7; }
.md-nav-item:hover { background: var(--hover); color: var(--text); }
.md-nav-item.active {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent); border-left-color: var(--accent);
}
.md-nav-item.active svg { opacity: 1; }

.md-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.md-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap;
}
.md-toolbar-title { font-size: 14px; font-weight: 600; }
.md-toolbar-desc { font-size: 11px; color: var(--muted); margin-left: 6px; }
.md-search {
  height: 28px; padding: 0 10px; width: 200px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 12px; outline: none; margin-left: auto;
}
.md-search:focus { border-color: var(--accent); }
.md-btn {
  height: 28px; padding: 0 12px; border-radius: 4px; border: none; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.md-btn-primary { background: var(--accent); color: #1e1e2e; font-weight: 600; }
.md-btn-primary:hover { filter: brightness(1.1); }
.md-btn-secondary { background: var(--bg3); color: var(--text); }
.md-btn-secondary:hover { background: var(--bg4); }
.md-stat { color: var(--muted); font-size: 11px; }

.md-table-wrap { flex: 1; overflow: auto; }
table { min-width: 100%; border-collapse: collapse; white-space: nowrap; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--bg2); border-bottom: 2px solid var(--border);
  padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:hover { background: var(--hover); }
tbody tr:hover .row-actions { opacity: 1; }
td { padding: 8px 12px; white-space: nowrap; vertical-align: middle; }
.row-actions { opacity: 0; display: flex; gap: 2px; justify-content: flex-end; transition: opacity .15s; }
.act-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 4px; border: none; cursor: pointer;
  background: transparent; color: var(--muted);
}
.act-btn:hover { background: var(--bg3); color: var(--text); }
.act-btn.del:hover { color: var(--danger); }
.md-empty { display: flex; align-items: center; justify-content: center;
  height: 100px; color: var(--muted); font-size: 12px; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.badge-in_use      { background: color-mix(in srgb,var(--success)18%,transparent); color:var(--success);}
.badge-maintenance { background: color-mix(in srgb,var(--warn) 18%,transparent);   color:var(--warn);   }
.badge-scrapped    { background: color-mix(in srgb,var(--danger)18%,transparent);  color:var(--danger); }

.md-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.md-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 22px 24px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.md-modal h3 { font-size: 15px; font-weight: 600; }
.md-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.md-field { display: flex; flex-direction: column; gap: 4px; }
.md-field.full { grid-column: 1 / -1; }
.md-field label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.md-field input, .md-field select, .md-field textarea {
  height: 32px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 13px; outline: none;
}
.md-field textarea { height: 56px; padding: 6px 10px; resize: vertical; }
.md-field input:focus, .md-field select:focus, .md-field textarea:focus { border-color: var(--accent); }
.md-modal-footer { display: flex; justify-content: flex-end; gap: 8px; }
.md-btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.md-btn-ghost:hover { background: var(--hover); }
.md-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

.import-preview { max-height: 300px; overflow: auto; margin-top: 8px; }
.import-preview table { font-size: 11px; }
.import-preview td, .import-preview th { padding: 4px 8px; }
.import-stat { font-size: 12px; color: var(--muted); margin-top: 4px; }

.md-toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg3); color: var(--text); padding: 8px 16px;
  border-radius: 6px; font-size: 13px; z-index: 200; pointer-events: none;
  animation: fade-in .2s ease;
}
@keyframes fade-in { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }

.md-filter-bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  flex-shrink: 0; min-height: 36px;
}
.md-filter-bar:empty { display: none; }
.md-filter-chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px; border-radius: 12px; font-size: 11px;
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  cursor: default; white-space: nowrap;
}
.md-filter-chip .chip-remove {
  cursor: pointer; opacity: .6; margin-left: 2px; font-size: 13px; line-height: 1;
}
.md-filter-chip .chip-remove:hover { opacity: 1; color: var(--danger); }
.md-filter-select {
  height: 24px; padding: 0 6px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-size: 11px; outline: none;
}
.md-filter-select:focus { border-color: var(--accent); }
.md-filter-label { font-size: 11px; color: var(--muted); }

.md-pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px; background: var(--bg2); border-top: 1px solid var(--border);
  flex-shrink: 0; font-size: 12px; color: var(--muted);
}
.md-pagination-info { display: flex; align-items: center; gap: 8px; }
.md-pagination-controls { display: flex; align-items: center; gap: 4px; }
.md-page-btn {
  width: 28px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.md-page-btn:hover:not(:disabled) { background: var(--bg3); }
.md-page-btn:disabled { opacity: .4; cursor: default; }
.md-page-select {
  height: 24px; padding: 0 4px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-size: 11px; outline: none;
}
</style>
</head>
<body>
<div class="md-root">

  <nav class="md-nav">
    <div class="md-nav-title">现场信息</div>
    <div class="md-nav-item active" data-section="tools">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
      </svg>
      工具
    </div>
    <div class="md-nav-item" data-section="equipments">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12l-2-4z"/>
        <circle cx="12" cy="14" r="3"/>
      </svg>
      设备
    </div>
    <div class="md-nav-item" data-section="fixtures">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      工装
    </div>
    <div class="md-nav-item" data-section="sections">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      工段
    </div>
    <div class="md-nav-item" data-section="stations">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      工位
    </div>
  </nav>

  <div class="md-content">
    <div class="md-toolbar">
      <span class="md-toolbar-title" id="mdTitle">工具</span>
      <span class="md-toolbar-desc" id="mdDesc">工厂实物工具资产</span>
      <input class="md-search" id="mdSearch" type="text" placeholder="搜索…">
      <span class="md-stat" id="mdStat"></span>
      <button class="md-btn md-btn-secondary" id="mdImportBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导入
      </button>
      <button class="md-btn md-btn-primary" id="mdAddBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建
      </button>
    </div>

    <div class="md-filter-bar" id="mdFilterBar"></div>

    <div class="md-table-wrap" id="mdTableWrap">
      <div class="md-empty" id="mdEmpty" style="display:none">暂无数据</div>
    </div>

    <div class="md-pagination" id="mdPagination">
      <div class="md-pagination-info">
        <span id="pgInfo">共 0 条</span>
        <span class="md-filter-label">每页</span>
        <select class="md-page-select" id="pgSize">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
          <option value="0">全部</option>
        </select>
      </div>
      <div class="md-pagination-controls">
        <button class="md-page-btn" id="pgFirst" title="首页">«</button>
        <button class="md-page-btn" id="pgPrev" title="上页">‹</button>
        <span id="pgCurrent" style="margin:0 6px;">1 / 1</span>
        <button class="md-page-btn" id="pgNext" title="下页">›</button>
        <button class="md-page-btn" id="pgLast" title="末页">»</button>
      </div>
    </div>
  </div>

</div>

<div class="md-overlay" id="mdModal" style="display:none">
  <div class="md-modal">
    <h3 id="mdModalTitle">新建</h3>
    <div id="mdFormBody"></div>
    <hr class="md-divider">
    <div class="md-modal-footer">
      <button class="md-btn md-btn-ghost" id="mdModalCancel">取消</button>
      <button class="md-btn md-btn-primary" id="mdModalOk">保存</button>
    </div>
  </div>
</div>

<div class="md-overlay" id="importModal" style="display:none">
  <div class="md-modal" style="width:600px;">
    <h3 id="importModalTitle">导入数据</h3>
    <div id="importBody">
      <div class="md-field full">
        <label>选择文件（.xlsx 或 .csv）</label>
        <input id="importFileInput" type="file" accept=".xlsx,.csv"
          style="height:auto;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);">
      </div>
      <div id="importPreviewArea"></div>
    </div>
    <hr class="md-divider">
    <div class="md-modal-footer">
      <button class="md-btn md-btn-ghost" id="importCancel">取消</button>
      <button class="md-btn md-btn-primary" id="importConfirm" disabled>确认导入</button>
    </div>
  </div>
</div>

<script>
'use strict';

function _cf() {
  try {
    let w = window;
    for (let i = 0; i < 6; i++) {
      if (w._cloudFetch) return w._cloudFetch;
      if (w.parent === w) break;
      w = w.parent;
    }
  } catch (_) {}
  return null;
}
function _esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _toast(msg, ms = 2500) {
  const el = document.createElement('div');
  el.className = 'md-toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function _val(id) { return document.getElementById(id)?.value ?? ''; }

const STATUS_LABELS = { in_use:'使用中', maintenance:'维修中', scrapped:'已报废' };

function _uniqueVals(rows, key) {
  const set = new Set();
  rows.forEach(r => { const v = r[key]; if (v && String(v).trim()) set.add(String(v).trim()); });
  return [...set].sort();
}

// ══════════════════════════════════════════════════════════════════
// Section 定义
// ══════════════════════════════════════════════════════════════════

const SECTIONS = {

  // ── 工具资产 ───────────────────────────────────────────────────
  tools: {
    title: '工具', desc: '工厂实物工具资产',
    addLabel: '登记工具',

    filters: [
      { key:'status', label:'状态', options: () => ['in_use','maintenance','scrapped'], labelMap: STATUS_LABELS },
    ],

    async load(cf) {
      const r = await cf('/api/factory/tools');
      return r?.data || [];
    },

    cols: [
      { label:'资产编号', key:'asset_no',      width:'25%', render: r => `<strong>${_esc(r.asset_no||'—')}</strong>` },
      { label:'模板GID',  key:'template_gid',  width:'20%', render: r => _esc(r.template_gid||'—') },
      { label:'状态',     key:'status',        width:'12%',
        render: r => `<span class="badge badge-${r.status||'in_use'}">${_esc(STATUS_LABELS[r.status]||r.status)}</span>` },
      { label:'更新时间', key:'updated_at',    width:'18%', render: r => _esc(r.updated_at||'—') },
    ],

    importFields: ['asset_no', 'template_gid'],
    importLabels: { asset_no:'资产编号', template_gid:'模板GID' },

    formHtml() {
      return `<div class="md-form-grid">
        <div class="md-field full">
          <label>资产编号 *</label>
          <input id="fAssetNo" type="text" placeholder="唯一资产编号">
        </div>
        <div class="md-field full">
          <label>模板 GID（可选）</label>
          <input id="fTemplateGid" type="text" placeholder="关联的工具模板 GID">
        </div>
      </div>`;
    },

    fillForm(r) {
      document.getElementById('fAssetNo').value = r?.asset_no || '';
      document.getElementById('fTemplateGid').value = r?.template_gid || '';
    },

    readForm() {
      const no = _val('fAssetNo').trim();
      if (!no) { _toast('资产编号不能为空'); return null; }
      return { asset_no: no, template_gid: _val('fTemplateGid').trim() || null };
    },

    async create(cf, body) { return cf('/api/factory/tools', { method:'POST', body: JSON.stringify(body) }); },
    async update(cf, gid, body) { return cf(`/api/factory/tools/${gid}`, { method:'PATCH', body: JSON.stringify(body) }); },
    async remove(cf, gid) { return cf(`/api/factory/tools/${gid}`, { method:'DELETE' }); },

    buildImportBody(row) {
      const raw = row._raw || row;
      return { asset_no: row.asset_no || raw['资产编号'] || '', template_gid: row.template_gid || raw['模板GID'] || null };
    },
    importRequiredFn(body) { return !!body.asset_no; },
    async importOne(cf, body) { return cf('/api/factory/tools', { method:'POST', body: JSON.stringify(body) }); },

    searchFn(r, q) {
      return (r.asset_no||'').toLowerCase().includes(q)
          || (r.template_gid||'').toLowerCase().includes(q);
    },
  },

  // ── 设备资产 ───────────────────────────────────────────────────
  equipments: {
    title: '设备', desc: '工厂实物设备资产',
    addLabel: '登记设备',

    filters: [
      { key:'status', label:'状态', options: () => ['in_use','maintenance','scrapped'], labelMap: STATUS_LABELS },
    ],

    async load(cf) {
      const r = await cf('/api/factory/equipments');
      return r?.data || [];
    },

    cols: [
      { label:'资产编号', key:'asset_no',      width:'25%', render: r => `<strong>${_esc(r.asset_no||'—')}</strong>` },
      { label:'模板GID',  key:'template_gid',  width:'20%', render: r => _esc(r.template_gid||'—') },
      { label:'状态',     key:'status',        width:'12%',
        render: r => `<span class="badge badge-${r.status||'in_use'}">${_esc(STATUS_LABELS[r.status]||r.status)}</span>` },
      { label:'更新时间', key:'updated_at',    width:'18%', render: r => _esc(r.updated_at||'—') },
    ],

    importFields: ['asset_no', 'template_gid'],
    importLabels: { asset_no:'资产编号', template_gid:'模板GID' },

    formHtml() {
      return `<div class="md-form-grid">
        <div class="md-field full">
          <label>资产编号 *</label>
          <input id="fAssetNo" type="text" placeholder="唯一资产编号">
        </div>
        <div class="md-field full">
          <label>模板 GID（可选）</label>
          <input id="fTemplateGid" type="text" placeholder="关联的设备模板 GID">
        </div>
      </div>`;
    },

    fillForm(r) {
      document.getElementById('fAssetNo').value = r?.asset_no || '';
      document.getElementById('fTemplateGid').value = r?.template_gid || '';
    },

    readForm() {
      const no = _val('fAssetNo').trim();
      if (!no) { _toast('资产编号不能为空'); return null; }
      return { asset_no: no, template_gid: _val('fTemplateGid').trim() || null };
    },

    async create(cf, body) { return cf('/api/factory/equipments', { method:'POST', body: JSON.stringify(body) }); },
    async update(cf, gid, body) { return cf(`/api/factory/equipments/${gid}`, { method:'PATCH', body: JSON.stringify(body) }); },
    async remove(cf, gid) { return cf(`/api/factory/equipments/${gid}`, { method:'DELETE' }); },

    buildImportBody(row) {
      const raw = row._raw || row;

// ══════════════════════════════════════════════════════════════════
// 状态 & 运行时
// ══════════════════════════════════════════════════════════════════
let _section = 'tools';
let _rows    = [];
let _editGid = null;
let _query   = '';
let _importParsedRows = [];
let _filters = {};
let _page    = 1;
let _pageSize = 100;
let _sortKey = '';
let _sortDir = 'asc';

// ── 加载 ─────────────────────────────────────────────────────────
async function _load() {
  const cf = _cf();
  const sec = SECTIONS[_section];
  if (!cf || !sec) { _rows = []; _renderFilterBar(); _render(); return; }
  try {
    _rows = await sec.load(cf);
    _renderFilterBar();
    _render();
  } catch (e) {
    _toast('加载失败：' + (e.message || e));
  }
}

// ── 渲染表格 ─────────────────────────────────────────────────────
function _render() {
  const sec    = SECTIONS[_section];
  const wrap   = document.getElementById('mdTableWrap');
  const empty  = document.getElementById('mdEmpty');
  const stat   = document.getElementById('mdStat');

  wrap.querySelectorAll('table').forEach(t => t.remove());
  empty.style.display = 'none';

  // 1) 文本搜索
  let filtered = _query
    ? _rows.filter(r => sec.searchFn(r, _query))
    : _rows;

  // 2) 筛选条件
  Object.entries(_filters).forEach(([key, val]) => {
    if (!val) return;
    filtered = filtered.filter(r => String(r[key] || '') === val);
  });

  const totalFiltered = filtered.length;
  stat.textContent = `共 ${_rows.length} 条` + (totalFiltered !== _rows.length ? `，筛选 ${totalFiltered} 条` : '');

  if (!filtered.length) { empty.style.display = ''; _renderPagination(0, 0); return; }

  // 3) 排序
  if (_sortKey) {
    filtered = [...filtered].sort((a, b) => {
      const va = String(a[_sortKey] || '').toLowerCase();
      const vb = String(b[_sortKey] || '').toLowerCase();
      const cmp = va.localeCompare(vb, 'zh-Hans');
      return _sortDir === 'asc' ? cmp : -cmp;
    });
  }

  // 4) 分页
  const isSearching = !!_query;
  const effectivePageSize = isSearching ? 0 : _pageSize;
  let pageRows;
  if (effectivePageSize > 0) {
    const totalPages = Math.ceil(totalFiltered / effectivePageSize);
    if (_page > totalPages) _page = totalPages;
    if (_page < 1) _page = 1;
    const start = (_page - 1) * effectivePageSize;
    pageRows = filtered.slice(start, start + effectivePageSize);
    _renderPagination(totalFiltered, totalPages);
  } else {
    _page = 1;
    pageRows = filtered;
    _renderPagination(totalFiltered, 1);
  }

  const table = document.createElement('table');

  // 表头（可点击排序）
  const thead = document.createElement('thead');
  const htr   = document.createElement('tr');
  sec.cols.forEach(c => {
    const th = document.createElement('th');
    th.style.width = c.width || 'auto';
    if (c.align) th.style.textAlign = c.align;
    th.style.cursor = 'pointer';
    th.style.userSelect = 'none';
    const arrow = (_sortKey === c.key) ? (_sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    th.textContent = c.label + arrow;
    th.addEventListener('click', () => {
      if (_sortKey === c.key) { _sortDir = _sortDir === 'asc' ? 'desc' : 'asc'; }
      else { _sortKey = c.key; _sortDir = 'asc'; }
      _render();
    });
    htr.appendChild(th);
  });
  const thAct = document.createElement('th');
  thAct.style.width = '72px'; thAct.style.textAlign = 'right';
  thAct.textContent = '操作';
  htr.appendChild(thAct);
  thead.appendChild(htr); table.appendChild(thead);

  // 表体
  const tbody = document.createElement('tbody');
  pageRows.forEach(row => {
    const tr = document.createElement('tr');
    sec.cols.forEach(c => {
      const td = document.createElement('td');
      if (c.align) td.style.textAlign = c.align;
      td.innerHTML = c.render(row);
      tr.appendChild(td);
    });
    const tdAct = document.createElement('td');
    tdAct.innerHTML = `<div class="row-actions">
      <button class="act-btn del del-btn" title="删除" data-gid="${_esc(row.gid)}" data-name="${_esc(row.asset_no||row.name||row.code||row.gid)}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>`;
    tr.appendChild(tdAct);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.insertBefore(table, empty);

  // 事件
  tbody.querySelectorAll('.del-btn').forEach(btn =>
    btn.addEventListener('click', () => _deleteRow(btn.dataset.gid, btn.dataset.name))
  );
}

// ── 分页渲染 ─────────────────────────────────────────────────────
function _renderPagination(total, totalPages) {
  const info = document.getElementById('pgInfo');
  const cur  = document.getElementById('pgCurrent');
  const first = document.getElementById('pgFirst');
  const prev  = document.getElementById('pgPrev');
  const next  = document.getElementById('pgNext');
  const last  = document.getElementById('pgLast');

  if (total === 0) {
    info.textContent = '共 0 条';
    cur.textContent = '0 / 0';
    first.disabled = prev.disabled = next.disabled = last.disabled = true;
    return;
  }

  const isSearching = !!_query;
  if (isSearching) {
    info.textContent = `搜索结果 ${total} 条（不分页）`;
    cur.textContent = '—';
    first.disabled = prev.disabled = next.disabled = last.disabled = true;
  } else {
    const ps = _pageSize > 0 ? _pageSize : total;
    const startIdx = (_page - 1) * ps + 1;
    const endIdx = Math.min(_page * ps, total);
    info.textContent = `第 ${startIdx}-${endIdx} 条 / 共 ${total} 条`;
    cur.textContent = `${_page} / ${totalPages}`;
    first.disabled = prev.disabled = (_page <= 1);
    next.disabled = last.disabled = (_page >= totalPages);
  }
}

// ── 筛选栏渲染 ───────────────────────────────────────────────────
function _renderFilterBar() {
  const bar = document.getElementById('mdFilterBar');
  const sec = SECTIONS[_section];
  const filterDefs = sec.filters || [];

  if (!filterDefs.length) { bar.innerHTML = ''; return; }

  let html = '';
  filterDefs.forEach(fd => {
    const opts = fd.options(_rows);
    const currentVal = _filters[fd.key] || '';
    html += `<span class="md-filter-label">${_esc(fd.label)}:</span>`;
    html += `<select class="md-filter-select" data-filter-key="${fd.key}">`;
    html += `<option value="">全部</option>`;
    opts.forEach(v => {
      const label = fd.labelMap ? (fd.labelMap[v] || v) : v;
      html += `<option value="${_esc(v)}" ${v === currentVal ? 'selected' : ''}>${_esc(label)}</option>`;
    });
    html += '</select>';
  });

  Object.entries(_filters).forEach(([key, val]) => {
    if (!val) return;
    const fd = filterDefs.find(f => f.key === key);
    const label = fd?.labelMap ? (fd.labelMap[val] || val) : val;
    html += `<span class="md-filter-chip">${_esc(fd?.label || key)}: ${_esc(label)}<span class="chip-remove" data-filter-key="${key}">×</span></span>`;
  });

  bar.innerHTML = html;

  bar.querySelectorAll('.md-filter-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const key = sel.dataset.filterKey;
      if (sel.value) _filters[key] = sel.value;
      else delete _filters[key];
      _page = 1;
      _renderFilterBar();
      _render();
    });
  });
  bar.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      delete _filters[btn.dataset.filterKey];
      _page = 1;
      _renderFilterBar();
      _render();
    });
  });
}

// ── 切换分区 ─────────────────────────────────────────────────────
function _switchSection(key) {
  _section = key;
  _query   = '';
  _filters = {};
  _page    = 1;
  _sortKey = '';
  _sortDir = 'asc';
  document.getElementById('mdSearch').value = '';
  document.querySelectorAll('.md-nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.section === key)
  );
  const sec = SECTIONS[key];
  document.getElementById('mdTitle').textContent = sec.title;
  document.getElementById('mdDesc').textContent  = sec.desc;

}

async function _saveModal() {

// ── 导入 ─────────────────────────────────────────────────────────
function _openImportModal() {
  document.getElementById('importPreviewArea').innerHTML = '';
  document.getElementById('importFileInput').value = '';
  document.getElementById('importConfirm').disabled = true;
  _importParsedRows = [];
  document.getElementById('importModal').style.display = '';
}
function _closeImportModal() { document.getElementById('importModal').style.display = 'none'; }

async function _handleFileSelect(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') { await _parseCSV(file); }
  else if (ext === 'xlsx') { await _parseXLSX(file); }
  else { _toast('仅支持 .xlsx 和 .csv 文件'); }
}

async function _parseCSV(file) {
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { _toast('CSV 文件为空或只有表头'); return; }
  const headers = _splitCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = _splitCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h.trim()] = vals[idx]?.trim() || ''; });
    rows.push(obj);
  }
  _showImportPreview(headers, rows);
}

function _splitCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      result.push(current); current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

async function _parseXLSX(file) {
  const cf = _cf();
  if (!cf) { _toast('未连接云端，无法解析 Excel'); return; }
  const buf = await file.arrayBuffer();
  const b64 = _arrayBufferToBase64(buf);
  try {
    const res = await cf('/api/import-export/import/parse-excel', {
      method: 'POST',
      body: JSON.stringify({ file_b64: b64, filename: file.name }),
    });
    if (!res?.data?.headers?.length) { _toast('Excel 解析无数据'); return; }
    const headers = res.data.headers;
    const rows = (res.data.rows || []).map(arr => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = arr[i] ?? ''; });
      return obj;
    });
    if (!rows.length) { _toast('Excel 解析无有效数据行'); return; }
    _showImportPreview(headers, rows);
  } catch (e) {
    _toast('解析失败：' + (e.message || e));
  }
}

function _arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function _showImportPreview(headers, rows) {
  const sec = SECTIONS[_section];
  const fields = sec.importFields;
  const labels = sec.importLabels;

  const aliasMap = {};
  fields.forEach(f => {
    aliasMap[f.toLowerCase()] = f;
    const lbl = (labels[f] || '').toLowerCase();
    if (lbl) aliasMap[lbl] = f;
  });
  const EXTRA_ALIASES = {
    '资产编号': 'asset_no', '模板gid': 'template_gid',
    '名称': 'name', '编号': 'code', '工厂gid': 'factory_gid',
    '工段gid': 'factory_section_gid', '排序': 'sort_order', '颜色': 'color',
    '节拍(s)': 'takt_time', '节拍': 'takt_time', '高度(mm)': 'height_mm', '高度': 'height_mm',
  };
  Object.entries(EXTRA_ALIASES).forEach(([k, v]) => { aliasMap[k.toLowerCase()] = v; });

  const mapping = {};
  headers.forEach(h => {
    const hLower = h.trim().toLowerCase();
    const fk = aliasMap[hLower];
    if (fk && !mapping[fk]) mapping[fk] = h;
  });

  _importParsedRows = rows.map(r => {
    const obj = { _raw: r };
    fields.forEach(f => {
      const hdr = mapping[f];
      obj[f] = hdr ? String(r[hdr] ?? '').trim() : '';
    });
    return obj;
  }).filter(r => fields.some(f => r[f] && String(r[f]).trim()));

  const area = document.getElementById('importPreviewArea');
  const mappedFields = fields.filter(f => mapping[f]);
  const unmappedFields = fields.filter(f => !mapping[f]);

  if (!_importParsedRows.length) {
    let hint = '<div class="import-stat" style="color:var(--danger)">';
    if (!mappedFields.length) {
      hint += '列头无法匹配任何字段。请确保 Excel 列头包含：' + fields.map(f => labels[f] || f).join('、');
    } else {
      hint += '所有行为空（已映射字段无有效数据）。';
    }
    hint += '</div>';
    area.innerHTML = hint;
    document.getElementById('importConfirm').disabled = true;
    return;
  }

  let html = '';
  if (unmappedFields.length && mappedFields.length) {
    html += `<div class="import-stat">已映射 ${mappedFields.length}/${fields.length} 个字段` +
      `（未映射：${unmappedFields.map(f => labels[f]||f).join('、')}）</div>`;
  }
  html += `<div class="import-stat">已识别 <strong>${_importParsedRows.length}</strong> 条有效记录，预览前 10 条：</div>`;
  html += '<div class="import-preview"><table><thead><tr>';
  mappedFields.forEach(f => { html += `<th>${_esc(labels[f]||f)}</th>`; });
  html += '</tr></thead><tbody>';
  _importParsedRows.slice(0, 10).forEach(r => {
    html += '<tr>';
    mappedFields.forEach(f => { html += `<td>${_esc(String(r[f]||''))}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  area.innerHTML = html;
  document.getElementById('importConfirm').disabled = false;
}

async function _doImport() {
  const cf = _cf();
  const sec = SECTIONS[_section];
  if (!cf || !_importParsedRows.length) return;

  document.getElementById('importConfirm').disabled = true;
  document.getElementById('importConfirm').textContent = '导入中…';

  let ok = 0, fail = 0, lastErr = '';
  for (const row of _importParsedRows) {
    const body = sec.buildImportBody(row);
    const requiredCheck = sec.importRequiredFn
      ? sec.importRequiredFn(body)
      : !!body[sec.importFields[0]];
    if (!requiredCheck) { fail++; lastErr = '必填字段为空'; continue; }
    try {
      await sec.importOne(cf, body);
      ok++;
    } catch (e) {
      fail++;
      lastErr = e.message || '未知错误';
    }
  }

  let msg = `导入完成：成功 ${ok} 条`;
  if (fail) msg += `，失败 ${fail} 条`;
  if (fail && lastErr) msg += `（${lastErr}）`;
  _toast(msg, 4000);
  _closeImportModal();
  document.getElementById('importConfirm').textContent = '确认导入';
  document.getElementById('importConfirm').disabled = false;
  await _load();
}

// ── 事件绑定 ─────────────────────────────────────────────────────
document.querySelectorAll('.md-nav-item').forEach(el =>
  el.addEventListener('click', () => _switchSection(el.dataset.section))
);
document.getElementById('mdAddBtn').addEventListener('click', () => _openModal(null));
document.getElementById('mdImportBtn').addEventListener('click', _openImportModal);
document.getElementById('mdModalCancel').addEventListener('click', _closeModal);
document.getElementById('mdModalOk').addEventListener('click', _saveModal);
document.getElementById('mdModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) _closeModal();
});
document.getElementById('mdSearch').addEventListener('input', e => {
  _query = e.target.value.trim().toLowerCase();
  _page = 1;
  _render();
});

document.getElementById('importCancel').addEventListener('click', _closeImportModal);
document.getElementById('importModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) _closeImportModal();
});
document.getElementById('importConfirm').addEventListener('click', _doImport);
document.getElementById('importFileInput').addEventListener('change', _handleFileSelect);

// 分页事件
document.getElementById('pgFirst').addEventListener('click', () => { _page = 1; _render(); });
document.getElementById('pgPrev').addEventListener('click', () => { if (_page > 1) { _page--; _render(); } });
document.getElementById('pgNext').addEventListener('click', () => { _page++; _render(); });
document.getElementById('pgLast').addEventListener('click', () => {
  const total = _rows.length;
  if (_pageSize > 0) _page = Math.ceil(total / _pageSize);
  _render();
});
document.getElementById('pgSize').addEventListener('change', e => {
  _pageSize = parseInt(e.target.value) || 0;
  _page = 1;
  _render();
});

// 主题继承
try {
  const parentTheme = window.parent?.document?.documentElement?.getAttribute('data-theme');
  if (parentTheme) document.documentElement.setAttribute('data-theme', parentTheme);
} catch (_) {}

// 初始加载
_load();
</script>
