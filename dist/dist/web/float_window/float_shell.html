<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>悬浮窗</title>
  
  <link rel="stylesheet" href="/assets/float_shell-729582ba.css">
</head>
<body>
<script src="/web/icons.js"></script>

<!-- 标题栏（拖拽区域） -->
<div class="fs-titlebar" id="fsTitlebar">
  <div class="fs-drag" id="fsDragRegion">
    <svg class="fs-icon-grip" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="16" cy="8" r="1.5" fill="currentColor"/>
      <circle cx="8" cy="16" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/>
    </svg>
    <span class="fs-title" id="fsTitle">悬浮卡片</span>
  </div>
  <div class="fs-controls">
    <button class="fs-btn" id="fsBtnRefresh" title="刷新">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
    <button class="fs-btn" id="fsBtnConfig" title="配置卡片">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button class="fs-btn" id="fsBtnOrb" title="缩为悬浮球">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="fs-btn fs-btn-close" id="fsBtnClose" title="关闭">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- 内容区 iframe -->
<div class="fs-body" id="fsBody">
  <div class="fs-empty" id="fsEmpty">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="8" x2="13" y2="8"/><line x1="8" y1="16" x2="11" y2="16"/></svg>
    <p>点击右上角 <strong>配置</strong> 设置卡片内容</p>
  </div>
  <iframe id="fsIframe" class="fs-iframe" style="display:none" allowfullscreen></iframe>
</div>

<!-- 调整大小手柄 -->
<div class="fs-resize fs-resize-se" id="fsResizeSE"></div>
<div class="fs-resize fs-resize-s"  id="fsResizeS"></div>
<div class="fs-resize fs-resize-e"  id="fsResizeE"></div>

<!-- 配置弹窗 -->
<div class="fs-modal-overlay" id="fsConfigModal" style="display:none">
  <div class="fs-modal">
    <div class="fs-modal-hdr">
      配置卡片内容
      <span class="fs-modal-close" id="fsBtnConfigClose">✕</span>
    </div>
    <div class="fs-modal-body">
      <label>内容模式</label>
      <select id="fsConfigMode">
        <option value="row_detail">行详情（可编辑）</option>
        <option value="markdown_file">Markdown 文件</option>
        <option value="image_gallery">图片预览+标注</option>
        <option value="webview">网页浏览</option>
        <option value="pdf">PDF 预览</option>
        <option value="field_detail">字段详情展开</option>
        <option value="script">脚本文件编辑</option>
        <option value="text_image">图文双栏</option>
      </select>
      <!-- row_detail / field_detail 参数 -->
      <div id="fsRowParams">
        <label>数据类型</label>
        <select id="fsConfigItemType">
          <option value="task">任务</option>
          <option value="issue">问题</option>
          <option value="knowledge">知识条目</option>
          <option value="rule">规则</option>
        </select>
        <label>条目 GID</label>
        <input type="text" id="fsConfigGid" placeholder="留空则由触发卡片推送">
        <label>存储来源</label>
        <select id="fsConfigSource">
          <option value="local">本地</option>
          <option value="cloud">云端</option>
        </select>
      </div>
      <!-- field_detail 字段名 -->
      <div id="fsFieldParams" style="display:none">
        <label>字段 Key</label>
        <input type="text" id="fsConfigField" placeholder="如 description">
      </div>
      <!-- webview URL -->
      <div id="fsWebviewParams" style="display:none">
        <label>网页 URL</label>
        <input type="text" id="fsConfigUrl" placeholder="https://...">
      </div>
      <!-- markdown 文件路径 -->
      <div id="fsMdParams" style="display:none">
        <label>Markdown 文件路径</label>
        <input type="text" id="fsConfigMdPath" placeholder="留空使用内置编辑器">
      </div>
      <label>卡片标题</label>
      <input type="text" id="fsConfigTitle" placeholder="可选，留空自动">
    </div>
    <div class="fs-modal-footer">
      <button class="fs-modal-btn fs-modal-btn-primary" id="fsBtnConfigSave">应用</button>
      <button class="fs-modal-btn" id="fsBtnConfigCancel">取消</button>
    </div>
  </div>
</div>

<script src="float_shell.js"></script>
</body>
</html>
