    ${typeBadgeHtml}
    <div class="st-status-bar"><div class="st-status-fill" style="height:${pct}%"></div></div>
    <div class="st-card-body">
      <div class="st-card-row1">
        <svg class="st-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <use href="#ic-${n.canvas_icon || 'star'}"/>
        </svg>
        <span class="st-card-label">${n.title || '节点'}</span>
      </div>
      ${displayIdHtml}${ownerHtml}${datesHtml}<div class="st-card-row3"></div>
    </div>`;

  // Description tooltip on hover (700ms delay) — always show title; add desc if present
  {
    let _tipTimer = null;
    div.addEventListener('mouseenter', ev => {
      _tipTimer = setTimeout(() => {
        const tip = _getNodeDescTip();
        tip.innerHTML = '';
        const titleLine = document.createElement('div');
        titleLine.style.cssText = 'font-weight:600;margin-bottom:' + (n.description ? '5px' : '0');
        titleLine.textContent = n.title || '节点';
        tip.appendChild(titleLine);
        if (n.description) {
          const descLine = document.createElement('div');
          descLine.style.cssText = 'color:var(--subtext0);';
          descLine.textContent = n.description;
          tip.appendChild(descLine);
        }
        tip.style.display = 'block';
        const x = Math.min(ev.clientX + 14, window.innerWidth - 260);
        const y = Math.min(ev.clientY + 10, window.innerHeight - 80);
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
      }, 700);
    });
    div.addEventListener('mouseleave', () => {
      clearTimeout(_tipTimer);
      const tip = _getNodeDescTip();
      tip.style.display = 'none';
    });
    div.addEventListener('mousedown', () => {
      clearTimeout(_tipTimer);
      const tip = _getNodeDescTip();
      tip.style.display = 'none';
    });
  }

  // Children collapse badge — appended into row3
  const childCount = _getChildGids(n.gid).length;
  if (childCount > 0) {
    const isCollapsed = _collapsed.has(n.gid);
    const badge = document.createElement('span');
    badge.className = 'st-children-badge' + (isCollapsed ? ' collapsed' : '');
    badge.textContent = (isCollapsed ? '▶ ' : '▼ ') + childCount;
    badge.title = isCollapsed ? '点击展开子节点' : '点击折叠子节点';
    badge.addEventListener('mousedown', e => e.stopPropagation());
    badge.addEventListener('click', e => {
      e.stopPropagation();
      if (_collapsed.has(n.gid)) _collapsed.delete(n.gid); else _collapsed.add(n.gid);
      renderCanvas();
    });
    div.querySelector('.st-card-row3').appendChild(badge);
  }

  // Quick-add buttons (visible on hover)
  const btnChild = document.createElement('button');
  btnChild.className = 'st-node-qbtn st-qbtn-down';
  btnChild.title = '添加子节点（实线连接，层级关系）';
  btnChild.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  btnChild.addEventListener('mousedown', e => e.stopPropagation());
  btnChild.addEventListener('click', e => { e.stopPropagation(); quickAddSubTask(n.gid); });

  const btnNext = document.createElement('button');
  btnNext.className = 'st-node-qbtn st-qbtn-right';
  btnNext.title = '添加下一步节点（序列流向，前置关系由虚线手动连接）';
  btnNext.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  btnNext.addEventListener('mousedown', e => e.stopPropagation());
  btnNext.addEventListener('click', e => { e.stopPropagation(); quickAddNextStep(n.gid); });

  div.appendChild(btnChild);
  div.appendChild(btnNext);

  // Events
  div.addEventListener('mousedown', onNodeMouseDown);
  div.addEventListener('click', onNodeClick);
  return div;
}

function updateNodeEl(n) {
  const old = canvas.querySelector(`.st-node[data-gid="${n.gid}"]`);
  if (!old) return;
  const fresh = createNodeEl(n);
  canvas.insertBefore(fresh, old);
  old.remove();
}

// ── Quick-add: next-step / sub-task ──
const NEXT_STEP_X_GAP = 172; // horizontal distance to next-step node
const SIBLING_Y_GAP   = 74;  // vertical distance between sub-tasks (card height + gap)
const INDENT_X        = 52;  // horizontal indent per tree level (tree-diagram style)

// Cache depths for the current render pass (set in renderAllEdges)
let _depthsCache = {};
const NODE_PAD        = 24;  // minimum clearance between node edges

// Returns Set of all gids in the subtree rooted at rootGid (compose edges, inclusive of root)
function _getSubtreeGids(rootGid) {
  const result = new Set();
  const queue = [rootGid];
  while (queue.length) {
    const g = queue.shift();
    if (result.has(g)) continue;
    result.add(g);
    _getChildGids(g).forEach(c => queue.push(c));
  }
  return result;
}

// Returns Set of all ancestor gids of nodeGid (compose edges, exclusive of self)
function _getAncestorGids(nodeGid) {
  const result = new Set();
  const queue = _getParentGids(nodeGid).slice();
  while (queue.length) {
    const g = queue.shift();
    if (result.has(g)) continue;
    result.add(g);
    _getParentGids(g).forEach(p => queue.push(p));
  }
  return result;
}

// Shift all nodes NOT in excludeSet whose center Y >= fromY down by amount.
// Updates _nodes array, DOM elements, and persists to DB (parallel).
async function _shiftNodesDown(excludeSet, fromY, amount) {
  const toShift = _nodes.filter(n => !excludeSet.has(n.gid) && n.canvas_y >= fromY);
  if (!toShift.length) return;
  toShift.forEach(n => {
    n.canvas_y += amount;
    const el = canvas.querySelector(`.st-node[data-gid="${n.gid}"]`);
    if (el) el.style.top = n.canvas_y + 'px';
  });
  await Promise.all(toShift.map(n => _apiUpdateCanvas(n.gid, { canvas_x: n.canvas_x, canvas_y: n.canvas_y })));
}

// Find a non-overlapping position near (proposedX, proposedY) — used for next-step only
function _findNonOverlappingPos(proposedX, proposedY, excludeGid = null) {
  // Use card half-diagonal for circle-based overlap approximation
  const newR = Math.hypot(CARD_W, CARD_H) / 2;
  function _overlaps(x, y) {
    return _nodes.some(n => {
      if (n.gid === excludeGid) return false;
      const r = Math.hypot(CARD_W, CARD_H) / 2 + newR + NODE_PAD;
      const dx = n.canvas_x - x, dy = n.canvas_y - y;
      return dx * dx + dy * dy < r * r;
    });
  }
  if (!_overlaps(proposedX, proposedY)) return { x: proposedX, y: proposedY };
  const tryOrder = [
    [0, SIBLING_Y_GAP], [NEXT_STEP_X_GAP, 0], [0, SIBLING_Y_GAP * 2],
    [NEXT_STEP_X_GAP, SIBLING_Y_GAP], [-NEXT_STEP_X_GAP, 0],
    [0, -SIBLING_Y_GAP], [NEXT_STEP_X_GAP, SIBLING_Y_GAP * 2],
    [NEXT_STEP_X_GAP * 2, 0], [0, SIBLING_Y_GAP * 3],
  ];
  for (const [ox, oy] of tryOrder) {
    const tx = proposedX + ox, ty = proposedY + oy;
    if (!_overlaps(tx, ty)) return { x: tx, y: ty };
  }
  return { x: proposedX, y: proposedY + SIBLING_Y_GAP * 4 };
}

// Right "+": add a "next step" node to the right with a teal sequence arrow.
// Sequence edge shows flow direction but has NO blocking semantics.
// Prerequisites are determined solely by manually drawn dashed lines.
async function quickAddNextStep(nodeGid) {
  if (!_currentListGid) return;
  const node = _nodes.find(n => n.gid === nodeGid);
  if (!node) return;

  const { x: newX, y: newY } = _findNonOverlappingPos(
    node.canvas_x + NEXT_STEP_X_GAP, node.canvas_y
  );

  const nodeRes = await _apiCreateTask(_currentListGid, '新节点', 'normal', newX, newY, _getViewDefaultFields());
  if (!nodeRes.success) return;
  _nodes.push(nodeRes.data);

  // sequence edge: thin teal arrow showing flow; no parent-child, no blocking
  const edgeRes = await _apiCreateDep(nodeGid, nodeRes.data.gid, 'sequence');
  if (edgeRes.success) _edges.push(edgeRes.data);

  canvas.appendChild(createNodeEl(nodeRes.data));
  renderAllEdges();
  selectNode(nodeRes.data.gid);
}

async function quickAddSubTask(nodeGid) {
  if (!_currentListGid) return;
  const node = _nodes.find(n => n.gid === nodeGid);
  if (!node) return;

  // Place below and indented to the right (tree-diagram style: each level indents by INDENT_X)
  const existingSubs = _getChildGids(nodeGid)
    .map(g => _nodes.find(n => n.gid === g)).filter(Boolean);
  let baseX = node.canvas_x + INDENT_X;  // indent child one level to the right
  let baseY;
  if (existingSubs.length > 0) {
    const bottommost = existingSubs.reduce((m, s) => s.canvas_y > m.canvas_y ? s : m, existingSubs[0]);
    baseX = bottommost.canvas_x;          // same column as last sibling
    baseY = bottommost.canvas_y + SIBLING_Y_GAP;
  } else {
    baseY = node.canvas_y + SIBLING_Y_GAP;
  }

  // Shift uncle nodes down to make room — but only within the same root tree,
  // nodes belonging to other root trees are excluded from shifting.
  const frozen = new Set([..._getSubtreeGids(nodeGid), ..._getAncestorGids(nodeGid)]);
  // Find the root of the current node (topmost ancestor with no parent)
  const ancestors = [..._getAncestorGids(nodeGid)];
  const rootGid = ancestors.find(g => _getParentGids(g).length === 0) ?? nodeGid;
  const rootSubtree = _getSubtreeGids(rootGid);
  _nodes.forEach(n => { if (!rootSubtree.has(n.gid)) frozen.add(n.gid); });
  await _shiftNodesDown(frozen, baseY - CARD_H / 2 - NODE_PAD, SIBLING_Y_GAP);

  const nodeRes = await _apiCreateTask(_currentListGid, '新子节点', 'normal', baseX, baseY, _getViewDefaultFields());
  if (!nodeRes.success) return;
  _nodes.push(nodeRes.data);

  // compose edge: parent → child (solid line, hierarchy only, no blocking)
  const edgeRes = await _apiCreateDep(nodeGid, nodeRes.data.gid, 'compose');
  if (edgeRes.success) _edges.push(edgeRes.data);

  // Auto-expand parent so the new child is always visible.
  // If parent was collapsed, its other hidden children also need to reappear — use full renderCanvas().
  const wasCollapsed = _collapsed.has(nodeGid);
  _collapsed.delete(nodeGid);
  if (wasCollapsed) {
    renderCanvas();
  } else {
    updateNodeEl(node);  // badge/completion may change
    canvas.appendChild(createNodeEl(nodeRes.data));
    renderAllEdges();
  }
  selectNode(nodeRes.data.gid);
}

// ── Edge rendering ──
function buildEdgePath(sx, sy, tx, ty) {
  // Orthogonal L-shape: right→elbow mid→target (fits left-to-right layout)
  const midX = (sx + tx) / 2;
  return `M${sx},${sy} L${midX},${sy} L${midX},${ty} L${tx},${ty}`;
}

function getNodeCenter(gid) {
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return null;
  return { x: n.canvas_x, y: n.canvas_y };
}
function _nodeRight(gid) {
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return null;
  return n.canvas_x + CARD_W / 2;
}
function _nodeLeft(gid) {
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return null;
  return n.canvas_x - CARD_W / 2;
}
function _nodeBottom(gid) {
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return null;
  return n.canvas_y + CARD_H / 2;
}
function _nodeTop(gid) {
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return null;
  return n.canvas_y - CARD_H / 2;
}

function _svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function _arrowHead(g, tipX, tipY, angleDeg, color, size = 6) {
  const s = size;
  const a = angleDeg;
  const pts = [
    [tipX, tipY],
    [tipX - s*Math.cos((a-28)*Math.PI/180), tipY - s*Math.sin((a-28)*Math.PI/180)],
    [tipX - s*Math.cos((a+28)*Math.PI/180), tipY - s*Math.sin((a+28)*Math.PI/180)],
  ];
  g.appendChild(_svgEl('polygon', {
    points: pts.map(p=>p.join(',')).join(' '), fill: color,
  }));
}

function renderAllEdges(hidden = new Set()) {
  svgOverlay.innerHTML = '';
  // Compute depth map once per render pass (used for stroke width scaling)
  _depthsCache = _computeDepths();

  // 1. Compose edges — group by SOURCE (parent) for branch rendering
  const composeBySource = new Map();
  _edges.forEach(e => {
    if (!e || !_isCompose(e)) return;
    if (hidden.has(e.source_gid) || hidden.has(e.target_gid)) return;
    if (!composeBySource.has(e.source_gid)) composeBySource.set(e.source_gid, []);
    composeBySource.get(e.source_gid).push(e);
  });
  composeBySource.forEach((edges, sourceGid) => {
    if (edges.length === 1) renderSingleComposeEdge(edges[0]);
    else renderChildrenBranch(sourceGid, edges);
  });

  // 2. Sequence edges — thin teal directional arrow (right+ flow)
  _edges.forEach(e => {
    if (!e || !_isSequence(e)) return;
    if (hidden.has(e.source_gid) || hidden.has(e.target_gid)) return;
    renderSequenceEdge(e);
  });

  // 3. Prerequisite edges — dashed purple arrow (manual only)
  _edges.forEach(e => {
    if (!e || !_isPrereq(e)) return;
    if (hidden.has(e.source_gid) || hidden.has(e.target_gid)) return;
    renderPrereqEdge(e);
  });
}

// ── Compose edge rendering (parent → child, PBOM-style tree guide lines) ──

function _composeStroke(parentGid, isSelected) {
  if (isSelected) return 2.5;
  const d = _depthsCache[parentGid] || 0;
  return Math.max(2 - d * 0.35, 0.8);
}

// Single compose edge: L-shaped path — vertical guide down then horizontal stub to child
function renderSingleComposeEdge(e) {
  const sc = getNodeCenter(e.source_gid);
  const tc = getNodeCenter(e.target_gid);
  if (!sc || !tc) return;

  const isSelected = e.gid === _selectedEdgeGid;
  const color = isSelected ? 'var(--yellow)' : 'var(--edge-dep)';
  const sw = _composeStroke(e.source_gid, isSelected);
  const arrowSz = Math.max(sw * 2.8, 4.5);

  const dy = tc.y - sc.y;
  const dx = tc.x - sc.x;
  let d, arrowX, arrowY, arrowAngle;

  if (dy > Math.abs(dx) * 0.5 + 20) {
    // Child is below: guide down from just left of child's indentation, then stub right to child left
    const srcBot = _nodeBottom(e.source_gid);
    const tgtL = _nodeLeft(e.target_gid);
    const guideX = tgtL - 8;
    const arrowRight = tgtL >= guideX;
    d = `M${guideX},${srcBot} L${guideX},${tc.y} L${tgtL},${tc.y}`;
    arrowX = tgtL; arrowY = tc.y; arrowAngle = arrowRight ? 0 : 180;
  } else {
    // Child is to the side: horizontal elbow
    const srcR = _nodeRight(e.source_gid);
    const tgtL = _nodeLeft(e.target_gid);
    const midX = (srcR + tgtL) / 2;
    d = `M${srcR},${sc.y} L${midX},${sc.y} L${midX},${tc.y} L${tgtL},${tc.y}`;
    arrowX = tgtL; arrowY = tc.y; arrowAngle = 180;
  }

  const g = _svgEl('g', {}); g.dataset.gid = e.gid; g.style.cursor = 'pointer';
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:color, 'stroke-width':sw, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
  _arrowHead(g, arrowX, arrowY, arrowAngle, color, arrowSz);
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:'transparent', 'stroke-width':'14' }));
  if (e.label) {
    const mid = { x: (sc.x + tc.x) / 2, y: (sc.y + tc.y) / 2 };
    const txt = _svgEl('text', { x:mid.x, y:mid.y-6, 'text-anchor':'middle', 'font-size':'11', fill:'var(--text-muted)' });
    txt.textContent = e.label; g.appendChild(txt);
  }
  g.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e.gid); });
  svgOverlay.appendChild(g);
}

// One parent → multiple children: shared vertical guide + per-child horizontal stubs (PBOM style)
function renderChildrenBranch(parentGid, edges) {
  const sc = getNodeCenter(parentGid);
  if (!sc) return;

  const childData = edges.map(e => {
    const tc = getNodeCenter(e.target_gid);
    if (!tc) return null;
    return { e, tc, tgtL: _nodeLeft(e.target_gid) };
  }).filter(Boolean);
  if (!childData.length) return;

  const avgDy = childData.reduce((s, c) => s + (c.tc.y - sc.y), 0) / childData.length;
  const avgDx = childData.reduce((s, c) => s + (c.tc.x - sc.x), 0) / childData.length;
  const useVertical = avgDy > Math.abs(avgDx) * 0.5 + 20;

  const isAnySelected = edges.some(e => e.gid === _selectedEdgeGid);
  const csw = _composeStroke(parentGid, false);
  const arrowSz = Math.max(csw * 2.8, 4.5);

  if (useVertical) {
    // PBOM-style: shared vertical guide just left of children's indentation, horizontal stubs to each child
    const minChildLeft = Math.min(...childData.map(c => c.tgtL));
    const guideX = minChildLeft - 8;
    const srcBot = _nodeBottom(parentGid);
    const sortedChildren = [...childData].sort((a, b) => a.tc.y - b.tc.y);
    const lastY = sortedChildren[sortedChildren.length - 1].tc.y;
    const guideColor = isAnySelected ? 'var(--yellow)' : 'var(--edge-dep)';

    // Shared vertical guide line
    svgOverlay.appendChild(_svgEl('line', {
      x1: guideX, y1: srcBot, x2: guideX, y2: lastY,
      stroke: guideColor, 'stroke-width': csw, 'stroke-linecap': 'round'
    }));

    // Per-child horizontal stubs with arrowhead
    childData.forEach(({ e, tc, tgtL }) => {
      const isSelected = e.gid === _selectedEdgeGid;
      const color = isSelected ? 'var(--yellow)' : 'var(--edge-dep)';
      const arrowRight = tgtL >= guideX;
      const stubSw = isSelected ? csw + 0.8 : csw;

      const g = _svgEl('g', {}); g.dataset.gid = e.gid; g.style.cursor = 'pointer';
      g.appendChild(_svgEl('line', {
        x1: guideX, y1: tc.y, x2: tgtL, y2: tc.y,
        stroke: color, 'stroke-width': stubSw, 'stroke-linecap': 'round'
      }));
      _arrowHead(g, tgtL, tc.y, arrowRight ? 0 : 180, color, arrowSz);
      // Wide invisible hit area
      const hitD = `M${guideX},${srcBot} L${guideX},${tc.y} L${tgtL},${tc.y}`;
      g.appendChild(_svgEl('path', { d: hitD, fill:'none', stroke:'transparent', 'stroke-width':'14' }));
      g.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e.gid); });
      svgOverlay.appendChild(g);
    });
  } else {
    // Horizontal spread: individual elbow per child
    childData.forEach(({ e, tc, tgtL }) => {
      const isSelected = e.gid === _selectedEdgeGid;
      const color = isSelected ? 'var(--yellow)' : 'var(--edge-dep)';
      const sw = _composeStroke(parentGid, isSelected);
      const srcR = _nodeRight(parentGid);
      const midX = (srcR + tgtL) / 2;
      const d = `M${srcR},${sc.y} L${midX},${sc.y} L${midX},${tc.y} L${tgtL},${tc.y}`;

      const g = _svgEl('g', {}); g.dataset.gid = e.gid; g.style.cursor = 'pointer';
      g.appendChild(_svgEl('path', { d, fill:'none', stroke:color, 'stroke-width':sw, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
      _arrowHead(g, tgtL, tc.y, 180, color, Math.max(sw * 2.8, 4.5));
      g.appendChild(_svgEl('path', { d, fill:'none', stroke:'transparent', 'stroke-width':'14' }));
      g.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e.gid); });
      svgOverlay.appendChild(g);
    });
  }
}

// ── Sequence edge rendering (right+，thin teal directional arrow) ──
function renderSequenceEdge(e) {
  const sc = getNodeCenter(e.source_gid);
  const tc = getNodeCenter(e.target_gid);
  if (!sc || !tc) return;

  const isSelected = e.gid === _selectedEdgeGid;
  const color = isSelected ? 'var(--yellow)' : 'var(--teal)';
  const sw = isSelected ? 2.5 : 1.5;

  const dy = tc.y - sc.y;
  const dx = tc.x - sc.x;
  let d, arrowX, arrowY, arrowAngle;

  if (Math.abs(dy) > Math.abs(dx) * 0.5 + 20 && dy > 0) {
    const srcBot = _nodeBottom(e.source_gid);
    const tgtTop = _nodeTop(e.target_gid);
    const midY = srcBot + (tgtTop - srcBot) / 2;
    d = `M${sc.x},${srcBot} L${sc.x},${midY} L${tc.x},${midY} L${tc.x},${tgtTop}`;
    arrowX = tc.x; arrowY = tgtTop; arrowAngle = 90;
  } else {
    const srcR = _nodeRight(e.source_gid);
    const tgtL = _nodeLeft(e.target_gid);
    const midX = (srcR + tgtL) / 2;
    d = `M${srcR},${sc.y} L${midX},${sc.y} L${midX},${tc.y} L${tgtL},${tc.y}`;
    arrowX = tgtL; arrowY = tc.y; arrowAngle = 180;
  }

  const g = _svgEl('g', {}); g.dataset.gid = e.gid; g.style.cursor = 'pointer';
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:color, 'stroke-width':sw, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
  _arrowHead(g, arrowX, arrowY, arrowAngle, color);
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:'transparent', 'stroke-width':'14' }));
  if (e.label) {
    const mid = { x: (sc.x + tc.x) / 2, y: (sc.y + tc.y) / 2 };
    const txt = _svgEl('text', { x:mid.x, y:mid.y-6, 'text-anchor':'middle', 'font-size':'11', fill:'var(--teal)' });
    txt.textContent = e.label; g.appendChild(txt);
  }
  g.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e.gid); });
  svgOverlay.appendChild(g);
}

// ── Prerequisite edge rendering (前置条件，purple dashed arrow with flow markers) ──

// Shared tooltip for prereq edge hover
let _prereqTooltip = null;
function _getPrereqTooltip() {
  if (_prereqTooltip) return _prereqTooltip;
  _prereqTooltip = document.createElement('div');
  _prereqTooltip.style.cssText = [
    'position:fixed;pointer-events:none;z-index:9999;display:none;white-space:nowrap',
    'background:var(--panel-bg);color:var(--text);border:1px solid var(--mauve)',
    'border-radius:6px;padding:5px 10px;font-size:12px',
    'box-shadow:0 3px 10px rgba(0,0,0,.35)',
  ].join(';');
  document.body.appendChild(_prereqTooltip);
  return _prereqTooltip;
}

// Shared tooltip for node description hover
let _nodeDescTip = null;
function _getNodeDescTip() {
  if (_nodeDescTip) return _nodeDescTip;
  _nodeDescTip = document.createElement('div');
  _nodeDescTip.className = 'st-node-desc-tip';
  document.body.appendChild(_nodeDescTip);
  return _nodeDescTip;
}

// Cubic bezier point at parameter t
function _bezierAt(t, p0, p1, p2, p3) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
  };
}
// Cubic bezier tangent at parameter t (un-normalised)
function _bezierTangAt(t, p0, p1, p2, p3) {
  const u = 1 - t;
  return {
    x: 3*u*u*(p1.x-p0.x) + 6*u*t*(p2.x-p1.x) + 3*t*t*(p3.x-p2.x),
    y: 3*u*u*(p1.y-p0.y) + 6*u*t*(p2.y-p1.y) + 3*t*t*(p3.y-p2.y),
  };
}

// ── Edge waypoints (handle dragging for prerequisite edges) ──
function _wpLsKey() { return `canvas_ewp:${_currentListGid}`; }
function _loadEdgeWaypoints() {
  if (!_currentListGid) return;
  try { _edgeWaypoints = JSON.parse(localStorage.getItem(_wpLsKey()) || '{}'); }
  catch(_) { _edgeWaypoints = {}; }
}
function _saveEdgeWaypoints() {
  if (!_currentListGid) return;
  localStorage.setItem(_wpLsKey(), JSON.stringify(_edgeWaypoints));
}
// Compute default bezier control points (ignores waypoints)
function _getPrereqCPsDefault(e) {
  const sc = getNodeCenter(e.source_gid);
  const tc = getNodeCenter(e.target_gid);
  const srcR = _nodeRight(e.source_gid);
  const tgtL = _nodeLeft(e.target_gid);
  const dy = tc.y - sc.y;
  const bend = Math.sign(dy || -1) * 40;
  return {
    p0: { x: srcR,      y: sc.y },
    p1: { x: srcR + 40, y: sc.y - bend },
    p2: { x: tgtL - 40, y: tc.y - bend },
    p3: { x: tgtL,      y: tc.y },
  };
}
// Returns control points, using stored midpoint to offset p1/p2 if available
function _getPrereqCPs(e) {
  const def = _getPrereqCPsDefault(e);
  const mid = _edgeWaypoints[e.gid]; // {x, y} single midpoint override, or undefined
  if (!mid) return def;
  // B(0.5) = (1/8)(P0+P3) + (3/8)(P1+P2)
  // Shifting P1 and P2 by D moves B(0.5) by (3/4)*D → to get desired delta, use D = delta*(4/3)
  const defMid = _bezierAt(0.5, def.p0, def.p1, def.p2, def.p3);
  const dx = (mid.x - defMid.x) * (4 / 3);
  const dy = (mid.y - defMid.y) * (4 / 3);
  return { ...def, p1: { x: def.p1.x + dx, y: def.p1.y + dy },
                   p2: { x: def.p2.x + dx, y: def.p2.y + dy } };
}

function renderPrereqEdge(e) {
  const sc = getNodeCenter(e.source_gid);
  const tc = getNodeCenter(e.target_gid);
  if (!sc || !tc) return;

  const satisfied = _evalDepCondition(e.source_gid, e.dep_condition);
  const isSelected = e.gid === _selectedEdgeGid;
  const baseColor  = satisfied ? 'var(--mauve)' : 'var(--red)';
  const color = isSelected ? 'var(--yellow)'
              : (satisfied ? 'color-mix(in srgb,var(--mauve) 38%,transparent)'
                           : 'color-mix(in srgb,var(--red)   38%,transparent)');
  const sw = isSelected ? 2 : 1.5;

  const { p0, p1, p2, p3 } = _getPrereqCPs(e);
  const d = `M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`;

  const g = _svgEl('g', {}); g.dataset.gid = e.gid; g.style.cursor = 'pointer';

  // Dashed path — wider gap so it's unobtrusive
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:color, 'stroke-width':sw,
    'stroke-linecap':'round', 'stroke-dasharray':'5 9' }));

  // Terminal arrowhead
  _arrowHead(g, p3.x, p3.y, 180, color);

  // Mid-path flow arrowheads at t≈0.35 and t≈0.70
  for (const t of [0.35, 0.70]) {
    const pt  = _bezierAt(t, p0, p1, p2, p3);
    const tan = _bezierTangAt(t, p0, p1, p2, p3);
    const ang = Math.atan2(tan.y, tan.x) * 180 / Math.PI;
    _arrowHead(g, pt.x, pt.y, ang, color, 5);
  }

  // Wide invisible hit area
  g.appendChild(_svgEl('path', { d, fill:'none', stroke:'transparent', 'stroke-width':'14' }));

  // Labels
  const midPt = _bezierAt(0.5, p0, p1, p2, p3);
  if (e.label) {
    const txt = _svgEl('text', { x:midPt.x, y:midPt.y-14, 'text-anchor':'middle', 'font-size':'11', fill:'var(--mauve)' });
    txt.textContent = e.label; g.appendChild(txt);
  }
  if (e.dep_condition && e.dep_condition !== 'done') {
    const condLabel = e.dep_condition.replace('completion>=', '≥') + '%';
    const txt = _svgEl('text', { x:midPt.x, y:midPt.y+2, 'text-anchor':'middle', 'font-size':'10', fill: color });
    txt.textContent = condLabel; g.appendChild(txt);
  }

  // When selected: single midpoint handle to bend the curve
  if (isSelected) {
    const hx = midPt.x, hy = midPt.y;
    const circ = _svgEl('circle', { cx:hx, cy:hy, r:5,
      fill:'var(--base)', stroke:'var(--yellow)', 'stroke-width':'2' });
    circ.style.cursor = 'grab';
    circ.addEventListener('click', ev => ev.stopPropagation());
    circ.addEventListener('dblclick', ev => {
      ev.stopPropagation();
      delete _edgeWaypoints[e.gid];
      _saveEdgeWaypoints();
      renderAllEdges();
    });
    circ.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.stopPropagation(); ev.preventDefault();
      // Initialize waypoint at current midpoint if not set
      if (!_edgeWaypoints[e.gid]) {
        _edgeWaypoints[e.gid] = { x: hx, y: hy };
      }
      const c = screenToCanvas(ev.clientX, ev.clientY);
      const pt = _edgeWaypoints[e.gid];
      _draggingHandle = { edgeGid: e.gid, offX: c.x - pt.x, offY: c.y - pt.y };
      document.addEventListener('mousemove', onDocMouseMove);
      document.addEventListener('mouseup',  onDocMouseUp);
    });
    g.appendChild(circ);
  }

  // Hover: tooltip + highlight source/target
  const srcNode = _nodes.find(n => n.gid === e.source_gid);
  const tgtNode = _nodes.find(n => n.gid === e.target_gid);
  const tip = _getPrereqTooltip();
  g.addEventListener('mouseenter', ev => {
    tip.innerHTML =
      `<span style="color:var(--mauve);font-weight:600">「${srcNode?.title||'?'}」</span>` +
      `<span style="color:var(--text-muted);margin:0 6px">→ 前置条件 →</span>` +
      `<span style="font-weight:600">「${tgtNode?.title||'?'}」</span>`;
    tip.style.display = 'block';
    tip.style.left = (ev.clientX + 14) + 'px';
    tip.style.top  = (ev.clientY - 10) + 'px';
    // Highlight endpoint nodes
    canvas.querySelector(`.st-node[data-gid="${e.source_gid}"]`)?.classList.add('prereq-highlight-src');
    canvas.querySelector(`.st-node[data-gid="${e.target_gid}"]`)?.classList.add('prereq-highlight-tgt');
  });
  g.addEventListener('mousemove', ev => {
    tip.style.left = (ev.clientX + 14) + 'px';
    tip.style.top  = (ev.clientY - 10) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
    canvas.querySelectorAll('.prereq-highlight-src,.prereq-highlight-tgt').forEach(el => {
      el.classList.remove('prereq-highlight-src', 'prereq-highlight-tgt');
    });
  });

  g.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e.gid); });
  svgOverlay.appendChild(g);
}

// ── Selection ──
function selectNode(gid) {
  _selectedNodeGid = gid;
  _selectedEdgeGid = null;
  canvas.querySelectorAll('.st-node').forEach(el => {
    el.classList.toggle('selected', el.dataset.gid === gid);
  });
  svgOverlay.querySelectorAll('g[data-gid]').forEach(g => {
    const path = g.querySelector('path[fill="none"]');
    if (path) path.setAttribute('stroke-width', '2');
  });
  if (gid) {
    const n = _nodes.find(x => x.gid === gid);
    if (n) showNodePanel(n);
  } else {
    showPanel('empty');
  }
}

function selectEdge(gid) {
  _selectedNodeGid = null;
  _selectedEdgeGid = gid;
  canvas.querySelectorAll('.st-node').forEach(el => el.classList.remove('selected'));
  svgOverlay.querySelectorAll('g[data-gid]').forEach(g => {
    const edgePath = g.querySelector('path[fill="none"][stroke-width]');
    if (edgePath) edgePath.setAttribute('stroke-width', g.dataset.gid === gid ? '3' : '2');
  });
  if (gid) {
    const e = _edges.find(x => x.gid === gid);
    if (e) showEdgePanel(e);
  } else {
    showPanel('empty');
  }
}

function showPanel(which) {
  if (!_panelOpen) return;   // 面板折叠时不响应
  panelEmpty.style.display = which === 'empty' ? 'flex' : 'none';
  nodeForm.style.display   = which === 'node'  ? 'block' : 'none';
  edgeForm.style.display   = which === 'edge'  ? 'block' : 'none';
}

function showNodePanel(n) {
  showPanel('node');
  const status = n.status || 'pending';
  document.getElementById('pfLabel').value      = n.title || '';
  document.getElementById('pfCompletion').value = n.completion || 0;
  document.getElementById('pfCompVal').textContent = (n.completion || 0) + '%';
  document.getElementById('pfDesc').value       = n.description || '';
  document.querySelectorAll('.st-type-btn').forEach(b => {
    b.className = 'st-type-btn' + (b.dataset.type === n.node_type ? ` active-${n.node_type}` : '');
  });
  // icon preview
  const iconId = n.canvas_icon || 'star';
  document.getElementById('pfIconPreview').querySelector('use').setAttribute('href', `#ic-${iconId}`);
  document.getElementById('pfIconLabel').textContent = iconId;
  _currentEditIcon = iconId;

  // Parent-node handling: lock slider, show children list
  const childGids = _getChildGids(n.gid);
  const isParent = childGids.length > 0;
  const pfCompletion = document.getElementById('pfCompletion');
  pfCompletion.disabled = isParent;
  pfCompletion.style.opacity = isParent ? '.5' : '1';
  document.getElementById('pfCompLockedHint').style.display = isParent ? 'block' : 'none';

  const pfChildrenSection = document.getElementById('pfChildrenSection');
  if (isParent) {
    pfChildrenSection.style.display = 'block';
    document.getElementById('pfChildCount').textContent = `(${childGids.length}个)`;
    const list = document.getElementById('pfChildrenList');
    list.innerHTML = '';
    childGids.forEach(cgid => {
      const child = _nodes.find(x => x.gid === cgid);
      if (!child) return;
      const row = document.createElement('div');
      row.className = 'st-child-row';
      row.innerHTML = `<span class="st-child-name" title="${child.title}">${child.title || '节点'}</span>
        <span class="st-child-pct">${child.completion || 0}%</span>`;
      row.addEventListener('click', () => selectNode(cgid));
      list.appendChild(row);
    });
  } else {
    pfChildrenSection.style.display = 'none';
  }

  // Next-step section: nodes this node feeds into (outgoing compose edges)
  const nextGids = _getComposeOutputs(n.gid);
  const pfNextSection = document.getElementById('pfNextSection');
  if (nextGids.length > 0) {
    pfNextSection.style.display = 'block';
    document.getElementById('pfNextCount').textContent = `(${nextGids.length}个)`;
    const nextList = document.getElementById('pfNextList');
    nextList.innerHTML = '';
    nextGids.forEach(ngid => {
      const next = _nodes.find(x => x.gid === ngid);
      if (!next) return;
      const row = document.createElement('div');
      row.className = 'st-child-row';
      row.innerHTML = `<span class="st-child-name" title="${next.title}">${next.title || '节点'}</span>
        <span class="st-child-pct">${next.completion || 0}%</span>`;
      row.addEventListener('click', () => selectNode(ngid));
      nextList.appendChild(row);
    });
  } else {
    pfNextSection.style.display = 'none';
  }

  // Prerequisite section: incoming prerequisite edges (前置条件)
  const prereqGids = _getPrereqInputs(n.gid);
  const pfPrereqSection = document.getElementById('pfPrereqSection');
  if (prereqGids.length > 0) {
    pfPrereqSection.style.display = 'block';
    document.getElementById('pfPrereqCount').textContent = `(${prereqGids.length}个)`;
    const prereqList = document.getElementById('pfPrereqList');
    prereqList.innerHTML = '';
    prereqGids.forEach(pgid => {
      const pre = _nodes.find(x => x.gid === pgid);
      if (!pre) return;
      const satisfied = pre.status === 'done';
      const row = document.createElement('div');
      row.className = 'st-child-row';
      row.innerHTML = `<span class="st-child-name" title="${pre.title}" style="color:${satisfied?'var(--green)':'var(--mauve)'}">${pre.title || '节点'}</span>
        <span class="st-child-pct" style="color:${satisfied?'var(--green)':'var(--red)'}">${satisfied?'✓':'…'}</span>`;
      row.addEventListener('click', () => selectNode(pgid));
      prereqList.appendChild(row);
    });
  } else {
    pfPrereqSection.style.display = 'none';
  }

  // Status buttons
  _updateStatusBtns(status);
  const pfBtnBlocked = document.getElementById('pfBtnBlocked');
  pfBtnBlocked.style.display = (status === 'blocked') ? 'flex' : 'none';

  // Blocked reason
  const pfBlockedReason = document.getElementById('pfBlockedReason');
  if (status === 'blocked') {
    const reasons = _getBlockedReasons(n.gid);
    pfBlockedReason.style.display = 'block';
    pfBlockedReason.innerHTML = '🔒 ' + (reasons.length ? reasons.join('<br>') : '节点被依赖关系阻塞');
  } else {
    pfBlockedReason.style.display = 'none';
  }

  // Task list fields
  document.getElementById('pfPriority').value      = n.priority || '';
  document.getElementById('pfDueDate').value       = (n.due_date || '').slice(0, 10);
  document.getElementById('pfPlanStart').value     = (n.plan_start || '').slice(0, 10);
  document.getElementById('pfPlanEnd').value       = (n.plan_end || '').slice(0, 10);
  document.getElementById('pfTimeEstimate').value  = n.time_estimate != null ? n.time_estimate : '';
  // Owner GID
  document.getElementById('pfOwnerGid').value = n.owner_gid || '';
}

function showEdgePanel(e) {
  showPanel('edge');
  document.getElementById('pfEdgeLabel').value = e.label || '';
  // dep_condition and dep_group only apply to prerequisite edges
  const isPrereq = _isPrereq(e);
  // type tag
  const tag = document.getElementById('pfEdgeTypeTag');
  if (isPrereq) {
    tag.textContent = '前置条件'; tag.style.background = 'var(--mauve)'; tag.style.color = '#fff';
  } else if (_isSequence(e)) {
    tag.textContent = '下一步'; tag.style.background = 'var(--teal)'; tag.style.color = '#fff';
  } else {
    tag.textContent = '父子关系'; tag.style.background = 'var(--peach)'; tag.style.color = '#fff';
  }
  document.getElementById('pfDepCondField').style.display  = isPrereq ? '' : 'none';
  document.getElementById('pfDepGroupField').style.display = isPrereq ? '' : 'none';
  if (isPrereq) {
    const cond = e.dep_condition || 'done';
    const sel = document.getElementById('pfDepCond');
    const knownOpts = ['done','started','completion>=50','completion>=80','completion>=100'];
    if (knownOpts.includes(cond)) { sel.value = cond; document.getElementById('pfDepCondCustom').value = ''; }
    else { sel.value = 'done'; document.getElementById('pfDepCondCustom').value = cond; }
    document.getElementById('pfDepGroup').value = e.dep_group || '';
  }
}

// ── Toolbar mode ──
let _lastActiveTool = null;
function setTool(t) {
  _tool = t;
  _linkSrcGid = null;
  removePreviewLine();
  document.getElementById('btnLinkDep').classList.toggle('active', t === 'add_dep');
  viewport.style.cursor = (t !== 'select') ? 'crosshair' : 'default';
}

document.getElementById('btnLinkDep').addEventListener('click', () => setTool(_tool === 'add_dep' ? 'select' : 'add_dep'));

document.getElementById('btnAddNode').addEventListener('click', async () => {
  if (!_currentListGid) return alert('请先选择或创建任务清单');
  // place at center of viewport
  const rect = viewport.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const w = screenToCanvas(rect.left + cx, rect.top + cy);
  const res = await _apiCreateTask(_currentListGid, '新节点', 'normal', w.x, w.y, _getViewDefaultFields());
  if (res.success) {
    _nodes.push(res.data);
    canvasEmpty.style.display = 'none';   // hide placeholder now that a node exists
    canvas.appendChild(createNodeEl(res.data));
    selectNode(res.data.gid);
  }
});

document.getElementById('btnDelete').addEventListener('click', async () => {
  if (_selectedNodeGid) {
    if (!await _confirm('删除此节点？相关连线也将被删除。')) return;
    // Collect parents before deleting so we can propagate upward
    const parentGids = _getParentGids(_selectedNodeGid);
    await _apiDeleteTask(_selectedNodeGid);
    _edges = _edges.filter(e => e.source_gid !== _selectedNodeGid && e.target_gid !== _selectedNodeGid);
    _nodes = _nodes.filter(n => n.gid !== _selectedNodeGid);
    _selectedNodeGid = null;
    _applyAllParentCompletions();
    _recomputeBlockedStatuses();
    renderCanvas();
    showPanel('empty');
    // Persist updated parent completions
    for (const pgid of parentGids) {
      const p = _nodes.find(n => n.gid === pgid);
      if (p) await _apiUpdateCanvas(p.gid, { completion: p.completion });
    }
  } else if (_selectedEdgeGid) {
    await _apiDeleteDep(_selectedEdgeGid);
    _edges = _edges.filter(e => e.gid !== _selectedEdgeGid);
    _selectedEdgeGid = null;
    _recomputeBlockedStatuses();
    renderCanvas();
    renderAllEdges();
    showPanel('empty');
  }
});

document.getElementById('pfDeleteNode').addEventListener('click', () => document.getElementById('btnDelete').click());
document.getElementById('pfDeleteEdge').addEventListener('click', () => document.getElementById('btnDelete').click());
document.getElementById('pfResetEdgePath').addEventListener('click', () => {
  if (!_selectedEdgeGid) return;
  delete _edgeWaypoints[_selectedEdgeGid];
  _saveEdgeWaypoints();
  renderAllEdges();
});

// ── Node drag & click ──
function onNodeMouseDown(e) {
  if (_tool !== 'select') return;
  e.stopPropagation();
  const gid = e.currentTarget.dataset.gid;
  _dragging = true;
  _dragNodeGid = gid;
  const n = _nodes.find(x => x.gid === gid);
  const c = screenToCanvas(e.clientX, e.clientY);
  _dragOffX = c.x - n.canvas_x;
  _dragOffY = c.y - n.canvas_y;
  // Snapshot descendant offsets so they move in lockstep
  _dragDescendants = new Map();
  _getDescendants(gid).forEach(dGid => {
    const dn = _nodes.find(x => x.gid === dGid);
    if (dn) _dragDescendants.set(dGid, { offX: dn.canvas_x - n.canvas_x, offY: dn.canvas_y - n.canvas_y });
  });
  document.addEventListener('mousemove', onDocMouseMove);
  document.addEventListener('mouseup', onDocMouseUp);
}

function onNodeClick(e) {
  e.stopPropagation();
  const gid = e.currentTarget.dataset.gid;
  if (_tool === 'add_dep') {
    handleLinkClick(gid);
    return;
  }
  if (!_dragging) selectNode(gid);
}

async function handleLinkClick(gid) {
  if (!_linkSrcGid) {
    _linkSrcGid = gid;
    canvas.querySelector(`.st-node[data-gid="${gid}"]`)?.classList.add('selected');
  } else {
    if (_linkSrcGid === gid) { _linkSrcGid = null; removePreviewLine(); return; }
    const res = await _apiCreateDep(_linkSrcGid, gid, 'prerequisite');
    if (res.success) {
      _edges.push(res.data);
      _recomputeBlockedStatuses();
      renderCanvas();
      renderAllEdges();
    }
    _linkSrcGid = null;
    removePreviewLine();
    canvas.querySelectorAll('.st-node').forEach(el => {
      el.classList.toggle('selected', el.dataset.gid === _selectedNodeGid);
    });
  }
}

function removePreviewLine() {
  if (_previewLine) { _previewLine.remove(); _previewLine = null; }
}

// ── Mouse move / up (drag + pan + preview line) ──
function onDocMouseMove(e) {
  if (_draggingHandle) {
    const c = screenToCanvas(e.clientX, e.clientY);
    const { edgeGid, offX, offY } = _draggingHandle;
    _edgeWaypoints[edgeGid] = { x: c.x - offX, y: c.y - offY };
    renderAllEdges();
    return;
  }
  if (_dragging) {
    const c = screenToCanvas(e.clientX, e.clientY);
    const n = _nodes.find(x => x.gid === _dragNodeGid);
    if (!n) return;
    n.canvas_x = c.x - _dragOffX;
    n.canvas_y = c.y - _dragOffY;
    const el = canvas.querySelector(`.st-node[data-gid="${_dragNodeGid}"]`);
    if (el) { el.style.left = n.canvas_x + 'px'; el.style.top = n.canvas_y + 'px'; }
    // Move all descendants in lockstep
    _dragDescendants.forEach(({ offX, offY }, dGid) => {
      const dn = _nodes.find(x => x.gid === dGid);
      if (!dn) return;
      dn.canvas_x = n.canvas_x + offX;
      dn.canvas_y = n.canvas_y + offY;
      const del = canvas.querySelector(`.st-node[data-gid="${dGid}"]`);
      if (del) { del.style.left = dn.canvas_x + 'px'; del.style.top = dn.canvas_y + 'px'; }
    });
    renderAllEdges();
    // grid cell highlight (for dragged node only)
    const hit = _gridHitTest(n.canvas_x, n.canvas_y);
    _updateGridCellHighlight(hit);
  }
}

async function onDocMouseUp(e) {
  if (_draggingHandle) {
    _saveEdgeWaypoints();
    _draggingHandle = null;
    document.removeEventListener('mousemove', onDocMouseMove);
    document.removeEventListener('mouseup',  onDocMouseUp);
    return;
  }
  if (_dragging) {
    const savedGid = _dragNodeGid;
    _dragging = false;           // clear BEFORE await so click handler sees it correctly
    _dragNodeGid = null;
    document.removeEventListener('mousemove', onDocMouseMove);
    document.removeEventListener('mouseup', onDocMouseUp);
    const n = _nodes.find(x => x.gid === savedGid);
    if (n) {
      const hit = _gridHitTest(n.canvas_x, n.canvas_y);
      const rowGid = hit?.rowGid || null;
      const colGid = hit?.colGid || null;
      n.canvas_row_gid = rowGid;
      n.canvas_col_gid = colGid;
      await _apiUpdateCanvas(n.gid, { canvas_x: n.canvas_x, canvas_y: n.canvas_y,
        canvas_row_gid: rowGid, canvas_col_gid: colGid });
    }
    // Persist descendant positions in parallel
    const descSaves = [];
    _dragDescendants.forEach((_, dGid) => {
      const dn = _nodes.find(x => x.gid === dGid);
      if (!dn) return;
      const hit = _gridHitTest(dn.canvas_x, dn.canvas_y);

      dn.canvas_col_gid = hit?.colGid || null;
      descSaves.push(_apiUpdateCanvas(dGid, { canvas_x: dn.canvas_x, canvas_y: dn.canvas_y,

    });

    _updateGridCellHighlight(null);
    _gridHoverCell = null;
  }

// ── Auto-layout (left→right dep tree; siblings grouped vertically) ──
document.getElementById('btnAutoLayout').addEventListener('click', async () => {
  if (!_nodes.length) return;
  const XGAP = 200, YGAP = 110, XOFF = 120, YOFF = 200;

  // Layer assignment: layer = max(layer of all prerequisites) + 1
  // Roots = nodes with no incoming dep edges
  const layerOf = {};
  _nodes.forEach(n => { layerOf[n.gid] = 0; });
  // Topological sort via Kahn's algorithm using dep edges (source→target)
  const inDeg = {};
  const successors = {}; // successors[a] = nodes that depend on a (a is prereq of them)
  _nodes.forEach(n => { inDeg[n.gid] = 0; successors[n.gid] = []; });
  _edges.forEach(e => {
    if (!_isCompose(e)) return; // only compose edges define the synthesis hierarchy
    if (inDeg[e.target_gid] !== undefined) inDeg[e.target_gid]++;
    if (successors[e.source_gid]) successors[e.source_gid].push(e.target_gid);
  });
  let queue = _nodes.filter(n => inDeg[n.gid] === 0).map(n => n.gid);
  if (!queue.length) queue = [_nodes[0].gid];
  const visited = new Set(queue);
  while (queue.length) {
    const cur = queue.shift();
    (successors[cur] || []).forEach(next => {
      layerOf[next] = Math.max(layerOf[next] || 0, (layerOf[cur] || 0) + 1);
      if (!visited.has(next)) { visited.add(next); queue.push(next); }
    });
  }

  // Group nodes by layer; within each layer, group siblings (nodes sharing same target) together
  const byLayer = {};
  _nodes.forEach(n => {
    const l = layerOf[n.gid] || 0;
    if (!byLayer[l]) byLayer[l] = [];
    byLayer[l].push(n.gid);
  });

  // Sort each layer: group siblings (same target) together, sort groups by target's position
  const targetOf = {}; // first compose-target of node (for sibling grouping)
  _edges.forEach(e => { if (_isCompose(e) && !targetOf[e.source_gid]) targetOf[e.source_gid] = e.target_gid; });

  const positions = {};
  const numLayers = Math.max(...Object.keys(byLayer).map(Number)) + 1;
  for (let li = 0; li < numLayers; li++) {
    const layer = byLayer[li] || [];
    // Group siblings: sort by target gid so siblings are adjacent
    layer.sort((a, b) => {
      const ta = targetOf[a] || a, tb = targetOf[b] || b;
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    });
    const x = XOFF + li * XGAP;
    const totalH = (layer.length - 1) * YGAP;
    const yStart = YOFF - totalH / 2;
    layer.forEach((gid, i) => {
      positions[gid] = { x, y: yStart + i * YGAP };
    });
  }

  // batch update
  const updates = _nodes.map(n => {
    const pos = positions[n.gid] || { x: n.canvas_x, y: n.canvas_y };
    n.canvas_x = pos.x; n.canvas_y = pos.y;
    return _apiUpdateCanvas(n.gid, { canvas_x: pos.x, canvas_y: pos.y });
  });
  await Promise.all(updates);
  renderCanvas();
});

async function saveCurrentNode() {
  if (!_selectedNodeGid) return;
  const n = _nodes.find(x => x.gid === _selectedNodeGid);
  if (!n) return;
  n.title       = document.getElementById('pfLabel').value;
  n.description = document.getElementById('pfDesc').value;
  // Task list fields
  n.priority      = document.getElementById('pfPriority').value || null;
  n.due_date      = document.getElementById('pfDueDate').value || null;
  n.plan_start    = document.getElementById('pfPlanStart').value || null;
  n.plan_end      = document.getElementById('pfPlanEnd').value || null;
  const te = document.getElementById('pfTimeEstimate').value;
  n.time_estimate = te !== '' ? parseInt(te) : null;
  const newOwnerGid = document.getElementById('pfOwnerGid').value.trim() || null;
  if (newOwnerGid !== n.owner_gid) n.owner_name = '';  // only clear name if GID actually changed
  n.owner_gid = newOwnerGid;
  // Only read completion from slider when this is a leaf node (parent nodes are auto-computed)
  if (!_hasChildren(n.gid)) {
    const newComp = parseInt(document.getElementById('pfCompletion').value) || 0;
    n.completion = newComp;
    // Auto-sync status with completion
    if (newComp >= 100 && n.status !== 'done') {
      n.status = 'done';
      _updateStatusBtns('done');
    } else if (newComp < 100 && n.status === 'done') {
      n.status = 'in_progress';
      _updateStatusBtns('in_progress');
    }
  }
  await _apiUpdateTask(n.gid, { title: n.title, completion: n.completion,
    description: n.description, status: n.status,
    priority: n.priority, due_date: n.due_date,
    plan_start: n.plan_start, plan_end: n.plan_end,
    time_estimate: n.time_estimate, owner_gid: n.owner_gid });
  updateNodeEl(n);
  _recomputeBlockedStatuses();
  renderAllEdges();
  // Propagate completion upward through branch edges
  if (!_hasChildren(n.gid)) {
    await _propagateCompletion(n.gid);
  }
}

// 独立窗口（非 iframe）没有父窗口的 _authMode / _cloudFetch，需自行初始化
async function _initStandaloneCloud() {
  if (!window.electronAPI) return;
  // 设置 _authMode
  if (!window._authMode) {
    try {
      const state = await window.electronAPI?.authGetState?.();
      window._authMode = state?.mode || 'none';
    } catch(e) {}
  }
  // 设置 _cloudFetch（与 main.js 实现保持一致）
  if (!window._cloudFetch) {
    window._cloudFetch = async function(path, opts = {}) {
      const config = (await window.electronAPI?.getConfig?.()) || {};
      const state  = (await window.electronAPI?.authGetState?.()) || {};
      const baseUrl = (config.backendUrl || 'http://127.0.0.1:8080').replace(/\/$/, '');
      const token = state.token || '';
      const isFormData = typeof opts.body?.append === 'function';
      const res = await fetch(`${baseUrl}${path}`, {
        ...opts,
        headers: {
          ...(isFormData ? {} : { 'Content-Type': 'application/json' }),
          ...(token ? { 'X-AI00-Token': token } : {}),
          ...(opts.headers || {}),
        },
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = err.detail;
        const msg = typeof detail === 'string' ? detail
          : Array.isArray(detail) ? detail.map(e => e.msg || JSON.stringify(e)).join('; ')
          : detail ? JSON.stringify(detail) : `HTTP ${res.status}`;
        throw new Error(msg);
      }
      if (res.status === 204 || res.headers.get('content-length') === '0') return null;
      return res.json();
    };
  }
}

function _applyViewFilters(tasks, config) {
  if (!config?.filters?.length) return tasks;
  return tasks.filter(t =>
    config.filters.every(f => {
      const val = t[f.field];
      if (f.op === 'eq')       return val === f.value;
      if (f.op === 'neq')      return val !== f.value;
      if (f.op === 'in')       return (Array.isArray(f.value) ? f.value : [f.value]).includes(val);
      if (f.op === 'contains') return String(val ?? '').includes(f.value);
      if (f.op === 'empty')    return !val;
      if (f.op === 'notempty') return !!val;
      return true;
    })
  );
}

async function doImportFromView() {
  if (!_currentListGid) return;
  const modal = document.getElementById('importViewModal');

  let allTasks;
  try { allTasks = await _apiListTasks(_currentListGid, false); }
  catch(e) { alert('加载任务失败：' + e.message); return; }
  // 按视图筛选
  let toImport = _importViewSelected
    ? _applyViewFilters(allTasks, _importViewSelected.config)
    : allTasks;
  // 排除已在画布上的
  const existing = new Set(_nodes.map(n => n.gid));
  toImport = toImport.filter(t => !existing.has(t.gid));
  if (!toImport.length) { alert('所有符合条件的任务已在画布上，无需重复导入。'); modal.style.display = 'none'; return; }
  // 自动布局：从当前画布右下方开始，4列网格
  const baseX = 120, baseY = 120, colW = 200, rowH = 100, cols = 4;
  const maxY = _nodes.reduce((m, n) => Math.max(m, (n.canvas_y ?? 0) + 120), baseY - 100);
  toImport.forEach((t, i) => {
    t.canvas_x = baseX + (i % cols) * colW;
    t.canvas_y = maxY + Math.floor(i / cols) * rowH;
    t._placed  = true;
    _nodes.push(t);
    _apiUpdateCanvas(t.gid, { canvas_x: t.canvas_x, canvas_y: t.canvas_y }).catch(() => {});
  });
  renderCanvas();
  modal.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── Grid (Swimlane Axes) ─────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
//
// Architecture:
//   #glColAxis / #glRowAxis / #glAxisCorner — fixed strips inside #viewport,
//     do NOT move when canvas pans; header cells inside are repositioned in
//     _updateGridAxes() on every applyTransform() call to stay aligned with cells.
//   #gridLayer — inside #canvas; contains only .gl-cell backgrounds (move with canvas).

function _mkGid() {
  return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function _defaultGridConfig() {
  return {
    enabled: true, x: 220, y: 140,
    headerRowH: 36, headerColW: 88,
    rows: [
      { gid: _mkGid(), label: '行 1', height: 240 },
      { gid: _mkGid(), label: '行 2', height: 240 },
    ],

      { gid: _mkGid(), label: '列 A', width: 270 },

    ]
  };
}

function _loadGridConfig(listGid) {
  const s = listGid && localStorage.getItem('grd_' + listGid);
  if (s) { try { _gridConfig = JSON.parse(s); return; } catch {} }
  _gridConfig = { enabled: false, x: 220, y: 140,
    headerRowH: 36, headerColW: 88, rows: [], cols: [] };
}

function _saveGridConfig() {
  if (_currentListGid)
    localStorage.setItem('grd_' + _currentListGid, JSON.stringify(_gridConfig));
}

// ── Geometry helpers ──────────────────────────────────────────────────────────
// Canvas x of col j's left edge (inside cell area, past row-header column)
function _colCanvasLeft(j) {
  let x = _gridConfig.x + _gridConfig.headerColW;
  for (let i = 0; i < j; i++) x += _gridConfig.cols[i].width;
  return x;
}
// Canvas y of row i's top edge (inside cell area, past col-header row)
function _rowCanvasTop(i) {
  let y = _gridConfig.y + _gridConfig.headerRowH;
  for (let k = 0; k < i; k++) y += _gridConfig.rows[k].height;
  return y;
}
// Canvas point → viewport pixel:  vx = (cx + _tx) * _scale
function _cv(canvasCoord) { return (canvasCoord + _tx) * _scale; }
function _cvY(canvasCoord){ return (canvasCoord + _ty) * _scale; }

// ── Hit test: canvas coords → { rowGid, colGid } or null ─────────────────────
function _gridHitTest(cx, cy) {
  const g = _gridConfig;
  if (!g.enabled || !g.rows.length || !g.cols.length) return null;
  let colGid = null;
  let px = g.x + g.headerColW;
  for (const col of g.cols) {
    if (cx >= px && cx < px + col.width) { colGid = col.gid; break; }
    px += col.width;
  }
  let rowGid = null;
  let py = g.y + g.headerRowH;
  for (const row of g.rows) {
    if (cy >= py && cy < py + row.height) { rowGid = row.gid; break; }
    py += row.height;
  }
  return (colGid && rowGid) ? { rowGid, colGid } : null;
}

// ── Cell highlight during drag ────────────────────────────────────────────────
function _updateGridCellHighlight(hit) {
  const ov = document.getElementById('glHoverOverlay');
  if (!ov) return;
  if (!hit) {
    ov.style.display = 'none';
    _gridHoverCell = null;
    return;
  }
  const g = _gridConfig;
  const ci = g.cols.findIndex(c => c.gid === hit.colGid);
  const ri = g.rows.findIndex(r => r.gid === hit.rowGid);
  if (ci < 0 || ri < 0) { ov.style.display = 'none'; return; }
  const x = _colCanvasLeft(ci), y = _rowCanvasTop(ri);
  ov.style.left   = x + 'px';
  ov.style.top    = y + 'px';
  ov.style.width  = g.cols[ci].width  + 'px';
  ov.style.height = g.rows[ri].height + 'px';
  ov.style.display = 'block';
  const prev = _gridHoverCell;
  if (!prev || prev.rowGid !== hit.rowGid || prev.colGid !== hit.colGid) {
    ov.classList.remove('just-entered');
    void ov.offsetWidth;
    ov.classList.add('just-entered');
    _gridHoverCell = hit;
  }
}

// ── DOM helper ────────────────────────────────────────────────────────────────
function _gEl(tag, attrs = {}) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') e.className = v; else e.setAttribute(k, v);
  });
  return e;
}

// ── renderGrid: rebuild DOM structure, then position axes ────────────────────
function renderGrid() {
  const colAxis   = document.getElementById('glColAxis');
  const rowAxis   = document.getElementById('glRowAxis');
  const axisCorner= document.getElementById('glAxisCorner');
  const on = _gridConfig.enabled && _gridConfig.rows.length && _gridConfig.cols.length;

  // ── dot background: hide when grid is on ─────────────────────────────────
  viewport.style.backgroundImage = on
    ? 'none'
    : 'radial-gradient(circle,var(--overlay0) 1px,transparent 1px)';

  // ── axis overlays visibility ──────────────────────────────────────────────
  const disp = on ? 'block' : 'none';
  colAxis.style.display    = disp;
  rowAxis.style.display    = disp;
  axisCorner.style.display = on ? 'flex' : 'none';

  // ── gridLayer (cells only) ────────────────────────────────────────────────
  let layer = document.getElementById('gridLayer');
  if (!layer) {
    layer = document.createElement('div');
    layer.id = 'gridLayer';
    canvas.insertBefore(layer, canvas.firstChild);
  }
  layer.innerHTML = '';
  if (!on) { layer.style.display = 'none'; return; }
  layer.style.display = '';

  const { rows, cols } = _gridConfig;
  const totalRowsH = rows.reduce((s, r) => s + r.height, 0);
  const totalColsW = cols.reduce((s, c) => s + c.width, 0);
  const gridH = _gridConfig.headerRowH + totalRowsH;
  const gridW = _gridConfig.headerColW + totalColsW;

  // Vertical lines at each column boundary (cols.length + 1: left border + each right border)
  for (let j = 0; j <= cols.length; j++) {
    layer.appendChild(_gEl('div', { class: 'gl-vline', 'data-vl': j }));
  }
  // Horizontal lines at each row boundary (rows.length + 1: top border + each bottom border)
  for (let i = 0; i <= rows.length; i++) {
    layer.appendChild(_gEl('div', { class: 'gl-hline', 'data-hl': i }));
  }
  // Single hover overlay (positioned on drag)
  layer.appendChild(_gEl('div', { class: 'gl-hover-overlay', id: 'glHoverOverlay' }));

  // ── Column axis: create header elements ──────────────────────────────────
  colAxis.innerHTML = '';
  cols.forEach((col, j) => {
    const ch = _gEl('div', { class: 'gl-col-hdr', 'data-gid': col.gid });
    const lbl = _gEl('span', { class: 'gl-header-label' });
    lbl.textContent = col.label || `列 ${j + 1}`;
    lbl.addEventListener('dblclick', e => { e.stopPropagation(); _startHeaderEdit(lbl, col); });
    const rh = _gEl('span', { class: 'gl-resize-h' });
    _bindColResize(rh, col);
    const del = _gEl('button', { class: 'gl-del-btn', style: 'top:4px;right:8px;' });
    del.textContent = '×'; del.title = '删除此列';
    del.addEventListener('click', e => { e.stopPropagation(); _removeGridCol(col.gid); });
    ch.appendChild(lbl); ch.appendChild(rh); ch.appendChild(del);
    colAxis.appendChild(ch);
  });
  // Add-col button
  const addCol = _gEl('div', { class: 'gl-add-hdr', id: 'glAddCol' });
  addCol.textContent = '+'; addCol.title = '添加列';
  addCol.style.cssText = 'position:absolute;width:28px;top:4px;bottom:4px;';
  addCol.addEventListener('click', _addGridCol);
  colAxis.appendChild(addCol);

  // ── Row axis: create header elements ─────────────────────────────────────
  rowAxis.innerHTML = '';
  rows.forEach((row, i) => {
    const rh = _gEl('div', { class: 'gl-row-hdr', 'data-gid': row.gid });
    const lbl = _gEl('span', { class: 'gl-header-label' });
    lbl.textContent = row.label || `行 ${i + 1}`;
    lbl.addEventListener('dblclick', e => { e.stopPropagation(); _startHeaderEdit(lbl, row); });
    const rv = _gEl('span', { class: 'gl-resize-v' });
    _bindRowResize(rv, row);
    const del = _gEl('button', { class: 'gl-del-btn', style: 'bottom:6px;left:50%;transform:translateX(-50%);' });
    del.textContent = '×'; del.title = '删除此行';
    del.addEventListener('click', e => { e.stopPropagation(); _removeGridRow(row.gid); });
    rh.appendChild(lbl); rh.appendChild(rv); rh.appendChild(del);
    rowAxis.appendChild(rh);
  });
  // Add-row button
  const addRow = _gEl('div', { class: 'gl-add-hdr', id: 'glAddRow' });
  addRow.textContent = '+'; addRow.title = '添加行';
  addRow.style.cssText = 'position:absolute;left:4px;right:4px;height:28px;';
  addRow.addEventListener('click', _addGridRow);
  rowAxis.appendChild(addRow);

  // ── Corner: drag handle ───────────────────────────────────────────────────
  axisCorner.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 15l3-3-3-3M2 12h20M12 2v20"/></svg>`;
  _bindGridMoveDrag(axisCorner);

  _updateGridAxes();
}

// ── _updateGridAxes: reposition all axis header cells to match canvas transform
// Called by applyTransform() on every pan/zoom, and after renderGrid().
function _updateGridAxes() {
  if (!_gridConfig.enabled) return;
  const { rows, cols, headerRowH: hrH, headerColW: hcW } = _gridConfig;
  const colAxis    = document.getElementById('glColAxis');
  const rowAxis    = document.getElementById('glRowAxis');
  const axisCorner = document.getElementById('glAxisCorner');
  if (!colAxis || !rowAxis || !axisCorner) return;

  // Axis strip heights/widths (fixed in screen px, not scaled)
  const COL_AXIS_H = hrH;  // height of the top strip (px)
  const ROW_AXIS_W = hcW;  // width of the left strip (px)

  colAxis.style.height    = COL_AXIS_H + 'px';
  rowAxis.style.width     = ROW_AXIS_W + 'px';
  axisCorner.style.width  = ROW_AXIS_W + 'px';
  axisCorner.style.height = COL_AXIS_H + 'px';

  // ── Position col header cells ─────────────────────────────────────────────
  const colHdrs = colAxis.querySelectorAll('.gl-col-hdr');
  cols.forEach((col, j) => {
    const el = colHdrs[j];
    if (!el) return;
    const screenLeft  = _cv(_colCanvasLeft(j));
    const screenWidth = col.width * _scale;
    el.style.left  = screenLeft + 'px';
    el.style.width = screenWidth + 'px';
  });
  // Add-col button: right after last col
  const addColBtn = document.getElementById('glAddCol');
  if (addColBtn) {
    const lastColRight = _cv(_colCanvasLeft(cols.length));
    addColBtn.style.left = lastColRight + 'px';
  }

  // ── Position row header cells ─────────────────────────────────────────────
  const rowHdrs = rowAxis.querySelectorAll('.gl-row-hdr');
  rows.forEach((row, i) => {
    const el = rowHdrs[i];
    if (!el) return;
    const screenTop    = _cvY(_rowCanvasTop(i));
    const screenHeight = row.height * _scale;
    el.style.top    = screenTop + 'px';
    el.style.height = screenHeight + 'px';
  });
  // Add-row button: below last row
  const addRowBtn = document.getElementById('glAddRow');
  if (addRowBtn) {
    const lastRowBottom = _cvY(_rowCanvasTop(rows.length));
    addRowBtn.style.top = lastRowBottom + 'px';
  }

  // ── Position vertical + horizontal lines in #gridLayer ───────────────────
  const layer = document.getElementById('gridLayer');
  if (layer) {
    layer.querySelectorAll('.gl-vline').forEach(line => {
      const j = parseInt(line.dataset.vl);
      line.style.left   = _colCanvasLeft(j) + 'px';
      line.style.top    = '-9999px';
      line.style.height = '20000px';
    });
    layer.querySelectorAll('.gl-hline').forEach(line => {
      const i = parseInt(line.dataset.hl);
      line.style.top   = _rowCanvasTop(i) + 'px';
      line.style.left  = '-9999px';
      line.style.width = '20000px';
    });
  }
}

// ── Move entire grid by dragging corner ──────────────────────────────────────
function _bindGridMoveDrag(handle) {
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const c0 = screenToCanvas(e.clientX, e.clientY);
    const gx0 = _gridConfig.x, gy0 = _gridConfig.y;
    function onMove(ev) {
      const c = screenToCanvas(ev.clientX, ev.clientY);
      _gridConfig.x = gx0 + (c.x - c0.x);
      _gridConfig.y = gy0 + (c.y - c0.y);
      _updateGridAxes();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      _saveGridConfig();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── Column resize ─────────────────────────────────────────────────────────────
function _bindColResize(handle, col) {
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const startX = e.clientX, startW = col.width;
    const colIdx = _gridConfig.cols.findIndex(c => c.gid === col.gid);
    let prevW = startW;
    // Snapshot each node's column index at drag-start using gid first, position fallback
    const nodeColIdx = new Map();
    _nodes.forEach(n => {
      let nci = -1;
      if (n.canvas_col_gid) {
        nci = _gridConfig.cols.findIndex(c => c.gid === n.canvas_col_gid);
      }
      if (nci < 0) {
        const hit = _gridHitTest(n.canvas_x, n.canvas_y);
        if (hit?.colGid) nci = _gridConfig.cols.findIndex(c => c.gid === hit.colGid);
      }
      if (nci >= 0) nodeColIdx.set(n.gid, nci);
    });
    function onMove(ev) {
      const newW = Math.max(100, startW + (ev.clientX - startX) / _scale);
      const delta = newW - prevW;
      prevW = newW;
      col.width = newW;
      if (delta !== 0) {
        _nodes.forEach(n => {
          const nci = nodeColIdx.get(n.gid);
          if (nci !== undefined && nci > colIdx) {
            n.canvas_x += delta;
            const el = canvas.querySelector(`.st-node[data-gid="${n.gid}"]`);
            if (el) el.style.left = n.canvas_x + 'px';
          }
        });
        renderAllEdges();
      }
      _updateGridAxes();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      // Persist all shifted nodes
      _nodes.forEach(n => {
        const nci = nodeColIdx.get(n.gid);
        if (nci !== undefined && nci > colIdx) _apiUpdateCanvas(n.gid, { canvas_x: n.canvas_x, canvas_y: n.canvas_y });
      });
      _saveGridConfig();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── Row resize ────────────────────────────────────────────────────────────────
function _bindRowResize(handle, row) {
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const startY = e.clientY, startH = row.height;
    const rowIdx = _gridConfig.rows.findIndex(r => r.gid === row.gid);
    let prevH = startH;
    // Snapshot each node's row index at drag-start using gid first, position fallback
    const nodeRowIdx = new Map();
    _nodes.forEach(n => {
      let nri = -1;
      if (n.canvas_row_gid) {
        nri = _gridConfig.rows.findIndex(r => r.gid === n.canvas_row_gid);
      }
      if (nri < 0) {
        const hit = _gridHitTest(n.canvas_x, n.canvas_y);
        if (hit?.rowGid) nri = _gridConfig.rows.findIndex(r => r.gid === hit.rowGid);
      }
      if (nri >= 0) nodeRowIdx.set(n.gid, nri);
    });
    function onMove(ev) {
      const newH = Math.max(80, startH + (ev.clientY - startY) / _scale);
      const delta = newH - prevH;
      prevH = newH;
      row.height = newH;
      if (delta !== 0) {
        _nodes.forEach(n => {
          const nri = nodeRowIdx.get(n.gid);
          if (nri !== undefined && nri > rowIdx) {
            n.canvas_y += delta;
            const el = canvas.querySelector(`.st-node[data-gid="${n.gid}"]`);
            if (el) el.style.top = n.canvas_y + 'px';
          }
        });
        renderAllEdges();
      }
      _updateGridAxes();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      // Persist all shifted nodes
      _nodes.forEach(n => {
        const nri = nodeRowIdx.get(n.gid);
        if (nri !== undefined && nri > rowIdx) _apiUpdateCanvas(n.gid, { canvas_x: n.canvas_x, canvas_y: n.canvas_y });
      });
      _saveGridConfig();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── Header label inline editing ───────────────────────────────────────────────
function _startHeaderEdit(lbl, item) {
  lbl.contentEditable = 'true';
  lbl.focus();
  const range = document.createRange();
  range.selectNodeContents(lbl);
  getSelection().removeAllRanges();
  getSelection().addRange(range);
  function finish() {
    lbl.contentEditable = 'false';
    const v = lbl.textContent.trim();
    item.label = v || item.label;
    lbl.textContent = item.label;
    _saveGridConfig();
    lbl.removeEventListener('blur', finish);
    lbl.removeEventListener('keydown', onKey);
  }
  function onKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); finish(); }
    if (e.key === 'Escape') {
      lbl.textContent = item.label;
      lbl.contentEditable = 'false';
      lbl.removeEventListener('blur', finish);
      lbl.removeEventListener('keydown', onKey);
    }
  }
  lbl.addEventListener('blur', finish);
  lbl.addEventListener('keydown', onKey);
}

// ── Add / remove rows and columns ─────────────────────────────────────────────
function _addGridCol() {
  _gridConfig.cols.push({ gid: _mkGid(), label: `列 ${_gridConfig.cols.length + 1}`, width: 270 });
  renderGrid(); _saveGridConfig();
}
function _addGridRow() {
  _gridConfig.rows.push({ gid: _mkGid(), label: `行 ${_gridConfig.rows.length + 1}`, height: 240 });
  renderGrid(); _saveGridConfig();
}
function _removeGridCol(gid) {
  _gridConfig.cols = _gridConfig.cols.filter(c => c.gid !== gid);
  renderGrid(); _saveGridConfig();
}
function _removeGridRow(gid) {
  _gridConfig.rows = _gridConfig.rows.filter(r => r.gid !== gid);
  renderGrid(); _saveGridConfig();
}

// ── Focus Panel ────────────────────────────────────────────────────────────────
function _escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// BFS connected components via prereq/sequence edges (not compose)
function _getDepGroups() {
  const depEdges = _edges.filter(e => !_isCompose(e));
  const adj = new Map();
  _nodes.forEach(n => adj.set(n.gid, new Set()));
  depEdges.forEach(e => {
    if (!adj.has(e.source_gid)) adj.set(e.source_gid, new Set());
    if (!adj.has(e.target_gid)) adj.set(e.target_gid, new Set());
    adj.get(e.source_gid).add(e.target_gid);
    adj.get(e.target_gid).add(e.source_gid);
  });
  const visited = new Set();
  const groups = [];
  _nodes.forEach(n => {
    if (visited.has(n.gid)) return;
    if (!adj.get(n.gid) || adj.get(n.gid).size === 0) return;
    const group = [];
    const queue = [n.gid];
    visited.add(n.gid);
    while (queue.length) {
      const cur = queue.shift();
      group.push(cur);
      (adj.get(cur) || new Set()).forEach(nb => {
        if (!visited.has(nb) && _nodes.some(x => x.gid === nb)) {
          visited.add(nb); queue.push(nb);
        }
      });
    }
    if (group.length > 0) groups.push(group);
  });
  return groups;
}

// Pan/zoom canvas so node is visible, expand ancestors if needed, select node
function _panToNode(gid) {
  // Expand all collapsed ancestors
  let cur = gid;
  const toExpand = [];
  while (true) {
    const pEdge = _edges.find(e => _isCompose(e) && e.target_gid === cur);
    if (!pEdge) break;
    toExpand.unshift(pEdge.source_gid);
    cur = pEdge.source_gid;
  }
  let needRender = false;
  toExpand.forEach(ag => {
    if (_collapsed.has(ag)) { _collapsed.delete(ag); needRender = true; }
  });
  if (needRender) renderCanvas();
  // Center viewport on node
  const n = _nodes.find(x => x.gid === gid);
  if (!n) return;
  const vRect = viewport.getBoundingClientRect();
  _tx = (vRect.width  / 2) / _scale - n.canvas_x - 80;
  _ty = (vRect.height / 2) / _scale - n.canvas_y - 30;
  applyTransform();
  selectNode(gid);
  // Highlight the item in focus panel
  document.querySelectorAll('#focusPanelBody .st-fi-item').forEach(el => {
    el.classList.toggle('active', el.dataset.gid === gid);
  });
}

function renderFocusPanel() {
  const body = document.getElementById('focusPanelBody');
  if (!body) return;
  const q = _focusSearch.trim().toLowerCase();
  const match = n => !q || (n.title || '').toLowerCase().includes(q);

  let html = '';

  if (_focusChainAnchor !== null) {
    // "仅看此链" mode
    const groups = _getDepGroups();
    const group = groups.find(g => g.includes(_focusChainAnchor)) || [];
    html += `<button class="st-fi-back-btn" id="focusPanelBack">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      返回全部
    </button>`;
    const nodes = group.map(g => _nodes.find(x => x.gid === g)).filter(n => n && match(n));
    if (nodes.length === 0) {
      html += `<div class="st-fi-empty">无匹配节点</div>`;
    } else {
      nodes.forEach(n => {
        const badge = n.node_type === 'important' ? '<span class="st-fi-badge imp">重</span>'
                    : n.node_type === 'core'      ? '<span class="st-fi-badge core">关</span>' : '';
        html += `<div class="st-fi-item" data-gid="${n.gid}"><span class="st-fi-title">${_escHtml(n.title || '（无标题）')}</span>${badge}</div>`;
      });
    }
    body.innerHTML = html;
    body.querySelector('#focusPanelBack')?.addEventListener('click', () => {
      _focusChainAnchor = null; renderFocusPanel();
    });
    body.querySelectorAll('.st-fi-item[data-gid]').forEach(el =>
      el.addEventListener('click', () => _panToNode(el.dataset.gid)));
    return;
  }

  const showCore = _focusFilter === 'all' || _focusFilter === 'core';
  const showImp  = _focusFilter === 'all' || _focusFilter === 'important';
  const showDep  = _focusFilter === 'all' || _focusFilter === 'dep';
  let hasContent = false;

  // 关卡节点
  if (showCore) {
    const nodes = _nodes.filter(n => n.node_type === 'core' && match(n));
    if (nodes.length > 0) {
      hasContent = true;
      html += `<div class="st-fi-section"><div class="st-fi-sec-hdr"><span class="st-fi-badge core">关</span>关卡节点</div>`;
      nodes.forEach(n => {
        html += `<div class="st-fi-item" data-gid="${n.gid}"><span class="st-fi-title">${_escHtml(n.title || '（无标题）')}</span></div>`;
      });
      html += '</div>';
    }
  }

  // 重点节点
  if (showImp) {
    const nodes = _nodes.filter(n => n.node_type === 'important' && match(n));
    if (nodes.length > 0) {
      hasContent = true;
      html += `<div class="st-fi-section"><div class="st-fi-sec-hdr"><span class="st-fi-badge imp">重</span>重点节点</div>`;
      nodes.forEach(n => {
        html += `<div class="st-fi-item" data-gid="${n.gid}"><span class="st-fi-title">${_escHtml(n.title || '（无标题）')}</span></div>`;
      });
      html += '</div>';
    }
  }

  // 依赖链条
  if (showDep) {
    const groups = _getDepGroups();
    const filteredGroups = groups
      .map(g => g.filter(gid => { const n = _nodes.find(x => x.gid === gid); return n && match(n); }))
      .filter(g => g.length > 0);
    if (filteredGroups.length > 0) {
      hasContent = true;
      html += `<div class="st-fi-section"><div class="st-fi-sec-hdr"><span class="st-fi-badge dep">→</span>依赖链条</div>`;
      filteredGroups.forEach((group, gi) => {
        html += `<div class="st-fi-chain-row">
          <span>链条 ${gi + 1}（${group.length}节点）</span>
          <button class="st-fi-chain-btn" data-chain-anchor="${group[0]}">仅看此链</button>
        </div>`;
        group.forEach(gid => {
          const n = _nodes.find(x => x.gid === gid);
          if (!n) return;
          const badge = n.node_type === 'important' ? '<span class="st-fi-badge imp">重</span>'
                      : n.node_type === 'core'      ? '<span class="st-fi-badge core">关</span>' : '';
          html += `<div class="st-fi-item" data-gid="${gid}"><span class="st-fi-title">${_escHtml(n.title || '（无标题）')}</span>${badge}</div>`;
        });
      });
      html += '</div>';
    }
  }

  if (!hasContent) {
    html += `<div class="st-fi-empty">暂无内容<br>添加关卡/重点节点<br>或创建依赖连线</div>`;
  }

  body.innerHTML = html;
  body.querySelectorAll('.st-fi-item[data-gid]').forEach(el =>
    el.addEventListener('click', () => _panToNode(el.dataset.gid)));
  body.querySelectorAll('.st-fi-chain-btn[data-chain-anchor]').forEach(el =>
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      _focusChainAnchor = el.dataset.chainAnchor;
      renderFocusPanel();
    }));
}

function _toggleFocusPanel(open) {
  _focusOpen = (open !== undefined) ? open : !_focusOpen;
  const panel = document.getElementById('focusPanel');
  panel.classList.toggle('fp-collapsed', !_focusOpen);
  document.getElementById('btnToggleFocus').classList.toggle('active', _focusOpen);
  if (_focusOpen) renderFocusPanel();
}

document.getElementById('btnToggleFocus').addEventListener('click', () => _toggleFocusPanel());
document.getElementById('btnFocusPanelClose').addEventListener('click', () => _toggleFocusPanel(false));

document.getElementById('focusSearch').addEventListener('input', e => {
  _focusSearch = e.target.value;
  renderFocusPanel();
});

document.getElementById('focusFilters').addEventListener('click', e => {
  const btn = e.target.closest('[data-filt]');
  if (!btn) return;
  _focusFilter = btn.dataset.filt;
  _focusChainAnchor = null;
  document.querySelectorAll('#focusFilters [data-filt]').forEach(b =>
    b.classList.toggle('active', b.dataset.filt === _focusFilter));
  renderFocusPanel();
});
</script>
