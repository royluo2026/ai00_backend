<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>任务规划</title>
<style>
/* ── Catppuccin Latte 变量（默认浅色） ── */
:root {
  --rosewater:#dc8a78; --flamingo:#dd7878; --pink:#ea76cb; --mauve:#8839ef;
  --red:#d20f39; --maroon:#e64553; --peach:#fe640b; --yellow:#df8e1d;
  --green:#40a02b; --teal:#179299; --sky:#04a5e5; --sapphire:#209fb5;
  --blue:#1e66f5; --lavender:#7287fd;
  --text:#4c4f69; --subtext1:#5c5f77; --subtext0:#6c6f85;
  --overlay2:#7c7f93; --overlay1:#8c8fa1; --overlay0:#9ca0b0;
  --surface2:#acb0be; --surface1:#bcc0cc; --surface0:#ccd0da;
  --base:#eff1f5; --mantle:#e6e9ef; --crust:#dce0e8;

  --bg: var(--base); --bg2: var(--mantle); --sidebar-bg: var(--crust);
  --border: var(--surface0); --hover: var(--surface0);
  --accent: var(--blue); --text-muted: var(--overlay0);
  --node-normal-bg: var(--surface0); --node-imp-bg: #e0e4ff;
  --node-core-bg: #ffeedd; --canvas-bg: #f5f5f8;
  --edge-branch: var(--blue); --edge-dep: #9ca0b0;
  --prereq-src-ring: var(--mauve); --prereq-tgt-ring: var(--red);
  --panel-bg: var(--base); --toolbar-bg: var(--crust);
}
[data-theme="dark"] {
  --bg:#1e1e2e; --bg2:#181825; --sidebar-bg:#13131f;
  --border:#313244; --hover:#2a2a3d; --accent:#89b4fa;
  --text:#cdd6f4; --text-muted:#6c7086;
  --node-normal-bg:#2a2a3d; --node-imp-bg:#1e2052; --node-core-bg:#3d2010;
  --canvas-bg:#181825;
  --edge-branch:#89b4fa; --edge-dep:#585b70;
  --panel-bg:#1e1e2e; --toolbar-bg:#13131f;
  --surface0:#313244; --surface1:#45475a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,sans-serif;font-size:13px;}

/* ── Layout ── */
.st-layout{display:flex;flex-direction:column;height:100%;}
.st-toolbar{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:var(--toolbar-bg);border-bottom:1px solid var(--border);
  flex-shrink:0;user-select:none;
}
.st-body{display:flex;flex:1;overflow:hidden;}
.st-sidebar{
  width:180px;flex-shrink:0;background:var(--sidebar-bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;transition:width .18s ease;
}
.st-sidebar.collapsed{ width:32px; }
.st-sidebar.collapsed .st-tree-list,
.st-sidebar.collapsed .st-sidebar-hdr span,
.st-sidebar.collapsed #btnNewTree{ display:none; }
.st-main{flex:1;position:relative;overflow:hidden;background:var(--canvas-bg);}
.st-panel{
  width:220px;flex-shrink:0;background:var(--panel-bg);
  border-left:none;overflow-y:auto;
  display:flex;flex-direction:column;
  transition:width .18s ease;
}
.st-panel.collapsed{width:0;overflow:hidden;}
/* 折叠按钮 */
#btnTogglePanel{
  width:14px;flex-shrink:0;background:var(--panel-bg);
  border:none;border-left:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);padding:0;transition:background .12s,color .12s;
}
#btnTogglePanel:hover{background:var(--hover);color:var(--text);}
#btnTogglePanel .tp-chev{transition:transform .18s ease;display:flex;}

/* ── Toolbar ── */
.st-btn{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  cursor:pointer;font-size:12px;transition:background .12s;white-space:nowrap;
}
.st-btn:hover{background:var(--hover);}
.st-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.st-btn svg{flex-shrink:0;}
.st-sep{width:1px;height:22px;background:var(--border);margin:0 2px;}
.st-zoom-label{font-size:12px;color:var(--text-muted);min-width:42px;text-align:center;}

/* ── Sidebar (tree list) ── */
.st-sidebar-hdr{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-muted);padding:10px 8px 6px 12px;user-select:none;
  display:flex;align-items:center;gap:2px;
}
.st-sidebar-hdr span{ flex:1; }
.st-sidebar-hdr button{
  background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:18px;line-height:1;padding:0 2px;
}
.st-sidebar-hdr button:hover{opacity:.75;}
/* collapse toggle — always visible even when sidebar is collapsed */
.st-sidebar-collapse{
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--text-muted);cursor:pointer;flex-shrink:0;
  transition:color .12s; font-size:14px;
}
.st-sidebar-collapse:hover{color:var(--text);}
/* when collapsed: show ONLY the collapse button in hdr, not hidden like other hdr buttons */
.st-sidebar.collapsed .st-sidebar-hdr button:not(.st-sidebar-collapse){ display:none; }
.st-sidebar.collapsed .st-sidebar-collapse{ display:flex; }
.st-tree-list{flex:1;overflow-y:auto;padding:4px 6px;}
.st-tree-item{
  display:flex;align-items:center;gap:6px;padding:7px 8px;
  border-radius:6px;cursor:pointer;transition:background .12s;
  font-size:12px;color:var(--text);
}
.st-tree-item:hover{background:var(--hover);}
.st-tree-item.active{background:var(--accent);color:#fff;}
.st-tree-item .st-ti-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st-tree-item .st-ti-del{
  flex-shrink:0;opacity:0;background:none;border:none;cursor:pointer;
  color:inherit;font-size:14px;padding:1px 3px;
}
.st-tree-item:hover .st-ti-del{opacity:.7;}
.st-tree-item.active .st-ti-del{opacity:.8;}
.st-tree-empty{padding:20px 12px;text-align:center;color:var(--text-muted);font-size:12px;}
/* ── View sub-items under each list ── */
.st-view-item{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px 4px 24px;
  border-radius:5px;cursor:pointer;
  font-size:11px;color:var(--text-muted);
  user-select:none;
}
.st-view-item:hover{background:var(--hover);}
.st-view-item.active{background:var(--surface1);color:var(--accent);}
.st-view-item .st-vi-icon{flex-shrink:0;opacity:.6;}
.st-view-item.active .st-vi-icon{opacity:1;}
.st-view-item .st-vi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* View context menu */
.st-view-ctx{
  position:fixed;z-index:10000;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:4px 0;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.25);
  font-size:12px;
}
.st-view-ctx-item{
  padding:6px 14px;cursor:pointer;color:var(--text);white-space:nowrap;
}
.st-view-ctx-item:hover{background:var(--hover);}

/* ── Canvas ── */
.st-viewport{width:100%;height:100%;overflow:hidden;position:relative;cursor:default;
  background-image:radial-gradient(circle,var(--overlay0) 1px,transparent 1px);
  background-size:48px 48px;
}
.st-canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:4000px;height:3000px;}

/* ── Grid fixed axis overlays (live in #viewport, not in canvas) ── */
#glAxisCorner{
  position:absolute;z-index:12;
  background:var(--crust);
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  display:none;cursor:grab;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:10px;box-sizing:border-box;
}
#glAxisCorner:active{cursor:grabbing;}
#glColAxis{
  position:absolute;top:0;left:0;right:0;z-index:11;
  background:var(--crust);border-bottom:1px solid var(--border);
  overflow:hidden;display:none;pointer-events:none;box-sizing:border-box;
}
#glRowAxis{
  position:absolute;top:0;left:0;bottom:0;z-index:11;
  background:var(--crust);border-right:1px solid var(--border);
  overflow:hidden;display:none;pointer-events:none;box-sizing:border-box;
}
/* Individual header cells inside axes */
.gl-col-hdr,.gl-row-hdr{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--text);
  pointer-events:all;overflow:hidden;user-select:none;box-sizing:border-box;
}
.gl-col-hdr{ border-right:1px solid var(--border); top:0; bottom:0; }
.gl-row-hdr{ border-bottom:1px solid var(--border); left:0; right:0; }
.gl-header-label{
  flex:1;padding:0 6px;outline:none;cursor:default;
  text-align:center;overflow:hidden;white-space:normal;word-break:break-all;
  border-radius:3px;min-width:0;line-height:1.35;
}
.gl-header-label[contenteditable="true"]{
  cursor:text;background:var(--surface0);outline:1px solid var(--accent);
}
.gl-resize-h{
  position:absolute;right:0;top:0;bottom:0;width:5px;
  cursor:col-resize;background:transparent;pointer-events:all;transition:background .12s;
}
.gl-resize-h:hover{background:color-mix(in srgb,var(--accent) 50%,transparent);}
.gl-resize-v{
  position:absolute;bottom:0;left:0;right:0;height:5px;
  cursor:row-resize;background:transparent;pointer-events:all;transition:background .12s;
}
.gl-resize-v:hover{background:color-mix(in srgb,var(--accent) 50%,transparent);}
.gl-del-btn{
  position:absolute;opacity:0;pointer-events:all;
  background:var(--surface0);border:1px solid var(--border);
  border-radius:3px;cursor:pointer;color:var(--text-muted);
  font-size:10px;line-height:1;padding:1px 3px;transition:opacity .12s;
}
.gl-col-hdr:hover .gl-del-btn,.gl-row-hdr:hover .gl-del-btn{ opacity:.8; }
.gl-del-btn:hover{background:var(--red);color:#fff;border-color:var(--red);opacity:1;}
.gl-add-hdr{
  position:absolute;pointer-events:all;background:none;
  border:1px dashed var(--surface2);color:var(--text-muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;border-radius:4px;transition:background .12s,color .12s,border-color .12s;
  box-sizing:border-box;
}
.gl-add-hdr:hover{background:var(--hover);color:var(--text);border-color:var(--border);}
/* Grid layer (inside canvas — lines + hover overlay, no filled cells) */
#gridLayer{ position:absolute;pointer-events:none; }
.gl-vline{
  position:absolute;width:1px;background:var(--border);pointer-events:none;box-sizing:border-box;
}
.gl-hline{
  position:absolute;height:1px;background:var(--border);pointer-events:none;box-sizing:border-box;
}
.gl-hover-overlay{
  position:absolute;display:none;pointer-events:none;box-sizing:border-box;
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  transition:background .18s,border-color .18s;
}
@keyframes gl-enter-flash{
  0%  {background:color-mix(in srgb,var(--accent) 22%,transparent);}
  70% {background:color-mix(in srgb,var(--accent) 10%,transparent);}
  100%{background:color-mix(in srgb,var(--accent)  8%,transparent);}
}
.gl-hover-overlay.just-entered{animation:gl-enter-flash .45s ease-out forwards;}
.st-svg-overlay{position:absolute;inset:0;overflow:visible;pointer-events:none;}
.st-svg-overlay path,
.st-svg-overlay line,
.st-svg-overlay polygon{pointer-events:stroke;}

/* ── Node cards ── */
.st-node{
  position:absolute;transform:translate(-50%,-50%);
  width:144px;
  display:flex;flex-direction:row;
  cursor:pointer;user-select:none;
  box-shadow:0 1px 4px rgba(0,0,0,.10);
  transition:box-shadow .12s;
  border-radius:6px;
  z-index:1;
}
.st-node:hover{ box-shadow:0 3px 10px rgba(0,0,0,.20); }
.st-node.selected{
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent) !important;
}

/* ── Status bar (left strip) — owns its own style, no border ── */
.st-status-bar{
  width:6px;flex-shrink:0;position:relative;overflow:hidden;
  border-radius:6px 0 0 6px;
}
/* track (background) per status */
.st-node.status-pending    .st-status-bar { background:color-mix(in srgb,var(--overlay0) 30%,transparent); }
.st-node.status-in_progress .st-status-bar{ background:color-mix(in srgb,var(--yellow)  20%,transparent); }
.st-node.status-done       .st-status-bar { background:color-mix(in srgb,var(--green)   20%,transparent); }
.st-node.status-blocked    .st-status-bar { background:color-mix(in srgb,var(--red)     20%,transparent); }
/* fill (grows from bottom = completion %) */
.st-status-fill{
  position:absolute;bottom:0;left:0;right:0;
  transition:height .35s ease;
}
.st-node.status-pending    .st-status-fill { background:var(--overlay0); }
.st-node.status-in_progress .st-status-fill{ background:var(--yellow); }
.st-node.status-done       .st-status-fill { background:var(--green); }
.st-node.status-blocked    .st-status-fill { background:var(--red); }
/* breathing glow on in_progress fill only */
@keyframes st-bar-breathe{
  0%,100%{ opacity:.8;  filter:drop-shadow(0 0 0px transparent); }
  50%    { opacity:1;   filter:drop-shadow(0 0 4px var(--yellow)); }
}
.st-node.status-in_progress .st-status-fill{ animation:st-bar-breathe 2s ease-in-out infinite; }

/* ── Card body — owns its own border + background ── */
.st-card-body{
  flex:1;min-width:0;padding:5px 8px 5px 6px;
  background:var(--panel-bg);
  border-top:    1.5px solid var(--border);
  border-right:  1.5px solid var(--border);
  border-bottom: 1.5px solid var(--border);
  border-radius: 0 6px 6px 0;
}
/* Node type = right-top corner badge ("重" / "关") */
.st-node-type-badge{
  position:absolute;top:-8px;right:4px;
  font-size:9px;font-weight:800;line-height:1;
  padding:2px 5px;border-radius:3px;
  color:#fff;pointer-events:none;letter-spacing:.5px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.st-node.nt-important .st-node-type-badge{ background:#f97316; }
.st-node.nt-core      .st-node-type-badge{ background:#e53935; }
.st-node.selected        .st-card-body{ border-top-color:var(--accent) !important; border-right-color:var(--accent) !important; border-bottom-color:var(--accent) !important; }
.st-node.prereq-highlight-src .st-card-body{ border-top-color:var(--mauve) !important; border-right-color:var(--mauve) !important; border-bottom-color:var(--mauve) !important; }
.st-node.prereq-highlight-tgt .st-card-body{ border-top-color:var(--red)   !important; border-right-color:var(--red)   !important; border-bottom-color:var(--red)   !important; }

/* Row 1: icon + label */
.st-card-row1{display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.st-card-icon{width:11px;height:11px;flex-shrink:0;color:var(--text-muted);}
.st-node.nt-important .st-card-icon{ color:#f97316; }
.st-node.nt-core      .st-card-icon{ color:#e53935; }
.st-card-label{
  flex:1;min-width:0;
  font-size:11.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* Display ID badge */
.st-card-display-id{
  font-size:9px;color:var(--text-muted);letter-spacing:.2px;
  margin-bottom:2px;
}

/* Owner row */
.st-card-owner{
  font-size:9.5px;color:var(--text-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:2px;display:flex;align-items:center;gap:3px;
}
/* Node description tooltip */
.st-node-desc-tip{
  position:fixed;pointer-events:none;z-index:9999;display:none;
  max-width:240px;white-space:pre-wrap;word-break:break-word;
  background:var(--panel-bg);color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:7px 10px;font-size:12px;line-height:1.5;
  box-shadow:0 4px 14px rgba(0,0,0,.30);
}
/* Dates row */
.st-card-dates{
  font-size:9.5px;color:var(--text-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:3px;display:flex;align-items:center;gap:3px;
}

/* Row 3: children badge */
.st-card-row3{display:flex;align-items:center;gap:5px;}

/* Children collapse badge */
.st-children-badge{
  font-size:9px;font-weight:700;
  padding:1px 4px;border-radius:3px;
  background:var(--surface1);color:var(--text-muted);
  cursor:pointer;flex-shrink:0;white-space:nowrap;
  transition:background .1s,color .1s;
}
.st-children-badge:hover{background:var(--hover);color:var(--text);}
.st-children-badge.collapsed{
  background:color-mix(in srgb,var(--blue) 18%,var(--surface1));
  color:var(--blue);
}

/* ── Quick-add (+) buttons on node hover ── */
.st-node-qbtn {
  position:absolute;width:17px;height:17px;
  background:var(--blue);color:#fff;
  border:1.5px solid rgba(255,255,255,.7);border-radius:50%;
  cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s,background .12s;
  z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:0;
}
.st-node:hover .st-node-qbtn { opacity:1; }
.st-node-qbtn:hover { background:var(--sapphire) !important; opacity:1 !important; }
.st-qbtn-down { bottom:-11px; left:50%; transform:translateX(-50%); }
.st-qbtn-right{ right:-11px; top:50%; transform:translateY(-50%); }

/* edge preview line */
.st-preview-line{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;fill:none;}

/* ── Right Panel ── */
.st-panel-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-muted);gap:10px;font-size:12px;
}
.st-panel-empty svg{opacity:.35;}
.st-panel-form{padding:12px;display:flex;flex-direction:column;gap:10px;}
.st-panel-form label{font-size:11px;color:var(--text-muted);margin-bottom:2px;display:block;}
.st-panel-form input[type=text],
.st-panel-form input[type=date],
.st-panel-form input[type=number],
.st-panel-form textarea,
.st-panel-form select{
  width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:5px;
  background:var(--bg2);color:var(--text);font-size:12px;outline:none;
  resize:vertical;
}
.st-panel-form input[type=text]:focus,
.st-panel-form input[type=date]:focus,
.st-panel-form input[type=number]:focus,
.st-panel-form textarea:focus,
.st-panel-form select:focus{border-color:var(--accent);}
.st-panel-form input[type=range]{width:100%;}
.st-panel-form .st-field{display:flex;flex-direction:column;}
.st-panel-form .st-row{display:flex;gap:8px;}
.st-panel-form .st-row .st-field{flex:1;}
.st-panel-sep{height:1px;background:var(--border);margin:4px 0;}
.st-panel-title{
  font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.07em;
  text-transform:uppercase;padding:10px 12px 4px;
}
.st-panel-delete{
  margin:4px 12px 12px;padding:6px;border-radius:6px;border:1px solid var(--red);
  background:none;color:var(--red);cursor:pointer;font-size:12px;width:calc(100% - 24px);
}
.st-panel-delete:hover{background:var(--red);color:#fff;}
.st-panel-reset-path{
  margin:4px 12px 2px;padding:6px;border-radius:6px;border:1px solid var(--border);
  background:none;color:var(--text-muted);cursor:pointer;font-size:12px;width:calc(100% - 24px);
}
.st-panel-reset-path:hover{background:var(--hover);color:var(--text);}
.st-type-btns{display:flex;gap:6px;}
.st-type-btn{
  flex:1;padding:5px 4px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text-muted);cursor:pointer;font-size:11px;
  text-align:center;transition:all .12s;
}
.st-type-btn:hover{background:var(--hover);}
.st-type-btn.active-normal{background:var(--surface1);color:var(--text);border-color:var(--text-muted);}
.st-type-btn.active-important{background:#fff3e8;color:#f97316;border-color:#f97316;}
.st-type-btn.active-core{background:#ffeaea;color:#e53935;border-color:#e53935;}
[data-theme="dark"] .st-type-btn.active-important{background:#3d2200;color:#fb923c;}
[data-theme="dark"] .st-type-btn.active-core{background:#3d0a0a;color:#f87171;}

/* icon picker */
.st-icon-btn{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;
  border:1px solid var(--border);background:var(--bg2);color:var(--text);
  cursor:pointer;font-size:12px;width:100%;
}
.st-icon-btn:hover{background:var(--hover);}
.st-icon-picker-overlay{
  position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
.st-icon-picker{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  width:440px;max-height:500px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.st-ip-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:13px;
}
.st-ip-header button{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;}
.st-ip-body{overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px;}
.st-ip-cat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:4px;font-weight:600;}
.st-ip-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.st-ip-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:6px;cursor:pointer;transition:background .12s;
}
.st-ip-item:hover{background:var(--hover);}
.st-ip-item.selected{background:var(--accent);color:#fff;}
.st-ip-item svg{width:22px;height:22px;}
.st-ip-item span{font-size:9px;color:var(--text-muted);text-align:center;line-height:1.1;}
.st-ip-item.selected span{color:rgba(255,255,255,.85);}

/* completion */
.st-completion-val{font-size:11px;color:var(--accent);font-weight:600;}

/* children badge on node ring */
.st-children-badge {
  position:absolute;bottom:-4px;right:-4px;
  background:var(--blue);color:#fff;
  font-size:9px;font-weight:700;line-height:1;
  padding:2px 5px;border-radius:8px;
  min-width:16px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  cursor:pointer;z-index:2;
  transition:background .12s;
}
.st-children-badge:hover{background:var(--sapphire);}
.st-children-badge.collapsed{background:var(--overlay0);}

/* Blocked reason in panel */
.st-blocked-reason{
  margin:0 12px 8px;padding:7px 10px;
  background:rgba(210,15,57,.07);border:1px solid rgba(210,15,57,.22);
  border-radius:6px;font-size:11px;color:var(--red);line-height:1.55;
}
[data-theme="dark"] .st-blocked-reason{background:rgba(243,139,168,.07);border-color:rgba(243,139,168,.22);color:#f38ba8;}
/* Status buttons in panel */
.st-status-btns{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;}
.st-status-btn{
  flex:1;min-width:0;padding:4px 3px;border-radius:5px;
  border:1px solid var(--border);background:var(--bg2);
  color:var(--text-muted);cursor:pointer;font-size:10px;
  text-align:center;transition:all .12s;
}
.st-status-btn:hover{background:var(--hover);}
.st-status-btn.sp{background:var(--surface1);color:var(--text);border-color:var(--text-muted);}
.st-status-btn.sip{background:rgba(30,102,245,.1);color:var(--blue);border-color:var(--blue);}
.st-status-btn.sd{background:rgba(64,160,43,.1);color:var(--green);border-color:var(--green);}
.st-status-btn.sb{background:rgba(210,15,57,.08);color:var(--red);border-color:var(--red);cursor:default;}
[data-theme="dark"] .st-status-btn.sip{background:rgba(137,180,250,.1);color:#89b4fa;border-color:#89b4fa;}
[data-theme="dark"] .st-status-btn.sd{background:rgba(166,227,161,.1);color:#a6e3a1;border-color:#a6e3a1;}
[data-theme="dark"] .st-status-btn.sb{background:rgba(243,139,168,.08);color:#f38ba8;border-color:#f38ba8;}
/* dep-only fields in edge panel */
.st-dep-only{display:none;}

/* locked completion hint (parent node) */
.st-comp-locked-hint {
  font-size:11px;color:var(--text-muted);font-style:italic;margin-top:3px;
}
/* children list in property panel */
.st-children-list {
  display:flex;flex-direction:column;gap:4px;margin-top:4px;
}
.st-child-row {
  display:flex;align-items:center;gap:6px;padding:5px 8px;
  border-radius:5px;cursor:pointer;background:var(--bg2);
  border:1px solid var(--border);transition:background .12s;
}
.st-child-row:hover { background:var(--hover); }
.st-child-name { flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.st-child-pct { font-size:11px;color:var(--accent);font-weight:600;flex-shrink:0; }

/* custom prompt/confirm dialog */
.st-dlg-overlay{
  position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
}
.st-dlg{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:20px 22px;min-width:280px;max-width:360px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;
}
.st-dlg p{font-size:13px;color:var(--text);}
.st-dlg input[type=text]{
  width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg2);color:var(--text);font-size:13px;outline:none;
}
.st-dlg input[type=text]:focus{border-color:var(--accent);}
.st-dlg-btns{display:flex;gap:8px;justify-content:flex-end;}
.st-dlg-btns button{
  padding:5px 16px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);cursor:pointer;font-size:12px;
}
.st-dlg-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.st-dlg-btns button:hover{opacity:.85;}

/* ── Focus Panel ── */
.st-focus-panel{
  width:200px;flex-shrink:0;background:var(--sidebar-bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;transition:width .18s ease;
}
.st-focus-panel.fp-collapsed{width:0;}
.st-focus-hdr{
  display:flex;align-items:center;gap:5px;
  padding:7px 8px 6px;border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.st-focus-hdr span{font-size:12px;font-weight:600;flex:1;}
.st-focus-hdr button{
  background:none;border:none;cursor:pointer;padding:2px;
  color:var(--text-muted);line-height:1;border-radius:3px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.st-focus-hdr button:hover{background:var(--hover);color:var(--text);}
.st-focus-search{padding:5px 8px;flex-shrink:0;border-bottom:1px solid var(--border);}
.st-focus-search input{
  width:100%;padding:3px 7px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);font-size:11px;outline:none;
}
.st-focus-search input:focus{border-color:var(--accent);}
.st-focus-filters{
  display:flex;gap:3px;padding:5px 8px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.st-focus-filters button{
  padding:2px 7px;border-radius:10px;border:1px solid var(--border);
  background:none;color:var(--subtext1);font-size:10px;cursor:pointer;line-height:1.4;
}
.st-focus-filters button:hover{background:var(--hover);}
.st-focus-filters button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.st-focus-body{flex:1;overflow-y:auto;padding:4px 0;}
.st-fi-section{margin-bottom:2px;}
.st-fi-sec-hdr{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px 3px;font-size:10px;font-weight:700;
  color:var(--text-muted);letter-spacing:.4px;
}
.st-fi-badge{
  font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;
  color:#fff;flex-shrink:0;
}
.st-fi-badge.imp{background:#f97316;}
.st-fi-badge.core{background:#e53935;}
.st-fi-badge.dep{background:var(--accent);font-style:normal;}
.st-fi-item{
  padding:4px 12px;font-size:11px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);line-height:1.4;border-radius:3px;margin:0 4px;
  display:flex;align-items:center;gap:4px;
}
.st-fi-item:hover{background:var(--hover);}
.st-fi-item.active{background:var(--accent);color:#fff;}
.st-fi-item > .st-fi-badge{margin-left:auto;}
.st-fi-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st-fi-chain-row{
  padding:2px 10px 1px;font-size:10px;font-weight:600;
  color:var(--subtext0);display:flex;align-items:center;gap:4px;
}
.st-fi-chain-btn{
  font-size:9px;padding:1px 5px;border-radius:3px;
  border:1px solid var(--border);background:none;cursor:pointer;
  color:var(--subtext1);margin-left:auto;flex-shrink:0;
}
.st-fi-chain-btn:hover{background:var(--hover);}
.st-fi-back-btn{
  display:flex;align-items:center;gap:4px;

.st-fi-empty{
  padding:20px 12px;text-align:center;font-size:11px;
  color:var(--text-muted);line-height:1.7;
}

<script>
'use strict';

// ── cloud infrastructure ──
function _cf(path, opts = {}) {
  const fn = window.parent?._cloudFetch || window._cloudFetch;
  if (!fn) return Promise.resolve(null);
  return fn(path, opts);
}

// Task status mapping: canvas uses 'done', DB uses 'completed'
function _toDbStatus(s) { return s === 'done' ? 'completed' : s; }
function _toCanvasStatus(s) { return s === 'completed' ? 'done' : (s || 'pending'); }

// Owner GID cache removed — owner shown as raw GID on card

// Normalize task from DB to canvas internal format
function _remapTask(t) {
  return Object.assign({}, t, {
    _placed:        t.canvas_x != null,
    canvas_x:       t.canvas_x ?? 200,
    canvas_y:       t.canvas_y ?? 200,
    canvas_icon:    t.canvas_icon || 'star',
    node_type:      t.node_type  || 'normal',
    completion:     t.completion || 0,
    status:         _toCanvasStatus(t.status),
    description:    t.description || '',
    owner_name:     t.owner_name  || '',
    canvas_row_gid: t.canvas_row_gid || null,
    canvas_col_gid: t.canvas_col_gid || null,
  });
}

// ── API wrappers (cloud-only) ──
async function _apiListLists() {
  try {
    const d = await _cf('/api/lists?item_type=task');
    return (d?.data ?? []).map(l => ({ ...l, _source: 'cloud' }));
  } catch (e) { console.warn('[TaskCanvas] 清单加载失败:', e); return []; }
}

async function _apiListTasks(listGid, placedOnly = false) {
  try {
    const d = await _cf(`/api/tasks?list_gid=${listGid}`);
    let t = (d?.data ?? []).map(_remapTask);
    if (placedOnly) t = t.filter(n => n._placed);
    return t;
  } catch(e) { console.warn('[TaskCanvas] tasks 加载失败:', e.message); return []; }
}

async function _apiListDeps(listGid) {
  try { const d = await _cf(`/api/task-dependencies?list_gid=${listGid}`); return d?.data ?? []; }

}

async function _apiCreateTask(listGid, title, nodeType, cx, cy, extraFields = {}) {
  const d = await _cf('/api/tasks', { method: 'POST',
    body: JSON.stringify({ title, node_type: nodeType, canvas_x: cx, canvas_y: cy, list_gid: listGid, status: 'pending', ...extraFields }) });
  return d?.data?.gid ? { success: true, data: _remapTask(d.data) } : { success: false };
}

async function _apiUpdateTask(gid, fields) {
  const dbFields = Object.assign({}, fields);
  if ('status' in dbFields) dbFields.status = _toDbStatus(dbFields.status);
  await _cf(`/api/tasks/${gid}`, { method: 'PUT', body: JSON.stringify(dbFields) });
}

async function _apiUpdateCanvas(gid, fields) {
  await _cf(`/api/tasks/${gid}`, { method: 'PUT', body: JSON.stringify(fields) });
}

async function _apiDeleteTask(gid) {
  await _cf(`/api/tasks/${gid}`, { method: 'DELETE' });
}

async function _apiCreateDep(sourceGid, targetGid, edgeType, depCondition, depGroup, label) {
  const body = { source_gid: sourceGid, target_gid: targetGid, edge_type: edgeType,
    dep_condition: depCondition || 'done', dep_group: depGroup || null, label: label || '' };
  const d = await _cf('/api/task-dependencies', { method: 'POST', body: JSON.stringify(body) });
  return d?.data?.gid ? { success: true, data: d.data } : { success: false };
}

async function _apiUpdateDep(gid, fields) {
  await _cf(`/api/task-dependencies/${gid}`, { method: 'PUT', body: JSON.stringify(fields) });
}

async function _apiDeleteDep(gid) {

}

async function _apiListViews(listGid) {
  try {
    const d = await _cf(`/api/views?module=task&list_gid=${listGid}`);
    if (d?.data?.length) return d.data;
  } catch(e) {}
  try {
    const stored = JSON.parse(localStorage.getItem(`vm_views_task_${listGid}`) || '[]');
    const global  = JSON.parse(localStorage.getItem('vm_views_task_global') || '[]');
    return [...stored, ...global];
  } catch(e) {}
  return [];
}

function _getViewDefaultFields() {
  if (!_currentView?.config?.filters?.length) return {};
  const fields = {};
  for (const f of _currentView.config.filters) {
    if (f.op === 'eq') fields[f.field] = f.value;
    else if (f.op === 'in' && Array.isArray(f.value) && f.value.length === 1) fields[f.field] = f.value[0];
  }
  return fields;
}

// ── Custom dialogs (prompt/confirm broken in Electron renderer) ──
function _prompt(msg, defaultVal = '') {
  return new Promise(resolve => {
    document.getElementById('stDlgMsg').textContent = msg;
    const inp = document.getElementById('stDlgInput');
    inp.style.display = 'block';
    inp.value = defaultVal;
    document.getElementById('stDlgOverlay').style.display = 'flex';
    setTimeout(() => inp.focus(), 50);
    const ok = document.getElementById('stDlgOk');
    const cancel = document.getElementById('stDlgCancel');
    const close = document.getElementById('stDlgOverlay');
    function finish(val) {
      document.getElementById('stDlgOverlay').style.display = 'none';
      inp.style.display = 'none';
      ok.onclick = null; cancel.onclick = null; close.onclick = null;
      resolve(val);
    }
    ok.onclick = () => finish(inp.value.trim() || null);
    cancel.onclick = () => finish(null);
    close.onclick = e => { if (e.target === close) finish(null); };
    inp.onkeydown = e => { if (e.key === 'Enter') finish(inp.value.trim() || null); if (e.key === 'Escape') finish(null); };
  });
}
function _confirm(msg) {
  return new Promise(resolve => {
    document.getElementById('stDlgMsg').textContent = msg;
    document.getElementById('stDlgInput').style.display = 'none';
    document.getElementById('stDlgOverlay').style.display = 'flex';
    const ok = document.getElementById('stDlgOk');
    const cancel = document.getElementById('stDlgCancel');
    const close = document.getElementById('stDlgOverlay');
    function finish(val) {
      document.getElementById('stDlgOverlay').style.display = 'none';
      ok.onclick = null; cancel.onclick = null; close.onclick = null;
      resolve(val);
    }
    ok.onclick = () => finish(true);
    cancel.onclick = () => finish(false);
    close.onclick = e => { if (e.target === close) finish(false); };
  });
}

// ── Parent-child completion helpers ──
// In the synthesis tree model (LoL-style):
//   dep edge: source_gid=prereq/ingredient, target_gid=synthesized_item
// ── Semantic edge helpers ──
// compose edges  (edge_type:'compose' or legacy 'branch') = 下级/材料，完成度向上聚合
// prerequisite edges (edge_type:'prerequisite' or legacy 'dependency') = 前置条件，控制阻塞
function _isCompose(e)   { return e.edge_type === 'compose'      || e.edge_type === 'branch'; }
function _isPrereq(e)    { return e.edge_type === 'prerequisite' || e.edge_type === 'dependency'; }
function _isSequence(e)  { return e.edge_type === 'sequence'; }

// inputs (incoming edges, left side)
function _getComposeInputs(nodeGid)  { return _edges.filter(e => _isCompose(e)  && e.target_gid === nodeGid).map(e => e.source_gid); }
function _getPrereqInputs(nodeGid)   { return _edges.filter(e => _isPrereq(e)   && e.target_gid === nodeGid).map(e => e.source_gid); }
function _hasComposeInputs(nodeGid)  { return _edges.some(e => _isCompose(e)  && e.target_gid === nodeGid); }

// outputs (outgoing compose edges, right side — what this node is a material for)
function _getComposeOutputs(nodeGid) { return _edges.filter(e => _isCompose(e) && e.source_gid === nodeGid).map(e => e.target_gid); }

// Tree hierarchy: parent → child direction (compose edge source=parent, target=child)
function _getChildGids(nodeGid)  { return _getComposeOutputs(nodeGid); }
function _getParentGids(nodeGid) { return _getComposeInputs(nodeGid); }
function _hasChildren(nodeGid)   { return _edges.some(e => _isCompose(e) && e.source_gid === nodeGid); }

// ── Collapse helpers ──
function _getDescendants(gid) {
  const result = new Set();
  const stack = [gid];
  while (stack.length) {
    const g = stack.pop();
    _getChildGids(g).forEach(c => { if (!result.has(c)) { result.add(c); stack.push(c); } });
  }
  return result;
}
function _getHiddenGids() {
  const hidden = new Set();
  _collapsed.forEach(gid => _getDescendants(gid).forEach(d => hidden.add(d)));
  return hidden;
}
// Compute depth of each node (root = 0)
function _computeDepths() {
  const depth = {};
  _nodes.forEach(n => { depth[n.gid] = Infinity; });
  // roots = nodes with no incoming compose edge (nodes with no parent in the hierarchy)
  const roots = _nodes.filter(n => !_edges.some(e => _isCompose(e) && e.target_gid === n.gid));
  const queue = roots.map(n => ({ gid: n.gid, d: 0 }));
  while (queue.length) {
    const { gid, d } = queue.shift();
    if (depth[gid] <= d) continue;
    depth[gid] = d;
    _getChildGids(gid).forEach(c => queue.push({ gid: c, d: d + 1 }));
  }
  // unreachable nodes (cycles or disconnected) → depth 0
  _nodes.forEach(n => { if (depth[n.gid] === Infinity) depth[n.gid] = 0; });
  return depth;
}
function _setExpandToLevel(maxLevel) {
  _collapsed.clear();
  const depths = _computeDepths();
  _nodes.forEach(n => {
    if (depths[n.gid] >= maxLevel && _hasChildren(n.gid)) _collapsed.add(n.gid);
  });
  renderCanvas();
}
function _computeParentCompletion(nodeGid) {
  const childGids = _getChildGids(nodeGid);
  if (childGids.length === 0) return null;
  const children = childGids.map(g => _nodes.find(n => n.gid === g)).filter(Boolean);
  if (children.length === 0) return 0;
  const sum = children.reduce((acc, c) => acc + (c.completion || 0), 0);
  return Math.round(sum / children.length);
}
async function _propagateCompletion(changedGid) {
  const visited = new Set();
  const queue = _getParentGids(changedGid);
  while (queue.length > 0) {
    const pgid = queue.shift();
    if (visited.has(pgid)) continue;
    visited.add(pgid);
    const p = _nodes.find(n => n.gid === pgid);
    if (!p) continue;
    const newComp = _computeParentCompletion(pgid);
    if (newComp === null) continue;
    p.completion = newComp;
    await _apiUpdateCanvas(p.gid, { completion: newComp });
    updateNodeEl(p);
    // If the panel is currently showing this parent, refresh its slider
    if (_selectedNodeGid === pgid) {
      document.getElementById('pfCompletion').value = newComp;
      document.getElementById('pfCompVal').textContent = newComp + '%';
    }
    _getParentGids(pgid).forEach(g => { if (!visited.has(g)) queue.push(g); });
  }
  // After all propagations, recompute blocked states and re-color dep edges
  _recomputeBlockedStatuses();
  renderAllEdges();
}
function _applyAllParentCompletions() {
  // Topological multi-pass (handles arbitrary depth, no async needed on load)
  // parentGids = nodes that have at least one child (source of compose edges)
  const parentGids = new Set(_edges.filter(_isCompose).map(e => e.source_gid));
  for (let pass = 0; pass < 20; pass++) {
    let changed = false;
    parentGids.forEach(pgid => {
      const p = _nodes.find(n => n.gid === pgid);
      if (!p) return;
      const newComp = _computeParentCompletion(pgid);
      if (newComp !== null && p.completion !== newComp) {
        p.completion = newComp;
        changed = true;
      }
    });
    if (!changed) break;
  }
}

// ── Dependency evaluation & blocked status ──
function _evalDepCondition(srcGid, condition) {
  const src = _nodes.find(n => n.gid === srcGid);
  if (!src) return false;
  const cond = condition || 'done';
  if (cond === 'done') return src.status === 'done';
  if (cond === 'started') return src.status !== 'pending' && src.status !== 'blocked';
  const m = cond.match(/^completion>=(\d+)$/);
  if (m) return (src.completion || 0) >= parseInt(m[1]);
  return src.status === 'done';
}

function _isNodeBlocked(nodeGid) {
  const node = _nodes.find(n => n.gid === nodeGid);
  if (!node || node.status === 'done') return false;
  // Prerequisites-only blocking: solid-line (compose/parent-child) does NOT restrict.
  // A node is only blocked by manually drawn dashed prerequisite edges.
  const prereqEdges = _edges.filter(e => _isPrereq(e) && e.target_gid === nodeGid);
  for (const e of prereqEdges.filter(e => !e.dep_group)) {
    if (!_evalDepCondition(e.source_gid, e.dep_condition)) return true;
  }
  const groups = {};
  prereqEdges.filter(e => e.dep_group).forEach(e => { (groups[e.dep_group] = groups[e.dep_group] || []).push(e); });
  for (const grp of Object.values(groups)) {
    if (!grp.some(e => _evalDepCondition(e.source_gid, e.dep_condition))) return true;
  }
  return false;
}

function _getBlockedReasons(nodeGid) {
  const reasons = [];
  const prereqEdges = _edges.filter(e => _isPrereq(e) && e.target_gid === nodeGid);
  for (const e of prereqEdges.filter(e => !e.dep_group)) {
    if (!_evalDepCondition(e.source_gid, e.dep_condition)) {
      const src = _nodes.find(n => n.gid === e.source_gid);
      reasons.push(`前置未满足：「${src?.title||'?'}」(${e.dep_condition||'done'})`);
    }
  }
  const groups = {};
  prereqEdges.filter(e => e.dep_group).forEach(e => { (groups[e.dep_group] = groups[e.dep_group]||[]).push(e); });
  for (const [grp, grpEdges] of Object.entries(groups)) {
    if (!grpEdges.some(e => _evalDepCondition(e.source_gid, e.dep_condition))) {
      const names = grpEdges.map(e => _nodes.find(n => n.gid === e.source_gid)?.title||'?').join(' 或 ');
      reasons.push(`依赖组[${grp}]未满足：需 ${names}`);
    }
  }
  return reasons;
}

function _recomputeBlockedStatuses() {
  let changed = true;
  for (let pass = 0; pass < 20 && changed; pass++) {
    changed = false;
    _nodes.forEach(n => {
      if (n.status === 'done') return;
      const blocked = _isNodeBlocked(n.gid);
      if (blocked && n.status !== 'blocked') { n.status = 'blocked'; changed = true; }
      else if (!blocked && n.status === 'blocked') { n.status = 'pending'; changed = true; }
    });
  }
}

function _updateStatusBtns(status) {
  const map = { pending:'sp', in_progress:'sip', done:'sd' };
  document.querySelectorAll('#pfStatusBtns .st-status-btn').forEach(b => {

    b.className = `st-status-btn${status === s ? ' ' + (map[s]||'') : ''}`;

}

// Compact date formatter: "5/17" or "25/5/17" if year differs
function _fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  const now = new Date();
  const mo = d.getMonth() + 1, dy = d.getDate();
  return d.getFullYear() !== now.getFullYear()
    ? `${d.getFullYear().toString().slice(2)}/${mo}/${dy}`
    : `${mo}/${dy}`;
}
