<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>清单注册表</title>
<style>
:root {
  --bg-primary:   #ffffff;
  --bg-secondary: #f7f6f3;
  --bg-tertiary:  #efefef;
  --text-normal:  #2e2e2e;
  --text-muted:   #6e6e6e;
  --text-faint:   #9a9a9a;
  --border:       #dcdcdc;
  --accent:       #7b61ff;
  --accent-h:     #6951e0;
  --radius:       6px;
  --font-mono:    'Consolas','JetBrains Mono','Fira Code',monospace;
}
:root[data-theme="dark"] {
  --bg-primary:   #1e1e2e;
  --bg-secondary: #181825;
  --bg-tertiary:  #313244;
  --text-normal:  #cdd6f4;
  --text-muted:   #a6adc8;
  --text-faint:   #6c7086;
  --border:       #313244;
  --accent:       #89b4fa;
  --accent-h:     #7ba8f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg-secondary);color:var(--text-normal);
  height:100vh;overflow:hidden;display:flex;flex-direction:column;
}

/* ── toolbar ── */
.toolbar{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;background:var(--bg-primary);
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;
}
.toolbar-title{font-size:15px;font-weight:700;color:var(--text-normal);margin-right:4px;}
.toolbar-sub{font-size:12px;color:var(--text-faint);}
.toolbar-spacer{flex:1;}
input[type=text]{
  padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-secondary);color:var(--text-normal);font-size:12px;
  outline:none;width:150px;
}
input[type=text]:focus{border-color:var(--accent);}
.btn{
  padding:5px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-muted);
  display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-accent:hover{background:var(--accent-h);color:#fff;}

/* ── multi-select dropdown ── */
.ms-wrap{position:relative;display:inline-block;}
.ms-btn{
  padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-secondary);color:var(--text-muted);font-size:12px;
  cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;
  transition:all .15s;user-select:none;min-width:80px;
}
.ms-btn:hover,.ms-btn.open{border-color:var(--accent);color:var(--text-normal);}
.ms-btn.has-sel{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg-secondary));}
.ms-caret{font-size:9px;margin-left:auto;opacity:.6;}
.ms-panel{
  position:absolute;top:calc(100% + 4px);left:0;min-width:160px;
  background:var(--bg-primary);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.15);
  z-index:200;padding:4px 0;display:none;
}
.ms-panel.open{display:block;}
.ms-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text-normal);
  transition:background .1s;
}
.ms-item:hover{background:var(--bg-tertiary);}
.ms-item input[type=checkbox]{
  width:13px;height:13px;cursor:pointer;accent-color:var(--accent);flex-shrink:0;
}
.ms-sep{margin:3px 0;border:none;border-top:1px solid var(--border);}
.ms-actions{
  display:flex;gap:0;border-top:1px solid var(--border);
  padding:4px 8px;justify-content:space-between;
}
.ms-action-btn{
  font-size:10px;padding:2px 8px;border:none;background:transparent;
  color:var(--text-faint);cursor:pointer;border-radius:3px;
}
.ms-action-btn:hover{color:var(--accent);background:var(--bg-tertiary);}

/* ── table ── */
.tbl-wrap{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg-primary);}
thead{position:sticky;top:0;z-index:5;}
thead th{
  background:var(--bg-secondary);color:var(--text-faint);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:8px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;text-align:left;
}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,var(--bg-primary));}
tr.domain-sep td{
  background:var(--bg-secondary);color:var(--text-faint);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:5px 10px 4px;border-bottom:1px solid var(--border);
}
.tbl-name{font-family:var(--font-mono);font-size:11px;color:var(--text-normal);font-weight:600;white-space:nowrap;}
.tbl-parent{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.tbl-fields{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);line-height:1.6;}
.tbl-mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}

/* category badge */
.cat-badge{display:inline-block;font-size:9px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap;}
.cat-agg{background:rgba(137,180,250,.18);color:#89b4fa;}
.cat-fk {background:rgba(166,227,161,.18);color:#a6e3a1;}
.cat-ref{background:rgba(250,179,135,.18);color:#fab387;}
.cat-sys{background:rgba(108,112,134,.18);color:#a6adc8;}

/* usage badge */
.use-badge{display:inline-block;font-size:9px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap;}
.use-ref  {background:rgba(116,199,236,.18);color:#74c7ec;}
.use-tpl  {background:rgba(203,166,247,.18);color:#cba6f7;}
.use-std  {background:rgba(166,227,161,.18);color:#a6e3a1;}
.use-attr {background:rgba(250,179,135,.18);color:#fab387;}
.use-other{background:rgba(108,112,134,.15);color:#a6adc8;}

/* status select */
.status-sel{
  font-size:11px;padding:2px 6px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg-secondary);
  color:var(--text-normal);cursor:pointer;outline:none;
}
.status-sel:focus{border-color:var(--accent);}

/* usage cell */
.usage-wrap{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.usage-custom{
  font-size:10px;color:var(--text-muted);outline:none;
  border-bottom:1px dashed var(--border);min-width:40px;max-width:100px;
}
.usage-custom:focus{border-color:var(--accent);color:var(--text-normal);}

/* note cell */
.note-cell{
  min-width:140px;max-width:220px;word-break:break-all;
  color:var(--text-muted);outline:none;border-radius:3px;padding:1px 3px;
}
.note-cell:focus{background:color-mix(in srgb,var(--accent) 8%,var(--bg-primary));color:var(--text-normal);}
.note-cell:empty::before{content:"双击编辑…";color:var(--text-faint);font-style:italic;}

/* custom row */
tr.custom-row td{background:color-mix(in srgb,var(--accent) 5%,transparent);}
tr.custom-row td[contenteditable]{outline:none;cursor:text;border-radius:3px;}
tr.custom-row td[contenteditable]:focus{background:color-mix(in srgb,var(--accent) 10%,var(--bg-primary));}
.del-btn{
  display:none;width:20px;height:20px;border:none;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--text-faint);font-size:12px;
  align-items:center;justify-content:center;transition:all .15s;
}
.del-btn:hover{background:rgba(243,139,168,.2);color:#f38ba8;}
tr.custom-row:hover .del-btn{display:inline-flex;}
</style>
</head>
<body>
<script src="/web/icons.js"></script>

<!-- toolbar -->
<div class="toolbar">
  <span class="toolbar-title">清单注册表</span>
  <span class="toolbar-sub">DB 表牵引 &middot; 共 44 张表</span>
  <div class="toolbar-spacer"></div>
  <input type="text" id="searchInput" placeholder="搜索表名 / 含义…">
  <!-- multi-select filters -->
  <div class="ms-wrap" id="msCat"></div>
  <div class="ms-wrap" id="msDomain"></div>
  <div class="ms-wrap" id="msStatus"></div>
  <div class="ms-wrap" id="msUsage"></div>
  <button class="btn btn-accent" id="btnAddRow">
    <svg class="icon" width="13" height="13"><use href="#icon-plus"/></svg>
    新增行
  </button>
  <button class="btn" id="btnExport">
    <svg class="icon" width="13" height="13"><use href="#icon-download"/></svg>
    导出快照
  </button>
</div>

<!-- table -->
<div class="tbl-wrap">
<table id="regTable">
  <thead>
    <tr>
      <th style="width:185px">表名</th>
      <th style="width:110px">对应清单 / 模块</th>
      <th style="width:110px">领域</th>
      <th style="width:88px">类别</th>
      <th style="width:120px">聚合根</th>
      <th style="width:170px">子实体</th>
      <th style="width:100px">用途</th>
      <th style="width:170px">业务含义</th>
      <th style="width:130px">关联父表</th>
      <th style="width:230px">主要字段</th>
      <th style="width:78px">状态</th>
      <th style="width:190px">备注</th>
      <th style="width:32px"></th>
    </tr>
  </thead>
  <tbody id="regBody"></tbody>
</table>
</div>

// ── Multi-Select 组件 ─────────────────────────────────────────────────────
class MultiSelect {
  constructor(containerId, options, placeholder, onChange) {
    this.el = document.getElementById(containerId);
    this.options = options;   // [{value, label}]
    this.placeholder = placeholder;
    this.onChange = onChange;
    this.selected = new Set();
    this._build();
  }

  _build() {
    this.btn = document.createElement('div');
    this.btn.className = 'ms-btn';
    this.btn.innerHTML = `<span class="ms-label">${this.placeholder}</span><span class="ms-caret">▾</span>`;

    this.panel = document.createElement('div');
    this.panel.className = 'ms-panel';

    // 全选/全清 actions
    const actions = document.createElement('div');
    actions.className = 'ms-actions';
    const btnAll = document.createElement('button');
    btnAll.className = 'ms-action-btn';
    btnAll.textContent = '全选';
    btnAll.onclick = (e) => { e.stopPropagation(); this.options.forEach(o => this.selected.add(o.value)); this._refresh(); this.onChange(); };
    const btnNone = document.createElement('button');
    btnNone.className = 'ms-action-btn';
    btnNone.textContent = '清空';
    btnNone.onclick = (e) => { e.stopPropagation(); this.selected.clear(); this._refresh(); this.onChange(); };
    actions.appendChild(btnAll);
    actions.appendChild(btnNone);
    this.panel.appendChild(actions);

    const sep = document.createElement('hr');
    sep.className = 'ms-sep';
    this.panel.appendChild(sep);

    // option checkboxes
    this.checkboxes = [];
    this.options.forEach(opt => {
      const item = document.createElement('label');
      item.className = 'ms-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = opt.value;
      cb.addEventListener('change', () => {
        if (cb.checked) this.selected.add(opt.value);
        else this.selected.delete(opt.value);
        this._refresh();
        this.onChange();
      });
      item.appendChild(cb);
      item.appendChild(document.createTextNode(opt.label || opt.value));
      this.panel.appendChild(item);
      this.checkboxes.push(cb);
    });

    this.el.appendChild(this.btn);
    this.el.appendChild(this.panel);

    this.btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = this.panel.classList.contains('open');
      document.querySelectorAll('.ms-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.ms-btn.open').forEach(b => b.classList.remove('open'));
      if (!isOpen) {
        this.panel.classList.add('open');
        this.btn.classList.add('open');
      }
    });
  }

  _refresh() {
    this.checkboxes.forEach(cb => { cb.checked = this.selected.has(cb.value); });
    const n = this.selected.size;
    const label = this.btn.querySelector('.ms-label');
    if (n === 0) {
      label.textContent = this.placeholder;
      this.btn.classList.remove('has-sel');
    } else if (n === this.options.length) {
      label.textContent = this.placeholder + '（全部）';
      this.btn.classList.remove('has-sel');
    } else {
      label.textContent = this.placeholder + `（${n}）`;
      this.btn.classList.add('has-sel');
    }
  }

  getValues() { return this.selected; }  // empty Set = no filter
}

// close panels on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.ms-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.ms-btn.open').forEach(b => b.classList.remove('open'));
});

// ── 本地持久化 ─────────────────────────────────────────────────────────────
const NOTE_KEY   = 'lists.notes';
const STATUS_KEY = 'lists.statuses';
const USAGE_KEY  = 'lists.usages';
const CUSTOM_KEY = 'lists.custom_rows';

function loadNotes()    { try { return JSON.parse(localStorage.getItem(NOTE_KEY)   || '{}'); } catch { return {}; } }
function loadStatuses() { try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch { return {}; } }
function loadUsages()   { try { return JSON.parse(localStorage.getItem(USAGE_KEY)  || '{}'); } catch { return {}; } }
function loadCustoms()  { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch { return []; } }
function saveNotes(o)    { localStorage.setItem(NOTE_KEY,   JSON.stringify(o)); }
function saveStatuses(o) { localStorage.setItem(STATUS_KEY, JSON.stringify(o)); }
function saveUsages(o)   { localStorage.setItem(USAGE_KEY,  JSON.stringify(o)); }
function saveCustoms(a)  { localStorage.setItem(CUSTOM_KEY, JSON.stringify(a)); }

async function persistNote(id, value) {
  const notes = loadNotes(); notes[id] = value; saveNotes(notes);
  try {
    const cf = window._cloudFetch || window.parent?._cloudFetch || window.parent?.parent?._cloudFetch;
    if (cf) await cf('/admin/config', { method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key:`lists.${id}.note`, value }) });
  } catch {}
}

async function loadRemoteNotes() {
  try {
    const cf = window._cloudFetch || window.parent?._cloudFetch || window.parent?.parent?._cloudFetch;
    if (!cf) return;
    const res = await cf('/admin/config?prefix=lists.');
    if (res?.items) {
      const notes = loadNotes();
      res.items.forEach(item => {
        const m = item.key.match(/^lists\.(.+)\.note$/);
        if (m) notes[m[1]] = item.value;
      });
      saveNotes(notes);
    }
  } catch {}
}

// ── badge helpers ──────────────────────────────────────────────────────────
const CAT_META = {
  [CAT_AGG]:{ cls:'cat-agg', label:'聚合根' },
  [CAT_FK]: { cls:'cat-fk',  label:'外键关联' },
  [CAT_REF]:{ cls:'cat-ref', label:'引用GID' },
  [CAT_SYS]:{ cls:'cat-sys', label:'系统工具' },
};
const USE_META = {
  [USE_REF]: { cls:'use-ref',  label:'信息引用' },
  [USE_TPL]: { cls:'use-tpl',  label:'模板清单' },
  [USE_STD]: { cls:'use-std',  label:'标准清单' },
  [USE_ATTR]:{ cls:'use-attr', label:'属性清单' },
  [USE_OTHER]:{ cls:'use-other',label:'其他' },
};
function catBadge(v) {
  const m = CAT_META[v] || { cls:'cat-sys', label:v };
  return `<span class="cat-badge ${m.cls}" title="${esc(v)}">${m.label}</span>`;
}
function useBadge(v) {
  const m = USE_META[v] || { cls:'use-other', label: v||'其他' };
  return `<span class="use-badge ${m.cls}">${m.label}</span>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── build rows ─────────────────────────────────────────────────────────────
function buildRows() {
  const notes    = loadNotes();
  const statuses = loadStatuses();
  const usages   = loadUsages();
  const customs  = loadCustoms();
  const base = LISTS.map(r => ({
    ...r,
    note:        notes[r.id]    !== undefined ? notes[r.id]    : r.note,
    status:      statuses[r.id] !== undefined ? statuses[r.id] : r.status,
    usage:       usages[r.id]?.usage       !== undefined ? usages[r.id].usage       : r.usage,
    usageCustom: usages[r.id]?.usageCustom !== undefined ? usages[r.id].usageCustom : r.usageCustom,
    custom: false,
  }));
  return [...base, ...customs.map(r => ({ ...r, custom: true }))];
}

// ── multi-select filter instances ──────────────────────────────────────────
let msCat, msDomain, msStatus, msUsage;

// ── render ─────────────────────────────────────────────────────────────────
let _rows = [];

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const selCat    = msCat.getValues();
  const selDomain = msDomain.getValues();
  const selStatus = msStatus.getValues();
  const selUsage  = msUsage.getValues();

  _rows = buildRows();
  const body = document.getElementById('regBody');
  body.innerHTML = '';
  let lastDomain = null;

  _rows.forEach((r, idx) => {
    const matchQ = !q ||
      r.name.toLowerCase().includes(q) ||
      (r.meaning||'').toLowerCase().includes(q) ||
      (r.aggregate||'').toLowerCase().includes(q) ||
      (r.entities||'').toLowerCase().includes(q);
    if (!matchQ) return;
    if (selCat.size    > 0 && !selCat.has(r.category))  return;
    if (selDomain.size > 0 && !selDomain.has(r.domain)) return;
    if (selStatus.size > 0 && !selStatus.has(r.status)) return;
    if (selUsage.size  > 0 && !selUsage.has(r.usage))   return;

    if (!r.custom && r.domain !== lastDomain) {
      lastDomain = r.domain;
      const sep = document.createElement('tr');
      sep.className = 'domain-sep';
      sep.innerHTML = `<td colspan="${NCOLS}">${esc(r.domain)}</td>`;
      body.appendChild(sep);
    }

    const statusOpts = ['active','partial','planned','legacy']
      .map(s => `<option value="${s}"${r.status===s?' selected':''}>${s}</option>`).join('');
    const usageOpts  = [USE_REF, USE_TPL, USE_STD, USE_ATTR, USE_OTHER]
      .map(u => `<option value="${u}"${r.usage===u?' selected':''}>${u}</option>`).join('');

    const tr = document.createElement('tr');
    if (r.custom) tr.className = 'custom-row';

    const isOther = r.usage === USE_OTHER;

    if (r.custom) {
      const catOpts = [CAT_AGG, CAT_FK, CAT_REF, CAT_SYS]
        .map(c => `<option value="${c}"${r.category===c?' selected':''}>${c}</option>`).join('');
      tr.innerHTML = `
        <td><span class="tbl-name" contenteditable="true"
          onblur="saveCustom(${idx},'name',this.innerText)">${esc(r.name)}</span></td>
        <td contenteditable="true"
          onblur="saveCustom(${idx},'listName',this.innerText)">${esc(r.listName||'')}</td>
        <td contenteditable="true"
          onblur="saveCustom(${idx},'domain',this.innerText)">${esc(r.domain)}</td>
        <td><select class="status-sel" style="font-size:10px"
          onchange="saveCustom(${idx},'category',this.value)">${catOpts}</select></td>
        <td><span class="tbl-mono" contenteditable="true"
          onblur="saveCustom(${idx},'aggregate',this.innerText)">${esc(r.aggregate||'')}</span></td>
        <td><span class="tbl-mono" contenteditable="true"
          onblur="saveCustom(${idx},'entities',this.innerText)">${esc(r.entities||'')}</span></td>
        <td><select class="status-sel" style="font-size:10px"
          onchange="saveCustom(${idx},'usage',this.value)">${usageOpts}</select></td>
        <td contenteditable="true"
          onblur="saveCustom(${idx},'meaning',this.innerText)">${esc(r.meaning||'')}</td>
        <td><span class="tbl-parent" contenteditable="true"
          onblur="saveCustom(${idx},'parent',this.innerText)">${esc(r.parent||'')}</span></td>
        <td><span class="tbl-fields" contenteditable="true"
          onblur="saveCustom(${idx},'fields',this.innerText)">${esc(r.fields||'')}</span></td>
        <td><select class="status-sel"
          onchange="saveCustom(${idx},'status',this.value)">${statusOpts}</select></td>
        <td class="note-cell" contenteditable="true"
          onblur="saveCustom(${idx},'note',this.innerText)">${esc(r.note||'')}</td>
        <td><button class="del-btn" onclick="deleteCustom(${idx})" title="删除此行">✕</button></td>
      `;
    } else {
      const usageCell = isOther
        ? `<div class="usage-wrap">${useBadge(r.usage)}<span class="usage-custom" contenteditable="true"
              title="自定义说明" onblur="onUsageCustomBlur('${r.id}',this.innerText)">${esc(r.usageCustom)}</span></div>`
        : `<div class="usage-wrap">${useBadge(r.usage)}</div>`;
      tr.innerHTML = `
        <td><span class="tbl-name">${esc(r.name)}</span></td>
        <td>${esc(r.listName)}</td>
        <td>${esc(r.domain)}</td>
        <td>${catBadge(r.category)}</td>
        <td><span class="tbl-mono">${esc(r.aggregate)}</span></td>
        <td><span class="tbl-mono">${esc(r.entities)}</span></td>
        <td>
          <select class="status-sel" style="font-size:10px;margin-bottom:3px"
            onchange="onUsageChange('${r.id}',this.value,this)">${usageOpts}</select>
          ${isOther ? `<div style="margin-top:2px"><span class="usage-custom" contenteditable="true"
            title="填写自定义说明" onblur="onUsageCustomBlur('${r.id}',this.innerText)">${esc(r.usageCustom)}</span></div>` : ''}
        </td>
        <td>${esc(r.meaning)}</td>
        <td><span class="tbl-parent">${esc(r.parent)}</span></td>

          onblur="onNoteBlur('${r.id}',this.innerText)">${esc(r.note)}</td>
        <td></td>
      `;
    }
    body.appendChild(tr);
  });

// ── event handlers ─────────────────────────────────────────────────────────
window.onStatusChange = function(id, value) {
  const s = loadStatuses(); s[id] = value; saveStatuses(s);
};
window.onNoteBlur = function(id, text) { persistNote(id, text.trim()); };
window.onUsageChange = function(id, value, selectEl) {
  const u = loadUsages();
  if (!u[id]) u[id] = {};
  u[id].usage = value;
  saveUsages(u);
  // toggle custom input visibility without full re-render
  const td = selectEl.closest('td');
  let existing = td.querySelector('.usage-custom');
  if (value === USE_OTHER) {
    if (!existing) {
      const div = document.createElement('div');
      div.style.marginTop = '2px';
      const span = document.createElement('span');
      span.className = 'usage-custom';
      span.contentEditable = 'true';
      span.title = '填写自定义说明';
      span.setAttribute('onblur', `onUsageCustomBlur('${id}',this.innerText)`);
      div.appendChild(span);
      td.appendChild(div);
    }
  } else {
    if (existing) existing.parentElement.remove();
  }
};
window.onUsageCustomBlur = function(id, text) {
  const u = loadUsages();
  if (!u[id]) u[id] = {};
  u[id].usageCustom = text.trim();
  saveUsages(u);
};
window.saveCustom = function(idx, field, value) {
  const customs = loadCustoms();
  const ci = idx - LISTS.length;
  if (ci < 0 || ci >= customs.length) return;
  customs[ci][field] = value.trim !== undefined ? value.trim() : value;
  saveCustoms(customs);
};
window.deleteCustom = function(idx) {
  const customs = loadCustoms();
  customs.splice(idx - LISTS.length, 1);
  saveCustoms(customs);
  renderTable();
};

document.getElementById('btnAddRow').addEventListener('click', () => {

  customs.push({ id:'custom_'+Date.now(), domain:'', name:'', listName:'',
    category:CAT_REF, aggregate:'', entities:'',
    usage:USE_OTHER, usageCustom:'',
    meaning:'', parent:'', fields:'', status:'planned', note:'', custom:true });
  saveCustoms(customs);
  renderTable();
  document.querySelector('.tbl-wrap').scrollTop = 999999;
});

document.getElementById('searchInput').addEventListener('input', renderTable);

// ── Export snapshot ─────────────────────────────────────────────────────────
async function exportSnapshot() {
  const btn = document.getElementById('btnExport');
  btn.textContent = '导出中…';
  btn.disabled = true;

  try {
    await loadRemoteNotes();

    const now    = new Date().toLocaleString('zh-CN', { hour12: false });
    const rows   = buildRows();   // static + localStorage overrides + customs

    // 按 domain 分组（同 renderTable 的分组顺序）
    const groups = {};
    const domainOrder = [];
    rows.forEach(r => {
      const d = r.domain || '自定义';
      if (!groups[d]) { groups[d] = []; domainOrder.push(d); }
      groups[d].push(r);
    });

    const esc = s => String(s || '').replace(/\|/g, '｜').replace(/\n/g, ' ');

    const lines = [
      '# 清单注册表快照',
      '',
      `> 导出时间：${now}`,
      `> 共 ${rows.length} 张表`,
      '',
    ];

    for (const domain of domainOrder) {
      lines.push(`## ${domain}`, '');
      lines.push('| 表名 | 对应清单 | 聚合根 | 业务含义 | 状态 | 备注 |');
      lines.push('|-----|---------|------|---------|------|------|');
      groups[domain].forEach(r => {
        lines.push(`| ${esc(r.name)} | ${esc(r.listName)} | ${esc(r.aggregate)} | ${esc(r.meaning)} | ${esc(r.status)} | ${esc(r.note)} |`);
      });
      lines.push('');
    }

    const md = lines.join('\n');

    const eAPI = window.electronAPI || window.parent?.electronAPI;
    if (eAPI?.writeTextFile) {
      let p = decodeURIComponent(window.location.pathname);
      if (/^\/[A-Za-z]:\//.test(p)) p = p.slice(1);
      const dir = p.replace(/[^/\\]+$/, '');
      await eAPI.writeTextFile(dir + 'lists_snapshot.md', md);
      btn.textContent = '✓ 已导出';
    } else {
      await navigator.clipboard.writeText(md);
      btn.textContent = '✓ 已复制';
    }
  } catch (e) {
    console.error('[export]', e);
    btn.textContent = '导出失败';
  } finally {
    setTimeout(() => {
      btn.innerHTML = '<svg class="icon" width="13" height="13"><use href="#icon-download"/></svg> 导出快照';
      btn.disabled = false;
    }, 2000);
  }
}

document.getElementById('btnExport').addEventListener('click', exportSnapshot);

  msDomain = new MultiSelect('msDomain', [
    { value:'系统域' },{ value:'项目域' },
    { value:'工艺域（旧）' },{ value:'工艺域（BOP五层）' },
    { value:'eBOM域' },{ value:'知识域' },{ value:'工厂域' },
    { value:'协作域' },{ value:'任务域' },{ value:'问题域' },
  ], '领域', renderTable);

  msStatus = new MultiSelect('msStatus', [
    { value:'active' },{ value:'partial' },{ value:'planned' },{ value:'legacy' },
  ], '状态', renderTable);

  msUsage = new MultiSelect('msUsage', [
    { value:USE_REF,  label:'信息引用' },
    { value:USE_TPL,  label:'模板清单' },

    { value:USE_ATTR, label:'属性清单' },
    { value:USE_OTHER,label:'其他' },

  await loadRemoteNotes();
  renderTable();
})();
