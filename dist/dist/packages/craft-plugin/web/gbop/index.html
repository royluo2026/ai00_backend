<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GBOP 标准工序</title>
  
  
  <link rel="stylesheet" href="/assets/index-191035b9.css">
  <link rel="stylesheet" href="/assets/list_deps-9b550476.css">
</head>
<body>
  <script src="/web/icons.js"></script>

  <!-- ListShell 挂载点 -->
  <div id="appRoot" style="height:100vh;display:flex;flex-direction:column;overflow:hidden"></div>

  <!-- ═══ 新建版本 Modal ═══ -->
  <div id="modal-new-version" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">新建 GBOP 版本</div>
      <input type="hidden" id="inp-ver-family-gid" value="" />
      <label>GBOP名称
        <input id="inp-ver-name" type="text" placeholder="如 X11总装GBOP标准工序（同族版本共享）" />
      </label>
      <div id="inp-ver-family-hint" class="modal-hint hidden" style="margin-top:-4px;color:var(--color-accent,#89b4fa)">将加入现有版本族，名称已锁定</div>
      <label>车型
        <input id="inp-ver-vehicle" type="text" placeholder="如 X11" />
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-new-version">取消</button>
        <button id="btn-confirm-new-version" class="btn-primary">创建</button>
      </div>
    </div>
  </div>

  <!-- ═══ 编辑版本 Modal ═══ -->
  <div id="modal-edit-version" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">编辑版本属性</div>
      <input type="hidden" id="inp-editver-gid" />
      <label>GBOP名称
        <input id="inp-editver-name" type="text" />
      </label>
      <label>车型
        <input id="inp-editver-vehicle" type="text" />
      </label>
      <label>状态
        <select id="inp-editver-status">
          <option value="draft">草稿</option>
          <option value="active">激活</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-edit-version">取消</button>
        <button id="btn-confirm-edit-version" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ═══ 从VPPS零件导入 Modal ═══ -->
  <div id="modal-import-vpps" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">从 VPPS 零件导入</div>
      <p class="modal-hint">将 vpps_parts 中 L1~L3 的系统/装置/零部件结构导入为树形节点。<br>
        按 parent_vpps 字段自动建立父子关系。</p>
      <label>导入层级
        <div style="display:flex;gap:12px;margin-top:4px">
          <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="inp-import-l1" checked /> L1 系统</label>
          <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="inp-import-l2" checked /> L2 装置</label>
          <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="inp-import-l3" checked /> L3 零部件</label>
        </div>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-import-vpps">取消</button>
        <button id="btn-confirm-import-vpps" class="btn-primary">导入</button>
      </div>
    </div>
  </div>

  <!-- ═══ 从TC Excel导入 Modal ═══ -->
  <div id="modal-import-tc-excel" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">从 TC Excel 导入工序/操作</div>
      <p class="modal-hint">Sheet 1：总装工序/操作 → 写入 gbop_processes / gbop_operations，自动建立父子关系。<br>
        Sheet 2：VPPS 绑定表 → 将工序/操作链接到已有零部件节点。</p>
      <label>选择 Excel 文件 <span class="req">*</span>
        <input id="inp-tc-excel-file" type="file" accept=".xlsx,.xls" style="margin-top:4px" />
      </label>
      <div id="tc-excel-result" style="margin-top:8px;font-size:12px;color:var(--color-muted)"></div>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-import-tc-excel">取消</button>
        <button id="btn-confirm-import-tc-excel" class="btn-primary">导入</button>
      </div>
    </div>
  </div>

  <!-- ═══ 新建节点 Modal ═══ -->
  <div id="modal-new-entry" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">新建节点</div>
      <input type="hidden" id="inp-entry-parent-gid" value="" />
      <label>节点类型 <span class="req">*</span>
        <select id="inp-entry-type">
          <option value="system">系统 (L1)</option>
          <option value="device">装置 (L2)</option>
          <option value="part">零部件 (L3)</option>
          <option value="process" selected>总装工序 (L4)</option>
          <option value="operation">总装操作 (L5)</option>
        </select>
      </label>
      <label>名称 <span class="req">*</span>
        <input id="inp-entry-name" type="text" placeholder="节点名称" />
      </label>
      <label>VPPS
        <input id="inp-entry-vpps" type="text" placeholder="VPPS编码" />
      </label>
      <label>VPPS描述
        <input id="inp-entry-vpps-desc" type="text" placeholder="VPPS描述" />
      </label>
      <label>序号
        <input id="inp-entry-seq" type="number" value="0" min="0" />
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-new-entry">取消</button>
        <button id="btn-confirm-new-entry" class="btn-primary">创建</button>
      </div>
    </div>
  </div>

  <!-- ═══ Fork Modal ═══ -->
  <div id="modal-fork" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Fork 版本</div>
      <label>新版本名称
        <input id="inp-fork-name" type="text" placeholder="留空继承来源名称" />
      </label>
      <label>加入版本族
        <select id="inp-fork-family">
          <option value="">-- 继承来源版本族 --</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" data-close-modal="modal-fork">取消</button>
        <button id="btn-confirm-fork" class="btn-primary">执行 Fork</button>
      </div>
    </div>
  </div>

  <script src="/web/components/grid_editor.js"></script>
  <script src="/web/components/view_manager.js"></script>
  <script src="/web/components/list_sidebar.js"></script>
  <script src="/web/components/entry_thread.js"></script>
  <script src="/web/components/sidebar_detail_panel.js"></script>
  <script src="/web/components/tree_view.js"></script>
  <script src="/web/components/overlay_edit_modal.js"></script>
  <script src="/web/components/import_export.js"></script>
  <script src="/web/components/diff_manager.js"></script>
  <script src="/web/components/list_shell.js"></script>
  <script src="gbop.js"></script>
</body>
</html>
