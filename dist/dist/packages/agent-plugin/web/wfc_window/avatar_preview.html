<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>小柔头像选择</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1e1e2e; color: #cdd6f4;
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
    padding: 32px;
  }
  h1 { font-size: 17px; color: #89b4fa; margin-bottom: 6px; }
  .subtitle { color: #585b70; font-size: 12px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: #181825; border: 2px solid #313244;
    border-radius: 10px; padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: #585b70; background: #1e1e2e; }
  .card.selected { border-color: #89b4fa; background: #1e2035; }
  .card-label { font-size: 12px; font-weight: 600; color: #cdd6f4; }
  .card-desc { font-size: 10px; color: #585b70; text-align: center; line-height: 1.5; }
  .previews { display: flex; align-items: center; gap: 14px; }
  .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .preview-wrap span { font-size: 9px; color: #45475a; }
  .av64 { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .av28 { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .copy-box { margin-top: 24px; background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 14px; }
  .copy-box h2 { font-size: 12px; color: #89b4fa; margin-bottom: 8px; }
  .copy-box pre { font-size: 10.5px; color: #9399b2; white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; line-height: 1.6; }
</style>
</head>

  svg:`<svg viewBox="0 0 40 40" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">

  <ellipse cx="20" cy="16" rx="14" ry="11" fill="#89B4FA"/>

];

const grid = document.getElementById('grid');
A.forEach(av => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="previews">
      <div class="preview-wrap"><div class="av64">${av.svg}</div><span>64px</span></div>
      <div class="preview-wrap"><div class="av28">${av.svg}</div><span>28px</span></div>
    </div>
    <div class="card-label">${av.label}</div>
    <div class="card-desc">${av.desc}</div>
  `;
  card.addEventListener('click', () => {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    document.getElementById('out').textContent = av.svg.trim();
  });
  grid.appendChild(card);
});
</script>

</html>
