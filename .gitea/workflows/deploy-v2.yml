name: Deploy to V2 Test

on:
  push:
    branches: [test]

jobs:
  deploy:
    runs-on: [self-hosted, test-server]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workmanship-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: devteam/workmanship-web
          ref: test
          path: workmanship-web
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Install frontend dependencies
        shell: cmd
        working-directory: workmanship-web
        run: npm ci --ignore-scripts

      - name: Build frontend
        shell: cmd
        working-directory: workmanship-web
        run: npm run build:web
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy
        shell: cmd
        run: |
          call workmanship-backend\scripts\deploy.bat "%CD%"
