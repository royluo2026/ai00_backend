name: Deploy to V2 Test

on:
  push:
    branches: [test]

jobs:
  deploy:
    runs-on: [self-hosted, test-server]
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: workmanship-backend

      - name: Checkout frontend repo (same branch)
        uses: actions/checkout@v4
        with:
          repository: devteam/workmanship-web
          ref: ${{ github.ref_name }}
          path: workmanship-web
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Build frontend
        shell: cmd
        working-directory: workmanship-web
        run: |
          where node
          if exist "node_modules" rmdir /s /q node_modules
          npm ci --ignore-scripts
          npm run build:web --silent
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Python deps
        shell: cmd
        run: |
          if not exist "E:\projects\ai00-v2\venv" python -m venv E:\projects\ai00-v2\venv
          E:\projects\ai00-v2\venv\Scripts\pip install -r workmanship-backend\backend\requirements.txt --quiet

      - name: Deploy backend files
        shell: cmd
        run: |
          if not exist "E:\projects\ai00-v2" mkdir E:\projects\ai00-v2
          robocopy workmanship-backend\backend E:\projects\ai00-v2\backend /MIR /XD __pycache__ /XF *.pyc .env* /NFL /NDL /NJH /NJS
          if %ERRORLEVEL% LEQ 7 exit 0

      - name: Deploy plugins
        shell: cmd
        run: |
          if not exist "E:\projects\ai00-v2\plugins" mkdir E:\projects\ai00-v2\plugins
          robocopy workmanship-backend\plugins E:\projects\ai00-v2\plugins /MIR /XD __pycache__ /XF *.pyc /NFL /NDL /NJH /NJS
          if %ERRORLEVEL% LEQ 7 exit 0

      - name: Deploy frontend dist
        shell: cmd
        run: |
          if not exist "E:\projects\ai00-v2\dist" mkdir E:\projects\ai00-v2\dist
          robocopy workmanship-web\dist E:\projects\ai00-v2\dist /MIR /NFL /NDL /NJH /NJS
          if %ERRORLEVEL% LEQ 7 exit 0

      - name: Deploy scripts
        shell: cmd
        run: |
          if not exist "E:\projects\ai00-v2\scripts" mkdir E:\projects\ai00-v2\scripts
          robocopy workmanship-backend\scripts E:\projects\ai00-v2\scripts /MIR /NFL /NDL /NJH /NJS
          if %ERRORLEVEL% LEQ 7 exit 0

      - name: Record deploy version
        shell: cmd
        run: |
          python -c "import json,subprocess,os;from datetime import datetime,timezone,timedelta;tz=timezone(timedelta(hours=8));be=subprocess.run(['git','-C','workmanship-backend','rev-parse','--short','HEAD'],capture_output=True,text=True).stdout.strip();bf=subprocess.run(['git','-C','workmanship-backend','rev-parse','HEAD'],capture_output=True,text=True).stdout.strip();fe=subprocess.run(['git','-C','workmanship-web','rev-parse','--short','HEAD'],capture_output=True,text=True).stdout.strip();ff=subprocess.run(['git','-C','workmanship-web','rev-parse','HEAD'],capture_output=True,text=True).stdout.strip();entry={'backend_commit':be,'backend_full':bf,'frontend_commit':fe,'frontend_full':ff,'deployed_at':datetime.now(tz).strftime('%Y-%m-%dT%H:%M:%S')};f=r'E:\projects\ai00-v2\.deploy-history.json';d=json.load(open(f)) if os.path.exists(f) else {'current':None,'history':[]};d['current']=entry;d['history']=[entry]+d.get('history',[]);d['history']=d['history'][:20];json.dump(d,open(f,'w',encoding='utf-8'),ensure_ascii=False,indent=2)"

      - name: Ensure NSSM env
        shell: cmd
        run: |
          nssm set AI00Backend-V2 AppEnvironmentExtra "ENV_FILE=E:\projects\ai00-v2\backend\.env.v2.runtime" "PYTHONIOENCODING=utf-8"

      - name: Restart service
        shell: cmd
        run: |
          taskkill /F /FI "SERVICES eq AI00Backend-V2" 2>nul
          timeout /t 3 /nobreak >nul
          taskkill /F /IM python.exe 2>nul
          timeout /t 2 /nobreak >nul
          net start AI00Backend-V2

      - name: Health check
        shell: cmd
        run: |
          timeout /t 8 /nobreak >nul
          curl -f http://127.0.0.1:8082/health
