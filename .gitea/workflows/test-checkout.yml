name: Test Checkout
on:
  push:
    branches: [chk-test]

jobs:
  test:
    runs-on: [self-hosted, test-server]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: workmanship-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: devteam/workmanship-web
          ref: test
          path: workmanship-web
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Verify
        shell: cmd
        run: |
          echo Backend: && git -C workmanship-backend log --oneline -1
          echo Frontend: && git -C workmanship-web log --oneline -1
