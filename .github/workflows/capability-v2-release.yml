name: Capability V2 Release Candidate

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Immutable isolated RC environment identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrated-release-candidate:
    runs-on: [self-hosted, windows, capability-v2-rc]
    environment: capability-v2-release-candidate
    env:
      AI00_ACCEPTANCE_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      AI00_ACCEPTANCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      AI00_ACCEPTANCE_AGENT_RESULT: passed
      AI00_ACCEPTANCE_MCP_RESULT: passed
      AI00_ACCEPTANCE_LOCAL_RUNTIME_RESULT: passed
      AI00_ACCEPTANCE_OCEANBASE_URL: ${{ secrets.CAPABILITY_V2_OCEANBASE_URL }}
      AI00_ACCEPTANCE_OCEANBASE_SSL_CA: ${{ secrets.CAPABILITY_V2_OCEANBASE_SSL_CA }}
      AI00_ACCEPTANCE_OIS_HEALTH_URL: ${{ secrets.CAPABILITY_V2_OIS_HEALTH_URL }}
      AI00_ACCEPTANCE_JWT_DISCOVERY_URL: ${{ secrets.CAPABILITY_V2_JWT_DISCOVERY_URL }}
      AI00_ACCEPTANCE_JWT_ISSUER: ${{ secrets.CAPABILITY_V2_JWT_ISSUER }}
      AI00_ACCEPTANCE_OAUTH_DISCOVERY_URL: ${{ secrets.CAPABILITY_V2_OAUTH_DISCOVERY_URL }}
      AI00_ACCEPTANCE_OAUTH_ISSUER: ${{ secrets.CAPABILITY_V2_OAUTH_ISSUER }}
      AI00_ACCEPTANCE_LOCAL_RUNTIME_HEALTH_URL: ${{ secrets.CAPABILITY_V2_LOCAL_RUNTIME_HEALTH_URL }}
      AI00_ACCEPTANCE_RUNTIME_EVIDENCE_SOURCE: ${{ secrets.CAPABILITY_V2_RUNTIME_EVIDENCE_PATH }}
      AI00_ACCEPTANCE_PROVIDER_CRUD_EVIDENCE: ${{ secrets.CAPABILITY_V2_PROVIDER_CRUD_EVIDENCE_PATH }}
      AI00_ACCEPTANCE_RC_EVIDENCE: artifacts/capability-v2-rc-evidence.json
      AI00_AGENT_DB_URL: ${{ secrets.CAPABILITY_V2_AGENT_DB_URL }}
      AI00_AGENT_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_AGENT_DDL_DB_URL }}
      AI00_BASE_DB_URL: ${{ secrets.CAPABILITY_V2_BASE_DB_URL }}
      AI00_BASE_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_BASE_DDL_DB_URL }}
      AI00_CRAFT_DB_URL: ${{ secrets.CAPABILITY_V2_CRAFT_DB_URL }}
      AI00_CRAFT_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_CRAFT_DDL_DB_URL }}
      AI00_DIGITAL_MODEL_DB_URL: ${{ secrets.CAPABILITY_V2_DIGITAL_MODEL_DB_URL }}
      AI00_DIGITAL_MODEL_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_DIGITAL_MODEL_DDL_DB_URL }}
      AI00_FACTORY_DB_URL: ${{ secrets.CAPABILITY_V2_FACTORY_DB_URL }}
      AI00_FACTORY_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_FACTORY_DDL_DB_URL }}
      AI00_INTEGRATION_DB_URL: ${{ secrets.CAPABILITY_V2_INTEGRATION_DB_URL }}
      AI00_INTEGRATION_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_INTEGRATION_DDL_DB_URL }}
      AI00_KNOWLEDGE_DB_URL: ${{ secrets.CAPABILITY_V2_KNOWLEDGE_DB_URL }}
      AI00_KNOWLEDGE_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_KNOWLEDGE_DDL_DB_URL }}
      AI00_LOCAL_RUNTIME_DB_URL: ${{ secrets.CAPABILITY_V2_LOCAL_RUNTIME_DB_URL }}
      AI00_LOCAL_RUNTIME_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_LOCAL_RUNTIME_DDL_DB_URL }}
      AI00_ONTOLOGY_DB_URL: ${{ secrets.CAPABILITY_V2_ONTOLOGY_DB_URL }}
      AI00_ONTOLOGY_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_ONTOLOGY_DDL_DB_URL }}
      AI00_PROJECT_MANAGEMENT_DB_URL: ${{ secrets.CAPABILITY_V2_PROJECT_MANAGEMENT_DB_URL }}
      AI00_PROJECT_MANAGEMENT_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_PROJECT_MANAGEMENT_DDL_DB_URL }}
      AI00_SIMULATION_DB_URL: ${{ secrets.CAPABILITY_V2_SIMULATION_DB_URL }}
      AI00_SIMULATION_DDL_DB_URL: ${{ secrets.CAPABILITY_V2_SIMULATION_DDL_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/scripts/build_capability_catalog.py --check
      - run: python backend/scripts/generate_capability_docs.py --check
      - run: python backend/scripts/build_user_function_registry.py --strict
      - run: python backend/scripts/build_capability_acceptance_manifest.py --check
      - run: python -m pytest backend/tests -q
      - run: npm ci
        working-directory: services/agent-runtime
      - run: npm test
        working-directory: services/agent-runtime
      - run: npm ci
        working-directory: services/mcp-gateway
      - run: npm test
        working-directory: services/mcp-gateway
      - run: dotnet test local-runtime/Ai00.LocalRuntime.sln -c Release
      - name: Verify live domain database isolation
        run: python backend/scripts/verify_domain_database_isolation.py --provider-evidence "$env:AI00_ACCEPTANCE_PROVIDER_CRUD_EVIDENCE" --output artifacts/database-isolation.json
      - name: Assemble current-run RC evidence
        run: python backend/scripts/assemble_capability_v2_rc_evidence.py --runtime-evidence "$env:AI00_ACCEPTANCE_RUNTIME_EVIDENCE_SOURCE" --database-evidence artifacts/database-isolation.json --output "$env:AI00_ACCEPTANCE_RC_EVIDENCE"
      - run: python backend/scripts/run_capability_v2_acceptance.py --mode release-candidate --strict --report artifacts/capability-v2-release-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-v2-release-candidate-report
          path: |
            artifacts/capability-v2-release-candidate.json
            artifacts/capability-v2-rc-evidence.json
            artifacts/database-isolation.json
          if-no-files-found: error
