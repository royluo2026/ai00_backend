name: Capability V2 Release Candidate

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Immutable isolated RC environment identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrated-release-candidate:
    runs-on: [self-hosted, windows, capability-v2-rc]
    environment: capability-v2-release-candidate
    env:
      AI00_ACCEPTANCE_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      AI00_ACCEPTANCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      AI00_ACCEPTANCE_OCEANBASE_URL: ${{ secrets.CAPABILITY_V2_OCEANBASE_URL }}
      AI00_ACCEPTANCE_OCEANBASE_SSL_CA: ${{ secrets.CAPABILITY_V2_OCEANBASE_SSL_CA }}
      AI00_ACCEPTANCE_OIS_HEALTH_URL: ${{ secrets.CAPABILITY_V2_OIS_HEALTH_URL }}
      AI00_ACCEPTANCE_JWT_DISCOVERY_URL: ${{ secrets.CAPABILITY_V2_JWT_DISCOVERY_URL }}
      AI00_ACCEPTANCE_JWT_ISSUER: ${{ secrets.CAPABILITY_V2_JWT_ISSUER }}
      AI00_ACCEPTANCE_OAUTH_DISCOVERY_URL: ${{ secrets.CAPABILITY_V2_OAUTH_DISCOVERY_URL }}
      AI00_ACCEPTANCE_OAUTH_ISSUER: ${{ secrets.CAPABILITY_V2_OAUTH_ISSUER }}
      AI00_ACCEPTANCE_PROVIDER_CRUD_EVIDENCE: artifacts/provider-crud.json
      AI00_ACCEPTANCE_RC_EVIDENCE: artifacts/capability-v2-rc-evidence.json
      AI00_RC_ADMIN_DB_URL: ${{ secrets.CAPABILITY_V2_RC_ADMIN_DB_URL }}
      AI00_RC_BACKEND_URL: ${{ secrets.CAPABILITY_V2_RC_BACKEND_URL }}
      AI00_RC_AGENT_URL: ${{ secrets.CAPABILITY_V2_RC_AGENT_URL }}
      AI00_RC_MCP_URL: ${{ secrets.CAPABILITY_V2_RC_MCP_URL }}
      AI00_RC_PROBE_CONFIG: ${{ secrets.CAPABILITY_V2_RC_PROBE_CONFIG }}
      AI00_RC_USER_TOKEN: ${{ secrets.CAPABILITY_V2_RC_USER_TOKEN }}
      AI00_RC_DEVICE_ID: ${{ secrets.CAPABILITY_V2_RC_DEVICE_ID }}
      AI00_RC_DEVICE_TOKEN: ${{ secrets.CAPABILITY_V2_RC_DEVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -r backend/requirements.txt

      - name: freeze-domains
        run: python backend/scripts/freeze_official_domains.py --check
      - name: catalog-check
        run: python backend/scripts/build_capability_catalog.py --check
      - name: docs-check
        run: python backend/scripts/generate_capability_docs.py --check
      - name: registry-strict
        run: python backend/scripts/build_user_function_registry.py --strict
      - name: acceptance-manifest-check
        run: python backend/scripts/build_capability_acceptance_manifest.py --check
      - name: dependency-check
        run: python backend/scripts/check_domain_dependencies.py
      - name: boundary-audit
        run: python backend/scripts/audit_domain_boundaries.py --json
      - name: python-tests
        run: python -m pytest backend/tests plugins -q
      - name: agent-tests
        working-directory: services/agent-runtime
        run: |
          npm ci
          npm test
      - name: mcp-tests
        working-directory: services/mcp-gateway
        run: |
          npm ci
          npm test
      - name: local-runtime-tests
        run: dotnet test local-runtime/Ai00.LocalRuntime.sln -c Release
      - name: database-bootstrap
        run: python backend/scripts/bootstrap_capability_v2_rc_databases.py --admin-url-env AI00_RC_ADMIN_DB_URL --environment-id "$env:AI00_ACCEPTANCE_ENVIRONMENT_ID" --output-env .runtime/capability-v2-rc.env
      - name: domain-migrations
        run: python backend/scripts/run_capability_v2_rc_database_setup.py --env-file .runtime/capability-v2-rc.env --export-job-env "$env:GITHUB_ENV"
      - name: runtime-evidence
        run: python backend/scripts/run_capability_v2_rc_runtime.py --backend-url "$env:AI00_RC_BACKEND_URL" --agent-url "$env:AI00_RC_AGENT_URL" --mcp-url "$env:AI00_RC_MCP_URL" --provider-output artifacts/provider-crud.json --runtime-output artifacts/runtime-evidence.json
      - name: database-isolation
        run: python backend/scripts/verify_domain_database_isolation.py --provider-evidence artifacts/provider-crud.json --output artifacts/database-isolation.json
      - name: evidence-assembly
        run: python backend/scripts/assemble_capability_v2_rc_evidence.py --runtime-evidence artifacts/runtime-evidence.json --database-evidence artifacts/database-isolation.json --output "$env:AI00_ACCEPTANCE_RC_EVIDENCE"
      - name: strict-acceptance
        run: python backend/scripts/run_capability_v2_acceptance.py --mode release-candidate --strict --report artifacts/capability-v2-release-candidate.json
      - name: completion-recheck
        run: python backend/scripts/check_capability_v2_completion.py --mode strict --report artifacts/capability-v2-release-candidate.json
      - name: secret-schema-scan
        if: always()
        shell: pwsh
        run: |
          $files = @(
            "artifacts/provider-crud.json",
            "artifacts/runtime-evidence.json",
            "artifacts/database-isolation.json",
            "artifacts/capability-v2-rc-evidence.json",
            "artifacts/capability-v2-release-candidate.json"
          )
          $forbidden = '"(?:password|token|secret|credential|database_url|dsn|authorization|admin_url|private_key)"\s*:'
          foreach ($file in $files) {
            if ((Test-Path -LiteralPath $file) -and ((Get-Content -Raw -LiteralPath $file) -match $forbidden)) {
              throw "Forbidden secret-shaped JSON field in $file"
            }
          }
      - name: artifact-upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-v2-release-candidate-report
          path: |
            artifacts/provider-crud.json
            artifacts/runtime-evidence.json
            artifacts/database-isolation.json
            artifacts/capability-v2-rc-evidence.json
            artifacts/capability-v2-release-candidate.json
          if-no-files-found: error
