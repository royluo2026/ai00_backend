name: Capability V2 Pull Request Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "plugins/**"
      - "docs/capabilities/**"
      - "docs/acceptance/**"
      - "docs/governance/**"
      - ".github/workflows/capability-v2-*.yml"

permissions:
  contents: read

jobs:
  contract-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/scripts/build_capability_catalog.py --check
      - run: python backend/scripts/generate_capability_docs.py --check
      - run: python backend/scripts/build_user_function_registry.py --check
      - run: python backend/scripts/build_capability_acceptance_manifest.py --check
      - run: python backend/scripts/check_domain_dependencies.py
      - run: python -m pytest backend/tests -q
