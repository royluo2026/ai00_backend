<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI00 Deploy Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f14;color:#cdd6f4;padding:24px;min-height:100vh}
h1{font-size:22px;font-weight:600;margin-bottom:20px}
h1 span{color:#89b4fa}
.card{background:#181825;border:1px solid #313244;border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;color:#a6adc8;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.commit{font-family:monospace;font-size:13px;color:#89b4fa;background:#1a2033;padding:2px 8px;border-radius:4px}
.tag-yellow{background:#332a1a;color:#f9e2af;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:5px;font-size:11px;font-weight:600}
.badge-success{background:#a6e3a1;color:#1e1e2e}
.badge-failure{background:#f38ba8;color:#1e1e2e}
.badge-running{background:#89b4fa;color:#1e1e2e;animation:pulse 1.5s infinite}
.badge-pending{background:#f9e2af;color:#1e1e2e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #313244}
th{color:#a6adc8;font-weight:600;font-size:11px;text-transform:uppercase}
.time{color:#6c7086;font-size:12px}
tr:hover{background:#1e1e2e}
.btn{padding:6px 14px;border-radius:6px;border:1px solid #45475a;background:#313244;color:#cdd6f4;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{background:#45475a}
.btn-rollback{background:#331a1a;border-color:#f38ba8;color:#f38ba8}
.btn-rollback:hover{background:#4a2020}
.btn-refresh{background:#1a3320;border-color:#a6e3a1;color:#a6e3a1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#1e1e2e;border:1px solid #313244;border-radius:12px;padding:24px;width:400px}
.modal h3{margin-bottom:12px;color:#f9e2af}
.modal p{font-size:13px;color:#bac2de;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.gap16{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mt12{margin-top:12px}
.section-label{font-size:11px;color:#6c7086;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.success-msg{color:#a6e3a1;font-size:13px;padding:8px 12px;background:#1a3320;border-radius:6px;margin-top:12px}
.error-msg{color:#f38ba8;font-size:13px;padding:8px 12px;background:#331a1a;border-radius:6px;margin-top:12px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.green{background:#a6e3a1}
.status-dot.red{background:#f38ba8}
</style>
</head>
<body>

<div class="flex-between">
  <h1><span>AI00</span> Deploy Dashboard</h1>
  <button class="btn btn-refresh" onclick="refreshAll()">&#x21bb; Refresh</button>
</div>

<div class="card">
  <h2>Current Deploy</h2>
  <div class="gap16">
    <div><div class="section-label">Backend</div><span class="commit" id="cur-be">---</span></div>
    <div><div class="section-label">Frontend</div><span class="commit" id="cur-fe">---</span></div>
    <div><div class="section-label">Deployed At</div><span class="time" id="cur-time">---</span></div>
    <span id="needs-update" style="display:none" class="tag-yellow">New version pending</span>
  </div>
</div>

<div class="card">
  <h2>Pipeline Runs</h2>
  <div id="pipeline-runs">Loading...</div>
</div>

<div class="card">
  <h2>Deploy History <span style="font-weight:400;font-size:11px;color:#6c7086">(last 20)</span></h2>
  <div id="deploy-history">Loading...</div>
</div>

<div class="modal-overlay" id="rollback-modal">
  <div class="modal">
    <h3>Confirm Rollback</h3>
    <p>Rollback to commit <strong class="commit" id="rollback-commit"></strong><br>This will force-push to test branch and trigger redeploy.</p>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-rollback" id="btn-confirm-rollback">Confirm Rollback</button>
    </div>
    <div id="rollback-result"></div>
  </div>
</div>

<script>
async function cf(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function refreshAll() {
  await Promise.all([loadCurrent(), loadPipeline(), loadHistory()]);
}

async function loadCurrent() {
  try {
    const d = await cf('/api/current');
    const c = d.current || {};
    document.getElementById('cur-be').textContent = c.backend_commit || '---';
    document.getElementById('cur-fe').textContent = c.frontend_commit || '---';
    document.getElementById('cur-time').textContent = c.deployed_at ? fmt(c.deployed_at) : '---';
    document.getElementById('needs-update').style.display = d.needs_update ? 'inline-block' : 'none';
  } catch(e) {}
}

async function loadPipeline() {
  const el = document.getElementById('pipeline-runs');
  try {
    const d = await cf('/api/pipeline');
    if (!d.runs || !d.runs.length) { el.innerHTML = '<span class="time">No runs</span>'; return; }
    let h = '<table><tr><th>Status</th><th>Commit</th><th>Branch</th><th>Time</th></tr>';
    for (const r of d.runs) {
      const b = badge(r.status, r.conclusion);
      h += `<tr><td>${b}</td><td><code>${r.head_sha||'-'}</code></td><td>${r.head_branch||'-'}</td><td class="time">${fmt(r.created_at)}</td></tr>`;
    }
    h += '</table>';
    el.innerHTML = h;
  } catch(e) { el.innerHTML = '<span class="time">Can not fetch pipeline</span>'; }
}

async function loadHistory() {
  const el = document.getElementById('deploy-history');
  try {
    const d = await cf('/api/history');
    if (!d.history || !d.history.length) { el.innerHTML = '<span class="time">No records</span>'; return; }
    let h = '<table><tr><th>Backend</th><th>Frontend</th><th>Deployed At</th><th>Action</th></tr>';
    for (const r of d.history) {
      h += `<tr><td><code>${r.backend_commit||'-'}</code></td><td><code>${r.frontend_commit||'-'}</code></td><td class="time">${fmt(r.deployed_at)}</td><td><button class="btn btn-rollback" onclick="confirmRollback('${r.backend_commit}')">Rollback</button></td></tr>`;
    }
    h += '</table>';
    el.innerHTML = h;
  } catch(e) { el.innerHTML = '<span class="time">Can not fetch history</span>'; }
}

function badge(st, cc) {
  if (st === 'running') return '<span class="badge badge-running">Running</span>';
  if (st === 'waiting'||st==='pending') return '<span class="badge badge-pending">Pending</span>';
  if (cc === 'success') return '<span class="badge badge-success">Success</span>';
  if (cc === 'failure') return '<span class="badge badge-failure">Failed</span>';
  return '<span class="badge">'+(st||'-')+'</span>';
}

function fmt(t) {
  if (!t) return '-';
  const d = new Date(t);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let _rollbackCommit = '';
function confirmRollback(c) {
  _rollbackCommit = c;
  document.getElementById('rollback-commit').textContent = c;
  document.getElementById('rollback-modal').classList.add('active');
  document.getElementById('rollback-result').innerHTML = '';
}
function closeModal() {
  document.getElementById('rollback-modal').classList.remove('active');
}
document.getElementById('btn-confirm-rollback').addEventListener('click', async () => {
  const btn = document.getElementById('btn-confirm-rollback');
  const rs = document.getElementById('rollback-result');
  btn.disabled = true; btn.textContent = 'Rolling back...';
  try {
    const r = await cf('/api/rollback', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({commit:_rollbackCommit})});
    rs.innerHTML = r.success ? '<div class="success-msg">'+r.message+'</div>' : '<div class="error-msg">'+r.message+'</div>';
    if (r.success) setTimeout(() => { closeModal(); refreshAll(); }, 3000);
  } catch(e) { rs.innerHTML = '<div class="error-msg">Error: '+e.message+'</div>'; }
  btn.disabled = false; btn.textContent = 'Confirm Rollback';
});

refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
